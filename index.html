ns. The AI governance committee, chaired by Tom Eklund, meets to decide the next step.","type":"application","difficulty":"expert","stem":"Which action should the committee take?","options":["Sign the contract before the discount expires and complete assessments during implementation","Classify the use under the EU AI Act (employment use is high-risk), complete the required impact assessments and legal-basis review, and decide on the contract through governance based on the results","Pilot in the third-country subsidiary first, deferring assessments until the EU rollout","Accept the vendor's ISO/IEC 42001 certificate as evidence that the tool complies with the organization's legal obligations"],"correctIndex":1,"explanation":"Employment-related AI is a high-risk category with obligations on risk management, data governance, human oversight and impact assessment, and employee data raises privacy and consent issues. Classification, DPIA/FRIA and legal-basis work must precede commitment, with the committee making a documented decision. A vendor's management-system certificate speaks to the vendor's processes, not to the deployer's own legal obligations. Discounts and pilots do not remove those duties.","optionRationales":["Commercial incentives do not justify committing before risks are understood, and a signed contract limits options.","Employment-related AI is a high-risk category with obligations on risk management, data governance, human oversight and impact assessment, and employee data raises privacy and consent issues. Classification, DPIA/FRIA and legal-basis work must precede commitment, with the committee making a documented decision. A vendor's management-system certificate speaks to the vendor's processes, not to the deployer's own legal obligations. Discounts and pilots do not remove those duties.","A pilot on real employees without assessments still creates legal and ethical exposure and sets up the same issues later.","The certificate does not transfer or satisfy the deployer's own obligations, including assessments and legal basis."],"sourceRef":"D1 practice questions · Q64 · 1.16","tags":["d1","document-import","scenario","application"]},{"id":"d2-doc-q001","sectionId":"d2-A","knowledgePointIds":["d2-A-0-0"],"scenarioId":"d2-doc-case-862f342e66","scenario":"Lakemont Health's data science team has built a sepsis early-warning model from five years of patient records. The model performs poorly in clinical trials. A review finds that diagnosis codes are entered inconsistently across hospitals, many records are duplicated, and some lab values are obviously wrong. The product owner, Dr. Amira Hassan, asks the data scientist, Kevin Doyle, what the primary issue is and what to do.","type":"application","difficulty":"basic","stem":"Which dimension of big data is MOST directly the problem, and what is the BEST action?","options":["Volume: collect additional years of records from the same hospitals, then retrain","Veracity: profile and cleanse the data against documented quality rules, and verify results before retraining","Velocity: move to a streaming pipeline so that records are used as soon as they are created","Variety: add imaging and free-text notes so that the model has more signals"],"correctIndex":1,"explanation":"Step 1: the symptoms (inconsistent coding, duplicates, wrong values) are quality, accuracy and credibility defects, which is veracity. Step 2: the fix is to cleanse and validate to defined rules before retraining. More records of poor quality only make the model more confidently wrong, faster data does not correct bad data, and more data types add complexity without repairing the existing defects.","optionRationales":["More volume of the same flawed data multiplies the problem and enlarges the attack surface.","Step 1: the symptoms (inconsistent coding, duplicates, wrong values) are quality, accuracy and credibility defects, which is veracity. Step 2: the fix is to cleanse and validate to defined rules before retraining. More records of poor quality only make the model more confidently wrong, faster data does not correct bad data, and more data types add complexity without repairing the existing defects.","Speed of arrival is not the issue. Faster delivery of low-quality data degrades decisions faster.","Variety can reduce bias, but adding sources before the existing data is trustworthy leaves the root cause untouched."],"sourceRef":"D2 practice questions · Q1 · 2.1","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q002","sectionId":"d2-A","knowledgePointIds":["d2-A-0-3"],"scenarioId":"d2-doc-case-7fe538f16b","scenario":"Marlow Retail's customer-service assistant answers questions about promotions, but customers report it quotes offers that ended months ago. The model was trained last year and is retrained annually. The head of operations, Brenda Ortiz, wants a fix that is reliable and can be implemented without a full retraining cycle.","type":"application","difficulty":"moderate","stem":"What is the BEST action?","options":["Have a human agent review every response before the customer sees it","Increase the context window so that the model can read more of its old training material","Add a disclaimer telling customers that offers may be out of date","Ground the assistant's answers in current promotion data using retrieval-augmented generation, and set a defined retraining cadence"],"correctIndex":3,"explanation":"The cause is data lag: the gap between data collection and model use. Step 1: recognize that the model's knowledge is static. Step 2: use RAG to anchor answers in current data while the base model stays unchanged, and schedule retraining to keep the model itself current. A larger window does not add new facts, a disclaimer accepts the defect, and reviewing every response is slow and disproportionate for a routine task.","optionRationales":["Universal manual review is costly and slow for low-risk questions, and still leaves the underlying staleness.","A larger context window does not supply information the model never learned.","A disclaimer tolerates the problem rather than correcting the data.","The cause is data lag: the gap between data collection and model use. Step 1: recognize that the model's knowledge is static. Step 2: use RAG to anchor answers in current data while the base model stays unchanged, and schedule retraining to keep the model itself current. A larger window does not add new facts, a disclaimer accepts the defect, and reviewing every response is slow and disproportionate for a routine task."],"sourceRef":"D2 practice questions · Q2 · 2.1.3","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q003","sectionId":"d2-A","knowledgePointIds":["d2-A-0-1"],"scenarioId":"d2-doc-case-67029aedd2","scenario":"Ironvale Bank trains a fraud model on customer transaction history. A customer withdraws consent for secondary data use, but the withdrawal request never reaches the data engineering team, and the customer's records remain in the next training run. The compliance officer, Naomi Peters, is asked what control would have prevented this.","type":"application","difficulty":"moderate","stem":"Which control would have been MOST effective?","options":["A consent management process linked to data collection and preprocessing, so that withdrawals are honored and documented, combined with anonymization or masking of personal data before training","A privacy notice that states data may be used for model improvement","A quarterly manual check of a sample of training records","Encryption of the training dataset at rest"],"correctIndex":0,"explanation":"Consent for personal data in AI training must be collected, documented and honored, including withdrawal. Step 1: identify that the failure is a broken link between the consent record and the data pipeline. Step 2: choose a control that operates inside the pipeline, with masking as a second layer. A notice does not process opt-outs, a quarterly sample detects late, and encryption protects confidentiality but does not stop unauthorized use.","optionRationales":["Consent for personal data in AI training must be collected, documented and honored, including withdrawal. Step 1: identify that the failure is a broken link between the consent record and the data pipeline. Step 2: choose a control that operates inside the pipeline, with masking as a second layer. A notice does not process opt-outs, a quarterly sample detects late, and encryption protects confidentiality but does not stop unauthorized use.","A notice informs customers but does not remove withdrawn records from the pipeline.","Periodic sampling is detective and slow, and the withdrawn data would already have been used.","Encryption does not address whether the data may be used at all."],"sourceRef":"D2 practice questions · Q3 · 2.1.1","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q004","sectionId":"d2-A","knowledgePointIds":["d2-A-0-2"],"scenarioId":"d2-doc-case-4e3ad1a5ce","scenario":"Cobalt Insurance's product owner, Tyrell Banks, wants to train a motor-claims severity model on all telematics, location history, browsing data and social media activity \"because the model might find useful patterns.\" The privacy officer, Ingrid Sato, asks the internal auditor what to verify first.","type":"application","difficulty":"moderate","stem":"What should the auditor verify FIRST?","options":["That the model's accuracy increases as more fields are added","That the data warehouse has capacity to store all of the proposed data","That data collected for the model is limited to what the stated use case needs, and that the collection can be justified against the documented purpose","That the data is stored in a region with lower cloud costs"],"correctIndex":2,"explanation":"Collection must be fit for purpose: only the data the use case needs, consistent with the stated purpose. Step 1: compare the proposed data to the documented purpose. Step 2: remove anything not justified. Capacity, accuracy gains and cost do not establish that the collection is lawful or necessary, and more fields can add privacy risk and noise.","optionRationales":["Accuracy improvement does not justify unnecessary or unlawful collection.","Capacity is a planning matter and does not address whether the data should be collected.","Collection must be fit for purpose: only the data the use case needs, consistent with the stated purpose. Step 1: compare the proposed data to the documented purpose. Step 2: remove anything not justified. Capacity, accuracy gains and cost do not establish that the collection is lawful or necessary, and more fields can add privacy risk and noise.","Cost optimization does not answer the fit-for-purpose question and may create transfer issues."],"sourceRef":"D2 practice questions · Q4 · 2.1.2","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q005","sectionId":"d2-A","knowledgePointIds":["d2-A-0-4"],"scenarioId":"d2-doc-case-9b0938f954","scenario":"Stratus Manufacturing's data lake holds public product datasheets, supplier pricing and restricted R\u0026D designs. They sit in the same storage zones with no classification tags. Data scientists pull data into notebooks for model training. The security manager, Paolo Rinaldi, is asked for the GREATEST risk and the first recommendation.","type":"application","difficulty":"difficult","stem":"Which pairing is BEST?","options":["Greatest risk is slow queries; recommend moving all data to a faster platform","Greatest risk is high storage cost; recommend deleting data older than one year","Greatest risk is a data swamp in which restricted data mixes with public data without tags or barriers; first recommendation is to enforce classification tagging and access controls when data enters the lake","Greatest risk is encryption overhead; recommend removing encryption so that scientists can work faster"],"correctIndex":2,"explanation":"Different classification levels commingled without tags or barriers is the specific lake risk. Step 1: identify the lack of classification and separation. Step 2: apply tagging and access controls at ingestion, so that controls follow the data into the notebooks. Cost, speed and encryption overhead are secondary, and removing encryption favors convenience over security.","optionRationales":["Query performance is not the primary risk, and a faster platform does not separate restricted data.","Storage cost is a business concern, and deletion by age does not address classification.","Different classification levels commingled without tags or barriers is the specific lake risk. Step 1: identify the lack of classification and separation. Step 2: apply tagging and access controls at ingestion, so that controls follow the data into the notebooks. Cost, speed and encryption overhead are secondary, and removing encryption favors convenience over security.","Removing encryption increases exposure and ignores the commingling problem."],"sourceRef":"D2 practice questions · Q5 · 2.3","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q006","sectionId":"d2-A","knowledgePointIds":["d2-A-0-4"],"scenarioId":"d2-doc-case-4e290d8796","scenario":"Prism Technologies is loading confidential HR and legal documents into a vector database for an internal assistant. An AI engineer, Leo Park, argues that because the vector store holds only numerical embeddings and not the original documents, data classification requirements no longer apply. The information security manager, Dana Wright, must respond.","type":"application","difficulty":"difficult","stem":"What is the BEST response?","options":["Embeddings can still leak information, so they should be protected at a level commensurate with the original classification, using access control suited to vector data","Agree, because the original documents are not stored in the vector database","Apply controls only if the vector database is hosted outside the company network","Reclassify the embeddings as public, because they are not readable by people"],"correctIndex":0,"explanation":"Vector databases store mathematical representations with metadata, and embeddings still leak information to varying degrees. Step 1: reject the assumption that conversion to vectors removes sensitivity. Step 2: apply protection matching the original classification, with attribute, index or query-based access models. Hosting location does not change sensitivity, and unreadable by people is not the same as safe.","optionRationales":["Vector databases store mathematical representations with metadata, and embeddings still leak information to varying degrees. Step 1: reject the assumption that conversion to vectors removes sensitivity. Step 2: apply protection matching the original classification, with attribute, index or query-based access models. Hosting location does not change sensitivity, and unreadable by people is not the same as safe.","The absence of source documents does not remove the leakage risk.","Internal hosting still needs access controls and monitoring.","Human readability is not the test. Embeddings can be exploited by attackers."],"sourceRef":"D2 practice questions · Q6 · 2.3","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q007","sectionId":"d2-A","knowledgePointIds":["d2-A-0-4"],"scenarioId":"d2-doc-case-9039e576b6","scenario":"Calder Bank extracts customer records from its core system into an ML platform. A review shows the extraction job pulls every column, including fields the model does not use, and writes owner and classification metadata for each record to a plaintext application log accessible to the support team. The model owner, Hana Brooks, asks the auditor for the FIRST recommendation.","type":"application","difficulty":"expert","stem":"What should be recommended FIRST?","options":["Delete the metadata from the source system so that it cannot be logged","Encrypt the plaintext log and continue to extract all columns","Grant the support team read-only access to the log so that actions are traceable","Mask the sensitive fields or correct the extraction logic so that only fit-for-purpose data moves, and keep classification metadata out of plaintext logs"],"correctIndex":3,"explanation":"Controls can be lost at each hop of the pipeline, and metadata may land in unprotected places. Step 1: spot two defects, over-extraction and metadata exposure in a plaintext log. Step 2: address both at source by limiting extraction to what is needed and removing metadata from plaintext logs. Encrypting only the log leaves over-extraction, granting access spreads exposure, and deleting source metadata destroys the classification needed for control.","optionRationales":["Removing source metadata breaks classification and provenance, which the controls depend on.","Encrypting the log leaves the unnecessary extraction in place and the data still leaves its source.","Read-only access to sensitive metadata widens exposure and does not minimize the data moved.","Controls can be lost at each hop of the pipeline, and metadata may land in unprotected places. Step 1: spot two defects, over-extraction and metadata exposure in a plaintext log. Step 2: address both at source by limiting extraction to what is needed and removing metadata from plaintext logs. Encrypting only the log leaves over-extraction, granting access spreads exposure, and deleting source metadata destroys the classification needed for control."],"sourceRef":"D2 practice questions · Q7 · 2.3","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q008","sectionId":"d2-A","knowledgePointIds":["d2-A-0-5"],"scenarioId":"d2-doc-case-f686a1ff60","scenario":"Evergreen Payments' fraud model scored 98% on training data but misses many fraudulent transactions in production. The data scientist, Ravi Menon, finds that dates appear in several formats across source systems and 12% of mandatory know-your-customer fields are blank. Operations lead Elena Cruz asks which quality problems apply and what to put in place.","type":"application","difficulty":"moderate","stem":"Which answer is BEST?","options":["Timeliness and uniqueness defects; shorten the retraining schedule","Consistency and completeness defects; implement data quality rules and validation at ingestion, and monitor them","Validity defects only; widen the allowed value ranges","Accuracy defects only; add more hidden layers to the model"],"correctIndex":1,"explanation":"Inconsistent formats are a consistency issue, and blank mandatory fields are a completeness issue. Step 1: map symptoms to dimensions. Step 2: put quality rules and validation at ingestion so that defects are caught before training and in production. Retraining faster, widening ranges or adding model complexity does not fix the data.","optionRationales":["Nothing in the scenario points to staleness or duplicates, and faster retraining does not fix formats or blanks.","Inconsistent formats are a consistency issue, and blank mandatory fields are a completeness issue. Step 1: map symptoms to dimensions. Step 2: put quality rules and validation at ingestion so that defects are caught before training and in production. Retraining faster, widening ranges or adding model complexity does not fix the data.","Widening allowed ranges would admit more bad data and ignore completeness.","Adding complexity risks overfitting and leaves the data defects in place."],"sourceRef":"D2 practice questions · Q8 · 2.4","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q009","sectionId":"d2-A","knowledgePointIds":["d2-F-0-3"],"scenarioId":"d2-doc-case-cbdb3b02f8","scenario":"Pinecrest Retail's product-recommendation assistant, which retrieves context from a vector index, begins promoting a single supplier's goods. The engineering team confirms the training dataset and the model weights match their signed hashes, but several embeddings in the vector index have been altered. The security manager, Omar Haddad, must classify the incident and recommend a control.","type":"application","difficulty":"difficult","stem":"What is the BEST classification and control?","options":["Data poisoning; retrain the model on a clean dataset","Embedding tampering; add integrity controls, access control and change monitoring on the vector index","Model tampering; replace the model weights from backup","Model theft; add rate limiting on the API"],"correctIndex":1,"explanation":"Altered embedding vectors skew retrieved context, which is embedding tampering. Step 1: use the evidence that training data and weights are intact to rule out data poisoning and model tampering. Step 2: protect and monitor the vector store. Retraining and replacing weights do not touch the tampered component, and rate limiting addresses extraction, not alteration.","optionRationales":["Training data is unchanged, so poisoning is ruled out and retraining would not repair the index.","Altered embedding vectors skew retrieved context, which is embedding tampering. Step 1: use the evidence that training data and weights are intact to rule out data poisoning and model tampering. Step 2: protect and monitor the vector store. Retraining and replacing weights do not touch the tampered component, and rate limiting addresses extraction, not alteration.","Weights are intact, so restoring them changes nothing.","Theft means copying the model. This incident is manipulation of retrieval data."],"sourceRef":"D2 practice questions · Q9 · 2.7.5","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q010","sectionId":"d2-A","knowledgePointIds":["d2-F-0-8"],"scenarioId":"d2-doc-case-2f1aba6afa","scenario":"Harborlight Health tells its board that its AI training data is \"fully protected\" because it is encrypted at rest and in transit. The auditor, Maya Singh, notes that data scientists load decrypted patient notes into shared notebooks to train a model. The CISO, Ben Foster, asks how to respond.","type":"application","difficulty":"difficult","stem":"What is the BEST response?","options":["Encrypt the notebooks' output files only","Accept the statement, because encryption at rest and in transit covers all risks","Stop training on any personal data permanently","Recognize that encryption cannot protect data while it is used in training, and add tokenization or differential privacy, strict access controls and monitoring of the training environment"],"correctIndex":3,"explanation":"Models need readable data to learn, so encryption at rest and in transit leaves a gap during use. Step 1: identify the gap. Step 2: shield sensitive text with tokenization or differential privacy and restrict and monitor the environments where data is used. A blanket stop is not risk-based, and encrypting outputs does not protect the inputs in use.","optionRationales":["Output encryption leaves the decrypted inputs exposed.","The encryption claim ignores exposure during processing.","A permanent stop removes value and is unnecessary when proportionate controls exist.","Models need readable data to learn, so encryption at rest and in transit leaves a gap during use. Step 1: identify the gap. Step 2: shield sensitive text with tokenization or differential privacy and restrict and monitor the environments where data is used. A blanket stop is not risk-based, and encrypting outputs does not protect the inputs in use."],"sourceRef":"D2 practice questions · Q10 · 2.7.5","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q011","sectionId":"d2-A","knowledgePointIds":["d2-A-0-5","d1-D-5-0"],"scenarioId":"d2-doc-case-8b9a297b99","scenario":"Aldine Insurance's claims-fraud model has noticeably poorer recall for claims from a minority group of rural customers. The data science lead, Greg Alvarez, proposes to collect ten times more claims data from the existing customer base. The compliance officer, Joy Wang, doubts that this will help.","type":"application","difficulty":"difficult","stem":"What is the BEST action?","options":["Improve the variety and balance of the data, for example by oversampling the underrepresented group, and then re-test performance by subgroup","Collect ten times more data from the same population to increase volume","Remove the group from the dataset so that the poor results disappear","Report only the overall accuracy, which is high"],"correctIndex":0,"explanation":"Statistical bias from underrepresentation is addressed through representative, balanced data, not just volume. Step 1: identify the cause as imbalance. Step 2: rebalance (for example oversample) and verify by subgroup. More of the same data reproduces the gap, removing the group hides it, and overall accuracy masks subgroup harm.","optionRationales":["Statistical bias from underrepresentation is addressed through representative, balanced data, not just volume. Step 1: identify the cause as imbalance. Step 2: rebalance (for example oversample) and verify by subgroup. More of the same data reproduces the gap, removing the group hides it, and overall accuracy masks subgroup harm.","More of the same skewed distribution keeps the minority underrepresented.","Excluding the group conceals the problem and may itself be discriminatory.","Aggregate accuracy hides subgroup failure and avoids the issue."],"sourceRef":"D2 practice questions · Q11 · 2.2","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q012","sectionId":"d2-A","knowledgePointIds":["d2-A-0-2"],"scenarioId":"d2-doc-case-9b860c8e1d","scenario":"Brightwater Diagnostics wants to build an imaging model for a rare disease, but has only about 400 labeled scans. The head of AI, Dr. Priya Nair, asks the AI governance team what approach is acceptable.","type":"application","difficulty":"difficult","stem":"Which approach is BEST?","options":["Train a much deeper network, since complex models need less data","Scrape patient images from public forums to quickly increase the sample","Augment the data with validated synthetic samples or transfer learning, check the synthetic data against real clinical data for bias and leakage, and keep a clinically independent test set","Reuse some of the test scans for training to increase the training set"],"correctIndex":2,"explanation":"With scarce data the aim is to widen learning without compromising integrity, privacy or evaluation. Step 1: increase effective data through validated synthetic data or transfer learning. Step 2: keep an independent test set and check bias and leakage. Scraping raises consent and quality issues, deeper networks overfit small sets, and reusing test scans contaminates evaluation.","optionRationales":["Deeper networks on small data are prone to overfitting.","Scraped images lack consent, provenance and quality control.","With scarce data the aim is to widen learning without compromising integrity, privacy or evaluation. Step 1: increase effective data through validated synthetic data or transfer learning. Step 2: keep an independent test set and check bias and leakage. Scraping raises consent and quality issues, deeper networks overfit small sets, and reusing test scans contaminates evaluation.","Training on test data contaminates the evaluation and inflates results."],"sourceRef":"D2 practice questions · Q12 · 2.2","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q013","sectionId":"d2-A","knowledgePointIds":["d2-A-0-4","d1-D-1-0","d1-D-3-0"],"scenarioId":"d2-doc-case-2a71a69ba3","scenario":"Tessa Technologies licenses a labeled dataset from a vendor for a customer-support model. When the compliance officer, Luis Ortega, asks where the data came from and whether it was collected lawfully, the vendor has no records. The product owner wants to start training because the project is behind schedule.","type":"application","difficulty":"moderate","stem":"What is the PRIMARY concern, and what should be done?","options":["Performance risk; train a small model first and check accuracy","Security risk; add stronger network controls and start training","Provenance and legal-rights risk; do not use the data until its origin and the right to use it are established","Cost risk; negotiate a lower price and proceed"],"correctIndex":2,"explanation":"Without provenance records the organization cannot show it has the right to use the data, which exposes it to legal and regulatory risk (for example copyright claims). Step 1: identify provenance as the issue. Step 2: stop use until origin and rights are established. Security controls, pilots and price changes do not resolve rights.","optionRationales":["A pilot would still use data of unknown lawfulness.","More security does not establish lawful origin.","Without provenance records the organization cannot show it has the right to use the data, which exposes it to legal and regulatory risk (for example copyright claims). Step 1: identify provenance as the issue. Step 2: stop use until origin and rights are established. Security controls, pilots and price changes do not resolve rights.","A discount does not cure missing rights."],"sourceRef":"D2 practice questions · Q13 · 2.1","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q014","sectionId":"d2-A","knowledgePointIds":["d2-A-0-4","d1-D-4-3"],"scenarioId":"d2-doc-case-41d73de376","scenario":"Kinetic Retail's demand model trains on data that passes through an extract-transform-load (ETL) process. After a developer changes a transformation rule, some product prices are loaded in the wrong currency, and forecasts degrade. No one documented or tested the change. The data engineering manager, Salma Idris, asks the auditor which control matters MOST.","type":"application","difficulty":"moderate","stem":"What is the MOST effective control?","options":["Define, document, test and approve ETL requirements and logic, with validation checks and logging at each stage","Allow developers to alter ETL rules freely, since the model will adapt","Increase the volume of loaded data to dilute the errors","Review forecasts only at year end"],"correctIndex":0,"explanation":"Errors can be introduced at any stage of ETL, so defining, documenting, testing and properly implementing the requirements and logic are integrity controls. Step 1: trace the degradation to an untested transformation change. Step 2: put controls on ETL itself. Models do not adapt reliably to systematic errors, more data does not dilute them safely, and year-end review is too late.","optionRationales":["Errors can be introduced at any stage of ETL, so defining, documenting, testing and properly implementing the requirements and logic are integrity controls. Step 1: trace the degradation to an untested transformation change. Step 2: put controls on ETL itself. Models do not adapt reliably to systematic errors, more data does not dilute them safely, and year-end review is too late.","Models learn from the corrupted data rather than correcting it.","Larger volumes of flawed data worsen the problem.","Annual review detects the issue long after harm."],"sourceRef":"D2 practice questions · Q14 · 2.7.5","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q015","sectionId":"d2-A","knowledgePointIds":["d2-A-0-5"],"scenarioId":"d2-doc-case-44f0c1d940","scenario":"Crestwood Insurance's customer table contains three separate records for the same policyholder, each with a different customer number. The data scientist, Alex Moreno, notices that the claims model counts this customer's history three times. The operations manager, Nadia Reed, asks which quality dimension is affected and what to do.","type":"application","difficulty":"basic","stem":"Which answer is BEST?","options":["Completeness; add more fields to each record","Timeliness; refresh the table every day","Validity; restrict the allowed values of the customer number field","Uniqueness; apply deduplication rules and unique identifiers at ingestion"],"correctIndex":3,"explanation":"Duplicate or redundant records breach uniqueness. Step 1: name the dimension. Step 2: remove duplicates and enforce a single identifier at ingestion. Refreshing, restricting values or adding fields do not remove the duplication.","optionRationales":["Adding fields does not address duplicate records.","Timeliness concerns how current data is, which is not the problem.","Validity concerns conformance to rules, and the numbers may each be valid.","Duplicate or redundant records breach uniqueness. Step 1: name the dimension. Step 2: remove duplicates and enforce a single identifier at ingestion. Refreshing, restricting values or adding fields do not remove the duplication."],"sourceRef":"D2 practice questions · Q15 · 2.4","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q016","sectionId":"d2-B","knowledgePointIds":["d2-B-0-1"],"scenarioId":"d2-doc-case-8658a094ce","scenario":"Tallis Manufacturing's operations director announces that the company \"needs an AI project\" to reduce unplanned downtime. A product owner, Gina Marsh, is asked to start. Engineers are already comparing platforms and a vendor is offering a free trial.","type":"application","difficulty":"basic","stem":"What should the product owner do FIRST?","options":["Select the AI platform with the most features during the free trial","Define the specific business problem, success measures and the data and resources needed to address it","Collect all available sensor data into a central lake","Choose the model architecture and begin training"],"correctIndex":1,"explanation":"The first step in the AI life cycle is use case development: identify the business problem, not the technology, and judge whether AI is suitable and whether data and resources are adequate. Platform choice, indiscriminate collection and architecture selection all assume a problem that has not yet been defined.","optionRationales":["Selecting technology before defining the problem inverts the sequence and risks poor fit.","The first step in the AI life cycle is use case development: identify the business problem, not the technology, and judge whether AI is suitable and whether data and resources are adequate. Platform choice, indiscriminate collection and architecture selection all assume a problem that has not yet been defined.","Collecting everything without a purpose violates fit-for-purpose and creates cost and risk.","Architecture and training come after the problem and data are understood."],"sourceRef":"D2 practice questions · Q16 · 2.8.1","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q017","sectionId":"d2-B","knowledgePointIds":["d2-B-0-2"],"scenarioId":"d2-doc-case-e06d1b2a70","scenario":"A data science team at Orchid Insurance reports that its claims-triage model reached 94% accuracy and is ready for production. The claims director, Raj Patel, says the project goal was to cut average handling time by 20% and reduce leakage, but those measures were never tracked. The product owner, Elise Ward, must decide what to do.","type":"application","difficulty":"moderate","stem":"What is the BEST action?","options":["Release the model, because accuracy above 90% shows it is fit for use","Have business and technical owners agree success measures that combine business outcomes with model metrics, and test the model against them before release","Track handling time only after launch, using customer complaints as the indicator","Ask the vendor to confirm that the model is technically sound"],"correctIndex":1,"explanation":"Business resources must communicate the problem and success metrics, not just model performance. Step 1: recognize that accuracy does not show the business objective is met. Step 2: define joint success measures and verify them before go-live. Releasing on accuracy alone, relying on complaints, or relying on a vendor's technical statement leaves the objective unverified.","optionRationales":["High accuracy does not show that handling time or leakage improved.","Business resources must communicate the problem and success metrics, not just model performance. Step 1: recognize that accuracy does not show the business objective is met. Step 2: define joint success measures and verify them before go-live. Releasing on accuracy alone, relying on complaints, or relying on a vendor's technical statement leaves the objective unverified.","Complaints are a late and weak indicator, and measuring after launch is reactive.","Technical soundness does not demonstrate business value."],"sourceRef":"D2 practice questions · Q17 · 2.8.1","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q018","sectionId":"d2-B","knowledgePointIds":["d2-B-0-4"],"scenarioId":"d2-doc-case-07752fc5cf","scenario":"Greenfield Property's data scientist, Wen Zhao, builds a model to estimate home values using only floor area. The model performs poorly on both the data it was trained on and new data. The product owner, Sam Dixon, asks what the issue is and how to improve it.","type":"application","difficulty":"moderate","stem":"Which answer is BEST?","options":["The model is robust; add throttling to improve it","The model is overfitted; reduce the training data","The model is accurate, but needs a larger test set","The model is underfitted because too few features are used; add relevant features such as location, selected with business experts, and test for overfitting"],"correctIndex":3,"explanation":"Poor results on both training and new data indicate underfitting: a model too simple to capture the real drivers (here, location is missing). Step 1: diagnose underfitting. Step 2: add relevant features chosen collaboratively, then re-test so that complexity does not tip into overfitting. Overfitting would show good training results, and throttling is unrelated.","optionRationales":["Throttling addresses inference-time resource use, not model fit.","Overfitting would show strong training performance and weak new-data performance, which is not the pattern here.","Poor performance on training data cannot be fixed with a larger test set.","Poor results on both training and new data indicate underfitting: a model too simple to capture the real drivers (here, location is missing). Step 1: diagnose underfitting. Step 2: add relevant features chosen collaboratively, then re-test so that complexity does not tip into overfitting. Overfitting would show good training results, and throttling is unrelated."],"sourceRef":"D2 practice questions · Q18 · 2.8.2","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q019","sectionId":"d2-B","knowledgePointIds":["d2-B-0-4","d2-B-0-16"],"scenarioId":"d2-doc-case-3cb11258eb","scenario":"Summit Bank's credit model uses 900 input features. It scores 100% on training data and 71% on the test set. The compliance officer, Natalia Gomez, notes that regulators expect the bank to explain individual credit decisions, and the model team cannot explain which factors matter.","type":"application","difficulty":"difficult","stem":"What is the BEST course of action?","options":["Reduce and select features with business input, use regularization, evaluate on held-out data, and favor a model complexity that can be explained","Add more features and layers to push test performance towards 100%","Report the 100% training score to the credit committee","Keep the model as it is and provide a general description of how credit models work"],"correctIndex":0,"explanation":"The gap between training and test results shows overfitting from too many features, and complexity also reduces explainability. Step 1: diagnose. Step 2: reduce features, regularize, validate on held-out data and choose complexity that supports explanation. Adding complexity worsens both problems, quoting training scores misleads, and a generic description does not explain decisions.","optionRationales":["The gap between training and test results shows overfitting from too many features, and complexity also reduces explainability. Step 1: diagnose. Step 2: reduce features, regularize, validate on held-out data and choose complexity that supports explanation. Adding complexity worsens both problems, quoting training scores misleads, and a generic description does not explain decisions.","More features and layers deepen overfitting and opacity.","Training accuracy is not evidence of real performance and presenting it misleads governance.","A generic description does not satisfy a requirement to explain individual decisions."],"sourceRef":"D2 practice questions · Q19 · 2.8.2","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q020","sectionId":"d2-B","knowledgePointIds":["d2-B-0-7"],"scenarioId":"d2-doc-case-d9d75f4453","scenario":"Bluestone Health's data scientist repeatedly adjusts a model's hyperparameters, checking results on the test set each time until performance peaks at 96%. In production, performance drops to 83%. The internal auditor, Carla Mendes, reviews the process.","type":"application","difficulty":"moderate","stem":"What is the MOST likely issue, and what is the BEST remedy?","options":["Underfitting; reduce the number of features","Data drift in production; retrain the model every day","Test-set contamination through repeated tuning; use the validation set for tuning and evaluate once on a fresh untouched test set","An integration failure; replace the deployment pipeline"],"correctIndex":2,"explanation":"The validation set (about 10-20% of data) is for tuning, and the test set (about 10-20%) is for a single final evaluation. Tuning on the test set leaks information into the model, producing an inflated estimate. Step 1: spot the contamination. Step 2: restore discipline and evaluate on an untouched set. The other options do not match the evidence of an inflated test score.","optionRationales":["Underfitting would give poor training results, not an inflated test peak.","Drift could occur, but the inflated test score is explained by tuning on the test set, and daily retraining is not justified.","The validation set (about 10-20% of data) is for tuning, and the test set (about 10-20%) is for a single final evaluation. Tuning on the test set leaks information into the model, producing an inflated estimate. Step 1: spot the contamination. Step 2: restore discipline and evaluate on an untouched set. The other options do not match the evidence of an inflated test score.","Nothing indicates a pipeline fault, and replacing it would not remove the contamination."],"sourceRef":"D2 practice questions · Q20 · 2.8.3","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q021","sectionId":"d2-B","knowledgePointIds":["d2-B-0-9"],"scenarioId":"d2-doc-case-3e689cecbf","scenario":"Ferrous Bank's fraud model flags card transactions. Only 1% of transactions are fraudulent. The data scientist, Idris Khan, reports 99% accuracy and recommends deployment. The risk manager, Lucy Tran, is not convinced.","type":"application","difficulty":"difficult","stem":"What should the risk manager require?","options":["A larger training set, with accuracy as the only metric","No further evaluation, as 99% accuracy is excellent","Evaluation using precision, recall and F1 on the fraud class, because accuracy alone can be high for a model that detects almost no fraud","A report of average response time instead of model metrics"],"correctIndex":2,"explanation":"With 99% of cases non-fraud, a model that flags nothing is 99% accurate. Step 1: recognize the imbalance. Step 2: require precision, recall and F1 for the minority class so that detection quality is visible. More data with the same metric, or latency figures, would not reveal missed fraud.","optionRationales":["More data without better metrics keeps the blind spot.","Accuracy on imbalanced data can hide a model that finds no fraud.","With 99% of cases non-fraud, a model that flags nothing is 99% accurate. Step 1: recognize the imbalance. Step 2: require precision, recall and F1 for the minority class so that detection quality is visible. More data with the same metric, or latency figures, would not reveal missed fraud.","Response time measures speed, not detection quality."],"sourceRef":"D2 practice questions · Q21 · 2.8.3","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q022","sectionId":"d2-B","knowledgePointIds":["d2-B-0-10","d2-B-0-11"],"scenarioId":"d2-doc-case-400419ee54","scenario":"Corvid Logistics' route-optimization model passed testing and the operations team plans a go-live this Friday. The monitoring dashboards and drift alerts are not ready and are scheduled for the following month. The product owner, Jack Moreno, argues that this is acceptable because testing was thorough.","type":"application","difficulty":"moderate","stem":"What is the BEST response from the AI governance lead?","options":["Require that monitoring, drift thresholds, alerts and a rollback plan are in place at go-live, or defer the release","Approve the release and add monitoring when time allows","Release to all regions at once to detect problems faster","Rely on user complaints to identify performance problems"],"correctIndex":0,"explanation":"Models degrade after deployment as data and conditions change, so monitoring tools must be ready to detect performance drift at go-live. Step 1: recognize that testing is point-in-time. Step 2: make monitoring and rollback a release condition. Releasing without them favors convenience over reliability.","optionRationales":["Models degrade after deployment as data and conditions change, so monitoring tools must be ready to detect performance drift at go-live. Step 1: recognize that testing is point-in-time. Step 2: make monitoring and rollback a release condition. Releasing without them favors convenience over reliability.","Delaying monitoring leaves drift undetected during the riskiest period.","A wider release increases exposure before controls exist.","Complaints detect problems late and only after harm."],"sourceRef":"D2 practice questions · Q22 · 2.8","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q023","sectionId":"d2-B","knowledgePointIds":["d2-B-0-13"],"scenarioId":"d2-doc-case-fdd6e0c4a4","scenario":"Larkspur Telecom retires a customer-support LLM that was fine-tuned on customer conversations. IT plans to shut down the servers and delete the application. The privacy officer, Anita Verma, is concerned. The model has billions of parameters.","type":"application","difficulty":"difficult","stem":"What is the GREATEST risk, and what is the BEST action?","options":["Reduced accuracy; keep the model running in parallel indefinitely","Loss of the model's branding; archive the application's interface","Excess GPU capacity; reassign the hardware immediately","Residual sensitive data may remain in the model, backups and related stores; execute a decommissioning plan covering data sanitization and migration, artifacts and retention obligations"],"correctIndex":3,"explanation":"Large models can retain sensitive training data, and copies persist in backups, logs and artifacts. Step 1: identify residual data as the key risk. Step 2: plan sanitization, migration and retention handling, then verify. The other options are not the main risk, and indefinite parallel operation avoids decommissioning.","optionRationales":["Keeping the model alive indefinitely defeats retirement and prolongs exposure.","Branding is not the risk in retirement.","Capacity reuse is a benefit, and doing it before sanitization could leave data on the hardware.","Large models can retain sensitive training data, and copies persist in backups, logs and artifacts. Step 1: identify residual data as the key risk. Step 2: plan sanitization, migration and retention handling, then verify. The other options are not the main risk, and indefinite parallel operation avoids decommissioning."],"sourceRef":"D2 practice questions · Q23 · 2.8","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q024","sectionId":"d2-B","knowledgePointIds":["d2-B-0-14"],"scenarioId":"d2-doc-case-a2d66f7c33","scenario":"Medisphere's new health-coaching app shares users' activity and location data with partners unless users find the setting and opt out. The privacy officer, Daniela Cruz, is reviewing it against Privacy by Design. The product owner says users can protect themselves if they wish.","type":"application","difficulty":"moderate","stem":"Which principle is MOST directly breached, and what is the fix?","options":["End-to-end security; add encryption to the partner transfer","Privacy as the default; configure the app so that data sharing is off unless the user actively chooses it","Visibility and transparency; publish a longer privacy notice","Full functionality; remove features until the app is simple"],"correctIndex":1,"explanation":"Under privacy as the default, personal data is protected out of the box without any action by the user. Opt-out sharing reverses that. Step 1: map the behavior to the principle. Step 2: change the default. Encryption, longer notices and removing features do not change who bears the burden of protection.","optionRationales":["Encryption protects transfers but does not make sharing opt-in.","Under privacy as the default, personal data is protected out of the box without any action by the user. Opt-out sharing reverses that. Step 1: map the behavior to the principle. Step 2: change the default. Encryption, longer notices and removing features do not change who bears the burden of protection.","A longer notice puts the burden on users and does not change the default.","Removing functionality conflicts with the positive-sum principle and does not fix the default."],"sourceRef":"D2 practice questions · Q24 · 2.9.1","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q025","sectionId":"d2-B","knowledgePointIds":["d2-B-0-15"],"scenarioId":"d2-doc-case-66239b776a","scenario":"Quantis Software ships AI features with permissive default settings and publishes hardening guides that customers must apply. Vulnerabilities are disclosed only when customers ask. The CEO, Marcus Hale, wants to align with Secure by Design. The CISO, Rina Patel, is asked what the principles require of the company.","type":"application","difficulty":"difficult","stem":"Which action BEST reflects Secure by Design?","options":["Keep permissive defaults but add more documentation for customers","Take ownership of customer security outcomes through secure defaults, be transparent about vulnerabilities and accountable for fixing them, and build leadership structures that drive this","Transfer security responsibility to customers through contract terms","Delay disclosure of vulnerabilities until patches are ready, to protect the brand"],"correctIndex":1,"explanation":"The three principles are ownership of customer security outcomes, radical transparency and accountability, and leadership that builds structures to achieve them. Step 1: identify where the company shifts responsibility to customers. Step 2: reverse it with secure defaults, openness and executive ownership. More documentation, contractual transfer and delayed disclosure retain the problem.","optionRationales":["Documentation leaves the burden on customers and keeps insecure defaults.","The three principles are ownership of customer security outcomes, radical transparency and accountability, and leadership that builds structures to achieve them. Step 1: identify where the company shifts responsibility to customers. Step 2: reverse it with secure defaults, openness and executive ownership. More documentation, contractual transfer and delayed disclosure retain the problem.","Contractual transfer is the opposite of ownership.","Concealing vulnerabilities contradicts radical transparency."],"sourceRef":"D2 practice questions · Q25 · 2.9.2","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q026","sectionId":"d2-B","knowledgePointIds":["d2-B-0-16"],"scenarioId":"d2-doc-case-ab8f61ffc9","scenario":"Alder Insurance uses a deep-learning model to decide on claims for EU customers. After a complaint, the regulator asks for evidence of how the model was built and how individual decisions can be explained. The model team has only a short architecture slide. The compliance officer, Petra Lindgren, asks what must be documented.","type":"application","difficulty":"difficult","stem":"What is the BEST response?","options":["Provide the vendor's marketing description of the platform","Provide the source code of the training scripts, as it shows exactly how the model works","Explain that deep-learning decisions cannot be explained and cite model accuracy","Document the governance over development and use, the personal data and consent handling (including opt-outs), data cleaning, security controls, model design and hyperparameters, and evaluation including adversarial, bias and toxicity testing"],"correctIndex":3,"explanation":"Where a model is too complex to explain every decision, organizations support explainability through documented governance, data, consent, cleaning, security, design, hyperparameters and testing. Step 1: recognize that explanation is built from multiple artifacts. Step 2: assemble them. Source code alone is of limited use for neural networks, claiming inexplicability fails the obligation, and marketing is not evidence.","optionRationales":["Marketing material is not independent evidence of how this model was built.","Code shows scripts, not learned behavior encoded in high-dimensional weights.","Declaring decisions inexplicable does not meet explanation requirements.","Where a model is too complex to explain every decision, organizations support explainability through documented governance, data, consent, cleaning, security, design, hyperparameters and testing. Step 1: recognize that explanation is built from multiple artifacts. Step 2: assemble them. Source code alone is of limited use for neural networks, claiming inexplicability fails the obligation, and marketing is not evidence."],"sourceRef":"D2 practice questions · Q26 · 2.9.3","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q027","sectionId":"d2-B","knowledgePointIds":["d2-B-0-17"],"scenarioId":"d2-doc-case-b9817ad4f4","scenario":"Cresta Bank's customer chatbot has been seen to loop on malformed inputs, consume excessive compute and, on two occasions, return unsafe financial guidance when confused. The engineering lead, Tom Ellison, proposes retraining on more data. The operations manager, Aisha Rahman, asks the auditor what would improve resilience MOST.","type":"application","difficulty":"expert","stem":"Which approach is MOST effective?","options":["Input validation and sanitization, throttling and limits at inference, proactive error handling and safe-failure thresholds, so that the system refuses to produce output that does not meet defined safety criteria","Retrain on more data and accept the same runtime behavior","Increase compute capacity so that loops complete","Add a disclaimer to the chatbot window about possible errors"],"correctIndex":0,"explanation":"Looping, resource exhaustion and unsafe outputs under unexpected input point to weak robustness. Step 1: diagnose as a brittleness problem, not a knowledge problem. Step 2: apply runtime controls: validation and sanitization, throttling, error handling and safe failure. More data does not add these controls, more compute funds the loop, and disclaimers do not prevent unsafe guidance.","optionRationales":["Looping, resource exhaustion and unsafe outputs under unexpected input point to weak robustness. Step 1: diagnose as a brittleness problem, not a knowledge problem. Step 2: apply runtime controls: validation and sanitization, throttling, error handling and safe failure. More data does not add these controls, more compute funds the loop, and disclaimers do not prevent unsafe guidance.","Retraining may improve knowledge but leaves input handling and resource use unchanged.","Extra compute merely pays for loops, and an attacker could exploit them.","A disclaimer does not stop harmful output, and it relies on the customer to detect it."],"sourceRef":"D2 practice questions · Q27 · 2.9.4","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q028","sectionId":"d2-B","knowledgePointIds":["d2-B-0-9"],"scenarioId":"d2-doc-case-d40ff02a60","scenario":"Pioneer Bank's product owner, Clara Nunez, wants to release a customer-segmentation model this week to meet a campaign date. The model has high accuracy, but bias testing and adversarial testing have not been done. The vendor offers a general security certificate as comfort. The AI governance lead, Jamal Wright, must advise.","type":"application","difficulty":"difficult","stem":"What is the BEST advice?","options":["Release now and run the tests after the campaign","Release, because accuracy is high and the certificate covers security","Hold the release until risk-based bias testing and adversarial testing are completed and documented, for example in the model card, or limit the release to a low-risk use","Skip the tests permanently, since the model is a black box"],"correctIndex":2,"explanation":"High accuracy does not show fairness or resilience, and a generic certificate does not test this model. Step 1: recognize the missing AI-specific tests. Step 2: complete them proportionately or narrow the release. Deferring or skipping tests favors schedule over reliability.","optionRationales":["Post-campaign testing means customers bear the risk first.","Accuracy and a general certificate do not evidence fairness or adversarial resilience.","High accuracy does not show fairness or resilience, and a generic certificate does not test this model. Step 1: recognize the missing AI-specific tests. Step 2: complete them proportionately or narrow the release. Deferring or skipping tests favors schedule over reliability.","Opacity makes behavioral testing more necessary, not less."],"sourceRef":"D2 practice questions · Q28 · 2.12","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q029","sectionId":"d2-B","knowledgePointIds":["d2-B-0-7"],"scenarioId":"d2-doc-case-c827f171c1","scenario":"Auditor Marcus Boyle reviews a hospital's readmission model. The data science team has split the data into training, validation and test sets. Boyle asks which set must stay untouched until the final evaluation, to give an unbiased estimate of performance.","type":"application","difficulty":"basic","stem":"Which dataset should be reserved for that purpose?","options":["The validation set, since it is used to tune hyperparameters","The training set, since the model has learned from it","The test set, used once after training and tuning are complete","The feature set, since it defines the inputs"],"correctIndex":2,"explanation":"The training set is for learning, the validation set for tuning hyperparameters or selecting a model, and the test set for one final, unbiased evaluation. Using the test set earlier contaminates the result. A feature set is not a data split.","optionRationales":["The validation set is used repeatedly during tuning.","The model has already seen the training set, so it cannot give an unbiased estimate.","The training set is for learning, the validation set for tuning hyperparameters or selecting a model, and the test set for one final, unbiased evaluation. Using the test set earlier contaminates the result. A feature set is not a data split.","Features are inputs, not an evaluation dataset."],"sourceRef":"D2 practice questions · Q29 · 2.8.3","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q030","sectionId":"d2-C","knowledgePointIds":["d2-C-0-1"],"scenarioId":"d2-doc-case-9db74f9351","scenario":"Ostrava Manufacturing's predictive-maintenance model suddenly raises false alarms after a supplier updates the firmware of vibration sensors, which changes the units of the data. No change request was raised. The operations lead, Pavel Novak, asks the AI governance team what should have been in place.","type":"application","difficulty":"moderate","stem":"Which control would have been MOST effective?","options":["Documented data input requirements and monitoring of input data against them, with upstream data changes handled through change management","More frequent hardware maintenance of the sensors","A larger model that tolerates any input format","Disabling alerts to reduce false alarms"],"correctIndex":0,"explanation":"Models expect specific input attributes, and unexpected changes in sources or formats degrade performance. Step 1: identify an input-data change outside the AI team's control. Step 2: require documented input requirements, monitoring of input data, and change management that covers upstream sources. Hardware maintenance does not prevent unit changes, a larger model does not fix it, and silencing alerts removes the safety signal.","optionRationales":["Models expect specific input attributes, and unexpected changes in sources or formats degrade performance. Step 1: identify an input-data change outside the AI team's control. Step 2: require documented input requirements, monitoring of input data, and change management that covers upstream sources. Hardware maintenance does not prevent unit changes, a larger model does not fix it, and silencing alerts removes the safety signal.","Maintenance does not control a firmware change affecting data format.","Model size does not guarantee tolerance to changes in units or schema.","Disabling alerts hides the problem and defeats monitoring."],"sourceRef":"D2 practice questions · Q30 · 2.10.1","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q031","sectionId":"d2-C","knowledgePointIds":["d2-B-0-11","d2-C-0-1"],"scenarioId":"d2-doc-case-a01a8a6b90","scenario":"Reliant Bank's credit-scoring model was validated 18 months ago. Since then, the economy and customer behavior have changed. Default rates in some segments are higher than the model predicts, but nobody noticed until the quarterly loss review. The head of model risk, Sylvia Brandt, asks what to put in place.","type":"application","difficulty":"difficult","stem":"What is the BEST recommendation?","options":["Replace the model with a more complex one","Retrain the model once each year on a fixed date, regardless of data changes","Wait for loss reviews to identify problems, as they have done","Include data drift monitoring in change management, with thresholds, alerts and criteria that trigger review or retraining"],"correctIndex":3,"explanation":"Changes in underlying data over time are drift, and some occur without the organization initiating them. Step 1: recognize that detection depended on lagging financial results. Step 2: monitor drift against thresholds and define when to review or retrain. A fixed annual date ignores actual change, loss reviews are lagging, and complexity does not detect drift.","optionRationales":["A more complex model could drift just as much and be harder to explain.","A calendar schedule may be too late or too early and does not detect change.","Lagging indicators detect harm after it has occurred.","Changes in underlying data over time are drift, and some occur without the organization initiating them. Step 1: recognize that detection depended on lagging financial results. Step 2: monitor drift against thresholds and define when to review or retrain. A fixed annual date ignores actual change, loss reviews are lagging, and complexity does not detect drift."],"sourceRef":"D2 practice questions · Q31 · 2.10.1","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q032","sectionId":"d2-C","knowledgePointIds":["d2-C-0-2"],"scenarioId":"d2-doc-case-5444eee1a0","scenario":"At Fernhill Retail, an engineer raises the temperature setting of the customer chatbot from 0.2 to 0.9 so that it sounds \"friendlier.\" No change ticket is raised. Within days, answers vary widely and some contradict policy. The compliance officer, Beth Alvarez, asks the audit team for its PRIMARY concern.","type":"application","difficulty":"moderate","stem":"What is the PRIMARY concern?","options":["The engineer has not received credit for a design improvement","Model parameter changes are not governed as formal changes with testing and approval","Temperature settings are cosmetic and have no operational effect","The chatbot should have been trained on more data"],"correctIndex":1,"explanation":"Behavior can change dramatically without touching code, and adjusting inference parameters such as temperature changes output variance. Step 1: recognize the setting as a material change. Step 2: require formal change control, testing and approval. Treating it as trivial or fixing it by training does not address the governance gap.","optionRationales":["Recognition is irrelevant to control. The issue is unmanaged change.","Behavior can change dramatically without touching code, and adjusting inference parameters such as temperature changes output variance. Step 1: recognize the setting as a material change. Step 2: require formal change control, testing and approval. Treating it as trivial or fixing it by training does not address the governance gap.","Temperature significantly alters variance and behavior, so it is not cosmetic.","More training data does not address an ungoverned configuration change."],"sourceRef":"D2 practice questions · Q32 · 2.10.2","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q033","sectionId":"d2-C","knowledgePointIds":["d2-C-0-2"],"scenarioId":"d2-doc-case-04ad2f121b","scenario":"A claims team at Westgate Insurance relies on a third-party LLM through an API. The vendor upgrades the underlying model version without notice, and claim summaries begin to omit key exclusions. The AI operations manager, Gareth Cole, asks what governance should have required.","type":"application","difficulty":"difficult","stem":"Which approach is MOST effective?","options":["Accept all vendor upgrades automatically, because newer models are better","Pin versions in production, require vendor change notification, and run impact assessment and regression tests against a baseline before adopting a new version, with a rollback plan","Rely on the vendor's release notes without testing","Disable the integration and return to a manual process permanently"],"correctIndex":1,"explanation":"Swapping a model for a newer version can drastically change outputs, so model versions are formal changes. Step 1: identify uncontrolled version change. Step 2: pin versions, obtain notice, test against a baseline and prepare rollback. Automatic adoption and reliance on release notes skip testing, and permanent disablement is disproportionate.","optionRationales":["Newer does not mean equivalent, and the result here shows regression.","Swapping a model for a newer version can drastically change outputs, so model versions are formal changes. Step 1: identify uncontrolled version change. Step 2: pin versions, obtain notice, test against a baseline and prepare rollback. Automatic adoption and reliance on release notes skip testing, and permanent disablement is disproportionate.","Release notes do not demonstrate behavior in the organization's use case.","A permanent return to manual work gives up value that controlled change would preserve."],"sourceRef":"D2 practice questions · Q33 · 2.10.2","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q034","sectionId":"d2-C","knowledgePointIds":["d2-C-0-2"],"scenarioId":"d2-doc-case-523c43de83","scenario":"Dunmore Bank's public chatbot is being manipulated by prompt injection to reveal internal instructions. A fix requires retraining, which will take about three weeks. The security manager, Tariq Hussain, needs an immediate mitigation that regulators and the change board will accept.","type":"application","difficulty":"difficult","stem":"What is the BEST action?","options":["Skip stakeholder approval because the situation is urgent","Apply a code patch directly to the model weights","Wait for the retrained model before taking any action","Implement input and output validation outside the model as an emergency change approved by key stakeholders while the model is retrained"],"correctIndex":3,"explanation":"A model cannot be patched like conventional code, and retraining takes time. Step 1: choose a shield that can be deployed quickly, namely pre-processing of inputs and post-processing of outputs outside the model. Step 2: follow emergency change approval with key stakeholders. Patching weights is not feasible, waiting leaves exposure, and skipping approval weakens control.","optionRationales":["Emergency changes still need stakeholder review and approval.","There is no equivalent of a code patch for model weights.","Waiting three weeks leaves the exploit open.","A model cannot be patched like conventional code, and retraining takes time. Step 1: choose a shield that can be deployed quickly, namely pre-processing of inputs and post-processing of outputs outside the model. Step 2: follow emergency change approval with key stakeholders. Patching weights is not feasible, waiting leaves exposure, and skipping approval weakens control."],"sourceRef":"D2 practice questions · Q34 · 2.10.4","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q035","sectionId":"d2-C","knowledgePointIds":["d2-C-0-2"],"scenarioId":"d2-doc-case-f8225f05a3","scenario":"Alvord Insurance deploys a new version of its claims model. Within days, denial rates for one customer segment rise sharply. The previous version is available. A review shows both versions were trained on the same dataset, which contains mislabeled outcomes for that segment. Operations manager Dean Ross proposes an immediate rollback.","type":"application","difficulty":"expert","stem":"What is the BEST course of action?","options":["Do not rely on rollback alone. Apply input/output controls or human review for the affected segment under emergency change approval, and correct the data and retrain","Roll back to the previous version, which has solved the problem","Keep the new version and retrain it on the same data","Disable monitoring so that denials are not flagged"],"correctIndex":0,"explanation":"Rollback helps when the issue correlates with a model change and the earlier model was sound. Step 1: note that the shared training data contains the fault, so the earlier model is also affected. Step 2: use quick shields, such as human review or validation controls, and fix the data before retraining. Rolling back or retraining on the same data repeats the error, and disabling monitoring hides it.","optionRationales":["Rollback helps when the issue correlates with a model change and the earlier model was sound. Step 1: note that the shared training data contains the fault, so the earlier model is also affected. Step 2: use quick shields, such as human review or validation controls, and fix the data before retraining. Rolling back or retraining on the same data repeats the error, and disabling monitoring hides it.","The previous version shares the data defect, so rollback does not solve it.","Retraining on the same data reproduces the bias.","Switching off monitoring conceals harm and favors convenience."],"sourceRef":"D2 practice questions · Q35 · 2.10.4","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q036","sectionId":"d2-C","knowledgePointIds":["d2-C-0-1"],"scenarioId":"d2-doc-case-e00a3a6f3f","scenario":"Halden Retail's demand-forecasting model tests well but performs worse in production. The engineering team discovers that production uses a different tokenization library and different text normalization steps than were used in training. The operations manager, Isla Murray, asks the auditor which control addresses this.","type":"application","difficulty":"moderate","stem":"Which control is MOST appropriate?","options":["A faster server for inference","A larger training set","Configuration management that tracks key configuration items and keeps preprocessing and tokenization consistent between training and production","A new model with additional layers"],"correctIndex":2,"explanation":"Differences in preprocessing between training and inference change what the model sees. Step 1: find the mismatch. Step 2: manage configuration items so that training and production use the same preprocessing and tokenization, and monitor for deviation. More data, hardware speed or model depth do not align the pipelines.","optionRationales":["Speed does not correct mismatched preprocessing.","More training data does not align the production pipeline.","Differences in preprocessing between training and inference change what the model sees. Step 1: find the mismatch. Step 2: manage configuration items so that training and production use the same preprocessing and tokenization, and monitor for deviation. More data, hardware speed or model depth do not align the pipelines.","More layers add complexity without fixing the inconsistency."],"sourceRef":"D2 practice questions · Q36 · 2.10.5","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q037","sectionId":"d2-C","knowledgePointIds":["d2-C-0-3"],"scenarioId":"d2-doc-case-c0fb1ee94e","scenario":"Brightwell Health plans to expand an AI scheduling tool that will change nurses' rosters and administrative roles. The change board, chaired by Monica Estrada, asks what the AI change management plan should include beyond technical testing.","type":"application","difficulty":"moderate","stem":"Which addition is MOST important?","options":["A communications plan that avoids mentioning job changes","A statement that no change management is needed because the tool is software","A workforce impact analysis with reskilling and transition support, plus monitoring of evolving regulation and societal sentiment","A pilot with a single department that ignores regulatory developments"],"correctIndex":2,"explanation":"AI change management should extend to workforce effects and the regulatory and societal environment, which is changing quickly. Step 1: recognize non-technical impacts. Step 2: plan analysis, reskilling, transition time and monitoring of laws such as the EU AI Act. Avoiding the subject or ignoring regulation increases risk and erodes trust.","optionRationales":["Concealing job impacts undermines trust and fair treatment.","AI needs enhanced change management that includes data and models.","AI change management should extend to workforce effects and the regulatory and societal environment, which is changing quickly. Step 1: recognize non-technical impacts. Step 2: plan analysis, reskilling, transition time and monitoring of laws such as the EU AI Act. Avoiding the subject or ignoring regulation increases risk and erodes trust.","A narrow pilot ignoring regulation does not manage the wider change."],"sourceRef":"D2 practice questions · Q37 · 2.10.3","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q038","sectionId":"d2-D","knowledgePointIds":["d2-D-0-1"],"scenarioId":"d2-doc-case-864b8c261c","scenario":"Norwood Retail lets an autonomous purchasing agent place supplier orders up to a set value without approval. After it places a large erroneous order, each team says the system made the decision. The chief operating officer, Lena Fischer, asks the AI governance lead what principle should guide the arrangement.","type":"application","difficulty":"moderate","stem":"Which approach is BEST?","options":["Management decides how much agency to grant, with supervision proportional to autonomy and a named human accountable who can trace why the agent acted","Accept that accountability lies with the AI because it made the decision","Increase the agent's autonomy so that it can correct its own errors","Remove logging so that disputes about the agent's actions are avoided"],"correctIndex":0,"explanation":"As AI autonomy grows the accountability gap widens, but technology may be autonomous while accountability is not. Step 1: recognize that responsibility remains with humans. Step 2: set agency levels deliberately, increase supervision as agency rises and ensure traceability. Blaming the AI, raising autonomy and removing logs make accountability worse.","optionRationales":["As AI autonomy grows the accountability gap widens, but technology may be autonomous while accountability is not. Step 1: recognize that responsibility remains with humans. Step 2: set agency levels deliberately, increase supervision as agency rises and ensure traceability. Blaming the AI, raising autonomy and removing logs make accountability worse.","AI cannot be held accountable, so this leaves harm without an owner.","More autonomy without supervision widens the gap.","Removing logs destroys the traceability that accountability needs."],"sourceRef":"D2 practice questions · Q38 · 2.11","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q039","sectionId":"d2-D","knowledgePointIds":["d2-D-0-0"],"scenarioId":"d2-doc-case-8d88d7aa0e","scenario":"Silvermark Bank logs millions of events per day from its deep-learning loan model, but the data sits unreviewed in storage. After a biased-outcome complaint, investigators cannot tell from the logs why decisions were made. The security manager, Jonas Weber, wants the audit committee to treat logging as a control that works.","type":"application","difficulty":"difficult","stem":"What would MOST improve the control?","options":["Rely on the existence of logs as proof that the model is monitored","Increase log retention to ten years without changing what is captured","Reduce the number of logged fields to speed up queries","Capture inputs, model parameters and outputs, make intermediate reasoning visible where possible, and add automated analysis and alerting so that logs are actionable"],"correctIndex":3,"explanation":"Deep-learning models are black boxes and need specialized logging. Step 1: see that volume without analysis is not a control. Step 2: capture the right data (inputs, parameters, outputs), expose intermediate steps where available (chain of thought), and analyze it automatically. Retention or trimming alone does not make logs useful, and existence is not effectiveness.","optionRationales":["A control that no one analyzes provides false assurance.","Longer retention of the same unreadable logs does not enable explanation.","Trimming fields reduces what investigators can reconstruct.","Deep-learning models are black boxes and need specialized logging. Step 1: see that volume without analysis is not a control. Step 2: capture the right data (inputs, parameters, outputs), expose intermediate steps where available (chain of thought), and analyze it automatically. Retention or trimming alone does not make logs useful, and existence is not effectiveness."],"sourceRef":"D2 practice questions · Q39 · 2.11.1","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q040","sectionId":"d2-D","knowledgePointIds":["d2-D-0-0"],"scenarioId":"d2-doc-case-3502641502","scenario":"The operations team at Terra Insurance reports that its fraud-detection service has 99.99% uptime and normal latency. Yet analysts notice that the model's detection of fraud has declined for months. The CIO, Walter Hsu, asks how observability differs from the current monitoring and what to add.","type":"application","difficulty":"moderate","stem":"Which answer is BEST?","options":["The current monitoring is sufficient, because the service is available","Monitoring shows that something is wrong. Observability helps explain why, so add visibility of data pipelines and model performa
