    { q:"An organization needs to assess credit risk using a model that can manage complex, nonlinear relationships and provide an interpretable decision path. Which algorithm class is MOST appropriate?", options:["Tree-based models","Hierarchical clustering","Principal Component Analysis","Deep Q Networks"], correctIndex:0, explanation:"Tree-based models are the go-to choice for nonlinear relationships requiring an interpretable decision path (A.4)." },
    { q:"A team has only a small amount of labeled training data but still needs a reliable image classifier. Which algorithm is BEST suited to this constraint?", options:["Support Vector Machine (SVM)","K-means clustering","Policy-based reinforcement learning","Hierarchical clustering"], correctIndex:0, explanation:"SVMs are specifically noted for working reliably even with relatively small amounts of training data (A.4)." },
    { q:"A marketing team wants to segment customers into a predefined number of groups for a campaign, with no existing labels to guide the grouping. Which technique is MOST appropriate?", options:["K-means clustering","Linear regression","Support Vector Machine","Q-learning"], correctIndex:0, explanation:"K-means is the defining technique for grouping unlabeled data into a predefined number (K) of clusters around centroids (A.4)." },
    { q:"A genetics research team wants to visualize nested relationships between genes without pre-specifying how many groups should exist. Which technique is MOST appropriate?", options:["K-means clustering","Hierarchical clustering","Principal Component Analysis","Logistic regression"], correctIndex:1, explanation:"Hierarchical clustering builds a nested tree (dendrogram) of clusters without requiring a predefined K, unlike K-means (A.4)." },
    { q:"Before training an image classifier, a team wants to reduce a very large number of correlated input variables into a smaller set of uncorrelated components. Which technique is MOST appropriate?", options:["Principal Component Analysis (PCA)","K-means clustering","Support Vector Machine","Deep Q Network"], correctIndex:0, explanation:"PCA is specifically used to reduce dimensionality by transforming correlated variables into uncorrelated principal components — a different goal from clustering (A.4)." },
    { q:"A robotics team wants an agent to learn the best action for each state using a lookup table of values, without needing a model of the environment. Which technique is MOST appropriate?", options:["Q-learning","Deep Q Network (DQN)","Policy-based methods","Convolutional Neural Network"], correctIndex:0, explanation:"Q-learning is the model-free reinforcement learning technique that maintains a Q-table of state-action values — DQN extends this with a neural network for high-dimensional spaces (A.4)." },
    { q:"A reinforcement learning team finds their environment's state space is too large for a traditional Q-table. Which approach is MOST appropriate?", options:["Q-learning with an expanded table","Deep Q Network (DQN)","K-means clustering","Hierarchical clustering"], correctIndex:1, explanation:"DQN extends Q-learning specifically by using a neural network instead of a Q-table, allowing it to scale to high-dimensional state spaces (A.4)." },
    { q:"An audit finding notes that a vendor set the learning rate and number of layers before training began, while the model's weights emerged only after training on data. How should the auditor classify the learning rate and layer count?", options:["Parameters","Hyperparameters","The algorithm itself","The trained model"], correctIndex:1, explanation:"Hyperparameters are settings chosen before training that control how the model learns (learning rate, layers) — parameters are what the model learns from data during training (A.4)." },
    { q:"Which term BEST describes a general-purpose model trained on broad datasets, making it adaptable to many different downstream tasks such as artwork generation and drug discovery?", options:["Prompt","NLP system","Foundation model / GPAI","Sentiment analysis engine"], correctIndex:2, explanation:"A foundation model (or GPAI) is specifically defined as broadly trained and adaptable to many different tasks (A.5)." },
    { q:"An organization's chatbot confidently cites a court case that does not exist, presenting it as established fact. This is a textbook example of which phenomenon?", options:["Underfitting","Overfitting","Hallucination","Data drift"], correctIndex:2, explanation:"Confident but factually wrong or fabricated output from a generative model is the defining characteristic of hallucination (A.5)." },
    { q:"An enterprise wants to classify thousands of customer reviews as positive, negative, or neutral. Which technique is MOST directly designed for this task?", options:["Sentiment analysis","Principal Component Analysis","Q-learning","Data provenance"], correctIndex:0, explanation:"Sentiment analysis (opinion mining) is specifically designed to classify text sentiment as positive, negative, or neutral (A.5)." },
    { q:"A 500-word prompt is broken down by an LLM into roughly 650 smaller units before processing. What are these units called?", options:["Embeddings","Tokens","Vectors","Parameters"], correctIndex:1, explanation:"Tokens are the smallest chunks of text an LLM processes — a prompt is broken into tokens (often word-pieces) before the model can operate on it (A.6)." },
    { q:"An auditor is told that the numerical representations of 'king' and 'queen' sit closer together in a model's internal space than 'king' and 'banana.' What concept does this illustrate?", options:["Tokens","Embeddings","Context window","Data provenance"], correctIndex:1, explanation:"Embeddings are numerical vectors representing meaning in high-dimensional space, enabling this kind of similarity comparison (A.6)." },
    { q:"A very long document plus a lengthy prompt is silently cut off before an LLM can process all of it. Which concept explains this limitation?", options:["Vector database capacity","Context window","Embedding dimensionality","Token bias"], correctIndex:1, explanation:"The context window is the number of tokens a model can consider at once — inputs exceeding it are truncated, a leading cause of hallucination (A.6)." },
    { q:"An organization stores embeddings of its internal documents to enable fast similarity search for a RAG system. Which component is being described?", options:["A vector database","A foundation model","A data lake","A Q-table"], correctIndex:0, explanation:"A vector database stores embeddings and enables fast similarity search using distance metrics like cosine similarity — critical infrastructure for RAG (A.6)." },
    { q:"Which OECD AI life-cycle model specifically maps WHO is accountable at each stage, rather than WHAT activities occur?", options:["The 7-phase life-cycle model (Plan through Retire)","The OECD AI Life Cycle Actors model","The NIST AI RMF four functions","The Data/Model/Task testing areas"], correctIndex:1, explanation:"The OECD Actors model (Data/Input, AI Model, Task/Output, People/Planet) tests accountability by role, distinct from the 7-phase activity model that tests what happens when (A.7)." },
    { q:"Which cost category would ongoing compute and energy consumption for a deployed AI system fall under?", options:["Implementation costs","Operational costs","Risk and compliance costs","Sunk costs"], correctIndex:1, explanation:"Operational costs specifically include system maintenance, energy consumption, and AI-specific salaries — distinct from one-time implementation or risk/compliance costs (A.8)." },
    { q:"Under Microsoft's AI Shared Responsibility Model, which layer remains the customer's responsibility regardless of whether the deployment is IaaS, PaaS, or SaaS (e.g., Copilot)?", options:["Application infrastructure","AI platform management","AI Usage (data governance, access management, user training)","Underlying model training"], correctIndex:2, explanation:"The AI Usage layer — data governance, access management, admin controls, user training — stays with the customer no matter which deployment model is chosen; this is the layer internal audit should always expect to test (A.9)." }
  ],
  "d1-B": [
    { q:"Which sequence correctly reflects the AI governance cycle described in ISACA's framework?", options:["Establish → Define → Provide → Report → Measure","Define → Establish → Provide → Measure → Report","Provide → Define → Measure → Establish → Report","Define → Measure → Establish → Provide → Report"], correctIndex:1, explanation:"The governance cycle runs Define (strategy/roles) → Establish (policies) → Provide (training) → Measure (metrics) → Report (to oversight body) (B.1)." },
    { q:"A banking industry association publishes AI risk-management best practices for its member banks. This activity is an example of AI strategy at which level?", options:["National","Industry","Corporate","Departmental"], correctIndex:1, explanation:"Industry-level strategy focuses on sector-wide standards and interpreting regulation for a given industry — distinct from national (government) or corporate (single-company) strategy (B.2)." },
    { q:"An organization rolling out GenAI across multiple countries wants to ensure its approach reflects local cultural norms and strengthens interdisciplinary collaboration. Per the WEF's value alignment framework, this activity falls under which pillar?", options:["Legal Compliance","Operational Strategy","Community","Ethical Foundations"], correctIndex:2, explanation:"Adapting strategies with community feedback and strengthening interdisciplinary collaboration to understand cultural nuance is specifically the Community pillar of the WEF's four value-alignment enablers (B.3)." },
    { q:"An internal audit engagement finds that an AI Steering Committee at an organization is directly approving policy updates and overseeing program metric reporting — tasks otherwise assigned to the Governance Committee. What is the MOST likely concern?", options:["The Steering Committee is fulfilling its intended role correctly","There is a role overlap that may blur risk/opportunity identification with program oversight accountability","This is a normal and expected consolidation of duties","The Governance Committee should be eliminated entirely"], correctIndex:1, explanation:"The Steering Committee is meant to identify risk/opportunity; the Governance Committee oversees the program and its metrics. Blurring these roles undermines clear accountability (B.4)." },
    { q:"An organization has a general AI Policy but employees report confusion about which specific GenAI tools they may use day to day. What is the MOST appropriate response?", options:["Eliminate the general AI Policy entirely","Develop a simple, user-facing AI Acceptable Use Policy (AUP) backed by training","Restrict all AI tool usage until further notice","Rely solely on the IT department's discretion"], correctIndex:1, explanation:"The AUP is specifically designed to be the practical, plain-language companion to the broader AI Policy — simple enough for general users and reinforced by training (B.5)." },
    { q:"A training team is overwhelmed by day-to-day questions after an AI tool rollout. What is the BEST way to reduce this burden while still supporting employees?", options:["Redesign the entire training curriculum from scratch","Outsource all AI questions to a paid external vendor","Appoint AI champions/power users within each team","Suspend the AI rollout until training capacity increases"], correctIndex:2, explanation:"Champions/power users are the specific, named leading-practice solution for this exact scenario — they reduce burden on training staff and provide peer-level advocacy (B.6)." },
    { q:"Before deploying an AI tool expected to significantly change job duties, what should an organization do FIRST regarding its workforce?", options:["Immediately reduce headcount in affected roles","Identify which tasks will be augmented versus replaced, and engage process owners for input","Wait until after deployment to assess impact","Delegate all workforce planning to the AI vendor"], correctIndex:1, explanation:"Workforce impact management starts with identifying augmented-vs-replaced tasks and engaging current employees/managers for input — not assuming wholesale replacement (B.7)." },
    { q:"When defining AI governance program metrics, which consideration should take priority over customer experience or business-case benefits?", options:["Potential harm to humans","Executive preference","Speed of implementation","Competitor benchmarking"], correctIndex:0, explanation:"Human-harm consideration must come before business factors like customer experience when defining AI governance metrics (B.8)." },
    { q:"A document states 'we will use AI to reduce diagnostic wait times while preserving clinician oversight.' This statement is BEST classified as which element of AI strategy alignment?", options:["Mission","Vision","Value alignment","Program metric"], correctIndex:1, explanation:"Vision communicates the organization's intent to use AI to further its mission — mission is the underlying purpose itself, which this statement assumes rather than states (B.3)." },
    { q:"A retailer cites reduced manual order processing time as a benefit of its new AI deployment. Which of the five named AI benefit categories does this MOST directly represent?", options:["Increased innovation","Automation","Enriched data analysis","Improved customer service"], correctIndex:1, explanation:"Automation is specifically defined as reduced operational cost and improved delivery efficiency — exactly what reduced manual processing time represents (B.3)." },
    { q:"Which role is ULTIMATELY accountable for the effects of an AI solution on the organization and its stakeholders, including setting risk tolerance?", options:["AI Steering Committee","Chief AI Officer (CAIO)","Executive/Senior Management","Internal Audit"], correctIndex:2, explanation:"Executive/Senior Management sets vision, mission, and risk tolerance and holds ultimate accountability — the CAIO leads adoption within that risk tolerance, a narrower operational role (B.4)." },
    { q:"An internal audit team is asked to accept ownership of remediating a bias finding in an AI model it just tested. What is the MOST appropriate response?", options:["Accept ownership, since Internal Audit understands the issue best","Decline, since Internal Audit's role is to assess, not own or build controls","Escalate to the AI Steering Committee to take ownership instead","Accept, provided the fix is documented afterward"], correctIndex:1, explanation:"Internal Audit assesses AI-related risk as part of the audit plan — it does not own, build, or accept AI risk, as that would compromise independence (B.4)." },
    { q:"Which role bridges the gap between technical IT staff and end users to ensure usability of an AI solution?", options:["Product Management","IT Operations","Risk Management","Data stewards"], correctIndex:0, explanation:"Product Management is specifically responsible for bridging technical IT staff and end users to ensure usability (B.4)." },
    { q:"Which function is responsible for integrating AI into the enterprise's overall risk management planning process?", options:["Information Security and Privacy","Risk Management","IT Development","Customer Service"], correctIndex:1, explanation:"Risk Management is specifically responsible for integrating AI into enterprise risk management planning — Information Security and Privacy instead focuses on data/systems security (B.4)." },
    { q:"Which stakeholder group updates job descriptions and provides training to support employee end users of a newly deployed AI solution?", options:["Human Resources","Customer Service","IT Operations","AI Steering Committee"], correctIndex:0, explanation:"Human Resources specifically supports employee end users through job classification and related training (B.4)." }
  ],
  "d1-C": [
    { q:"Which NIST AI RMF function is BEST described as 'identifying and understanding risk and its potential impact' before it is quantified?", options:["Govern","Map","Measure","Manage"], correctIndex:1, explanation:"Map is specifically the risk-identification function; Measure is where risk gets quantified, Govern sets up the program, and Manage handles ongoing treatment (C.1)." },
    { q:"An auditor is reviewing a biased credit-scoring AI that both denied an individual's application and disproportionately affected an entire demographic subgroup. Per the NIST harm taxonomy, this reflects harm at which levels?", options:["Harm to an Organization only","Harm to an Ecosystem only","Individual and Group/Community harm to People","Harm to natural resources"], correctIndex:2, explanation:"The NIST harm taxonomy separates People-harm into Individual, Group/Community, and Societal — this scenario reflects both Individual (denied applicant) and Group/Community (demographic subgroup) harm (C.1)." },
    { q:"An IS auditor reviewing an AI risk assessment notices the team simply accepted a vendor's claim that its model is 'unbiased' without independent testing. Which principle was violated?", options:["Integration into overall risk management","Repeating identification regularly","Professional skepticism","Considering AI's unique attributes"], correctIndex:2, explanation:"Professional skepticism requires auditors to resist the assumption that AI output is automatically trustworthy — accepting a vendor's unverified claim violates this principle (C.2)." },
    { q:"A data science team builds a credit-scoring algorithm without any bias testing, resulting in unjustified credit denials for a protected class. Which threat actor category does this scenario represent?", options:["Nation states","Cybercriminals","Insider threats","AI developers"], correctIndex:3, explanation:"Developers who build AI without ethical standards are themselves a recognized threat actor category — distinct from external attackers like cybercriminals or nation states (C.3)." },
    { q:"Per the OECD framework, which risk criterion is BEST described as 'the degree of choice an individual has as to whether to be subject to an AI system's effects'?", options:["Scale","Scope","Optionality","Severity"], correctIndex:2, explanation:"Optionality specifically measures how much choice an individual has — distinct from Scale (severity/probability) and Scope (breadth of population affected) (C.4)." },
    { q:"Under the EU AI Act, an AI system used for screening job applicants would MOST likely be classified as which risk tier?", options:["Unacceptable risk","High risk","Limited risk","Minimal risk"], correctIndex:1, explanation:"Employment-related AI is a named high-risk category under the EU AI Act — permitted but subject to conformity assessment, documentation, and human oversight requirements (C.5)." },
    { q:"An organization is fine-tuning a third-party foundation model using internal HR data. What is the GREATEST risk specific to this approach compared to using RAG instead?", options:["Higher latency during inference","Sensitive data may be encoded into the model's weights and later leak through queries","Reduced model accuracy overall","Increased storage costs for embeddings"], correctIndex:1, explanation:"Fine-tuning bakes data directly into model weights, creating leakage risk through future queries — this is exactly why RAG is generally lower-risk for sensitive data (C.6)." },
    { q:"Which of the following is a named, unique challenge that makes AI risk management harder than traditional IT risk management?", options:["Lack of any available risk frameworks","Absence of a human baseline to measure against for augmented/replaced tasks","Excessive documentation requirements","Overreliance on manual testing"], correctIndex:1, explanation:"The need for a human baseline when AI augments or replaces human activity is one of the five named challenges unique to AI risk management (C.7)." },
    { q:"A department sets a specific accuracy threshold below which a model must be pulled from production. This is an example of which concept?", options:["Risk appetite","Risk tolerance","Risk acceptance","Risk transfer"], correctIndex:1, explanation:"Risk tolerance is the tactical, narrower band that can be set at the departmental level — distinct from risk appetite, which is strategic and set at the enterprise level (C.8)." },
    { q:"An organization proceeds with using an AI chatbot despite negative customer sentiment, having determined the reputational risk falls within its defined risk tolerance. Which risk treatment option does this represent?", options:["Avoid","Mitigate","Share/Transfer","Accept"], correctIndex:3, explanation:"Accept means proceeding with a risk within tolerance — proceeding with risk ABOVE tolerance and taking no further action would instead constitute negligence, not a valid Accept (C.9)." },
    { q:"A retail demand-forecasting model's performance degrades every holiday season as customer buying habits shift, while the fundamental question being predicted stays the same. This is BEST described as which phenomenon?", options:["Concept drift", "Data drift", "Model theft", "Underfitting"], correctIndex:1, explanation:"When the input data distribution shifts (seasonality) but the underlying prediction task/target doesn't change, this is data drift — concept drift would mean the target's meaning itself changed (C.10)." },
    { q:"A fraud-detection model is 99% 'accurate' on a dataset that is 99% legitimate transactions, simply by always predicting 'not fraud.' Which metric should have been prioritized instead?", options:["Accuracy alone","F1 score (or precision/recall)","Model interpretability","Training time"], correctIndex:1, explanation:"On imbalanced datasets, accuracy is misleading — F1 score (balancing precision and recall) or the individual metrics themselves should be prioritized instead (C.11)." },
    { q:"A chatbot's KRI dashboard shows resolution rate at 92% and misunderstanding rate at 3%. Which of these values should trigger closer review against its stated target?", options:["Resolution rate, because it is below the 95% satisfaction target","Misunderstanding rate, because it exceeds the less-than-1% target","Both are within acceptable range","Neither metric is relevant to a chatbot"], correctIndex:1, explanation:"The misunderstanding rate target is less than 1% — 3% exceeds that threshold and should trigger review, while resolution rate's own target is 90%+, which 92% satisfies (C.12)." },
    { q:"An organization cannot independently verify a vendor's claimed accuracy figures because the vendor won't disclose its measurement methodology. This is BEST described as which type of third-party risk?", options:["Third-Party Data Risk","Third-Party System Risk","Model poisoning risk","Membership inference risk"], correctIndex:1, explanation:"Third-Party System Risk specifically concerns disagreement over or lack of transparency in HOW risk/performance is measured — distinct from Data Risk, which concerns WHAT data was used to train the model (C.6)." },
    { q:"An organization decides not to pursue an AI use case at all because of unresolved regulatory concerns. Which risk treatment option does this represent?", options:["Avoid","Mitigate","Share/Transfer","Accept"], correctIndex:0, explanation:"Avoid means eliminating exposure by not pursuing the activity at all — distinct from Mitigate (reducing impact via controls) or Share/Transfer (spreading impact to a partner or insurer) (C.9)." },
    { q:"A flight-demand forecasting model's predictions become unreliable after a major shift in border policy fundamentally changes what 'normal' travel behavior looks like, even though holiday and macroeconomic inputs stayed similar. This is BEST described as which phenomenon?", options:["Data drift","Concept drift","Model theft","Underfitting"], correctIndex:1, explanation:"Concept drift occurs when the statistical properties of the target itself change — here, the meaning of 'likely to fly' changed due to external constraints, not the input data distribution (C.10)." },
    { q:"A team wants to solve a customer-churn forecasting problem and considers implementing RAG as the solution. Is this an appropriate choice?", options:["Yes, RAG is ideal for any predictive analytics problem","No, RAG is designed for grounding factual answers, not forecasting or classification tasks","Yes, provided the vector database is large enough","No, because RAG only works with structured data"], correctIndex:1, explanation:"RAG is the wrong tool for predictive analytics like forecasting or classification — those are ML tasks; RAG is for grounding factual, retrievable answers (C.10)." }
  ],
  "d1-D": [
    { q:"An organization is classifying a dataset containing unpublished financial statements and customer lists. Which classification level is MOST appropriate?", options:["Public","Internal","Confidential","Restricted"], correctIndex:2, explanation:"Unpublished financials and customer lists are examples explicitly given for the Confidential classification — one tier below Restricted, which involves potential criminal/legal exposure (D.1)." },
    { q:"A customer's data was originally collected for customer service purposes but is now being reused to train a new marketing AI feature without additional consent. Which principle is being violated?", options:["Data provenance", "Data privacy", "Consent", "Data minimization"], correctIndex:2, explanation:"Consent must be specific and re-obtained for new/different purposes and reuse — the original consent does not automatically extend to a new use case (D.2)." },
    { q:"An auditor traces a model's biased output back to a specific transformation applied to the training data several steps earlier in the pipeline. Which capability made this possible?", options:["Data provenance", "Data privacy", "Consent", "Data minimization"], correctIndex:0, explanation:"Data provenance tracks the origin, lineage, and transformations applied to data through its life cycle — essential for exactly this kind of root-cause tracing (D.2)." },
    { q:"An organization applies differential privacy noise to a training dataset so individual records cannot be reverse-engineered from the resulting model. Which of the three data-protection pillars does this MOST directly address?", options:["Data provenance", "Data privacy", "Consent", "Data licensing"], correctIndex:1, explanation:"Differential privacy, anonymization, and encryption are named mitigations specifically under the Data Privacy pillar — protecting individuals' data during processing and storage (D.2)." },
    { q:"An ETL job pulls data from a third-party API using a hardcoded, unencrypted key stored in plaintext. This risk is MOST associated with which ETL stage?", options:["Extract", "Transform", "Load", "Query"], correctIndex:0, explanation:"Extract-stage risks specifically include unauthorized access, insecure connections, and credentials stored in plaintext (D.5)." },
    { q:"Training data is retained well past its legally required deletion date because retention rules were never enforced at the point data entered the warehouse. Which ETL stage's risk does this MOST reflect?", options:["Extract", "Transform", "Load", "None of the ETL stages"], correctIndex:2, explanation:"Load-stage risks specifically include retention-rule violations and compliance failures — this is where data lands in its final storage destination (D.5)." },
    { q:"A chatbot is granted access to a customer's entire record when its task only requires the account status field. Which principle does this violate?", options:["Data minimization", "Data provenance", "Consent", "Data licensing"], correctIndex:0, explanation:"Data minimization requires giving AI systems access only to the minimum data needed for their approved purpose (D.3)." },
    { q:"Per the Data Provenance Initiative, what trend was observed in licensed data availability between 2023 and 2024?", options:["All data categories saw identical restriction rates","High-quality data sources were restricted at a much higher rate than average","Restricted data availability increased for AI developers","Licensing became entirely unnecessary for AI training"], correctIndex:1, explanation:"25% of the highest-quality sources were restricted versus 5% of all data overall — high-quality sources are being restricted disproportionately fast (D.4)." },
    { q:"During which ETL stage is bias MOST likely to be introduced through cleansing rules that disproportionately drop data from one customer segment?", options:["Extract", "Transform", "Load", "Query"], correctIndex:1, explanation:"Bias risk concentrates hardest at the Transform stage, where cleansing, deduplication, and outlier-removal rules can disproportionately affect one segment (D.5)." },
    { q:"An organization uses SMOTE to correct a severe class imbalance in its fraud dataset. What is the GREATEST risk specific to this technique?", options:["It always reduces dataset size","Synthetic examples may inadvertently reinforce existing bias present in the minority class","It cannot be used with any classification algorithm","It requires manual labeling of every synthetic record"], correctIndex:1, explanation:"Over-sampling techniques like SMOTE fix class imbalance but can silently amplify bias already present in the minority-class examples they interpolate from (D.6)." },
    { q:"An attacker determines that a specific patient's record was used to train a medical AI model by observing the model's unusually high confidence on that record. This is an example of which inference risk?", options:["Attribute inference", "Membership inference", "Model inversion", "Data poisoning"], correctIndex:1, explanation:"Membership inference specifically involves determining whether a particular example was in the training set — attribute inference instead targets a subject's sensitive traits (D.7)." },
    { q:"Which data governance role is responsible SPECIFICALLY for data quality, as distinct from safeguarding or overall accountability for use?", options:["Data custodian", "Data owner", "Data steward", "Data Protection Officer"], correctIndex:2, explanation:"Data steward is specifically responsible for data quality — custodian safeguards it, owner is accountable for its integrity/use, and DPO is the GDPR-specific compliance role (D.8)." },
    { q:"A California resident is denied a loan by an automated decision system and requests an explanation. Which regulation MOST directly grants this right?", options:["PIPL", "CPRA", "EU AI Act only", "ISO/IEC 42001"], correctIndex:1, explanation:"CPRA (California) requires individuals be informed when automated decision-making is used and grants a right to request an explanation — PIPL is China's parallel regulation (D.9)." }
  ],
  "d1-E": [
    { q:"Which named framework provides a global, certifiable standard specifically for an AI Management System (AIMS)?", options:["NIST AI RMF", "ISO/IEC 42001", "OECD AI Principles", "MITRE ATLAS"], correctIndex:1, explanation:"ISO/IEC 42001 is the specific, certifiable AI management system standard — the AI counterpart to ISO 27001 for information security (E.1)." },
    { q:"A board wants an AI risk exposure translated into a specific dollar-loss range to support a funding decision. Which named framework is BEST suited to this specific requirement?", options:["FAIR (Factor Analysis of Information Risk)", "OECD AI Principles", "IEEE 7000-2021", "ISO/IEC 23053"], correctIndex:0, explanation:"FAIR is specifically built to quantify cyber/AI risk in financial terms for board-level decision-making — none of the other frameworks are designed for that purpose (E.1)." },
    { q:"An organization wants to align its AI governance with an existing, broader enterprise IT governance framework rather than building AI governance from scratch. Which framework is MOST likely to serve as that umbrella?", options:["COBIT 2019", "MITRE ATLAS", "CSA AI Controls Matrix", "UNESCO EIA"], correctIndex:0, explanation:"COBIT 2019 provides principles for the governance and management of enterprise IT broadly — AI governance often plugs into it rather than replacing it (E.1)." },
    { q:"A red team is planning adversarial tests against a newly deployed LLM application and wants a catalog of real-world attack patterns to reference. Which resource is MOST appropriate?", options:["MITRE ATLAS", "NIST CSF 2.0", "Singapore's Model AI Governance Framework", "COBIT 2019"], correctIndex:0, explanation:"MITRE ATLAS catalogs real-world adversarial attack patterns specifically useful for red teaming AI systems (E.1)." },
    { q:"An organization's hiring algorithm was found to favor male candidates because it amplified patterns present in decades of historical hiring data reflecting past institutional practices. Which bias type does this represent, and what is the BEST remediation?", options:["Human bias; remediate through user training","Systemic bias; remediate through bias audits and review of upstream institutional processes","Statistical/computational bias; remediate through more diverse training data","Systemic bias; remediate by increasing dataset size"], correctIndex:1, explanation:"Bias baked into historical institutional practices and procedures is systemic (systematic) bias — the fix is auditing and reviewing the upstream institutional processes themselves, not just the dataset (E.4)." },
    { q:"Different employees craft GenAI prompts in inconsistent ways, leading to inconsistent and sometimes anchored or confirmation-biased outputs across the team. Which bias type is this, and what is the BEST remediation?", options:["Human bias; remediate through standardized prompt templates and user training","Systemic bias; remediate through institutional policy review","Statistical/computational bias; remediate through more diverse training data","Systemic bias; remediate through human-in-the-loop checkpoints"], correctIndex:0, explanation:"Bias arising from user heuristics and inconsistent prompt-crafting is human bias — standardized prompt templates and training are the named remediation. HITL checkpoints address accountability of outputs, not bias prevention at the root (E.4)." },
    { q:"Which region has an ACTIVE national AI law paired with a still-PROPOSED companion liability law?", options:["China", "United States", "European Union", "Singapore"], correctIndex:1, explanation:"The US has an active National AI Act paired with the still-proposed Algorithmic Accountability Act — the EU's AI Act is active while its Liability Directive remains proposed, but the question specifically matches the US pairing (E.2)." },
    { q:"Per the three ethical principles for AI, what should happen to an AI solution that fails to meet even one of align-with-values, promote-social-good, or minimize-harm?", options:["It should proceed with additional monitoring only","It should not be created", "It should be approved by the CAIO only", "It should be delayed until the next budget cycle"], correctIndex:1, explanation:"AI solutions that do not meet all three ethical principles should not be created at all — this is a hard gate, not a monitoring checkpoint (E.3)." },
    { q:"A facial recognition study found error rates of 0.8% for light-skinned males versus 34.7% for dark-skinned females. Which bias category does this MOST reflect, and what is the BEST remediation?", options:["Human bias; remediate via user training","Systemic bias; remediate via institutional policy review","Statistical/computational bias; remediate via more diverse training data","Systemic bias; remediate via more compute power"], correctIndex:2, explanation:"Disparities tied to non-representative training data are statistical/computational bias — diversifying the training dataset is the correct fix, not simply collecting more data or reviewing institutional policy (E.4)." },
    { q:"Which of the following is IBM's named open-source toolkit for examining and mitigating bias across the AI life cycle?", options:["What-If Tool", "AI Fairness 360", "MITRE ATLAS", "LIME"], correctIndex:1, explanation:"AI Fairness 360 is IBM's toolkit; the What-If Tool is Google's — matching tool to vendor is directly testable (E.5)." },
    { q:"An organization publishes a model card describing a model's purpose, training data, and known limitations. This is BEST described as which trustworthy-AI concept?", options:["Explainability", "Observability", "Transparency", "Robustness"], correctIndex:2, explanation:"Transparency is about sharing what the model IS (design-time documentation like a model card) — explainability covers individual decisions, and observability covers real-time production monitoring (E.6)." },
    { q:"A class-action lawsuit alleges that a generative AI platform used artists' copyrighted works without licensing agreements to train its model. This scenario is MOST directly analogous to which named case?", options:["Andersen v. Stability AI", "Axel Springer/OpenAI licensing deal", "EU AI Act Article 86", "GDPR right to erasure"], correctIndex:0, explanation:"Andersen v. Stability AI is the named class-action precedent for unlicensed use of copyrighted training data (E.7)." },
    { q:"A high-risk AI medical-decision system has completed a DPIA. Is this sufficient under the EU AI Act?", options:["Yes, a DPIA fully satisfies all requirements","No, a FRIA is also required and covers broader ground than a DPIA","No, only a FRIA is required and a DPIA is unnecessary","Yes, provided the DPIA was reviewed by an ethicist"], correctIndex:1, explanation:"A DPIA does NOT cover the full scope of rights required under a FRIA — high-risk systems need a FRIA specifically, which is broader (covering the full EU Charter of Fundamental Rights) (E.8)." },
    { q:"Per IEA estimates, data centers are projected to account for nearly what percentage of Ireland's energy use by 2026?", options:["10%", "20%", "35%", "50%"], correctIndex:2, explanation:"The IEA estimated data centers would account for nearly 35% of Ireland's energy use by 2026 — a specific, named statistic on AI's environmental impact (E.9)." }
  ]
};

/* ============ QUESTION BANK SCHEMA ============
 * Stable IDs and explicit knowledge-point links make the legacy bank auditable.
 * Existing questions remain unassigned until reviewed; section membership alone
 * is not treated as proof that a specific knowledge point has been tested.
 */
const QUESTION_BANK_VERSION = 3;
const COVERAGE_TARGET_PER_POINT = 3;
function questionType(q) {
  if (/\b(FIRST|BEST|MOST|PRIMARY|GREATEST|KEY)\b/i.test(q.q)) return "judgment";
  if (/\b(which|what|how|why)\b/i.test(q.q)) return "application";
  return "knowledge";
}
const QUESTION_BANK = Object.fromEntries(Object.entries(QUIZZES).map(([sectionId, questions]) => [sectionId,
  questions.map((q, index) => ({
    id: `${sectionId}-q${String(index + 1).padStart(3, "0")}`,
    sectionId,
    knowledgePointIds: [], // Add explicit card keys, e.g. ["d1-A-0-0"], after content review.
    scenarioId: null,
    scenario: null,
    type: questionType(q),
    difficulty: "standard",
    stem: q.q,
    options: q.options,
    correctIndex: q.correctIndex,
    explanation: q.explanation,
    optionRationales: null,
    sourceRef: "AAIA Study Path curriculum; legacy question",
    tags: []
  }))
]));

const IMPORTED_DOCUMENT_QUESTIONS = [{"id":"d1-doc-q001","sectionId":"d1-A","knowledgePointIds":["d1-A-0-0"],"scenarioId":"d1-doc-case-2bb0e7fadb","scenario":"Northgate Insurance is evaluating a vendor product marketed as an \"artificial general intelligence underwriting assistant.\" Demonstrations show the tool only scores motor-insurance applications. The CRO, Hannah Bell, must decide how the tool will be governed before the pilot.","type":"application","difficulty":"basic","stem":"What should the CRO do FIRST?","options":["Apply a governance framework designed for cross-domain autonomous systems to the pilot","Classify the tool as narrow AI based on its demonstrated scope and require the vendor to substantiate its claims in writing","Accept the vendor's classification because the vendor best understands its own product","Postpone the pilot until general AI governance standards are issued"],"correctIndex":1,"explanation":"Nearly all AI in use today is narrow AI (ANI): it performs a specific task within a restricted domain. A system that only scores motor applications is ANI whatever the marketing says. Governance scope, control boundaries and risk assessment should follow what the system actually does, and unsupported vendor claims should be challenged and documented.","optionRationales":["Cross-domain autonomy frameworks fit AGI, which is theoretical. Over-scoping adds cost without addressing the real risks of a narrow underwriting model.","Nearly all AI in use today is narrow AI (ANI): it performs a specific task within a restricted domain. A system that only scores motor applications is ANI whatever the marketing says. Governance scope, control boundaries and risk assessment should follow what the system actually does, and unsupported vendor claims should be challenged and documented.","Accepting a vendor's label without validation is a third-party risk failure. Management remains accountable for the classification.","AGI is not deployed in practice, so waiting is unnecessary. The tool can be governed now as narrow AI."],"sourceRef":"D1 practice questions · Q1 · 1.1","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q002","sectionId":"d1-A","knowledgePointIds":["d1-A-1-1"],"scenarioId":"d1-doc-case-f2e0339089","scenario":"Brightwell Retail runs a churn-prediction model and has just licensed a generative AI assistant that drafts marketing copy and product images. The chief marketing officer wants both under one generic AI risk checklist. The privacy officer, Lena Ortiz, argues the two need different emphasis.","type":"application","difficulty":"moderate","stem":"Which risk is MOST specific to the generative AI assistant rather than the churn-prediction model?","options":["Bias inherited from historical customer data","Over-reliance on a forecast for material business decisions","Inaccurate probability thresholds for retention offers","Copyright and intellectual property exposure in generated content, and leakage of confidential data through prompts or training data"],"correctIndex":3,"explanation":"Predictive AI risks centre on inherited bias, mishandled sensitive data and over-reliance on forecasts. Generative AI adds risks of harmful or biased content, copyright and IP infringement, hallucination, and privacy violations through training-data leakage. Governance for GenAI therefore needs IP review, output controls and prompt-data rules that the predictive model does not.","optionRationales":["Inherited bias is a shared risk, but it is the signature risk of predictive models trained on historical records. It is not specific to GenAI.","Over-reliance on a prediction is a classic predictive-AI risk.","Threshold calibration is a technical performance matter for the predictive model and is not a GenAI-specific governance risk.","Predictive AI risks centre on inherited bias, mishandled sensitive data and over-reliance on forecasts. Generative AI adds risks of harmful or biased content, copyright and IP infringement, hallucination, and privacy violations through training-data leakage. Governance for GenAI therefore needs IP review, output controls and prompt-data rules that the predictive model does not."],"sourceRef":"D1 practice questions · Q2 · 1.1","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q003","sectionId":"d1-A","knowledgePointIds":["d1-A-3-1","d1-E-3-2"],"scenarioId":"d1-doc-case-807575f886","scenario":"Fairway Bank is building a supervised model to pre-approve personal loans. Training labels come from approval decisions made by loan officers over the past ten years. The head of model risk, Daniel Cho, is reviewing the proposal before it goes to the AI steering committee.","type":"application","difficulty":"moderate","stem":"What is the GREATEST governance concern with this approach?","options":["Historical approval labels may encode past human bias, which the model will learn and perpetuate","The model may require more computing capacity than the bank currently has","Logistic regression is less sophisticated than deep learning","Training will take longer than the project schedule allows"],"correctIndex":0,"explanation":"In supervised learning the labels define what \"correct\" means. Labels produced by humans can carry their prejudices, so the model reproduces them at scale. Governance must require label quality review, representative data and fairness testing before deployment. The other options are cost, technique and schedule issues, not governance risks to customers and the bank.","optionRationales":["In supervised learning the labels define what \"correct\" means. Labels produced by humans can carry their prejudices, so the model reproduces them at scale. Governance must require label quality review, representative data and fairness testing before deployment. The other options are cost, technique and schedule issues, not governance risks to customers and the bank.","Compute capacity is an operational planning matter, not a risk to fairness or compliance.","Model sophistication is not a governance criterion. Simpler models can be more explainable.","Schedule pressure is a project management issue and does not threaten fair outcomes."],"sourceRef":"D1 practice questions · Q3 · 1.2","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q004","sectionId":"d1-A","knowledgePointIds":["d1-A-5-4","d1-C-5-2"],"scenarioId":"d1-doc-case-c8d428357a","scenario":"Aldermere LLP wants a generative assistant that answers questions from privileged client files. The CIO proposes fine-tuning a foundation model on the files. The CISO prefers retrieval-augmented generation (RAG). The general counsel asks the AI governance lead, Priya Nair, for a recommendation.","type":"application","difficulty":"difficult","stem":"Which recommendation BEST balances capability and risk?","options":["Fine-tune the model, because a black-box response is harder for an attacker to exploit","Fine-tune the model, because training removes the need for document-level access controls","Use RAG with access controls and logging on the vector store, and treat the retrieval layer as a new attack surface to monitor","Prohibit the project, because generative AI cannot be used with privileged information"],"correctIndex":2,"explanation":"RAG retrieves context at query time, so the foundation model is not modified, knowledge can be updated quickly, access can be restricted at the database, and answers can cite sources. That generally makes it lower risk than fine-tuning on sensitive data. The retrieval layer still introduces risks such as leaked embeddings, poisoned vectors and prompt injection, so it needs access controls, ingestion validation and retrieval logging.","optionRationales":["Opacity lowers auditability and is not a security control. It also hinders explainability.","Fine-tuning bakes data into model weights, so sensitive content can be encoded and cannot be selectively restricted. It increases the need for controls, not reduces it.","RAG retrieves context at query time, so the foundation model is not modified, knowledge can be updated quickly, access can be restricted at the database, and answers can cite sources. That generally makes it lower risk than fine-tuning on sensitive data. The retrieval layer still introduces risks such as leaked embeddings, poisoned vectors and prompt injection, so it needs access controls, ingestion validation and retrieval logging.","A blanket prohibition ignores risk-based governance. The risk can be managed with appropriate architecture and controls."],"sourceRef":"D1 practice questions · Q4 · 1.4","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q005","sectionId":"d1-A","knowledgePointIds":["d1-A-6-3"],"scenarioId":"d1-doc-case-f5234e649c","scenario":"Marlow Logistics is building a route-optimization model that will change delivery schedules for drivers. The project manager plans to address bias only through a fairness test just before go-live. The chief ethics officer, Samuel Reyes, objects.","type":"application","difficulty":"moderate","stem":"Which approach to bias is BEST aligned with the AI life cycle?","options":["Run a single bias test immediately before deployment, since all other phases involve technical work only","Delegate bias to the vendor of the optimization software through a contract warranty","Address bias at several phases: ethics and bias assessment at design, representative and consented data at collection, explainability and oversight at build, and bias testing at validation","Address bias only through monitoring after deployment, when real outcomes are visible"],"correctIndex":2,"explanation":"Bias mitigation appears in phases 1 to 4 of the OECD-based life cycle, each with a different control: initial risk and ethics assessment (plan and design), data governance and representativeness (collect and process), explainability and human-in-the-loop (build), and bias and fairness testing (TEVV). A test at the end alone discovers problems when they are most expensive to fix.","optionRationales":["Late-only testing misses bias introduced by objectives, data and design choices and leaves little time to fix it.","Contractual warranties do not transfer accountability. The organization remains responsible for outcomes.","Bias mitigation appears in phases 1 to 4 of the OECD-based life cycle, each with a different control: initial risk and ethics assessment (plan and design), data governance and representativeness (collect and process), explainability and human-in-the-loop (build), and bias and fairness testing (TEVV). A test at the end alone discovers problems when they are most expensive to fix.","Post-deployment monitoring is necessary but is a detective control. Earlier preventive controls are also required."],"sourceRef":"D1 practice questions · Q5 · 1.4","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q006","sectionId":"d1-A","knowledgePointIds":["d1-A-8-1"],"scenarioId":"d1-doc-case-ded4374b17","scenario":"Olive \u0026 Pine, a retailer, plans to train a recommendation model on customer data from its EU stores. To reduce cost, the CTO proposes using a cloud region outside the EU. The data protection officer, Karin Vogel, asks the AI steering committee to weigh the proposal.","type":"application","difficulty":"difficult","stem":"What is the GREATEST concern?","options":["Processing in another jurisdiction may trigger cross-border transfer restrictions that the organization has no legal basis to meet","The provider may become difficult to replace later","Cost of cloud compute may fluctuate after the contract is signed","The cloud platform may scale less efficiently than on-premises hardware"],"correctIndex":0,"explanation":"Where a cloud provider physically processes data matters when the training data is covered by privacy law. Moving EU personal data to another region without a lawful transfer mechanism creates regulatory exposure, which is a governance and compliance risk with potential fines. Cost variation and lock-in are real cloud trade-offs but are business risks that can be managed. Scalability is typically a benefit of cloud.","optionRationales":["Where a cloud provider physically processes data matters when the training data is covered by privacy law. Moving EU personal data to another region without a lawful transfer mechanism creates regulatory exposure, which is a governance and compliance risk with potential fines. Cost variation and lock-in are real cloud trade-offs but are business risks that can be managed. Scalability is typically a benefit of cloud.","Vendor lock-in is a strategic concern, less severe than possible unlawful processing.","Cost fluctuation is a known cloud limitation, but it is not the most serious exposure.","Cloud typically scales better than internal hosting, so this is not a credible primary concern."],"sourceRef":"D1 practice questions · Q6 · 1.5","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q007","sectionId":"d1-A","knowledgePointIds":["d1-A-8-3"],"scenarioId":"d1-doc-case-d7d216f58b","scenario":"Crestline Manufacturing has rolled out a SaaS AI assistant to all staff. During an audit committee meeting the COO says, \"The vendor runs the platform, so the vendor is accountable for how the tool is used and for the data we feed it.\" The internal audit director, Mei Tan, disagrees.","type":"application","difficulty":"moderate","stem":"Which statement BEST reflects the shared responsibility model for SaaS AI?","options":["The vendor is responsible for data governance because it hosts the data","The customer is responsible only for user training","Responsibility transfers fully to the vendor once a service-level agreement is signed","The customer retains responsibility for data governance, usage policy and accountability, while the vendor is responsible for the platform and its application features"],"correctIndex":3,"explanation":"Even in SaaS, the customer owns decisions about what data is used and how outputs are applied. The vendor does not own the customer's data or its use. Accountability for governance, policy and use remains with the organization, which is why contract terms and internal policies matter.","optionRationales":["Hosting does not make the vendor the data governor. The customer decides data use and classification.","Responsibility extends beyond training to data governance, usage policy and accountability.","An SLA covers service levels. It cannot transfer the organization's accountability.","Even in SaaS, the customer owns decisions about what data is used and how outputs are applied. The vendor does not own the customer's data or its use. Accountability for governance, policy and use remains with the organization, which is why contract terms and internal policies matter."],"sourceRef":"D1 practice questions · Q7 · 1.5","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q008","sectionId":"d1-A","knowledgePointIds":["d1-A-6-3"],"scenarioId":"d1-doc-case-bf01748153","scenario":"Kestrel Staffing deployed an AI candidate-ranking tool. The data science team demonstrates that it met every technical specification and passed all test cases. Three months later, recruiters report that it ranks candidates in ways that do not match what hiring managers need, and an internal review shows uneven results for some groups. The audit committee chair, Olivia Grant, asks where the life cycle failed.","type":"application","difficulty":"expert","stem":"What is the MOST likely governance gap?","options":["Verification testing was insufficient because some test cases failed","Validation was not performed against intended business outcomes and real-world effects, even though verification against specifications succeeded","Hardware capacity limited the model's ranking accuracy","The data was cleansed too aggressively before training"],"correctIndex":1,"explanation":"Verification asks \"did we build it right?\" and validation asks \"is it the right thing to build, and does it work in the real world?\" A model can meet technical specifications and still fail business needs or produce biased outcomes. The TEVV phase must include validation with business stakeholders and fairness checks, not only specification testing.","optionRationales":["The scenario says all test cases passed, so verification did not fail.","Verification asks \"did we build it right?\" and validation asks \"is it the right thing to build, and does it work in the real world?\" A model can meet technical specifications and still fail business needs or produce biased outcomes. The TEVV phase must include validation with business stakeholders and fairness checks, not only specification testing.","Nothing in the scenario points to hardware. The issue is fit to business need and fairness.","Aggressive cleansing is not indicated, and it would not explain a mismatch with business outcomes."],"sourceRef":"D1 practice questions · Q8 · 1.4","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q009","sectionId":"d1-A","knowledgePointIds":["d1-A-3-4","d1-E-3-0"],"scenarioId":"d1-doc-case-24c4e6999e","scenario":"Ridgeway Bank's marketing analytics team uses an unsupervised clustering model to group customers, and the product team wants to use the clusters to decide who is offered premium services and who is excluded. Model risk manager Chiara Bellini reviews the proposal.","type":"application","difficulty":"moderate","stem":"What is the GREATEST governance concern?","options":["Clustering cannot be run on customer data","The clusters are unlabeled and hard to explain, may reflect spurious patterns or proxies for protected characteristics, and are being used for decisions that affect customers","The model needs labeled data to run at all","The clusters will be too similar to each other"],"correctIndex":1,"explanation":"Unsupervised learning finds patterns in unlabeled data. The risks are lack of explainability and the discovery of false patterns, and clusters can proxy for sensitive attributes. Using them to include or exclude customers needs validation, interpretability review and fairness testing. Clustering works on customer data and by definition does not need labels.","optionRationales":["Clustering can be run on customer data. The issue is how outputs are used.","Unsupervised learning finds patterns in unlabeled data. The risks are lack of explainability and the discovery of false patterns, and clusters can proxy for sensitive attributes. Using them to include or exclude customers needs validation, interpretability review and fairness testing. Clustering works on customer data and by definition does not need labels.","Labeled data is for supervised learning, and unsupervised methods do not require it.","Cluster similarity is a technical tuning matter, not the key governance risk."],"sourceRef":"D1 practice questions · Q9 · 1.2","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q010","sectionId":"d1-A","knowledgePointIds":["d1-A-3-7"],"scenarioId":"d1-doc-case-4621c8061f","scenario":"Quantum Freight is piloting a reinforcement-learning system that adjusts delivery prices in real time, rewarded for revenue per route. Pricing manager Dev Anand is pleased with early revenue. The ethics and risk committee, chaired by Sofia Marin, is asked to approve production use.","type":"application","difficulty":"moderate","stem":"Which review is MOST important before approval?","options":["Confirmation that the training data is labeled","Whether the system uses a convolutional neural network","The number of tokens processed per query","Review of the reward function design, testing in simulation, and ethical and regulatory constraints on how the system may pursue reward"],"correctIndex":3,"explanation":"Reinforcement learning agents optimize for rewards through trial and error, so a poorly specified reward can lead to harmful behaviour such as discriminatory or exploitative pricing. Governance must review the reward design, test in simulation and set constraints. Labeling, CNNs and tokens are irrelevant to the main risk here.","optionRationales":["Labeling relates to supervised learning.","CNNs are image-oriented architectures and not related to pricing reward risk.","Tokens relate to language models, not pricing agents.","Reinforcement learning agents optimize for rewards through trial and error, so a poorly specified reward can lead to harmful behaviour such as discriminatory or exploitative pricing. Governance must review the reward design, test in simulation and set constraints. Labeling, CNNs and tokens are irrelevant to the main risk here."],"sourceRef":"D1 practice questions · Q10 · 1.2","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q011","sectionId":"d1-A","knowledgePointIds":["d1-A-3-10"],"scenarioId":"d1-doc-case-29acaa1d43","scenario":"Medisight Hospital plans to deploy a convolutional neural network that flags anomalies in chest X-rays. The vendor reports high accuracy on its test set. The chief medical officer, Dr. Alan Reid, asks the AI governance committee, led by Kavita Rao, what must be confirmed before clinical use.","type":"application","difficulty":"difficult","stem":"What is MOST important to confirm?","options":["That training and test data are representative of the hospital's patient population, and that performance is clinically validated, including across patient subgroups","That the vendor uses a recurrent network rather than a convolutional one","That the model has the most hidden layers available","That the vendor's marketing materials cite the same accuracy figure"],"correctIndex":0,"explanation":"CNNs suit image data, so the architecture choice is appropriate. The governance risk is whether the model generalizes to this hospital's population and works equitably across subgroups, which requires representative data and clinical validation. More layers or marketing claims do not demonstrate this, and recurrent networks suit sequences, not images.","optionRationales":["CNNs suit image data, so the architecture choice is appropriate. The governance risk is whether the model generalizes to this hospital's population and works equitably across subgroups, which requires representative data and clinical validation. More layers or marketing claims do not demonstrate this, and recurrent networks suit sequences, not images.","RNNs are for sequential data, so they are less suitable for imaging.","Depth does not guarantee performance or fairness and can reduce explainability.","Marketing figures are not independent validation."],"sourceRef":"D1 practice questions · Q11 · 1.3","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q012","sectionId":"d1-A","knowledgePointIds":["d1-A-4-7","d1-A-1-1"],"scenarioId":"d1-doc-case-1aae3fd3f1","scenario":"Westbrook Airlines' customer-service assistant, built on a large language model, told a customer that a bereavement refund was available when the policy says otherwise. The customer relied on it, and a complaint reached the chief customer officer, Sandra Pike, who asks the AI governance lead how to reduce recurrence.","type":"application","difficulty":"moderate","stem":"Which approach is MOST effective?","options":["Increase the model's creativity setting to give richer answers","Remove all disclaimers so customers trust the assistant more","Ground answers in approved policy content, monitor outputs, apply human review to high-impact responses, and make the AI's limits clear to customers","Accept hallucination as an unavoidable cost with no further controls"],"correctIndex":2,"explanation":"Hallucination is a known generative AI risk, a confident but incorrect output. Governance measures include grounding the model in authoritative content (for example with RAG), monitoring, human oversight for high-impact outputs and transparency about limitations. Removing disclaimers or increasing creativity raises the risk, and doing nothing is not acceptable.","optionRationales":["Higher creativity typically increases the chance of inaccurate content.","Removing disclaimers reduces transparency and does not improve accuracy.","Hallucination is a known generative AI risk, a confident but incorrect output. Governance measures include grounding the model in authoritative content (for example with RAG), monitoring, human oversight for high-impact outputs and transparency about limitations. Removing disclaimers or increasing creativity raises the risk, and doing nothing is not acceptable.","Doing nothing leaves customers and the company exposed."],"sourceRef":"D1 practice questions · Q12 · 1.1","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q013","sectionId":"d1-A","knowledgePointIds":["d1-A-5-1","d1-A-5-3"],"scenarioId":"d1-doc-case-e102bae437","scenario":"Orion Legal has loaded embeddings of confidential merger documents into a vector database used by an internal assistant. The project lead, Mateo Ruiz, says the embeddings are only numbers, so no additional protection is needed. The information security manager, Yara Haddad, disagrees.","type":"application","difficulty":"difficult","stem":"Which statement BEST reflects the governance position?","options":["Embeddings are anonymous, so no controls are needed","Only the original documents require protection, not their embeddings","Embeddings can leak sensitive information and should be treated as data, with encryption, access controls, ingestion validation and retrieval logging","Controls are needed only if the database is hosted externally"],"correctIndex":2,"explanation":"Embeddings encode meaning and can, to varying degrees, be used to recover sensitive information. Vector databases also face risks from poisoned content and unauthorized retrieval. They should be governed like the data they represent, using encryption at rest and in transit, access control, validation on ingestion and logs of retrieval.","optionRationales":["Embeddings are not safely anonymous and can leak information.","Derived data can reveal the source, so it needs protection as well.","Embeddings encode meaning and can, to varying degrees, be used to recover sensitive information. Vector databases also face risks from poisoned content and unauthorized retrieval. They should be governed like the data they represent, using encryption at rest and in transit, access control, validation on ingestion and logs of retrieval.","Internal hosting does not remove the need for access control and logging."],"sourceRef":"D1 practice questions · Q13 · 1.4","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q014","sectionId":"d1-A","knowledgePointIds":["d1-A-5-2"],"scenarioId":"d1-doc-case-c2ee5ddc31","scenario":"Tarn Advisory uses an LLM assistant to summarize 200-page client contracts. Reviewers notice that summaries sometimes omit clauses in the later sections of long documents and state conclusions with confidence. The risk manager, Ollie Banks, asks the audit team what should be verified.","type":"application","difficulty":"moderate","stem":"Which explanation and control is MOST appropriate?","options":["The input may exceed the model's context window, so content is truncated; require checks that prompts and retrieved content fit, and human review of outputs for material contracts","The model is conscious and is skipping clauses on purpose","The documents contain too few tokens","The vector database should be deleted"],"correctIndex":0,"explanation":"A context window limits how many tokens a model can consider. Input beyond it is truncated, which causes omissions and hallucination-like errors. Governance and audit should confirm that inputs fit within limits, apply chunking or retrieval design, and keep human review for high-stakes use. Intentional omission, too few tokens or deleting the database do not explain or fix the issue.","optionRationales":["A context window limits how many tokens a model can consider. Input beyond it is truncated, which causes omissions and hallucination-like errors. Governance and audit should confirm that inputs fit within limits, apply chunking or retrieval design, and keep human review for high-stakes use. Intentional omission, too few tokens or deleting the database do not explain or fix the issue.","Intentional skipping is not how current narrow AI behaves. The cause is a technical limit.","Too few tokens would not cause omissions. The problem is too many.","Removing the database does not address truncation and may remove a useful control."],"sourceRef":"D1 practice questions · Q14 · 1.4","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q015","sectionId":"d1-A","knowledgePointIds":["d1-A-6-3","d1-E-0-9"],"scenarioId":"d1-doc-case-7dc4ec488e","scenario":"Beacon Bank will release a public-facing generative AI assistant next month. The audit committee chair, Janet Lowe, asks the CISO, Amir Khan, what assurance exists that the system can withstand malicious use such as manipulation of prompts and data extraction.","type":"application","difficulty":"moderate","stem":"Which activity provides the BEST assurance during the test and validation phase?","options":["A post-launch customer satisfaction study","A survey of employees about their feelings toward AI","A review of marketing materials for tone","AI red teaming at both the base-model and application levels, to emulate adversaries and fix weaknesses before production"],"correctIndex":3,"explanation":"Red teaming deliberately emulates adversaries to find vulnerabilities, such as prompt injection, data extraction and adversarial inputs, before release. It belongs in the testing, evaluation, verification and validation phase and should address both the model and the application built around it. Surveys, marketing review and post-launch studies do not test resilience.","optionRationales":["Post-launch studies are too late for pre-release assurance.","Employee sentiment does not test security or robustness.","Marketing tone is unrelated to adversarial resilience.","Red teaming deliberately emulates adversaries to find vulnerabilities, such as prompt injection, data extraction and adversarial inputs, before release. It belongs in the testing, evaluation, verification and validation phase and should address both the model and the application built around it. Surveys, marketing review and post-launch studies do not test resilience."],"sourceRef":"D1 practice questions · Q15 · 1.4","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q016","sectionId":"d1-A","knowledgePointIds":["d1-A-8-2"],"scenarioId":"d1-doc-case-754e55f833","scenario":"Sprout Logistics, a small company with no AI expertise, buys an off-the-shelf AI forecasting tool and sends it internal shipment and customer data. The owner, Hugo Lang, believes the vendor now carries all responsibility for results and security.","type":"application","difficulty":"moderate","stem":"Which risk deserves the MOST attention?","options":["The purchase will make the company's servers run too hot","Unclear accountability and ownership for maintenance and biased or wrong output, together with exposure of company data to a third party","The vendor's logo may not match the company's brand","The tool will be too fast to deploy"],"correctIndex":1,"explanation":"Off-the-shelf tools are quick to deploy and suit organizations lacking expertise, but risk concentrates in accountability and ownership (who is responsible for maintenance and biased outputs), ethical concerns, and data security, since sharing data with a third party creates more attack vectors. The other options are not material risks.","optionRationales":["Server heat is not a relevant governance risk.","Off-the-shelf tools are quick to deploy and suit organizations lacking expertise, but risk concentrates in accountability and ownership (who is responsible for maintenance and biased outputs), ethical concerns, and data security, since sharing data with a third party creates more attack vectors. The other options are not material risks.","Branding is a cosmetic concern.","Speed is a benefit, not a risk."],"sourceRef":"D1 practice questions · Q16 · 1.5","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q017","sectionId":"d1-A","knowledgePointIds":["d1-A-0-0"],"scenarioId":"d1-doc-case-be1c4e7c4e","scenario":"Plume Streaming's recommendation engine learns from users' past viewing. Over a year the catalogue shown to users has narrowed to a small set of popular titles and creators from underrepresented groups see falling exposure. The chief product officer, Elise Warren, asks audit for observations.","type":"application","difficulty":"difficult","stem":"What should the auditor focus on FIRST?","options":["Whether the vendor's servers have enough memory","How historical data is retained and used for retraining, and whether feedback loops from the model's own outputs are monitored and controlled","Whether the interface colors are accessible","Whether the engine could be replaced by a reactive, rule-based system"],"correctIndex":1,"explanation":"Limited-memory AI learns from historical data, so what is stored and how it feeds retraining and decisions matters. Recommendations influence behaviour, which becomes new training data, creating feedback loops that can amplify bias and narrow outcomes. Audit and governance should review retention, retraining and loop monitoring. Hardware, color and swapping systems do not address the cause.","optionRationales":["Server memory is an operational capacity issue.","Limited-memory AI learns from historical data, so what is stored and how it feeds retraining and decisions matters. Recommendations influence behaviour, which becomes new training data, creating feedback loops that can amplify bias and narrow outcomes. Audit and governance should review retention, retraining and loop monitoring. Hardware, color and swapping systems do not address the cause.","Interface colors are not related to the concentration of exposure.","Replacing the engine is a design choice that does not examine the current control weaknesses."],"sourceRef":"D1 practice questions · Q17 · 1.1","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q018","sectionId":"d1-A","knowledgePointIds":["d1-A-1-2"],"scenarioId":"d1-doc-case-4cc1a32d8a","scenario":"Corbel Bank's fraud team learns that criminals used a generative adversarial network to create a convincing deepfake of a senior executive's voice to authorize a payment. The CEO, Helen Pratt, asks what governance response is MOST appropriate.","type":"application","difficulty":"basic","stem":"Which response BEST addresses the risk?","options":["Ban all generative AI use inside the bank","Rely on staff to recognize fake voices unaided","Ignore it since only criminals can create deepfakes","Update policies and procedures to require independent verification for high-value requests and raise staff awareness about synthetic media"],"correctIndex":3,"explanation":"GANs use a generator and a discriminator to produce realistic synthetic content, which lowers the cost of impersonation. A proportionate response combines process controls such as out-of-band verification with training and awareness. A ban does not stop criminals, and relying on human detection alone is unreliable.","optionRationales":["Banning internal use does not stop external attackers.","Human judgment alone is increasingly unreliable against realistic fakes.","The threat is real and available to many actors.","GANs use a generator and a discriminator to produce realistic synthetic content, which lowers the cost of impersonation. A proportionate response combines process controls such as out-of-band verification with training and awareness. A ban does not stop criminals, and relying on human detection alone is unreliable."],"sourceRef":"D1 practice questions · Q18 · 1.1","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q019","sectionId":"d1-A","knowledgePointIds":["d1-A-4-6"],"scenarioId":"d1-doc-case-e41ba651c7","scenario":"Argent Lending's vendor presents a credit-default model with 99% accuracy on the data used to build it. In a three-month pilot on live applications, accuracy falls to 71%. The vendor says the pilot population was \"unusual.\" The chief risk officer, Paul Nakamura, must decide whether to approve rollout and what to require.","type":"application","difficulty":"difficult","stem":"What is the GREATEST concern, and what should governance require?","options":["The model may be overfitted to its training data; require validation on independent unseen data and acceptance criteria based on out-of-sample performance, with ongoing monitoring","The model is underfitted; require a simpler algorithm and proceed with rollout","The pilot was too short; extend it but accept the vendor's reported accuracy in the meantime","Accuracy is irrelevant to credit decisions; rely on the vendor's compliance certificate"],"correctIndex":0,"explanation":"A large gap between performance on training data and on new data is the classic sign of overfitting: the model has memorized the training data, including noise, and does not generalize. Governance should set acceptance criteria on independent, out-of-sample data, challenge vendor-reported figures, and monitor performance after deployment. An underfitted model performs poorly on both training and new data, which does not match the evidence.","optionRationales":["A large gap between performance on training data and on new data is the classic sign of overfitting: the model has memorized the training data, including noise, and does not generalize. Governance should set acceptance criteria on independent, out-of-sample data, challenge vendor-reported figures, and monitor performance after deployment. An underfitted model performs poorly on both training and new data, which does not match the evidence.","Underfitting would show poor results on the training data as well, and simplifying the algorithm would not address memorization.","Accepting vendor accuracy in the meantime relies on the figures that failed to hold in practice.","Accuracy and reliability are central to credit risk and fair treatment, and a certificate does not replace validation."],"sourceRef":"D1 practice questions · Q19 · 1.2","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q020","sectionId":"d1-B","knowledgePointIds":["d1-A-7-0"],"scenarioId":"d1-doc-case-d0ede8196e","scenario":"Harborview Health's CEO, Marcus Webb, announces that the hospital group will \"become AI-first.\" Department heads are already requesting vendor demos. The newly appointed chief AI officer, Dr. Elena Park, must set the direction.","type":"application","difficulty":"basic","stem":"What should be the FIRST step in any AI initiative?","options":["Select the vendor with the most advanced model","Roll out AI literacy training to all clinical staff","Identify the business use case or problem to be solved and the objectives it must support","Commission bias testing of candidate models"],"correctIndex":2,"explanation":"AI initiatives start from a business problem or opportunity. The use case, objectives and expected value define scope, risk, data needs and success measures. Vendor selection, training and testing are all downstream and cannot be shaped properly without it.","optionRationales":["Choosing technology first inverts the order and risks solutions that do not fit a need.","Training matters, but it follows from knowing what AI will be used for.","AI initiatives start from a business problem or opportunity. The use case, objectives and expected value define scope, risk, data needs and success measures. Vendor selection, training and testing are all downstream and cannot be shaped properly without it.","There is n
