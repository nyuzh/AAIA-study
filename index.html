function isQuestionWeak(q) {
  const stats = questionStats[q.id];
  if (stats && stats.incorrect > 0) return stats.lastCorrect !== true;
  const saved = savedQuizAnswer(q);
  return saved !== undefined && saved !== q.correctIndex;
}
function countWeakQuestions() { return allQuestions().filter(isQuestionWeak).length; }
function startExam() {
  const target = {d1:30,d2:41,d3:19};
  const pools = Object.fromEntries(DOMAINS.map(domain => [domain.id, allQuestions().filter(q=>q.sectionId.startsWith(domain.id+"-"))]));
  Object.values(pools).forEach(pool=>{for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}});
  const selected = [];
  DOMAINS.forEach(domain=>{
    selected.push(...pools[domain.id].slice(0,target[domain.id]));
  });
  let remaining=Math.max(0,Math.min(90,allQuestions().length)-selected.length);
  while(remaining>0){let added=false;for(const domain of DOMAINS){const pool=pools[domain.id],already=selected.filter(q=>q.sectionId.startsWith(domain.id+"-")).length;if(already<pool.length&&remaining>0){selected.push(pool[already]);remaining--;added=true;}}if(!added)break;}
  examSession={id:`exam-${Date.now()}`,questionIds:selected.map(q=>q.id),answers:{},startedAt:new Date().toISOString(),status:"in-progress",currentIndex:0};
  saveExamSession();view={name:"quiz",mode:"exam",questionIndex:0};
}
function finishExam() {
  if(!examSession||examSession.status==="completed") return;
  const answered=Object.keys(examSession.answers).length;
  if(answered<examSession.questionIds.length&&!window.confirm(`You have answered ${answered} of ${examSession.questionIds.length} questions. Submit the exam?`)) return;
  const domains={};let correct=0;
  examSession.questionIds.forEach(id=>{
    const q=QUESTION_BY_ID[id], answer=examSession.answers[id];
    const domainId=q.sectionId.split("-")[0];
    domains[domainId] ||= {total:0,answered:0,correct:0};
    domains[domainId].total++;
    if(answer!==undefined){domains[domainId].answered++;recordQuestionAttempt(q,answer);if(answer===q.correctIndex){correct++;domains[domainId].correct++;}}
  });
  examSession.status="completed";examSession.completedAt=new Date().toISOString();saveExamSession();
  examHistory.unshift({id:examSession.id,date:examSession.completedAt,total:examSession.questionIds.length,answered,correct,domains});
  examHistory=examHistory.slice(0,20);saveExamHistory();view={name:"examResults"};render();
}
function exportProgress() {
  const backup={app:"AAIA Study Path",version:1,exportedAt:new Date().toISOString(),state:{mastery,quizAnswers,questionStats,bookmarks,examHistory,examSession}};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const link=document.createElement("a"),url=URL.createObjectURL(blob);link.href=url;link.download=`aaia-progress-${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importProgress(event) {
  const file=event.target.files&&event.target.files[0];if(!file)return;

  reader.onload=()=>{try{
    const backup=JSON.parse(reader.result);
    if(backup.app!=="AAIA Study Path"||backup.version!==1||!backup.state||typeof backup.state!=="object")throw new Error("This is not a supported AAIA Study Path backup.");
    if(!window.confirm("Replace this browser's saved progress with the selected backup?"))return;
    mastery=backup.state.mastery||{};quizAnswers=backup.state.quizAnswers||{};questionStats=backup.state.questionStats||{};bookmarks=backup.state.bookmarks||{};examHistory=backup.state.examHistory||[];examSession=backup.state.examSession||null;
    saveMastery(mastery);saveQuizAnswers(quizAnswers);saveQuestionStats();saveBookmarks();saveExamHistory();saveExamSession();showToast("Progress restored");render();
  }catch(error){window.alert(error.message||"Could not read this progress file.");}finally{event.target.value="";}};
  reader.readAsText(file);
}
function resetProgress() {
  if(!window.confirm("Reset mastery, quiz answers, weak-area history, bookmarks, exam history, and the saved exam? This cannot be undone unless you exported a backup."))return;
  mastery={};quizAnswers={};questionStats={};bookmarks={};examHistory=[];examSession=null;
  try{[STORE_KEY,QUIZ_STORE_KEY,QUESTION_STATS_KEY,BOOKMARKS_KEY,EXAM_HISTORY_KEY,EXAM_SESSION_KEY].forEach(key=>localStorage.removeItem(key));}catch(e){}
  showToast("Progress reset");view={name:"home"};render();
}

const LEVELS = [
  { min:0,  title:"Audit Trainee" },
  { min:5,  title:"Staff Auditor" },
  { min:15, title:"Senior Auditor" },
  { min:25, title:"Audit Manager" },
  { min:35, title:"Senior Manager" },
  { min:50, title:"Audit Director" },
  { min:70, title:"Chief Audit Executive" }
];
const XP_PER_CARD = 10;

/* ============ STATE / STORAGE ============ */
const STORE_KEY = "aaia-mastery-v2";
function loadMastery() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ return {}; } }
function saveMastery(m) { try { localStorage.setItem(STORE_KEY, JSON.stringify(m)); } catch(e){} }
let mastery = loadMastery();
let openCard = null;
let view = { name: "home" };

const QUIZ_STORE_KEY = "aaia-quiz-v1";

function saveQuizAnswers(a) { try { localStorage.setItem(QUIZ_STORE_KEY, JSON.stringify(a)); } catch(e){} }
let quizAnswers = loadQuizAnswers();
const QUESTION_STATS_KEY = "aaia-question-stats-v1";
function loadQuestionStats() { try { return JSON.parse(localStorage.getItem(QUESTION_STATS_KEY)) || {}; } catch(e){ return {}; } }
function saveQuestionStats() { try { localStorage.setItem(QUESTION_STATS_KEY, JSON.stringify(questionStats)); } catch(e){} }
let questionStats = loadQuestionStats();
const BOOKMARKS_KEY = "aaia-bookmarks-v1";
function loadBookmarks() { try { return JSON.parse(localStorage.getItem(BOOKMARKS_KEY)) || {}; } catch(e){ return {}; } }
function saveBookmarks() { try { localStorage.setItem(BOOKMARKS_KEY, JSON.stringify(bookmarks)); } catch(e){} }

let examHistory = loadExamHistory();
const EXAM_SESSION_KEY = "aaia-exam-session-v1";
function loadExamSession() { try { return JSON.parse(localStorage.getItem(EXAM_SESSION_KEY)) || null; } catch(e){ return null; } }
function saveExamSession() { try { localStorage.setItem(EXAM_SESSION_KEY, JSON.stringify(examSession)); } catch(e){} }
let examSession = loadExamSession();
const D23_QUESTION_REWRITE_KEY = "aaia-d23-question-rewrite-v1";
function clearOutdatedDomain23Attempts() {
  try {
    if (localStorage.getItem(D23_QUESTION_REWRITE_KEY) === "complete") return;
    const isRewrittenQuestion = id => /^(?:d2|d3)-(?!doc-)/i.test(id);
    Object.keys(quizAnswers).forEach(id => { if (isRewrittenQuestion(id)) delete quizAnswers[id]; });
    Object.keys(questionStats).forEach(id => { if (isRewrittenQuestion(id)) delete questionStats[id]; });
    if (examSession && examSession.answers) {
      Object.keys(examSession.answers).forEach(id => { if (isRewrittenQuestion(id)) delete examSession.answers[id]; });
    }
    saveQuizAnswers(quizAnswers); saveQuestionStats(); saveExamSession();
    localStorage.setItem(D23_QUESTION_REWRITE_KEY, "complete");
  } catch(e) {}
}
clearOutdatedDomain23Attempts();
function recordQuestionAttempt(question, answer) {
  const record = questionStats[question.id] || { attempts:0, correct:0, incorrect:0, lastAttempted:null };
  record.attempts++;
  record.lastCorrect = answer === question.correctIndex;
  if (record.lastCorrect) record.correct++; else record.incorrect++;
  record.lastAttempted = new Date().toISOString();
  questionStats[question.id] = record;
  saveQuestionStats();
}
function masterLinkedPoints(question) {
  let newlyMastered = 0;
  (question.knowledgePointIds || []).forEach(id => {
    if (!mastery[id] && knowledgePointIndex().some(point => point.id === id)) {
      mastery[id] = true;
      newlyMastered++;
    }
  });
  if (newlyMastered) {
    saveMastery(mastery);
    showToast(`Correct — ${newlyMastered} knowledge point${newlyMastered === 1 ? "" : "s"} mastered (+${newlyMastered * XP_PER_CARD} XP)`);
  }
}
function quizAnswerKey(quizKey, qi) { return quizKey + "-" + qi; }
function quizScore(quizKey, total) {
  let answered = 0, correct = 0;
  const qs = questionsForSection(quizKey);
  qs.forEach((q, qi) => {
    const a = quizAnswers[q.id] ?? quizAnswers[quizAnswerKey(quizKey, qi)];
    if (a !== undefined) { answered++; if (a === q.correctIndex) correct++; }
  });
  return { answered, correct, total };
}

function cardKey(domId, secId, gi, ci) { return domId+"-"+secId+"-"+gi+"-"+ci; }

/* ============ STATS HELPERS ============ */
function allCards() {
  const list = [];
  DOMAINS.forEach(d => d.sections.forEach(s => s.groups.forEach((g, gi) => g.cards.forEach((c, ci) => {
    list.push({ key: cardKey(d.id, s.id, gi, ci), domId:d.id, secId:s.id });
  }))));
  return list;
}
function totalMasteredCount() { return allCards().filter(c => mastery[c.key]).length; }
function levelInfo(masteredCount) {
  let current = LEVELS[0];
  for (const l of LEVELS) if (masteredCount >= l.min) current = l;
  const idx = LEVELS.indexOf(current);
  const next = LEVELS[idx+1];
  return { title: current.title, next, toNext: next ? next.min - masteredCount : 0 };
}
function domainStats(dom) {
  let total=0, done=0;
  dom.sections.forEach(s => s.groups.forEach((g,gi) => g.cards.forEach((c,ci) => {
    total++; if (mastery[cardKey(dom.id, s.id, gi, ci)]) done++;
  })));
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}
function sectionStats(dom, sec) {
  let total=0, done=0;
  sec.groups.forEach((g,gi) => g.cards.forEach((c,ci) => {
    total++; if (mastery[cardKey(dom.id, sec.id, gi, ci)]) done++;
  }));
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}
function groupStats(dom, sec, g, gi) {
  let total=g.cards.length, done=0;
  g.cards.forEach((c,ci) => { if (mastery[cardKey(dom.id, sec.id, gi, ci)]) done++; });
  return { total, done, complete: total>0 && done===total };
}

/* ============ RING SVG ============ */
function ring(pct, size, strokeW, color) {
  const r = (size - strokeW) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (pct/100) * c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${strokeW}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeW}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${size*0.26}" fill="var(--ink)" font-family="-apple-system,sans-serif" font-weight="700">${pct}%</text>
  </svg>`;
}

/* ============ TOAST ============ */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

/* ============ RENDER: DOMAIN ============ */
function renderDomain() {
  const app = document.getElementById("app");

    app.innerHTML = `<div class="domain-head"><h2>${dom.title} — ${dom.full}</h2><div class="meta">${dom.weight}</div><p>${dom.desc}</p></div>

  }
  let cardsHtml = "";

    cardsHtml += `<div class="section-card${hasContent ? "" : " locked"}" data-sec="${sec.id}">

  });
  app.innerHTML = `
    <div class="domain-head">

  app.querySelectorAll(".mastercb").forEach(cb => {
    cb.addEventListener("click", e => e.stopPropagation());
    cb.addEventListener("change", () => {
      const key = cb.getAttribute("data-key");
      const wasMastered = !!mastery[key];
      mastery[key] = cb.checked;
      saveMastery(mastery);
      if (cb.checked && !wasMastered) showToast("+" + XP_PER_CARD + " XP");
      render();
    });
  });
  const resetBtn = document.getElementById("resetBtn");
  document.getElementById("returnToQuestion")?.addEventListener("click", () => { view = view.returnQuiz; render(); });
  if (resetBtn) resetBtn.addEventListener("click", () => {
    g.cards.forEach((c, ci) => { delete mastery[cardKey(dom.id, sec.id, gi, ci)]; });
    saveMastery(mastery);
    render();
  });
}

/* ============ RENDER: QUIZ ============ */
function renderQuiz() {
  const app = document.getElementById("app");
  const isExam = view.mode === "exam";
  if (isExam && !examSession) { view = {name:"exam"}; renderExam(); return; }
  const key = view.domId + "-" + view.secId;
  const fullQuestions = isExam ? examSession.questionIds.map(id => QUESTION_BY_ID[id]).filter(Boolean) : questionsForSection(key);
  const questions = view.questionIds ? fullQuestions.filter(q => view.questionIds.includes(q.id)) : fullQuestions;
  const examDone = isExam && examSession.status === "completed";
  const answerFor = (q,index) => isExam ? examSession.answers[q.id] : quizAnswers[q.id] ?? quizAnswers[quizAnswerKey(key,fullQuestions.indexOf(q))];
  const answered = questions.reduce((n,q,i) => n + (answerFor(q,i) !== undefined ? 1 : 0), 0);
  const score = isExam ? {answered,correct:examDone?questions.filter((q,i)=>answerFor(q,i)===q.correctIndex).length:null,total:questions.length} : {answered,correct:questions.filter((q,i)=>answerFor(q,i)!==undefined&&answerFor(q,i)===q.correctIndex).length,total:questions.length};
  let index = Math.max(0, Math.min(view.questionIndex || 0, questions.length - 1));
  const q = questions[index];
  if (!q) { app.innerHTML = `<div class="empty-note">No questions are available in this section yet.</div>`; return; }
  const saved = answerFor(q,index);
  const attempted = saved !== undefined && (!isExam || examDone);
  const selected = view.selectedAnswer ?? (saved !== undefined ? saved : null);
  const scoreText = isExam && !examDone ? `${answered}/${questions.length} answered` : `${score.correct} correct of ${score.answered} answered`;
  const scenarioOpen = !(view.collapsedScenarios && view.collapsedScenarios[q.scenarioId]);
  const scenarioHtml = q.scenario ? `<details class="quiz-case" ${scenarioOpen?"open":""}><summary>Case study</summary>${q.scenario.split("\n").filter(line=>line.trim()).map(line=>`<p>${line}</p>`).join("")}</details>` : "";
  const questionNav = `<details class="quiz-index" ${view.questionNavOpen?"open":""}><summary>Jump to a question · ${answered}/${questions.length} answered</summary><div class="quiz-index-grid">${questions.map((item,i)=>{const answer=answerFor(item,i);const state=answer===undefined?"":isExam&&!examDone?"answered":answer===item.correctIndex?"correct":"incorrect";return `<button class="qjump ${state}${i===index?" active":""}" data-jump="${i}" aria-label="Question ${i+1}${state?", "+state:""}">${i+1}</button>`;}).join("")}</div></details>`;
  const isBookmarked = !!bookmarks[q.id];
  const linkedPoint = (q.knowledgePointIds || []).map(id => knowledgePointIndex().find(point => point.id === id)).find(Boolean);
  app.innerHTML = `<div class="sec-head"><h2 class="serif">${isExam?"Full Mock Exam":`Practice Quiz — Section ${view.secId}`}</h2>
    <p>${index + 1} of ${questions.length} questions · ${scoreText}</p>
    <div class="quiz-summary"><span>${answered}/${questions.length}</span><div class="bar"><div style="width:${questions.length ? answered / questions.length * 100 : 0}%"></div></div></div></div>
    ${questionNav}${scenarioHtml}<article class="quiz-q"><div class="qnum">QUESTION ${index + 1} · ${q.type.toUpperCase()} <button id="bookmarkQuestion" class="bookmark-btn">${isBookmarked?"★ Saved":"☆ Bookmark"}</button></div><div class="stem">${q.stem}</div>
      ${linkedPoint ? `<button id="studyKnowledgePoint" class="study-point-link">Study this point: ${linkedPoint.card.term}</button>` : ""}
      ${q.options.map((option, oi) => `<button class="quiz-opt${selected === oi ? " selected" : ""}${attempted && oi === q.correctIndex ? " correct" : ""}${attempted && selected === oi && oi !== q.correctIndex ? " incorrect" : ""}" data-option="${oi}" ${attempted ? "disabled" : ""}>${String.fromCharCode(65 + oi)}. ${option}</button>`).join("")}
      ${attempted ? `<div class="quiz-explain"><div class="verdict ${saved === q.correctIndex ? "right" : "wrong"}">${saved === q.correctIndex ? "Correct" : "Not quite"} — answer ${String.fromCharCode(65 + q.correctIndex)}</div><div>${q.explanation}</div>${q.optionRationales ? `<ul>${q.optionRationales.map((r,i)=>`<li><strong>${String.fromCharCode(65+i)}.</strong> ${r}</li>`).join("")}</ul>` : ""}</div>` : ""}
    </article><div class="quiz-nav"><button id="quizBack">${isExam?"Save and exit":view.returnTo==="weak"?"← Weak areas":view.returnTo==="bookmarks"?"← Bookmarks":"← Section"}</button><div><button id="quizPrev" ${index === 0 ? "disabled" : ""}>Previous</button> <button id="quizNextUnanswered" ${questions.every((item,i)=>answerFor(item,i)!==undefined)?"disabled":""}>Next unanswered</button> <button id="quizNext" ${index >= questions.length - 1 ? "disabled" : ""}>Next →</button></div>
      ${isExam?(examDone?`<button id="examResultsBtn">Results</button>`:`<button class="primary" id="quizCheck" ${selected===null?"disabled":""}>Save answer</button> <button class="primary" id="finishExam">Submit exam</button>`):attempted?`<button id="quizRetry">Try again</button>`:`<button class="primary" id="quizCheck" ${selected===null?"disabled":""}>Check answer</button>`}</div>`;
  app.querySelectorAll(".qjump").forEach(el=>el.addEventListener("click",()=>{view.questionIndex=Number(el.dataset.jump);view.selectedAnswer=undefined;if(isExam){examSession.currentIndex=view.questionIndex;saveExamSession();}render();}));
  app.querySelector(".quiz-index")?.addEventListener("toggle",event=>{view.questionNavOpen=event.currentTarget.open;});
  app.querySelector(".quiz-case")?.addEventListener("toggle",event=>{view.collapsedScenarios ||= {};view.collapsedScenarios[q.scenarioId]=!event.currentTarget.open;});
  app.querySelectorAll(".quiz-opt:not(:disabled)").forEach(el => el.addEventListener("click", () => { view.selectedAnswer = Number(el.dataset.option); render(); }));
  document.getElementById("quizCheck")?.addEventListener("click", () => {
    if (view.selectedAnswer === undefined || view.selectedAnswer === null) return;
    if(isExam){examSession.answers[q.id]=view.selectedAnswer;examSession.currentIndex=index;saveExamSession();if(view.selectedAnswer===q.correctIndex)masterLinkedPoints(q);}
    else{quizAnswers[q.id]=view.selectedAnswer;saveQuizAnswers(quizAnswers);recordQuestionAttempt(q,view.selectedAnswer);if(view.selectedAnswer===q.correctIndex)masterLinkedPoints(q);}
    view.selectedAnswer = undefined; render();
  });
  document.getElementById("quizRetry")?.addEventListener("click", () => { delete quizAnswers[q.id]; delete quizAnswers[quizAnswerKey(key,fullQuestions.indexOf(q))]; saveQuizAnswers(quizAnswers); render(); });
  const moveTo=next=>{view.questionIndex=next;view.selectedAnswer=undefined;if(isExam){examSession.currentIndex=next;saveExamSession();}render();};
  document.getElementById("quizPrev")?.addEventListener("click",()=>moveTo(index-1));
  document.getElementById("quizNext")?.addEventListener("click",()=>moveTo(index+1));
  document.getElementById("quizNextUnanswered")?.addEventListener("click",()=>{for(let offset=1;offset<=questions.length;offset++){const candidate=(index+offset)%questions.length;if(answerFor(questions[candidate],candidate)===undefined){moveTo(candidate);return;}}});
  document.getElementById("bookmarkQuestion")?.addEventListener("click",()=>{if(bookmarks[q.id])delete bookmarks[q.id];else bookmarks[q.id]=true;saveBookmarks();render();});
  document.getElementById("studyKnowledgePoint")?.addEventListener("click",()=>{
    const point=linkedPoint;
    const resumeQuiz={...view,selectedAnswer:undefined};
    const groupIdx=point.section.groups.indexOf(point.group);
    openCard=point.id;
    view={name:"group",domId:point.domain.id,secId:point.section.id,groupIdx,returnQuiz:resumeQuiz};
    render();
  });
  document.getElementById("quizBack")?.addEventListener("click",()=>{if(isExam){examSession.currentIndex=index;saveExamSession();view={name:"exam"};}else if(view.returnTo==="weak")view={name:"weak"};else if(view.returnTo==="bookmarks")view={name:"bookmarks"};else view={name:"section",domId:view.domId,secId:view.secId};render();});
  document.getElementById("finishExam")?.addEventListener("click",finishExam);
  document.getElementById("examResultsBtn")?.addEventListener("click",()=>{view={name:"examResults"};render();});
}

/* ============ RENDER: COVERAGE AUDIT ============ */
function renderCoverage() {
  const app = document.getElementById("app");
  const coverage = questionCoverage();
  const qa = questionBankAudit();
  const linkedCount = Object.values(coverage.counts).filter(n => n > 0).length;
  const targetMet = Object.values(coverage.counts).filter(n => n >= COVERAGE_TARGET_PER_POINT).length;
  const rows = coverage.points.map(p => ({...p, count:coverage.counts[p.id]}));
  app.innerHTML = `<div class="sec-head"><h2 class="serif">Question bank coverage</h2>
    <p>${coverage.questions} questions · ${coverage.assigned} explicitly linked · ${linkedCount} of ${coverage.points.length} points tested · ${targetMet} at the ${COVERAGE_TARGET_PER_POINT}-question target</p>
    <p>Structure audit: ${qa.issues.length} issues · ${qa.scenarioCount} shared caselets across ${qa.withScenarios} questions · ${qa.unlinked} legacy questions remain unassigned · ${qa.missingRationales} questions still need option-by-option rationale review.</p>
    <div class="progress-line">Minimum target: ${COVERAGE_TARGET_PER_POINT} questions per knowledge point</div></div>
    <div class="coverage-controls"><select class="coverage-filter" id="coverageDomain"><option value="all">All domains</option>${DOMAINS.map(d=>`<option value="${d.id}">${d.title}</option>`).join("")}</select>
    <select class="coverage-filter" id="coverageStatus"><option value="all">All points</option><option value="missing">No questions</option><option value="below">Below target</option><option value="target">At target</option></select></div>
    <div style="overflow-x:auto"><table class="coverage-table"><thead><tr><th>Knowledge point</th><th>Domain / section</th><th>Questions</th><th>Coverage</th></tr></thead><tbody id="coverageRows"></tbody></table></div>`;
  const draw = () => {
    const domain = document.getElementById("coverageDomain").value, status = document.getElementById("coverageStatus").value;
    const filtered = rows.filter(p => (domain === "all" || p.domain.id === domain) && (status === "all" || status === "missing" && p.count === 0 || status === "below" && p.count > 0 && p.count < COVERAGE_TARGET_PER_POINT || status === "target" && p.count >= COVERAGE_TARGET_PER_POINT));
    document.getElementById("coverageRows").innerHTML = filtered.map(p => `<tr><td class="coverage-name">${p.card.term}<br><small>${p.id}</small></td><td>${p.domain.title} · ${p.section.id}</td><td>${p.count}/${COVERAGE_TARGET_PER_POINT}+</td><td>${p.count === 0 ? "Uncovered" : p.count < COVERAGE_TARGET_PER_POINT ? "Needs more" : "Target met"}</td></tr>`).join("") || `<tr><td colspan="4">No knowledge points match these filters.</td></tr>`;
  };
  document.getElementById("coverageDomain").addEventListener("change", draw);
  document.getElementById("coverageStatus").addEventListener("change", draw);
  draw();
}

function renderWeakAreas() {
  const app=document.getElementById("app"), weak=allQuestions().filter(isQuestionWeak);
  const byPoint={};
  weak.forEach(q=>q.knowledgePointIds.forEach(id=>{byPoint[id] ||= [];byPoint[id].push(q);}));
  const legacyWeak=weak.filter(q=>!q.knowledgePointIds.length);
  const points=knowledgePointIndex();
  const rows=Object.entries(byPoint).map(([id,qs])=>({point:points.find(p=>p.id===id),qs})).filter(x=>x.point).sort((a,b)=>b.qs.length-a.qs.length);
  app.innerHTML=`<div class="sec-head"><h2 class="serif">Weak areas</h2><p>${weak.length} questions have at least one recorded incorrect answer. Practice a knowledge point to retry its questions.</p></div>
    ${rows.map((row,i)=>{const dates=row.qs.map(q=>questionStats[q.id]?.lastAttempted).filter(Boolean).sort();const last=dates.length?new Date(dates[dates.length-1]).toLocaleString():"not recorded";return `<div class="weak-row"><div><strong>${row.point.card.term}</strong><br><small>${row.point.domain.title} · Section ${row.point.section.id} · ${row.qs.length} missed · last attempted ${last}</small></div><button data-weak="${i}">Practice ${row.qs.length}</button></div>`;}).join("")}${legacyWeak.map((q,i)=>`<div class="weak-row"><div><strong>Additional question</strong><br><small>${q.sectionId.replace("-", " · Section ")} · ${q.stem}</small></div><button data-legacy-weak="${i}">Review</button></div>`).join("")}${!weak.length?`<div class="empty-note">No weak areas yet. Answer questions to build your review list.</div>`:""}`;
  app.querySelectorAll("[data-weak]").forEach(button=>button.addEventListener("click",()=>{
    const row=rows[Number(button.dataset.weak)],qs=row.qs;
    qs.forEach(q=>{delete quizAnswers[q.id];});saveQuizAnswers(quizAnswers);
    view={name:"quiz",domId:row.point.domain.id,secId:row.point.section.id,questionIds:qs.map(q=>q.id),questionIndex:0,returnTo:"weak"};render();
  }));
  app.querySelectorAll("[data-legacy-weak]").forEach(button=>button.addEventListener("click",()=>{
    const q=legacyWeak[Number(button.dataset.legacyWeak)],index=questionsForSection(q.sectionId).indexOf(q),[domId,secId]=q.sectionId.split("-");
    delete quizAnswers[q.id];delete quizAnswers[quizAnswerKey(q.sectionId,index)];saveQuizAnswers(quizAnswers);
    view={name:"quiz",domId,secId,questionIds:[q.id],questionIndex:0,returnTo:"weak"};render();
  }));
}
function renderBookmarks() {
  const app=document.getElementById("app"), saved=allQuestions().filter(q=>bookmarks[q.id]);
  app.innerHTML=`<div class="sec-head"><h2 class="serif">Bookmarked questions</h2><p>${saved.length} saved for review.</p></div>
    ${saved.length?saved.map((q,i)=>`<div class="weak-row"><div><strong>${q.stem}</strong><br><small>${q.sectionId.replace("-", " · Section ")} · ${q.type}</small></div><button data-bookmark="${i}">Open</button></div>`).join(""):`<div class="empty-note">Bookmark questions while studying to collect them here.</div>`}`;
  app.querySelectorAll("[data-bookmark]").forEach(button=>button.addEventListener("click",()=>{
    const q=saved[Number(button.dataset.bookmark)],[domId,secId]=q.sectionId.split("-");
    view={name:"quiz",domId,secId,questionIds:[q.id],questionIndex:0,returnTo:"bookmarks"};render();
  }));
}
function renderProgress() {
  const app=document.getElementById("app"),coverage=questionCoverage();
  const attempted=Object.keys(questionStats).reduce((n,id)=>n+(questionStats[id].attempts||0),0);
  const correct=Object.keys(questionStats).reduce((n,id)=>n+(questionStats[id].correct||0),0);
  const incorrect=Object.keys(questionStats).reduce((n,id)=>n+(questionStats[id].incorrect||0),0);
  const untracked=allQuestions().filter(q=>savedQuizAnswer(q)!==undefined&&!(questionStats[q.id]?.attempts));
  const liveExamIds=examSession&&examSession.status==="in-progress"?Object.keys(examSession.answers):[];
  const totalAttempted=attempted+untracked.length+liveExamIds.length,totalCorrect=correct+untracked.filter(q=>savedQuizAnswer(q)===q.correctIndex).length+liveExamIds.filter(id=>examSession.answers[id]===QUESTION_BY_ID[id]?.correctIndex).length,totalIncorrect=incorrect+untracked.filter(q=>savedQuizAnswer(q)!==q.correctIndex).length+liveExamIds.filter(id=>examSession.answers[id]!==QUESTION_BY_ID[id]?.correctIndex).length;
  const linked=Object.values(coverage.counts).filter(n=>n>0).length;
  app.innerHTML=`<div class="sec-head"><h2 class="serif">Study progress</h2><p>Progress is saved in this browser. Export a backup from the home screen.</p></div>
    <div class="stat-grid"><div class="stat-box"><strong>${totalMasteredCount()}/${allCards().length}</strong>Knowledge points mastered</div><div class="stat-box"><strong>${totalAttempted}</strong>Recorded answers</div><div class="stat-box"><strong>${totalCorrect}</strong>Correct</div><div class="stat-box"><strong>${totalIncorrect}</strong>Incorrect</div><div class="stat-box"><strong>${totalAttempted?Math.round(totalCorrect/totalAttempted*100):0}%</strong>Answer accuracy</div><div class="stat-box"><strong>${linked}/${coverage.points.length}</strong>Points with questions</div></div>
    <h3>Domains</h3>${DOMAINS.map(d=>{const s=domainStats(d);const qs=allQuestions().filter(q=>q.sectionId.startsWith(d.id+"-"));const answered=qs.filter(q=>savedQuizAnswer(q)!==undefined||liveExamIds.includes(q.id)).length;return `<div class="weak-row"><div><strong>${d.title} — ${d.full}</strong><br><small>${s.done}/${s.total} knowledge points mastered · ${answered}/${qs.length} questions answered</small></div><span>${s.pct}%</span></div>`;}).join("")}
    <h3>Mock exam history</h3>${examHistory.length?examHistory.map(e=>`<div class="weak-row"><div><strong>${new Date(e.date).toLocaleString()}</strong><br><small>${e.answered}/${e.total} answered · ${e.correct} correct</small></div><span>${Math.round(e.correct/e.total*100)}%</span></div>`).join(""):`<p class="empty-note">No completed mock exams yet.</p>`}`;
}
function renderExam() {
  const app=document.getElementById("app");
  app.innerHTML=`<div class="sec-head"><h2 class="serif">Full mock exam</h2><p>A randomized 90-question mock exam, weighted across all three domains. Answers and exam progress save in this browser.</p></div>
    <div class="tool-card"><h3>${examSession&&examSession.status==="in-progress"?"Exam in progress":"Ready when you are"}</h3><p>${examSession&&examSession.status==="in-progress"?`${Object.keys(examSession.answers).length}/${examSession.questionIds.length} answered · started ${new Date(examSession.startedAt).toLocaleString()}`:"The exam draws questions in the AAIA domain proportions: 30 from Domain 1, 41 from Domain 2, and 19 from Domain 3."}</p>
    ${examSession&&examSession.status==="in-progress"?`<button id="resumeMock">Resume exam</button> <button id="submitMock">Submit exam</button>`:`<button id="startMock" class="primary">Start 90-question mock exam</button>`}</div>
    ${examHistory.length?`<h3>Recent results</h3>${examHistory.slice(0,5).map(e=>`<div class="weak-row"><div>${new Date(e.date).toLocaleString()}<br><small>${e.correct}/${e.total} correct</small></div><strong>${Math.round(e.correct/e.total*100)}%</strong></div>`).join("")}`:""}`;
  document.getElementById("startMock")?.addEventListener("click",()=>{startExam();render();});
  document.getElementById("resumeMock")?.addEventListener("click",()=>{view={name:"quiz",mode:"exam",questionIndex:examSession.currentIndex||0};render();});
  document.getElementById("submitMock")?.addEventListener("click",finishExam);
}
function renderExamResults() {
  const app=document.getElementById("app"),e=examHistory.find(item=>item.id===examSession?.id)||examHistory[0];
  if(!e){renderExam();return;}
  app.innerHTML=`<div class="sec-head"><h2 class="serif">Mock exam results</h2><p>Completed ${new Date(e.date).toLocaleString()}</p></div>
    <div class="stat-grid"><div class="stat-box"><strong>${e.correct}/${e.total}</strong>Correct</div><div class="stat-box"><strong>${e.answered}/${e.total}</strong>Answered</div><div class="stat-box"><strong>${Math.round(e.correct/e.total*100)}%</strong>Score</div></div>
    <h3>By domain</h3>${Object.entries(e.domains).map(([id,d])=>`<div class="weak-row"><div><strong>${id.toUpperCase()}</strong><br><small>${d.correct}/${d.total} correct · ${d.answered}/${d.total} answered</small></div><span>${Math.round(d.correct/d.total*100)}%</span></div>`).join("")}
    <div class="quiz-nav"><button id="examHome">Home</button><button id="reviewExam">Review exam answers</button></div>`;
  document.getElementById("examHome").addEventListener("click",()=>{view={name:"home"};render();});
  document.getElementById("reviewExam").addEventListener("click",()=>{view={name:"quiz",mode:"exam",questionIndex:0};render();});
}

/* ============ MAIN RENDER ============ */
function render() {
  renderTopbar();
  if (view.name === "home") renderHome();
  else if (view.name === "domain") renderDomain();
  else if (view.name === "section") renderSection();
  else if (view.name === "group") renderGroup();
  else if (view.name === "quiz") renderQuiz();
  else if (view.name === "coverage") renderCoverage();
  else if (view.name === "weak") renderWeakAreas();
  else if (view.name === "bookmarks") renderBookmarks();
  else if (view.name === "progress") renderProgress();
  else if (view.name === "exam") renderExam();
  else if (view.name === "examResults") renderExamResults();
}
render();
</script>
</body>
</html>
