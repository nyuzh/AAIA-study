othing to test until a use case and candidate solutions exist."],"sourceRef":"D1 practice questions · Q20 · 1.6","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q021","sectionId":"d1-B","knowledgePointIds":["d1-B-1-2","d1-B-4-0"],"scenarioId":"d1-doc-case-5b5ed107bb","scenario":"Sterling Mutual, a mid-sized insurer, has several business units buying AI tools independently. Claims, marketing and HR all run pilots, each with a different vendor and no central oversight. The board asks the CRO, Tomas Ruiz, how to regain control without stopping innovation.","type":"application","difficulty":"moderate","stem":"Which action would be MOST effective?","options":["Ban all AI tools until every unit has been audited","Require each business unit to write its own strategy independently","Establish a documented corporate AI strategy, approved by senior management, that links initiatives to business objectives, regulatory requirements and a business case process","Wait for national AI legislation before defining the organization's approach"],"correctIndex":2,"explanation":"Fragmented, unapproved AI use is \"Shadow AI.\" A corporate strategy approved by senior management creates alignment with business goals, sets expectations for risk and compliance, and gives units a channel for requests. It should draw on national and industry expectations but must be set at the corporate level.","optionRationales":["A blanket ban stifles beneficial use and tends to drive more shadow use.","Separate strategies reproduce the fragmentation the board is worried about.","Fragmented, unapproved AI use is \"Shadow AI.\" A corporate strategy approved by senior management creates alignment with business goals, sets expectations for risk and compliance, and gives units a channel for requests. It should draw on national and industry expectations but must be set at the corporate level.","Waiting abdicates leadership. Corporate strategy should proceed alongside, and adapt to, regulation."],"sourceRef":"D1 practice questions · Q21 · 1.6","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q022","sectionId":"d1-B","knowledgePointIds":["d1-B-3-9"],"scenarioId":"d1-doc-case-b40e71ab4c","scenario":"Lakeside Credit Union is adopting a third-party AI solution for member service. Technical staff talk about model performance, while branch employees complain that outputs are hard to use. The project sponsor wants a role that bridges the two groups.","type":"application","difficulty":"basic","stem":"Which role is PRIMARILY responsible for ensuring the solution meets user needs and is usable?","options":["Product management","Data scientist","Internal audit","Chief AI officer"],"correctIndex":0,"explanation":"Product management translates between technical teams and end users and is responsible for usability and fit. Data scientists build and tune models, internal audit provides independent assurance, and the chief AI officer sets enterprise direction.","optionRationales":["Product management translates between technical teams and end users and is responsible for usability and fit. Data scientists build and tune models, internal audit provides independent assurance, and the chief AI officer sets enterprise direction.","Data scientists focus on model development and evaluation, not on translating user needs.","Internal audit is independent and should not own the usability of a solution it will later assess.","The CAIO owns enterprise AI strategy and governance, not day-to-day product usability."],"sourceRef":"D1 practice questions · Q22 · 1.7","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q023","sectionId":"d1-B","knowledgePointIds":["d1-B-3-6"],"scenarioId":"d1-doc-case-42987ea811","scenario":"Pinecrest Bank's chief AI officer asks the head of internal audit, Rachel Adams, to draft the AI acceptable use policy and select the fairness metrics for the lending model because \"audit knows the regulations best.\" The policy must be approved before the next board meeting.","type":"application","difficulty":"difficult","stem":"How should the head of internal audit BEST respond?","options":["Draft the policy and metrics, then audit them to show diligence","Assign an audit manager to select the metrics and rely on the board to approve them","Refuse any involvement, including advice, to protect independence","Decline to own the policy and metrics, offer advisory input on regulatory expectations, and keep management accountable for design and approval"],"correctIndex":3,"explanation":"Management owns AI policies and fairness metric choices, since they are operational design decisions. Internal audit may advise on requirements and good practice but should not design controls or own management responsibilities, or it impairs its independence when it later audits them. Advice with management retaining ownership is the balanced response.","optionRationales":["Auditing one's own work is a self-review threat that compromises independence.","Selecting the metrics is still performing a management role, and board approval does not repair the independence impairment.","Complete refusal is overly rigid. Audit can provide advice and insight without taking ownership.","Management owns AI policies and fairness metric choices, since they are operational design decisions. Internal audit may advise on requirements and good practice but should not design controls or own management responsibilities, or it impairs its independence when it later audits them. Advice with management retaining ownership is the balanced response."],"sourceRef":"D1 practice questions · Q23 · 1.7","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q024","sectionId":"d1-B","knowledgePointIds":["d1-B-4-1"],"scenarioId":"d1-doc-case-cf56c835fe","scenario":"A law firm partner discovers that associates have pasted client contracts into a public chatbot to speed up summaries. The managing partner, Caroline Hughes, wants to address the root cause rather than punish individuals. No AI policy exists.","type":"application","difficulty":"moderate","stem":"What should the firm do FIRST?","options":["Block every generative AI domain at the network perimeter","Issue an acceptable use policy that defines approved tools, permitted data types and consequences, and support it with training","Ask each associate to sign an attestation that they will be careful","Monitor chatbot traffic and discipline repeat offenders"],"correctIndex":1,"explanation":"The AUP is the main internal instrument giving users ethical and responsible-use guidance. Without clear rules on approved tools and data, enforcement is unfair and ineffective. A policy with training addresses the cause, and technical controls and monitoring can then enforce it.","optionRationales":["A blanket block is heavy-handed, may push use to personal devices, and does not tell users what is allowed.","The AUP is the main internal instrument giving users ethical and responsible-use guidance. Without clear rules on approved tools and data, enforcement is unfair and ineffective. A policy with training addresses the cause, and technical controls and monitoring can then enforce it.","A vague attestation without defined rules is weak and hard to enforce.","Detection and discipline without a policy has nothing to enforce."],"sourceRef":"D1 practice questions · Q24 · 1.8","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q025","sectionId":"d1-B","knowledgePointIds":["d1-B-5-0"],"scenarioId":"d1-doc-case-f19ac75634","scenario":"Redwood Insurance will automate parts of claims triage next quarter. HR leader Tasha Morgan reports that staff fear job losses and some adjusters are already bypassing the tool. The sponsor asks for the MOST important element of the training and awareness plan.","type":"application","difficulty":"moderate","stem":"Which is MOST important?","options":["A single company-wide video on what AI is","Role-based training with clear communication about how AI will change each role, what oversight staff retain, and what reskilling is available","Technical deep-dives for all staff on model architecture","Training only for the development team that built the integration"],"correctIndex":1,"explanation":"Effective AI training is tailored by role. Users need to know how to use the tool, its limits, their oversight duties and how their jobs change, and communication reduces resistance. Generic or developer-only training does not support responsible use or adoption.","optionRationales":["A generic awareness video does not equip adjusters for their specific responsibilities.","Effective AI training is tailored by role. Users need to know how to use the tool, its limits, their oversight duties and how their jobs change, and communication reduces resistance. Generic or developer-only training does not support responsible use or adoption.","Most staff do not need architecture-level knowledge. This is not what drives responsible use.","Users and reviewers are the ones making decisions with AI outputs and must be trained."],"sourceRef":"D1 practice questions · Q25 · 1.9","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q026","sectionId":"d1-B","knowledgePointIds":["d1-B-7-0","d1-B-7-1"],"scenarioId":"d1-doc-case-786ea2b6a0","scenario":"The AI program dashboard presented to the board by CAIO Nikhil Rao shows the number of AI use cases deployed, adoption rate and projected cost savings. A director, Susan Kerr, says the board cannot tell whether the program is operating within its risk appetite.","type":"application","difficulty":"difficult","stem":"What would BEST improve the dashboard?","options":["Add more detail on adoption by department","Provide the model accuracy score for each system as the only additional metric","Replace cost-savings data with a list of vendor certifications","Add key risk indicators, such as bias incidents, drift alerts and override rates, with thresholds linked to risk appetite and escalation triggers"],"correctIndex":3,"explanation":"The dashboard measures performance and value (KPIs) but not exposure. KRIs with defined thresholds tied to risk appetite give early warning and tell leaders when to act. A balanced program scorecard needs both.","optionRationales":["Additional adoption data is another performance measure and does not show risk.","Accuracy alone does not cover fairness, drift, security or compliance exposure.","Dropping benefits data removes the business-alignment view, and certifications are not outcome metrics.","The dashboard measures performance and value (KPIs) but not exposure. KRIs with defined thresholds tied to risk appetite give early warning and tell leaders when to act. A balanced program scorecard needs both."],"sourceRef":"D1 practice questions · Q26 · 1.10","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q027","sectionId":"d1-B","knowledgePointIds":["d1-B-2-2"],"scenarioId":"d1-doc-case-53d3ac63a2","scenario":"Granite Bank's lending model was optimized to maximize approval volume, which met its target and pleased the business. A compliance review then finds approval rates for some protected groups are materially lower. The model performs exactly as specified. The CEO asks the chief risk officer, Anita Desai, what governance step would have prevented this.","type":"application","difficulty":"expert","stem":"Which step would have been MOST effective?","options":["Define objectives and constraints at the plan-and-design stage in line with ethical principles and legal requirements, with steering committee review of how the model's objective is set","Increase the volume of training data to improve accuracy","Add more frequent model retraining after launch","Transfer the model to an external vendor for operation"],"correctIndex":0,"explanation":"This is an AI alignment problem: the system's objective and behaviour were not aligned with human values, ethical principles and legal requirements. Alignment must be built in at design with governance oversight of objectives and constraints, rather than corrected after the fact. More data or retraining optimizes the same flawed objective.","optionRationales":["This is an AI alignment problem: the system's objective and behaviour were not aligned with human values, ethical principles and legal requirements. Alignment must be built in at design with governance oversight of objectives and constraints, rather than corrected after the fact. More data or retraining optimizes the same flawed objective.","More data does not change what the model is rewarded for.","Retraining on the same objective can reproduce or amplify the problem.","Outsourcing operations does not transfer accountability and does not fix the objective."],"sourceRef":"D1 practice questions · Q27 · 1.6","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q028","sectionId":"d1-B","knowledgePointIds":["d1-B-3-2"],"scenarioId":"d1-doc-case-76bd33e8ec","scenario":"Vantage Telecom's board wants an AI governance committee. The CTO suggests staffing it with senior engineers only, to make decisions fast. The chief privacy officer, Joanna Reeves, disagrees.","type":"application","difficulty":"difficult","stem":"Which composition BEST supports effective AI governance?","options":["Senior engineers only, since AI decisions are technical","The legal department only, since regulation is the main driver","A cross-functional committee with an executive sponsor, including legal, privacy, risk, security, HR, ethics and business owners, with internal audit providing independent assurance outside decision-making","Business unit heads only, since they own the benefits"],"correctIndex":2,"explanation":"AI risk spans legal, privacy, ethics, security, workforce and business impact, so governance needs diverse perspectives and executive accountability. Internal audit gives independent assurance and should not be a decision-maker. Narrow committees create blind spots.","optionRationales":["Engineering-only governance overlooks legal, ethical and business risks.","Legal-only governance misses technical, operational and business realities.","AI risk spans legal, privacy, ethics, security, workforce and business impact, so governance needs diverse perspectives and executive accountability. Internal audit gives independent assurance and should not be a decision-maker. Narrow committees create blind spots.","Business heads alone have a conflict between pursuing benefits and constraining risk."],"sourceRef":"D1 practice questions · Q28 · 1.7","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q029","sectionId":"d1-B","knowledgePointIds":["d1-A-7-0","d1-B-2-3"],"scenarioId":"d1-doc-case-ccf6574b5b","scenario":"Pioneer Energy's CEO has asked for a generative AI program \"because every competitor has one.\" The CFO has asked the CRO, Ben Ortiz, for a recommendation before funding is released.","type":"application","difficulty":"moderate","stem":"What is the BEST approach?","options":["Fund a broad pilot immediately to avoid falling behind","Reject all generative AI proposals until the technology matures","Require a business case with expected benefits, costs and risk assessment tied to strategic objectives before approving investment","Let each department decide whether to adopt based on its own budget"],"correctIndex":2,"explanation":"Competitive pressure and hype are not a business case. A documented case linking AI to strategy, with benefits, costs and risk, supports sound investment and governance. It avoids both reckless adoption and blanket rejection.","optionRationales":["Funding without a case invites poorly aligned spending and unmanaged risk.","Rejecting by default ignores potential value and is not risk-based.","Competitive pressure and hype are not a business case. A documented case linking AI to strategy, with benefits, costs and risk, supports sound investment and governance. It avoids both reckless adoption and blanket rejection.","Decentralized decisions bring back inconsistent governance and shadow AI."],"sourceRef":"D1 practice questions · Q29 · 1.5","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q030","sectionId":"d1-B","knowledgePointIds":["d1-B-3-0"],"scenarioId":"d1-doc-case-743366def1","scenario":"Fenwick Insurance's claims-triage model produces inconsistent outcomes. The data science lead says IT owns the model because it runs on IT infrastructure. IT says the claims business owns it because it uses the output. The business says data science built it and should answer for results. Nobody is named as accountable in the AI inventory. The CAIO, Lorraine Webb, asks for the BEST remedy.","type":"application","difficulty":"difficult","stem":"What is the BEST remedy?","options":["Assign a named accountable executive owner for each AI system, normally the business owner who benefits from and answers for outcomes, documented in the inventory and a RACI, with supporting responsibilities defined for data science and IT","Make data science solely accountable because it built the model","Leave accountability undefined to encourage collaboration","Make internal audit accountable for outcomes, since it reviews the system"],"correctIndex":0,"explanation":"Clear, documented accountability for each AI system is a basic governance requirement. The business owner who decides to use the AI and answers for its results is usually accountable, while data science, IT, privacy and risk have defined supporting roles. A RACI and registry entry make this visible and auditable. Internal audit must remain independent of operational ownership.","optionRationales":["Clear, documented accountability for each AI system is a basic governance requirement. The business owner who decides to use the AI and answers for its results is usually accountable, while data science, IT, privacy and risk have defined supporting roles. A RACI and registry entry make this visible and auditable. Internal audit must remain independent of operational ownership.","Builders are responsible for development, but outcomes in use are a business accountability.","Undefined accountability is the problem described, and it leaves no one to act or answer.","Audit cannot own what it must independently assess."],"sourceRef":"D1 practice questions · Q30 · 1.7","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q031","sectionId":"d1-C","knowledgePointIds":["d1-C-7-0","d1-C-7-1"],"scenarioId":"d1-doc-case-a67dcd90fb","scenario":"The board of Summit Bank states that it has a low appetite for customer harm from automated decisions. The operations team then sets a rule that the customer-service chatbot's misunderstanding rate must stay below 1%, with escalation to the risk committee if exceeded. Risk manager Alan Pierce is documenting these statements in the AI risk framework.","type":"application","difficulty":"basic","stem":"The 1% misunderstanding-rate limit is BEST described as:","options":["A key performance indicator with no link to risk","Risk appetite, the overall amount of risk the board is willing to pursue","Inherent risk before controls are applied","Risk tolerance, the acceptable variation around a defined objective"],"correctIndex":3,"explanation":"Risk appetite is the broad, board-level statement of the type and amount of risk the organization will accept. Risk tolerance translates it into measurable limits for specific activities, such as a maximum error rate. Tolerance thresholds also serve as KRI triggers.","optionRationales":["The limit is a risk threshold with escalation tied to the risk committee, so it is linked to risk.","The board's \"low appetite for customer harm\" statement is the appetite. The 1% limit is a measurable boundary.","Inherent risk is exposure without controls, which this is not.","Risk appetite is the broad, board-level statement of the type and amount of risk the organization will accept. Risk tolerance translates it into measurable limits for specific activities, such as a maximum error rate. Tolerance thresholds also serve as KRI triggers."],"sourceRef":"D1 practice questions · Q31 · 1.12.2","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q032","sectionId":"d1-C","knowledgePointIds":["d1-C-6-0"],"scenarioId":"d1-doc-case-f2d2d7017e","scenario":"Orchard Foods' AI team keeps a separate spreadsheet of AI risks that nobody outside the team reviews. The enterprise risk function has its own register, methodology and reporting to the board. The new CRO, Fatima Ali, wants AI risk to be managed properly.","type":"application","difficulty":"moderate","stem":"Which approach is BEST?","options":["Maintain the separate AI risk spreadsheet to preserve technical detail","Integrate AI-related risks into the existing enterprise risk management framework, using common scales, ownership and reporting, with AI-specific risk categories added","Rely on the AI team's judgment and report only incidents","Postpone integration until the organization has more AI systems"],"correctIndex":1,"explanation":"AI risk should be identified, assessed and reported within enterprise risk management so that leaders see it alongside other risks and can compare and prioritize. AI needs additional risk categories (bias, explainability, drift), but not a parallel process.","optionRationales":["A parallel register is invisible to governance and cannot be compared with other risks.","AI risk should be identified, assessed and reported within enterprise risk management so that leaders see it alongside other risks and can compare and prioritize. AI needs additional risk categories (bias, explainability, drift), but not a parallel process.","Incident-only reporting is reactive and cannot show risk exposure.","Integration should occur as AI is adopted, not after risk has accumulated."],"sourceRef":"D1 practice questions · Q32 · 1.11","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q033","sectionId":"d1-C","knowledgePointIds":["d1-C-1-0"],"scenarioId":"d1-doc-case-5b767c6702","scenario":"Tidewater Shipping has been using AI informally for months. The chief risk officer, Gregor Novak, wants to begin AI risk identification but has no overview of what is in use.","type":"application","difficulty":"moderate","stem":"What should be done FIRST?","options":["Select a quantitative risk model","Identify and inventory AI systems, use cases, data and owners, so risks can be identified in context","Purchase an AI monitoring platform","Rate the residual risk of each vendor"],"correctIndex":1,"explanation":"Risk identification depends on understanding what AI exists, what it is used for, what data it uses and who owns it. Without an inventory, assessments are incomplete and Shadow AI goes unseen. Models, tooling and residual ratings come afterwards.","optionRationales":["A model cannot be chosen sensibly without knowing the risk landscape.","Risk identification depends on understanding what AI exists, what it is used for, what data it uses and who owns it. Without an inventory, assessments are incomplete and Shadow AI goes unseen. Models, tooling and residual ratings come afterwards.","Tools should follow from known needs and inventory.","Residual risk is calculated after inherent risk and controls are known for identified systems."],"sourceRef":"D1 practice questions · Q33 · 1.11","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q034","sectionId":"d1-C","knowledgePointIds":["d1-C-8-3","d1-C-7-0"],"scenarioId":"d1-doc-case-c4106c4d48","scenario":"Cobalt Insurance's claims team wants to pilot an AI fraud-flagging model projected to save $4 million. The risk assessment shows a residual risk of discriminatory outcomes that exceeds the board's stated appetite. The project sponsor, Lisa Chen, proposes that she formally accept the risk at project level because the benefits are clear.","type":"application","difficulty":"difficult","stem":"What is the BEST course of action?","options":["Transfer the risk to the model vendor through a contract clause","Accept the risk at project level since the financial benefit exceeds expected loss","Proceed with the pilot but reduce the sample size to limit exposure","Escalate to the risk committee or board for decision, and pursue additional mitigation or defer the pilot until residual risk is within appetite"],"correctIndex":3,"explanation":"Risk that exceeds the board's appetite cannot be accepted by a project sponsor. It requires escalation to the level that set the appetite, along with more mitigation or avoidance. Benefit does not override a breach of appetite, especially for discrimination, which also has legal exposure.","optionRationales":["Accountability for outcomes cannot be fully transferred to a vendor, and contractual transfer does not bring risk within appetite.","Financial benefit does not justify exceeding appetite, and the sponsor lacks the authority.","A smaller pilot still exposes real customers to discriminatory outcomes.","Risk that exceeds the board's appetite cannot be accepted by a project sponsor. It requires escalation to the level that set the appetite, along with more mitigation or avoidance. Benefit does not override a breach of appetite, especially for discrimination, which also has legal exposure."],"sourceRef":"D1 practice questions · Q34 · 1.12","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q035","sectionId":"d1-C","knowledgePointIds":["d1-C-11-1"],"scenarioId":"d1-doc-case-6aba992416","scenario":"Bluestone Bank runs a credit-scoring model. The AI risk manager, Omar Haddad, wants an early-warning indicator that the model's behaviour is deteriorating before customers are harmed.","type":"application","difficulty":"moderate","stem":"Which is the MOST effective KRI?","options":["A trend in prediction performance and input-data distribution against defined thresholds, with escalation when thresholds are breached","Total spend on model development","Hours of AI training delivered to staff","The number of AI models in the inventory"],"correctIndex":0,"explanation":"KRIs are forward-looking metrics with thresholds that signal increasing risk. Performance deviation and data/concept drift against thresholds warn that a deployed model is degrading. Inventory counts, spend and training hours are activity or cost measures and do not signal model deterioration.","optionRationales":["KRIs are forward-looking metrics with thresholds that signal increasing risk. Performance deviation and data/concept drift against thresholds warn that a deployed model is degrading. Inventory counts, spend and training hours are activity or cost measures and do not signal model deterioration.","Spend measures investment, not risk exposure.","Training hours measure activity. They do not show model behaviour.","Inventory size is a volume measure, not a risk signal."],"sourceRef":"D1 practice questions · Q35 · 1.13","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q036","sectionId":"d1-C","knowledgePointIds":["d1-C-9-3"],"scenarioId":"d1-doc-case-ea315c52bd","scenario":"Helix Pharma reviews AI risks once a year in its annual risk cycle. Its clinical-trial matching model is retrained quarterly on new data and its vendor updates the underlying foundation model without notice. Internal auditor Greta Lindqvist reviews the arrangement.","type":"application","difficulty":"difficult","stem":"What is the GREATEST concern?","options":["The retraining frequency is too high for regulators","The annual review should be more detailed","Periodic annual assessment cannot keep pace with risk changes caused by drift, retraining and vendor model updates; monitoring and event-triggered reassessment are needed","The model should be frozen permanently after validation"],"correctIndex":2,"explanation":"AI risk is dynamic because data, models and vendor components change. Governance should include continuous monitoring with thresholds and reassessment triggered by material changes such as retraining or vendor updates. A more detailed annual review is still a point-in-time view, and freezing the model removes the benefit and may degrade it.","optionRationales":["Retraining is not inherently non-compliant, and the issue is the lack of control and reassessment around it.","Greater detail does not fix the timing problem.","AI risk is dynamic because data, models and vendor components change. Governance should include continuous monitoring with thresholds and reassessment triggered by material changes such as retraining or vendor updates. A more detailed annual review is still a point-in-time view, and freezing the model removes the benefit and may degrade it.","Permanent freezing is impractical and still leaves drift in the real-world data."],"sourceRef":"D1 practice questions · Q36 · 1.13","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q037","sectionId":"d1-C","knowledgePointIds":["d1-C-6-0"],"scenarioId":"d1-doc-case-a639bc0272","scenario":"Evergreen Retail will deploy a new generative AI tool to screen internal job applications. There is no history of incidents for this type of tool at the company, and the potential impact on employees and legal exposure is high. The risk manager, Diego Alvarez, is asked for a defensible assessment before the steering committee meets.","type":"application","difficulty":"expert","stem":"Which approach is BEST?","options":["Defer the assessment until enough internal incident data exists for statistical precision","Assign a precise numerical probability using vendor marketing claims","Use scenario-based, qualitative assessment with expert input and external incident evidence, set conservative controls, then refine ratings as monitoring data accrues","Rate the risk low because no incidents have occurred at the company"],"correctIndex":2,"explanation":"Where historical data is lacking, scenario analysis, expert judgment and external evidence are accepted ways to assess risk. Because impact is high, conservative controls apply, with ratings updated as real monitoring data arrives. Waiting leaves the risk unmanaged, vendor claims are not independent evidence, and absence of incidents is not evidence of low risk when no data exists.","optionRationales":["Waiting for internal incidents means deploying (or delaying) without any assessment.","False precision from vendor claims is misleading and not independent.","Where historical data is lacking, scenario analysis, expert judgment and external evidence are accepted ways to assess risk. Because impact is high, conservative controls apply, with ratings updated as real monitoring data arrives. Waiting leaves the risk unmanaged, vendor claims are not independent evidence, and absence of incidents is not evidence of low risk when no data exists.","Lack of past incidents reflects no history, not low likelihood or impact."],"sourceRef":"D1 practice questions · Q37 · 1.12.1","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q038","sectionId":"d1-C","knowledgePointIds":["d1-C-5-3"],"scenarioId":"d1-doc-case-1a9b25fe5c","scenario":"Atlas Retail is buying an AI screening tool from a vendor that uses subprocessors and will update its models periodically. The draft contract has no audit rights and no commitment to disclose what data is used to train the models. Procurement lead Naomi Clarke asks the privacy officer which provision is MOST important to add.","type":"application","difficulty":"moderate","stem":"Which provision should be added?","options":["Rights to audit and obtain assurance on data use, model testing and subprocessors, with notification of material model changes","A clause limiting the vendor's total liability to the annual fee","A requirement that the vendor use the latest model version","A right for the vendor to publish the customer name as a reference"],"correctIndex":0,"explanation":"Third-party AI introduces risks that the customer cannot control directly, such as hidden training data, subprocessors and model changes. Audit and assurance rights, transparency on data use, and change notification let the customer meet its own accountability and regulatory obligations. Liability caps, version commitments and reference rights do not provide oversight.","optionRationales":["Third-party AI introduces risks that the customer cannot control directly, such as hidden training data, subprocessors and model changes. Audit and assurance rights, transparency on data use, and change notification let the customer meet its own accountability and regulatory obligations. Liability caps, version commitments and reference rights do not provide oversight.","A liability cap limits recovery and would favour the vendor, and does not help oversight.","Always using the newest version can increase change risk without oversight.","Reference rights benefit the vendor and add no assurance."],"sourceRef":"D1 practice questions · Q38 · 1.11","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q039","sectionId":"d1-C","knowledgePointIds":["d1-C-5-3"],"scenarioId":"d1-doc-case-38455b0062","scenario":"Sable Bank uses a vendor's AI tool to screen mortgage applications. A regulator inquiry reveals that outcomes differ significantly across demographic groups. The vendor says its model is proprietary and refuses to share testing details. The head of compliance, Victor Lang, asks what the bank should do.","type":"application","difficulty":"difficult","stem":"What is the BEST response?","options":["Rely on the vendor's statement that the model is compliant","Argue to the regulator that accountability lies with the vendor","Continue operating unchanged while waiting for the regulator's findings","Recognize that the bank remains accountable for outcomes, invoke contractual testing and audit rights, and suspend or add human review of affected decisions while evidence is obtained"],"correctIndex":3,"explanation":"Using a third-party AI does not outsource accountability for outcomes, especially in regulated decisions. The bank must obtain evidence through contractual rights, protect customers in the meantime through human review or suspension, and be ready to demonstrate oversight.","optionRationales":["A bare vendor assurance is not evidence and does not satisfy oversight.","Regulators hold the regulated entity accountable. This argument would not hold and would damage credibility.","Continuing as-is risks ongoing harm and aggravates regulatory exposure.","Using a third-party AI does not outsource accountability for outcomes, especially in regulated decisions. The bank must obtain evidence through contractual rights, protect customers in the meantime through human review or suspension, and be ready to demonstrate oversight."],"sourceRef":"D1 practice questions · Q39 · 1.11","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q040","sectionId":"d1-C","knowledgePointIds":["d1-C-7-1"],"scenarioId":"d1-doc-case-d53a7a4c7a","scenario":"The board of Halcyon Bank states a low appetite for AI-driven customer harm. Its AI dashboard shows every KRI as green. An internal audit finds that the thresholds were set by the same team that built and operates the models, they are much looser than similar organizations' thresholds, and they were never approved by the risk committee. Auditor Maria Santos must rate the finding.","type":"application","difficulty":"expert","stem":"What is the GREATEST concern?","options":["The dashboard uses too many colors","Tolerance thresholds are not independently set or approved in line with board appetite, so green KRIs give false assurance","The KRIs are reported too frequently","The models are too accurate for the thresholds"],"correctIndex":1,"explanation":"KRIs provide assurance only if their thresholds reflect the board's appetite and are set and challenged independently of the people being measured. Self-set, loose thresholds can keep indicators green while real exposure exceeds appetite. The remedy is risk committee approval, benchmarking and independent review.","optionRationales":["Presentation style is not the issue.","KRIs provide assurance only if their thresholds reflect the board's appetite and are set and challenged independently of the people being measured. Self-set, loose thresholds can keep indicators green while real exposure exceeds appetite. The remedy is risk committee approval, benchmarking and independent review.","More frequent reporting is generally helpful and does not create false assurance.","High accuracy would not make thresholds inappropriate. The problem is who set them and how."],"sourceRef":"D1 practice questions · Q40 · 1.13","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q041","sectionId":"d1-D","knowledgePointIds":["d1-D-0-4"],"scenarioId":"d1-doc-case-92d608a894","scenario":"Fulton Group's HR staff have uploaded employee performance files into a public generative AI tool to draft review summaries. The CISO, Imani Joseph, wants a foundational control to prevent similar events.","type":"application","difficulty":"basic","stem":"Which control is the MOST fundamental?","options":["A requirement that all AI outputs are labelled as AI-generated","A data classification scheme that defines which classes of data may be used with which AI tools","An increase in the AI team's budget","A quarterly survey about staff attitudes to AI"],"correctIndex":1,"explanation":"Classification determines how data may be handled, including what may be entered into external or internal AI tools. Without it, users cannot tell what is permitted. Labelling outputs, budget and surveys do not control what data enters AI tools.","optionRationales":["Output labelling aids transparency, but it does not stop sensitive input being shared.","Classification determines how data may be handled, including what may be entered into external or internal AI tools. Without it, users cannot tell what is permitted. Labelling outputs, budget and surveys do not control what data enters AI tools.","Budget does not control data handling.","Surveys measure attitudes, not controls."],"sourceRef":"D1 practice questions · Q41 · 1.14","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q042","sectionId":"d1-D","knowledgePointIds":["d1-D-7-1","d1-D-3-0"],"scenarioId":"d1-doc-case-882b418646","scenario":"Zenith Auto wants to train a driver-behaviour model using telematics data collected through a reseller partner. The contract with the reseller does not clearly say who owns the data or whether it may be used for model training. The data governance lead, Paula Mendez, is asked what to do before the project proceeds.","type":"application","difficulty":"moderate","stem":"What should be done FIRST?","options":["Start with a small sample to test the model, then seek rights later","Assume ownership because the organization pays for the data","Ask the data scientists to anonymize the data and proceed","Determine data ownership and usage rights through legal and contract review before the data is used for training"],"correctIndex":3,"explanation":"Rights to use data are a prerequisite, and ownership and permitted use should be clear before training. Training first and clarifying later creates legal exposure (the model may be tainted), and payment does not necessarily confer ownership or training rights. Anonymization may not remove contractual or legal restrictions.","optionRationales":["Using data first can create unlawful use and an unusable model if rights are later denied.","Payment for access is not the same as ownership or permission to train.","Anonymization is a technical step that does not resolve contractual ownership or purpose restrictions.","Rights to use data are a prerequisite, and ownership and permitted use should be clear before training. Training first and clarifying later creates legal exposure (the model may be tainted), and payment does not necessarily confer ownership or training rights. Anonymization may not remove contractual or legal restrictions."],"sourceRef":"D1 practice questions · Q42 · 1.14","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q043","sectionId":"d1-D","knowledgePointIds":["d1-D-1-2"],"scenarioId":"d1-doc-case-ea6f5a5691","scenario":"Lumen Telecom collected customer usage data to deliver and bill its services. The marketing director, Eric Walsh, now wants to use the same data to train a personalized-offers model. The privacy officer, Hana Sato, reviews the privacy notice and consent records.","type":"application","difficulty":"difficult","stem":"What is the GREATEST concern?","options":["The original consent and notice did not cover the new purpose, so there may be no valid legal basis for the training use","The model may not be accurate enough","The data warehouse lacks sufficient storage","The marketing team lacks training on the tool"],"correctIndex":0,"explanation":"Personal data must be used for the purposes disclosed when it was collected, unless a new legal basis or fresh consent applies. Repurposing it for AI training without that basis creates privacy and regulatory risk. Accuracy, storage and training are operational matters.","optionRationales":["Personal data must be used for the purposes disclosed when it was collected, unless a new legal basis or fresh consent applies. Repurposing it for AI training without that basis creates privacy and regulatory risk. Accuracy, storage and training are operational matters.","Accuracy matters for performance, but it is not a legal compliance risk.","Storage is an infrastructure issue.","Training is a capability issue and does not make the use lawful."],"sourceRef":"D1 practice questions · Q43 · 1.15","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q044","sectionId":"d1-D","knowledgePointIds":["d1-D-3-0","d1-D-1-0"],"scenarioId":"d1-doc-case-0d6ff00f11","scenario":"Quill Media's data science team has found a large image dataset online, licensed \"for non-commercial research only,\" and has used it to train a model embedded in a commercial product. The general counsel, Rebecca Stone, learns of this at a pre-launch review.","type":"application","difficulty":"difficult","stem":"What is the BEST course of action?","options":["Launch as planned, since the images are publicly available online","Launch after removing the dataset name from the documentation","Pause the launch, assess licence and IP exposure, and either obtain a commercial licence or replace the data and retrain, while documenting provenance going forward","Continue with the model and rely on the product's terms of service to disclaim liability"],"correctIndex":2,"explanation":"Public availability is not permission, and a non-commercial licence prohibits commercial use. Using it exposes the organization to IP infringement and a potentially unusable model. The right response is to stop, assess, secure rights or replace the data, and put provenance records and licence checks in place.","optionRationales":["Publicly accessible does not mean free to use commercially.","Hiding the source does not remove the infringement and is deceptive.","Public availability is not permission, and a non-commercial licence prohibits commercial use. Using it exposes the organization to IP infringement and a potentially unusable model. The right response is to stop, assess, secure rights or replace the data, and put provenance records and licence checks in place.","Disclaimers in terms of service do not protect against the dataset owner's rights."],"sourceRef":"D1 practice questions · Q44 · 1.14","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q045","sectionId":"d1-D","knowledgePointIds":["d1-D-1-1"],"scenarioId":"d1-doc-case-ed7919e63f","scenario":"Corvid Bank plans an AI customer-profiling system for EU customers. The privacy officer, Annika Berg, requires a data protection impact assessment (DPIA) before approval. A project manager asks why it is needed when security testing is planned.","type":"application","difficulty":"moderate","stem":"What is the PRIMARY objective of the DPIA?","options":["To verify that the servers hosting the system are patched","To estimate the financial return on the project","To identify and mitigate risks to individuals' privacy and rights from the processing before it begins","To select the most accurate algorithm"],"correctIndex":2,"explanation":"A DPIA assesses the necessity, proportionality and risks of processing personal data for the individuals affected, and identifies safeguards before processing starts. It is a privacy and compliance tool and is not a security test, a financial analysis or a technical selection exercise.","optionRationales":["Patching is a security control, and a DPIA focuses on risk to individuals.","ROI is a business case matter.","A DPIA assesses the necessity, proportionality and risks of processing personal data for the individuals affected, and identifies safeguards before processing starts. It is a privacy and compliance tool and is not a security test, a financial analysis or a technical selection exercise.","Algorithm selection is a technical design decision."],"sourceRef":"D1 practice questions · Q45 · 1.15","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q046","sectionId":"d1-D","knowledgePointIds":["d1-D-1-1","d1-D-1-0"],"scenarioId":"d1-doc-case-d204ce852b","scenario":"Meridian Health deployed a model trained on patient interactions. A former patient withdraws consent and requests deletion of her data. The DPO, Dr. Samir Patel, learns that nobody can say whether her records were in the training set, and retraining the model is costly. The board wants to know what governance should have been in place.","type":"application","difficulty":"expert","stem":"Which capability would have BEST enabled a defensible response?","options":["Data provenance and lineage records, retention rules and a defined process for data subject requests that assesses impact on trained models, including retraining or removal","A policy stating that deletion requests apply only to source databases","A model card describing accuracy","Encryption of the training data at rest"],"correctIndex":0,"explanation":"Honouring withdrawal and deletion rights in AI requires knowing which data went into which model (provenance), applying retention rules, and having a process to evaluate and act on trained models. Limiting rights to source systems may be non-compliant, and encryption and model cards do not establish traceability or enable action.","optionRationales":["Honouring withdrawal and deletion rights in AI requires knowing which data went into which model (provenance), applying retention rules, and having a process to evaluate and act on trained models. Limiting rights to source systems may be non-compliant, and encryption and model cards do not establish traceability or enable action.","Excluding trained models from rights is likely to be non-compliant and not defensible.","A model card documents performance but not whether individual data was used.","Encryption protects confidentiality but does not support locating or removing individual data."],"sourceRef":"D1 practice questions · Q46 · 1.15","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q047","sectionId":"d1-D","knowledgePointIds":["d1-D-2-0"],"scenarioId":"d1-doc-case-b4e69d5cfc","scenario":"Data scientists at Pinnacle Insurance propose collecting every available customer attribute, including health and location data, \"in case it improves the model.\" The chief data officer, Wei Zhang, must respond.","type":"application","difficulty":"moderate","stem":"Which principle should guide the response?","options":["Collect all data but encrypt it, which resolves privacy concerns","Maximum collection, since more data always improves model accuracy","Collect all data first and review lawfulness after training","Data minimization: collect and use only the data necessary and justified for the defined purpose"],"correctIndex":3,"explanation":"Data minimization limits collection to what is needed for the stated purpose, which reduces privacy, security, bias and compliance risk. More data is not always better, and unneeded sensitive data can introduce risk. Encryption protects data but does not justify unnecessary collection.","optionRationales":["Encryption is a safeguard, and it does not remove the requirement to limit collection.","More data can add noise, bias and legal exposure, and does not always improve accuracy.","Reviewing lawfulness after training puts unlawful data into the model.","Data minimization limits collection to what is needed for the stated purpose, which reduces privacy, security, bias and compliance risk. More data is not always better, and unneeded sensitive data can introduce risk. Encryption protects data but does not justify unnecessary collection."],"sourceRef":"D1 practice questions · Q47 · 1.14","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q048","sectionId":"d1-D","knowledgePointIds":["d1-D-2-0","d1-D-1-1"],"scenarioId":"d1-doc-case-6a72386832","scenario":"Quarry Bank is retiring an AI collections model that has been replaced. The IT team plans to switch it off and delete the model files. The privacy officer, Laura Kim, points out that training data, prompts, logs and model outputs are held in several systems.","type":"application","difficulty":"difficult","stem":"What should the decommissioning plan BEST include?","options":["Immediate deletion of all associated data to minimize storage costs","A documented plan covering data migration or deletion, review of legal retention obligations, continuity of operations and verification that no lingering data remains","Deletion of only the model files, since data belongs to other systems","Indefinite retention of everything in case it is needed"],"correctIndex":1,"explanation":"Retirement is a phase with its own risks: data migration or deletion errors, lingering data and loss of continuity. A plan should reconcile privacy-driven deletion with legal retention duties, manage the transition, and verify the outcome. Deleting everything may breach retention duties, and keeping everything breaches minimization and increases exposure.","optionRationales":["Immediate wholesale deletion could violate legal retention or audit obligations.","Retirement is a phase with its own risks: data migration or deletion errors, lingering data and loss of continuity. A plan should reconcile privacy-driven deletion with legal retention duties, manage the transition, and verify the outcome. Deleting everything may breach retention duties, and keeping everything breaches minimization and increases exposure.","Leaving training data, logs and outputs behind creates compliance and exposure risk.","Indefinite retention conflicts with minimization and storage limitation."],"sourceRef":"D1 practice questions · Q48 · 1.4","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q049","sectionId":"d1-D","knowledgePointIds":["d1-D-8-0","d1-D-8-1"],"scenarioId":"d1-doc-case-2b8ffe0eaa","scenario":"Polaris Global operates AI-enabled customer services in California, the EU and China. The legal team, led by Ian Foster, reports that obligations under CPRA, GDPR and PIPL differ. The AI governance lead asks how to approach privacy governance.","type":"application","difficulty":"moderate","stem":"Which approach is BEST?","options":["Follow only the home-country law for all operations","Map applicable requirements by jurisdiction and design a common governance baseline, adding local controls where laws are stricter","Wait for enforcement actions before aligning processes","Operate separate unrelated programs without central coordination"],"correctIndex":1,"explanation":"Organizations operating across regions must comply with each applicable law. A common baseline with local additions is efficient, consistent and auditable. Ignoring other laws or waiting for enforcement creates legal exposure, and uncoordinated programs lead to gaps and duplication.","optionRationales":["Laws often apply based on where data subjects are, not where the organization is based.","Organizations operating across regions must comply with each applicable law. A common baseline with local additions is efficient, consistent and auditable. Ignoring other laws or waiting for enforcement creates legal exposure, and uncoordinated programs lead to gaps and duplication.","Reactive compliance exposes the organization to penalties and reputational harm.","Uncoordinated programs create inconsistent controls and make governance hard to evidence."],"sourceRef":"D1 practice questions · Q49 · 1.15","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q050","sectionId":"d1-D","knowledgePointIds":["d1-D-1-0","d1-D-4-3"],"scenarioId":"d1-doc-case-ade52886f7","scenario":"Cedar Health's data team merges patient datasets from five sources, removing duplicates and filling missing values before model training. The cleansing scripts are not documented, and nobody can say which records were changed. The chief data officer, Ravi Menon, asks the data governance lead what to require.","type":"application","difficulty":"moderate","stem":"Which requirement is BEST?","options":["Allow cleansing to be done ad hoc, as long as the final dataset looks clean","Delete the original source data once cleansing is complete","Skip cleansing, since models can handle any data quality","Perform cleansing under documented, logged and approved procedures that preserve data provenance, so changes can be traced and audited"],"correctIndex":3,"explanation":"Data collection and processing should include cleansing and quality checks, and documented provenance. Undocumented transformations make it impossible to trace errors, bias or consent issues, and they limit auditability. Deleting sources removes the audit trail, and skipping cleansing degrades model quality.","optionRationales":["Ad hoc changes without a record cannot be audited or reproduced.","Deleting originals destroys lineage evidence and may breach retention rules.","Poor-quality data produces unreliable and potentially biased outputs.","Data collection and processing should include cleansing and quality checks, and documented provenance. Undocumented transformations make it impossible to trace errors, bias or consent issues, and they limit auditability. Deleting sources removes the audit trail, and skipping cleansing degrades model quality."],"sourceRef":"D1 practice questions · Q50 · 1.14.5","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q051","sectionId":"d1-E","knowledgePointIds":["d1-E-0-2"],"scenarioId":"d1-doc-case-cbbbb68f3e","scenario":"The board of Aurora Utilities wants an internationally recognized, certifiable standard for establishing and continually improving its AI management system and demonstrating accountability to regulators. The chief compliance officer, Beth Collins, is asked which standard to adopt.","type":"application","difficulty":"basic","stem":"Which standard BEST meets this objective?","options":["ISO/IEC 42001, an AI management system standard","IEEE 7000, a model process for addressing ethical concerns during system design","OECD AI Principles, high-level recommendations adopted by member countries","ISO/IEC 23053, a framework for AI systems using machine learning"],"correctIndex":0,"explanation":"ISO/IEC 42001 specifies requirements for establishing, implementing, maintaining and continually improving an AI management system, and organizations can be certified against it. IEEE 7000 addresses ethics during design, the OECD principles are non-binding recommendations, and ISO/IEC 23053 describes a generic ML system framework.","optionRationales":["ISO/IEC 42001 specifies requirements for establishing, implementing, maintaining and continually improving an AI management system, and organizations can be certified against it. IEEE 7000 addresses ethics during design, the OECD principles are non-binding recommendations, and ISO/IEC 23053 describes a generic ML system framework.","IEEE 7000 focuses on embedding ethical concerns in system design, not on an organization-wide management system.","The OECD principles are guidance and not a certifiable management standard.","ISO/IEC 23053 describes a reference framework for ML systems, not a management system."],"sourceRef":"D1 practice questions · Q51 · 1.16.3","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q052","sectionId":"d1-E","knowledgePointIds":["d1-E-0-1"],"scenarioId":"d1-doc-case-849fcb31fc","scenario":"Granville Health wants a voluntary, structured framework to identify, assess and manage AI risks across its programs, organized by functions its risk team can assign to owners. The CRO, Tamara Wells, is selecting a reference.","type":"application","difficulty":"moderate","stem":"Which framework is MOST appropriate?","options":["The OECD AI life cycle diagram alone","The California Privacy Rights Act","The NIST AI Risk Management Framework","The Singapore data protection statute"],"correctIndex":2,"explanation":"The NIST AI RMF is a voluntary framework from the US National Institute of Standards and Technology to help organizations identify, assess and mitigate AI risk, organized around governing, mapping, measuring and managing. CPRA is a privacy law, and a country's data protection statute is not an AI risk framework. The OECD life cycle is useful context but is not a risk management framework.","optionRationales":["The OECD life cycle describes phases, but it is not a risk management framework by itself.","CPRA is a privacy regulation, not an AI risk framework.","The NIST AI RMF is a voluntary framework from the US National Institute of Standards and Technology to help organizations identify, assess and mitigate AI risk, organized around governing, mapping, measuring and managing. CPRA is a privacy law, and a country's data protection statute is not an AI risk framework. The OECD life cycle is useful context but is not a risk management framework.","A data protection statute regulates personal data and does not provide an AI risk management structure."],"sourceRef":"D1 practice questions · Q52 · 1.16.3","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q053","sectionId":"d1-E","knowledgePointIds":["d1-E-1-0","d1-E-0-7"],"scenarioId":"d1-doc-case-9e34772709","scenario":"Brightpath Recruitment, with clients in the EU, plans to use an AI tool to screen and rank job applicants. The compliance officer, Joel Becker, asks what the organization should do FIRST regarding the EU AI Act.","type":"application","difficulty":"difficult","stem":"What is the FIRST step?","options":["Launch and treat the system as minimal risk until a complaint is received","Seek only a security certification for the tool","Determine the system's risk classification under the Act, since employment-related systems fall in the high-risk category with specific obligations","Ask the vendor to confirm that it is acceptable"],"correctIndex":2,"explanation":"The EU AI Act is risk-based, and obligations depend on classification. Employment and worker management uses are high-risk and bring requirements such as risk management, data governance, documentation, human oversight and impact assessment. Classification determines which obligations apply, so it comes first. Launching without it risks non-compliance, and security certification and vendor assurances do not determine classification.","optionRationales":["Assuming minimal risk without analysis is non-compliant and unsafe.","Security certification is not the same as AI Act compliance.","The EU AI Act is risk-based, and obligations depend on classification. Employment and worker management uses are high-risk and bring requirements such as risk management, data governance, documentation, human oversight and impact assessment. Classification determines which obligations apply, so it comes first. Launching without it risks non-compliance, and security certification and vendor assurances do not determine classification.","Vendor confirmation is not independent and does not transfer the deployer's obligations."],"sourceRef":"D1 practice questions · Q53 · 1.16","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q054","sectionId":"d1-E","knowledgePointIds":["d1-E-5-1"],"scenarioId":"d1-doc-case-9f3ed5c9c3","scenario":"Willow Bank denies a small-business loan using a complex model. The applicant requests the reasons, and the regulator requires that explanations be provided on request. The model team says the model is a black box. The chief risk officer, Yusuf Ahmed, asks what governance should have required.","type":"application","difficulty":"moderate","stem":"What would be MOST effective?","options":["Require explainability proportionate to the decision's impact, such as interpretable models or explanation techniques, documented decision factors and human review of adverse decisions","Rely on the model's high accuracy as justification","Tell applicants that the algorithm is proprietary","Remove human review to avoid inconsistent explanations"],"correctIndex":0,"explanation":"Where decisions significantly affect individuals and regulation requires explanations, explainability is a governance requirement, not an optional feature. Controls include model choice, explanation techniques, documentation and human review. Accuracy and proprietary claims do not satisfy the obligation, and removing human review weakens oversight.","optionRationales":["Where decisions significantly affect individuals and regulation requires explanations, explainability is a governance requirement, not an optional feature. Controls include model choice, explanation techniques, documentation and human review. Accuracy and proprietary claims do not satisfy the obligation, and removing human review weakens oversight.","High accuracy does not explain why a given decision was made.","Proprietary claims do not remove regulatory obligations.","Removing human review decreases accountability."],"sourceRef":"D1 practice questions · Q54 · 1.17","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q055","sectionId":"d1-E","knowledgePointIds":["d1-E-2-0","d1-E-3-0"],"scenarioId":"d1-doc-case-07cc993162","scenario":"Delta Insurance's data science team reports that making its pricing model fairer across groups would lower overall predictive accuracy by two points. The team asks the executives to choose between fairness and accuracy. The CEO says it is a technical matter and should be decided by the data scientists.","type":"application","difficulty":"difficult","stem":"What is the BEST response from the governance function?","options":["Let the data scientists decide, since they understand the model","Always favour accuracy because it protects profits","Always favour fairness without assessing the business or legal impact","Bring the trade-off to the governance committee for a documented, risk-based decision aligned with ethical principles, legal requirements and risk appetite"],"correctIndex":3,"explanation":"Choices between fairness, accuracy and other values are policy and ethics decisions with legal and reputational impact, so they belong to accountable leaders and should be informed by data scientists, documented, and aligned with principles and appetite. Fixed rules in either direction ignore context.","optionRationales":["Delegating value judgments to technical staff removes executive accountability.","Always favouring accuracy may violate legal and ethical obligations.","Blind fairness weighting without impact analysis is not a risk-based decision, though fairness carries heavy weight.","Choices between fairness, accuracy and other values are policy and ethics decisions with legal and reputational impact, so they belong to accountable leaders and should be informed by data scientists, documented, and aligned with principles and appetite. Fixed rules in either direction ignore context."],"sourceRef":"D1 practice questions · Q55 · 1.17","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q056","sectionId":"d1-E","knowledgePointIds":["d1-E-3-0"],"scenarioId":"d1-doc-case-ad6bc3877d","scenario":"A post-implementation review at Harbor Retail finds that an AI scheduling tool consistently allocates fewer desirable shifts to part-time workers from certain demographic groups. HR director Monique Dubois asks what to do FIRST.","type":"application","difficulty":"moderate","stem":"What is the BEST first action?","options":["Wait for the next scheduled model retraining","Contain the harm by applying human review or pausing the automated decisions for affected staff, then investigate root cause and report to governance","Issue a statement that the tool is fair","Delete the logs to avoid legal discovery"],"correctIndex":1,"explanation":"When harm to individuals is identified, first limit further harm (human review or suspension), then investigate the cause (data, objective, design) and escalate through governance. Waiting prolongs harm, denying it without evidence is unfounded, and deleting logs is improper and destroys evidence.","optionRationales":["Waiting for retraining allows continued unfair treatment.","When harm to individuals is identified, first limit further harm (human review or suspension), then investigate the cause (data, objective, design) and escalate through governance. Waiting prolongs harm, denying it without evidence is unfounded, and deleting logs is improper and destroys evidence.","Asserting fairness without evidence is misleading and risky.","Destroying logs is unethical and may be unlawful."],"sourceRef":"D1 practice questions · Q56 · 1.17","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q057","sectionId":"d1-E","knowledgePointIds":["d1-E-7-1"],"scenarioId":"d1-doc-case-003a55ea04","scenario":"Crescent City Services is deploying an AI system that determines eligibility for housing support. The AI ethics lead, Ruth Okafor, recommends a fundamental rights impact assessment (FRIA) in addition to the DPIA already completed.","type":"application","difficulty":"moderate","stem":"What is the PRIMARY objective of the FRIA?","options":["To verify that data is stored encrypted","To assess how the system may affect the fundamental rights of the people it affects, beyond privacy and data protection","To benchmark model accuracy against competitors","To confirm that the budget is approved"],"correctIndex":1,"explanation":"A FRIA examines impact on rights such as non-discrimination, dignity and access to services. A DPIA is narrower, focused on privacy and data protection risk. Both can be needed for high-risk systems.","optionRationales":["Encryption is a security control, not the FRIA's focus.","A FRIA examines impact on rights such as non-discrimination, dignity and access to services. A DPIA is narrower, focused on privacy and data protection risk. Both can be needed for high-risk systems.","Benchmarking is a performance matter.","Budget approval is a project matter and has nothing to do with rights impact."],"sourceRef":"D1 practice questions · Q57 · 1.17.6","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q058","sectionId":"d1-E","knowledgePointIds":["d1-E-6-0"],"scenarioId":"d1-doc-case-23457bc56d","scenario":"Fable Studios wants to use a generative image tool to create artwork for a global campaign. The general counsel, Ingrid Svensson, notes that the vendor's terms are vague on training data provenance and on who owns the outputs. The marketing head argues speed matters most.","type":"application","difficulty":"expert","stem":"Which action BEST addresses the exposure?","options":["Require the agency to own all risk through a verbal agreement","Use the outputs freely, since AI-generated work cannot infringe anyone's rights","Use the tool but remove metadata from outputs","Assess provenance and ownership terms, obtain vendor IP indemnification and usage rights for outputs, and set guidelines for human review and authorship before commercial use"],"correctIndex":3,"explanation":"Generative outputs can reproduce protected material, and ownership of outputs and the status of training data vary by jurisdiction and vendor terms. Prudent governance clarifies provenance, secures indemnities and usage rights, and sets review practices. Assuming no infringement is false, removing metadata hides rather than resolves risk, and verbal arrangements are not enforceable controls.","optionRationales":["A verbal agreement provides no reliable allocation of liability.","AI outputs can infringe, and ownership may be uncertain.","Stripping metadata conceals provenance and does not resolve rights.","Generative outputs can reproduce protected material, and ownership of outputs and the status of training data vary by jurisdiction and vendor terms. Prudent governance clarifies provenance, secures indemnities and usage rights, and sets review practices. Assuming no infringement is false, removing metadata hides rather than resolves risk, and verbal arrangements are not enforceable controls."],"sourceRef":"D1 practice questions · Q58 · 1.17.5","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q059","sectionId":"d1-E","knowledgePointIds":["d1-E-8-0"],"scenarioId":"d1-doc-case-03ccb95658","scenario":"Solstice Energy has publicly committed to net-zero targets. The CTO proposes training and running several large AI models, which may sharply increase electricity and water use. The ESG director, Chloe Martin, asks the AI governance committee how this should be handled.","type":"application","difficulty":"difficult","stem":"Which approach is BEST?","options":["Include environmental impact in the AI risk assessment and business case, measure and monitor energy use, and weigh efficiency options against the sustainability commitments","Ignore environmental effects because they are outside AI governance","Cancel all AI initiatives to protect the climate targets","Delegate environmental matters to the vendor with no oversight"],"correctIndex":0,"explanation":"Environmental impact is a recognised ethical and strategic consideration in AI. It should be part of risk assessment and the business case, measured and monitored, and balanced against value and commitments. Ignoring it risks conflicts with stated goals, and blanket cancellation is not risk-based. Vendor reliance alone leaves the organization accountable.","optionRationales":["Environmental impact is a recognised ethical and strategic consideration in AI. It should be part of risk assessment and the business case, measured and monitored, and balanced against value and commitments. Ignoring it risks conflicts with stated goals, and blanket cancellation is not risk-based. Vendor reliance alone leaves the organization accountable.","Sustainability is part of ethical AI and ESG alignment.","Cancelling everything disregards benefits and is not proportionate.","The organization remains accountable for its commitments, so oversight is required."],"sourceRef":"D1 practice questions · Q59 · 1.17.7","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q060","sectionId":"d1-E","knowledgePointIds":["d1-B-6-0"],"scenarioId":"d1-doc-case-d56c45f22b","scenario":"Tern Financial's board approves automation that is expected to eliminate about 30% of back-office roles over two years. The business case counts only labour savings. HR leader Priya Menon warns of attrition, loss of knowledge and reputational risk, and the chief ethics officer asks about fairness to affected staff.","type":"application","difficulty":"expert","stem":"Which approach to the workforce impact is BEST?","options":["Keep the plan confidential until redundancies are final to avoid disruption","Focus on the technology rollout and address workforce issues if problems arise","Integrate workforce impact into strategy and governance with a change management plan, transparent communication, reskilling and redeployment options, and monitoring of people-related indicators","Rely on staff to retrain themselves in their own time"],"correctIndex":2,"explanation":"Workforce transformation is a significant AI risk and ethical consideration. Governance should treat it as part of strategy: assess impact, communicate openly, provide reskilling and redeployment, and monitor indicators such as attrition, morale and skills gaps. Secrecy, reactive handling and self-directed retraining increase risk and are inconsistent with ethical AI.","optionRationales":["Secrecy erodes trust and invites attrition and reputational harm.","Reactive handling lets avoidable problems grow.","Workforce transformation is a significant AI risk and ethical consideration. Governance should treat it as part of strategy: assess impact, communicate openly, provide reskilling and redeployment, and monitor indicators such as attrition, morale and skills gaps. Secrecy, reactive handling and self-directed retraining increase risk and are inconsistent with ethical AI.","Leaving retraining to individuals ignores the organization's responsibility and capacity."],"sourceRef":"D1 practice questions · Q60 · 1.9","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q061","sectionId":"d1-E","knowledgePointIds":["d1-E-2-0","d1-E-5-2"],"scenarioId":"d1-doc-case-ca60af8717","scenario":"An internal audit of Falcon Insurance's AI claims-denial recommender finds that human reviewers approved 99.8% of AI recommendations, each review taking under 20 seconds, with no records of overrides. Management cites this as proof that the model is highly accurate and that human-in-the-loop controls are working. Auditor Hannah Lee is drafting the report.","type":"application","difficulty":"expert","stem":"What is the GREATEST concern?","options":["Reviewers are too well paid","The model accuracy is too high to be credible","Human oversight may be nominal because of automation bias, so the control is not demonstrably effective","The model is not complex enough"],"correctIndex":2,"explanation":"Human-in-the-loop is effective only if reviewers have the time, information, training and authority to challenge outputs. A near-total approval rate with very short review times suggests rubber-stamping or automation bias, so the control may exist on paper without working. Governance should assess override rates, reviewer training and sampling of decisions.","optionRationales":["Reviewer pay is irrelevant to the control's effectiveness.","High approval does not by itself mean accuracy is not credible, and it does not show that oversight works.","Human-in-the-loop is effective only if reviewers have the time, information, training and authority to challenge outputs. A near-total approval rate with very short review times suggests rubber-stamping or automation bias, so the control may exist on paper without working. Governance should assess override rates, reviewer training and sampling of decisions.","Model complexity is unrelated to oversight effectiveness."],"sourceRef":"D1 practice questions · Q61 · 1.17","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q062","sectionId":"d1-E","knowledgePointIds":["d1-E-5-0"],"scenarioId":"d1-doc-case-2b81ec8d90","scenario":"Maple Telecom launches a customer chatbot with a human-like name and photo. Customers are not told they are speaking to an AI, and some complain after sharing sensitive information. The chief customer officer, Andre Silva, asks the AI ethics lead what principle has been breached.","type":"application","difficulty":"moderate","stem":"Which principle is MOST directly breached?","options":["Transparency: individuals should know when they are interacting with an AI system","Data minimization","Model robustness","Environmental sustainability"],"correctIndex":0,"explanation":"Transparency means people are informed when AI is used and how it affects them. Customers who believe they are speaking with a human may disclose information and make decisions they would not otherwise. Disclosure of AI interaction is a core ethical and, in many jurisdictions, legal requirement. The other principles may be relevant to AI in general but do not describe this failure.","optionRationales":["Transparency means people are informed when AI is used and how it affects them. Customers who believe they are speaking with a human may disclose information and make decisions they would not otherwise. Disclosure of AI interaction is a core ethical and, in many jurisdictions, legal requirement. The other principles may be relevant to AI in general but do not describe this failure.","Minimization concerns how much data is collected rather than disclosure of AI use.","Robustness concerns resilience to errors and attack.","Sustainability concerns environmental impact."],"sourceRef":"D1 practice questions · Q62 · 1.17","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q063","sectionId":"d1-E","knowledgePointIds":["d1-E-1-0","d1-E-0-1","d1-E-0-6"],"scenarioId":"d1-doc-case-52ce56112a","scenario":"Dunmore Group operates in the EU, the US and Singapore. The board asks general counsel, Fiona Grant, which AI governance sources are legally binding and which are guidance. Documents include the EU AI Act, the NIST AI Risk Management Framework, Singapore's Model AI Governance Framework, the OECD AI Principles and a proposed US bill on algorithmic accountability.","type":"application","difficulty":"moderate","stem":"Which statement is MOST accurate?","options":["None of the documents is relevant until the organization is audited","All of the listed documents are binding in every jurisdiction","Only the voluntary frameworks are binding, while the EU AI Act is guidance","The EU AI Act is binding law where it applies; NIST, Singapore's framework and OECD principles are voluntary guidance; the proposed US bill is not yet law"],"correctIndex":3,"explanation":"Governance needs to distinguish mandatory obligations from leading practices. The EU AI Act is legislation with a risk-based structure. NIST AI RMF, Singapore's framework and OECD principles are voluntary and helpful to structure governance. A proposed bill creates no current obligation but signals direction. Treating guidance as binding or the reverse leads to misallocated effort or non-compliance.","optionRationales":["Waiting for an audit leaves compliance and design unmanaged.","Voluntary frameworks do not create legal obligations on their own, and proposals are not law.","This reverses the actual status.","Governance needs to distinguish mandatory obligations from leading practices. The EU AI Act is legislation with a risk-based structure. NIST AI RMF, Singapore's framework and OECD principles are voluntary and helpful to structure governance. A proposed bill creates no current obligation but signals direction. Treating guidance as binding or the reverse leads to misallocated effort or non-compliance."],"sourceRef":"D1 practice questions · Q63 · 1.16","tags":["d1","document-import","scenario","application"]},{"id":"d1-doc-q064","sectionId":"d1-E","knowledgePointIds":["d1-E-1-0","d1-E-7-1","d1-D-1-1"],"scenarioId":"d1-doc-case-2faf054b73","scenario":"Vireo Group's HR leader, Natalia Ferraro, wants an AI tool that analyzes employee performance data and recommends ratings and promotions across subsidiaries in the EU and a third country. The vendor offers a significant discount if the contract is signed this quarter and holds an ISO/IEC 42001 certificate. The works council has raised concer
