<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAIA Study Path</title>
<style>
  :root {
    --ink:#1c2531; --ink-soft:#57606f; --paper:#f6f5f1; --panel:#ffffff;
    --line:#dcdad2; --navy:#1f3a5f; --navy-deep:#14263e;
    --gold:#a97c22; --gold-soft:#f1e6d0; --tip-bg:#fdf6e8; --tip-line:#e3c988;
    --done:#3f7d5c; --done-bg:#e6f0ea; --locked:#c7c4ba;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:#eceef1; --ink-soft:#aab2bf; --paper:#12161c; --panel:#1a2029;
      --line:#2b323d; --navy:#7fa7d6; --navy-deep:#a9c4e6;
      --gold:#d9ab5c; --gold-soft:#2c2416; --tip-bg:#241d10; --tip-line:#6b5323;
      --done:#7fbf9c; --done-bg:#16261f; --locked:#3a4149;
    }
  }
  :root[data-theme="dark"] {
    --ink:#eceef1; --ink-soft:#aab2bf; --paper:#12161c; --panel:#1a2029;
    --line:#2b323d; --navy:#7fa7d6; --navy-deep:#a9c4e6;
    --gold:#d9ab5c; --gold-soft:#2c2416; --tip-bg:#241d10; --tip-line:#6b5323;
    --done:#7fbf9c; --done-bg:#16261f; --locked:#3a4149;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  .serif { font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif; }
  a, button { font-family: inherit; }

  /* top bar: persistent across all views */
  .topbar {
    position: sticky; top:0; z-index: 10; background: var(--paper);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner {
    max-width: 900px; margin:0 auto; padding:.85rem 1.5rem;
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
  }
  .brand { display:flex; align-items:center; gap:.6rem; cursor:pointer; }
  .brand .mark { font-size:1.2rem; }
  .brand .name { font-weight:700; font-size:.95rem; color:var(--navy-deep); }
  .stats { display:flex; align-items:center; gap:1rem; font-size:.82rem; color:var(--ink-soft); }
  .stats .level { color:var(--gold); font-weight:700; }
  .stats .xp { white-space:nowrap; }
  .crumbs { max-width:900px; margin:0 auto; padding:.9rem 1.5rem 0; font-size:.82rem; color:var(--ink-soft); }
  .crumbs button { background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:0; font-size:.82rem; }
  .crumbs button:hover { color:var(--navy); text-decoration:underline; }
  .crumbs .sep { margin:0 .4rem; }
  .crumbs .current { color:var(--ink); font-weight:600; }

  main { max-width:900px; margin:0 auto; padding:1.4rem 1.5rem 4rem; }

  /* ---------- HOME VIEW ---------- */
  .hero { padding: 1.4rem 0 1.8rem; }
  .hero .eyebrow { font-size:.78rem; color:var(--ink-soft); letter-spacing:.02em; }
  .hero h1 { font-family:inherit; font-size:1.8rem; margin:.3rem 0 .5rem; color:var(--navy-deep); }
  .hero p { color:var(--ink-soft); margin:0; max-width:600px; font-size:.95rem; }

  .levelcard {
    background: var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:1.1rem 1.3rem; margin: 1.2rem 0 1.6rem; display:flex; align-items:center; gap:1.1rem;
  }
  .levelcard .ring { flex-shrink:0; }
  .levelcard .info .title { font-weight:700; color:var(--navy-deep); font-size:1.05rem; }
  .levelcard .info .sub { color:var(--ink-soft); font-size:.85rem; margin-top:.15rem; }
  .levelcard .badges { margin-left:auto; display:flex; gap:.35rem; flex-wrap:wrap; max-width:160px; justify-content:flex-end; }
  .badge-icon { font-size:1.15rem; opacity:.9; }

  .domain-grid { display:grid; gap:.9rem; }
  .domain-card {
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:1.1rem 1.3rem; display:flex; align-items:center; gap:1rem; cursor:pointer;
    transition: border-color .15s ease, transform .1s ease;
  }
  .domain-card:hover { border-color: var(--gold); }
  .domain-card.locked { cursor:default; opacity:.62; }
  .domain-card.locked:hover { border-color:var(--line); }
  .domain-card .dtitle { font-weight:700; color:var(--ink); font-size:1rem; }
  .domain-card .dmeta { font-size:.8rem; color:var(--ink-soft); margin-top:.15rem; }
  .domain-card .dweight { font-size:.72rem; color:var(--gold); font-weight:700; margin-top:.3rem; }
  .domain-card .arrow { margin-left:auto; color:var(--ink-soft); font-size:1.3rem; }

  /* ---------- DOMAIN VIEW ---------- */
  .domain-head { margin-bottom:1.3rem; }
  .domain-head h2 { font-size:1.5rem; margin:0 0 .3rem; color:var(--navy-deep); }
  .domain-head .meta { font-size:.85rem; color:var(--gold); font-weight:700; }
  .domain-head p { color:var(--ink-soft); font-size:.93rem; margin-top:.5rem; }

  .section-grid { display:grid; gap:.7rem; }
  .section-card {
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:.95rem 1.15rem; display:flex; align-items:center; gap:.9rem; cursor:pointer;
  }
  .section-card:hover { border-color:var(--gold); }
  .section-card.locked { cursor:default; opacity:.55; }
  .section-card .sc-ring { flex-shrink:0; }
  .section-card .sc-title { font-weight:600; font-size:.95rem; }
  .section-card .sc-sub { font-size:.78rem; color:var(--ink-soft); margin-top:.1rem; }
  .section-card .sc-trophy { margin-left:auto; font-size:1.1rem; }

  /* ---------- SECTION VIEW (group grid) ---------- */
  .group-card {
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:.95rem 1.15rem; display:flex; align-items:center; gap:.9rem; cursor:pointer;
  }
  .group-card:hover { border-color:var(--gold); }
  .group-card .gc-ring { flex-shrink:0; }
  .group-card .gc-title { font-weight:600; font-size:.93rem; }
  .group-card .gc-sub { font-size:.78rem; color:var(--ink-soft); margin-top:.1rem; }
  .group-card .gc-trophy { margin-left:auto; font-size:1.1rem; }

  /* ---------- GROUP VIEW (term cards) ---------- */
  .sec-head p { color:var(--ink-soft); font-size:.93rem; margin: .3rem 0 1rem; }
  .progress-line { font-size:.82rem; color:var(--ink-soft); margin-bottom:1.3rem; display:flex; align-items:center; gap:.6rem; }
  .progress-line .bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .progress-line .bar>div { height:100%; background:var(--gold); transition:width .3s ease; }

  .group { margin-bottom:1.5rem; }
  .group h3 {
    font-size:.95rem; margin:0 0 .6rem; color:var(--navy); font-weight:700;
    padding-bottom:.3rem; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:.4rem;
  }
  .cards { display:grid; gap:.55rem; }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:.8rem 1rem; cursor:pointer; user-select:none; transition:border-color .15s ease;
  }
  .card:hover { border-color:var(--gold); }
  .card.open { border-color:var(--gold); }
  .card.mastered { background: linear-gradient(var(--panel),var(--panel)) padding-box, none; }
  .card .row1 { display:flex; justify-content:space-between; align-items:baseline; gap:.8rem; }
  .card .term { font-weight:600; font-size:.97rem; }
  .card .hint { font-size:.72rem; color:var(--ink-soft); white-space:nowrap; }
  .card .xp-badge { font-size:.72rem; color:var(--done); font-weight:700; white-space:nowrap; }
  .card .summary { color:var(--ink-soft); font-size:.9rem; margin-top:.25rem; }
  .card .details { display:none; margin-top:.75rem; padding-top:.7rem; border-top:1px dashed var(--line); }
  .card.open .details { display:block; }
  .details .block { margin-bottom:.6rem; }
  .details .block:last-child { margin-bottom:0; }
  .details .lbl { font-size:.7rem; color:var(--gold); font-weight:700; display:block; margin-bottom:.15rem; }
  .details .txt { font-size:.9rem; color:var(--ink); }
  .details .tip { background:var(--tip-bg); border:1px solid var(--tip-line); border-radius:6px; padding:.55rem .7rem; font-size:.86rem; }
  .details label { display:flex; align-items:center; gap:.4rem; cursor:pointer; }

  .toast {
    position: fixed; bottom: 1.3rem; left:50%; transform:translateX(-50%);
    background: var(--navy-deep); color:#fff; padding:.55rem 1.1rem; border-radius:20px;
    font-size:.85rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,.2);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(-6px); }

  .reset-row {
    margin-top:1.8rem; padding-top:1rem; border-top:1px solid var(--line);
    font-size:.8rem; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center;
  }
  .reset-row button { background:none; border:1px solid var(--line); color:var(--ink-soft); padding:.35rem .75rem; border-radius:6px; cursor:pointer; font-size:.78rem; }

  .empty-note { color:var(--ink-soft); font-size:.9rem; padding:2rem 0; text-align:center; }

  /* ---------- QUIZ VIEW ---------- */
  .quiz-entry {
    background:var(--gold-soft); border:1px solid var(--tip-line); border-radius:10px;
    padding:.95rem 1.15rem; display:flex; align-items:center; gap:.9rem; cursor:pointer; margin-bottom:1.3rem;
  }
  .quiz-entry:hover { border-color:var(--gold); }
  .quiz-entry .qe-icon { font-size:1.4rem; }
  .quiz-entry .qe-title { font-weight:700; color:var(--ink); font-size:.97rem; }
  .quiz-entry .qe-sub { font-size:.8rem; color:var(--ink-soft); margin-top:.1rem; }
  .quiz-entry .qe-score { margin-left:auto; font-size:.85rem; color:var(--gold); font-weight:700; white-space:nowrap; }
  .quiz-q { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:1rem 1.1rem; margin-bottom:.8rem; }
  .quiz-case { background:var(--gold-soft); border:1px solid var(--tip-line); border-radius:8px; padding:.9rem 1.1rem; margin:1rem 0; }
  .quiz-case summary { cursor:pointer; font-weight:700; color:var(--ink); }
  .quiz-case p { font-size:.86rem; line-height:1.48; margin:.65rem 0 0; }
  .quiz-q .qnum { font-size:.72rem; color:var(--gold); font-weight:700; margin-bottom:.4rem; }
  .quiz-q .stem { font-size:.96rem; margin-bottom:.8rem; line-height:1.45; }
  .study-point-link { display:inline-flex; align-items:center; min-height:44px; margin:0 0 .85rem; padding:.55rem .8rem; border:1px solid var(--line); border-radius:7px; background:var(--gold-soft); color:var(--ink); cursor:pointer; text-align:left; }
  .study-point-link:hover { border-color:var(--gold); }
  .quiz-opt {
    display:block; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line);
    border-radius:6px; padding:.55rem .75rem; margin-bottom:.5rem; cursor:pointer; font-size:.9rem;
    font-family:inherit; color:var(--ink);
  }
  .quiz-opt:hover { border-color:var(--gold); }
  .quiz-opt.selected { border-color:var(--navy); }
  .quiz-opt.correct { background:var(--done-bg); border-color:var(--done); }
  .quiz-opt.incorrect { background:var(--tip-bg); border-color:#c0503f; }
  .quiz-opt:disabled { cursor:default; }
  .quiz-explain { margin-top:.7rem; padding-top:.7rem; border-top:1px dashed var(--line); font-size:.88rem; color:var(--ink); }
  .quiz-explain .verdict { font-weight:700; margin-bottom:.25rem; }
  .quiz-explain .verdict.right { color:var(--done); }
  .quiz-explain .verdict.wrong { color:#c0503f; }
  .quiz-summary { font-size:.85rem; color:var(--ink-soft); margin-bottom:1rem; display:flex; align-items:center; gap:.6rem; }
  .quiz-summary .bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .quiz-summary .bar>div { height:100%; background:var(--gold); }
  .quiz-index { margin:.8rem 0; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
  .quiz-index summary { padding:.75rem .9rem; cursor:pointer; font-weight:700; }
  .quiz-index-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:.4rem; max-height:210px; overflow:auto; padding:0 .75rem .75rem; }
  .qjump { min-height:38px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:6px; cursor:pointer; }
  .qjump.active { outline:2px solid var(--navy); outline-offset:1px; }
  .qjump.answered { background:var(--gold-soft); border-color:var(--gold); }
  .qjump.correct { background:var(--done-bg); border-color:var(--done); }
  .qjump.incorrect { background:var(--tip-bg); border-color:#c0503f; }
  .bookmark-btn { float:right; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:6px; padding:.25rem .5rem; cursor:pointer; }
  .tools-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.8rem; margin:1rem 0 1.5rem; }
  .tool-card { border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:1rem; }
  .tool-card h3 { margin:0 0 .35rem; font-size:1rem; }
  .tool-card p { margin:.25rem 0 .8rem; color:var(--ink-soft); font-size:.85rem; }
  .tool-card button,.tool-card label { display:inline-block; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink); padding:.55rem .7rem; cursor:pointer; font:inherit; font-size:.84rem; }
  .weak-row { display:flex; justify-content:space-between; align-items:center; gap:.75rem; padding:.75rem 0; border-bottom:1px solid var(--line); }
  .weak-row button { border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:.5rem .7rem; cursor:pointer; color:var(--ink); white-space:nowrap; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.65rem; margin:1rem 0; }
  .stat-box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:.8rem; }
  .stat-box strong { display:block; font-size:1.25rem; color:var(--navy); }
  .quiz-nav { display:flex; justify-content:space-between; align-items:center; gap:.75rem; margin:1rem 0; }
  .quiz-nav button,.coverage-filter { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:7px; padding:.65rem .9rem; cursor:pointer; font:inherit; }
  .quiz-nav button.primary { background:var(--navy); border-color:var(--navy); color:white; }
  .quiz-nav button:disabled { opacity:.45; cursor:default; }
  .coverage-entry { margin:1.2rem 0; }
  .coverage-table { width:100%; border-collapse:collapse; font-size:.85rem; }
  .coverage-table th,.coverage-table td { text-align:left; padding:.65rem .5rem; border-bottom:1px solid var(--line); vertical-align:top; }
  .coverage-table th { color:var(--ink-soft); font-size:.75rem; }
  .coverage-table .coverage-name { font-weight:600; }
  .coverage-controls { display:flex; gap:.6rem; flex-wrap:wrap; margin:1rem 0; }
  @media (max-width:600px) {
    .quiz-q { padding:.9rem; }
    .quiz-opt { padding:.8rem .75rem; font-size:.95rem; }
    .coverage-table th:nth-child(2),.coverage-table td:nth-child(2) { display:none; }
    .quiz-nav button { min-height:44px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brandHome">
      <span class="mark">📋</span><span class="name serif">AAIA Study Path</span>
    </div>
    <div class="stats">
      <span class="level" id="levelLabel">—</span>
      <span class="xp" id="xpLabel">0 XP</span>
    </div>
  </div>
  <div class="crumbs" id="crumbs"></div>
</div>

<main id="app">
  <section class="tool-card" role="status">
    <h1 class="serif">AAIA Study Path</h1>
    <p>Starting the study app…</p>
    <noscript><p>This file needs JavaScript to run. Open it in your phone’s Safari or Chrome browser, not a document or file preview app.</p></noscript>
    <p class="startup-help">If this message stays on screen, open the downloaded file in Safari or Chrome. Some phone file previewers do not run interactive HTML apps.</p>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
/* Keep phone file-preview and startup failures from appearing as an empty screen. */
window.addEventListener("error", event => {
  const app = document.getElementById("app");
  if (!app) return;
  const detail = event.message ? `<p class="startup-error-detail">${String(event.message).replace(/[&<>]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[char]))}</p>` : "";
  app.innerHTML = `<section class="tool-card" role="alert"><h1 class="serif">The study app could not start</h1><p>Open this file in Safari or Chrome rather than a document previewer, then reload it.</p>${detail}</section>`;
});
</script>

<script>
/* ============ DATA ============ */
const DOMAINS = [
  {
    id: "d1", title: "Domain 1", full: "AI Governance and Risk", weight: "33% of exam · ~30 questions",
    desc: "Governance, risk identification, privacy/data governance, ethics, regulations and standards.",
    locked: false,
    sections: [
      {
        id: "A", title: "AI Models, Considerations & Requirements",
        intro: "The vocabulary foundation for the rest of Domain 1 — and for Domains 2 and 3, which assume you already know these terms.",
        groups: [
          {
            name: "A.1 — Three Categories of AI (by capability)",
            cards: [
              { term:"ANI — Artificial Narrow Intelligence", summary:"Where virtually all AI in production lives today.",
                definition:"AI limited to a specific domain or task. Simulates human cognition within that narrow scope but has no self-awareness or general intelligence. Also called \"weak AI.\" Includes two sub-types: Reactive AI (no memory, responds only to current input) and Limited Memory AI (uses recent data, the basis of most deep learning today).",
                example:"Language translation, image classification, fraud-detection models, autonomous-vehicle subsystems, spam filters.",
                tip:"If a scenario describes a system doing one specialized task, it's ANI. Any answer choice describing \"currently deployed AGI\" or \"production ASI\" is automatically wrong — neither exists yet." },
              { term:"AGI — Artificial General Intelligence", summary:"Human-level intelligence across any task — not yet achieved.",
                definition:"A theoretical AI capable of performing any intellectual task a human can, requiring sensory perception, fine motor skills, problem-solving, navigation, natural language, creativity, and social-emotional engagement.",
                example:"No real-world example exists — this is a benchmark, not a deployed category.",
                tip:"Exam distractor pattern: an answer choice that casually refers to an AGI system \"currently in use\" is designed to be wrong." },
              { term:"ASI — Artificial Super Intelligence", summary:"Hypothetical intelligence exceeding human capability entirely.",
                definition:"A theoretical future stage where AI transcends human intelligence, surpassing our capability to achieve previously impossible feats.",
                example:"No real-world example — purely theoretical (consciousness, subjective experience, behavioral intelligence beyond human reach).",
                tip:"Same trap as AGI — if an answer implies ASI is operational anywhere today, eliminate it." }
            ]
          },
          {
            name: "A.2 — Predictive vs. Generative Models",
            cards: [
              { term:"Predictive AI", summary:"Forecasts outcomes from historical data.",
                definition:"Uses various ML algorithms to identify patterns and relationships in historical data in order to forecast future events or classify new inputs.",
                example:"Predictive maintenance, customer churn prediction, financial forecasting, fraud detection.",
                tip:"Watch for the giveaway verbs: \"forecast,\" \"predict,\" \"classify\" signal predictive AI. Risk questions pivot toward bias in training data and downstream decision accuracy." },
              { term:"Generative AI (GenAI)", summary:"Creates new, original content rather than classifying existing data.",
                definition:"A class of AI — including LLMs and GANs — that learns the underlying distribution of training data well enough to generate new images, code, text, speech, translations, music, or art.",
                example:"Chatbots, image synthesis, code assistants, marketing copy generation.",
                tip:"Giveaway verbs: \"generate,\" \"create,\" \"write,\" \"produce.\" Risk questions pivot toward copyright/IP, hallucination, harmful content, and training-data privacy leakage." },
              { term:"GANs — Generative Adversarial Networks", summary:"Two competing neural networks that jointly produce realistic synthetic data.",
                definition:"The Generator network creates new data samples resembling the training data; the Discriminator network tries to distinguish generated samples from real ones. Both improve continuously through this competition until the generator produces output the discriminator can no longer reliably tell apart from real data.",
                example:"Deepfake image/video generation, synthetic data generation for training other models.",
                tip:"GANs are one underlying architecture for GenAI; transformer-based LLMs are the other major one." }
            ]
          },
          {
            name: "A.3 — Training, Validation & Test Data",
            cards: [
              { term:"Training data", summary:"What the model learns from.",
                definition:"The core dataset used to teach the model how to make predictions or classifications. Contains both inputs and known outputs (in supervised learning).",
                example:"Emails labeled \"spam\" or \"not spam\" used to train a spam filter.",
                tip:"Exam shorthand: training data biases the model." },
              { term:"Validation data", summary:"Used mid-training to tune settings without touching the test set.",
                definition:"A separate dataset used during training to fine-tune model parameters/hyperparameters and prevent overfitting — without contaminating the untouched test set.",
                example:"Using a held-out validation set to determine the best probability threshold for classifying an email as spam.",
                tip:"Exam shorthand: validation data tunes the model." },
              { term:"Test data", summary:"The final, one-time check of real-world performance.",
                definition:"Simulates real-world data the model has never seen. Used only once, after training and validation are complete, to assess final performance and expected production accuracy.",
                example:"New, unseen emails used to test how well the finished spam filter performs.",
                tip:"Exam shorthand: test data evaluates the model. Tuning on the test set would contaminate it." }
            ]
          },
          {
            name: "A.4 — Machine Learning Algorithm Classes",
            cards: [
              { term:"Linear regression (Supervised)", summary:"Models a straight-line relationship between variables.",
                definition:"A simple, robust supervised algorithm that models the relationship between a dependent variable and one or more independent variables by fitting a linear equation to observed data.",
                example:"Predicting home prices from square footage, location, and age.",
                tip:"Use case → algorithm: \"predict a number\" always maps to regression." },
              { term:"Logistic regression (Supervised)", summary:"Predicts the probability of a binary outcome.",
                definition:"Predicts the probability of an event occurring based on one or more independent variables; useful for binary classification.",
                example:"Email spam filtering (spam / not spam).",
                tip:"\"Predict a category with two outcomes\" → logistic regression." },
              { term:"Tree-based models (Supervised)", summary:"Recursively split data into a hierarchy of decision rules.",
                definition:"Manage complex, nonlinear relationships using decision trees that recursively split data by input variables, predicting at the leaf nodes. Used for classification, regression, feature selection, visualization.",
                example:"Credit risk assessment.",
                tip:"Go-to when a scenario mentions nonlinear relationships or needs an interpretable decision path." },
              { term:"Support Vector Machines — SVM (Supervised)", summary:"Draws the best boundary line between two classes.",
                definition:"Used for classification and predictive modeling; relies on establishing a decision boundary called a \"hyperplane\" between sets of labeled data. Works reliably even with relatively small amounts of data.",
                example:"Image classification.",
                tip:"Answer when a scenario stresses limited training data but still needs reliable classification." },

                example:"Enhanced autonomous driving.",
                tip:"DQN = Q-learning + neural network, for when the state space is too large for a table." },
              { term:"Policy-based methods (Reinforcement)", summary:"Learns the action policy directly, skipping the value function.",

                tip:"Audit/risk lens: token usage drives cost and influences truncation risk in long inputs." },

                example:"A bank building its own fraud model in-house to keep full control over sensitive data, accepting the added infrastructure and staffing cost.",

                definition:"Identifies distinct layers with responsibility split by deployment type. Two layers sit closest to the customer regardless of deployment type: AI Usage (user training and accountability; usage policy and admin controls; identity, device, and access management; data governance) and AI Application (AI plugins and data connections; application design and implementation; application infrastructure). Below that, responsibility for the platform and infrastructure layers shifts depending on the offering: IaaS / \"Bring Your Own\" model — the organization owns almost everything above raw infrastructure, including building and hosting its own model; PaaS, e.g. Azure AI — the vendor manages the underlying AI platform, and the organization builds its application on top of it; SaaS, e.g. Copilot — the vendor manages the platform and application, and the organization's responsibility narrows mostly to AI Usage (governance, access, policy, training).",

              { term:"Data Drift (Covariate Drift)", summary:"The inputs changed; the target concept didn't.",

                definition:"(1) Information is more current than the model's training cutoff — RAG retrieves today's document at query time. (2) Information is proprietary and never in training data — RAG lets the LLM use internal data without exposing it to the foundation-model provider for training. (3) Information changes too frequently to retrain for — update the document store, not the model. (4) You need source citations and auditability — RAG returns the actual source document. (5) You need to control what the model can/cannot say — a grounded model can say 'I don't know' instead of hallucinating. (6) You're working with sensitive internal data that can't go into training — RAG keeps it in a controlled, deletable retrieval store (GDPR right-to-be-forgotten, HIPAA, privilege, trade secrets). (7) You need different answers for different users from the same model — RAG can apply access controls at retrieval time.",

            name: "B — AI Solution Development Methodology & Life Cycle",
            cards: [
              { term:"The Development Life Cycle (6 Phases)", summary:"A distinct 6-phase framing — don't confuse with Domain 1 A.7's 7-phase Plan→Retire model.",
                definition:"Use Case Development → Design → Development → Deployment → Monitoring and Maintenance → Decommissioning (Figure 2.4). Development of an AI solution is a highly iterative process, with each stage dependent on the previous ones — it's crucial to operationalize data governance controls throughout. Organizations may find that pure waterfall or pure agile methodologies don't fully address AI development's needs, and that hybridizing the two produces better results.",
                example:"An organization scoping a fraud-detection use case, designing the model approach, developing and training it, deploying it to production, monitoring its performance, and eventually decommissioning it as requirements change.",
                tip:"Domain 1's life cycle (Plan/Collect/Build/Test/Deploy/Operate/Retire) and Domain 2's life cycle (Use Case/Design/Development/Deployment/Monitoring & Maintenance/Decommissioning) describe the same underlying journey with different phase names and different counts (7 vs. 6). Recognize both as valid — don't assume there's one canonical version." },
              { term:"2.8.1 Use Case Development: Why AI Projects Fail", summary:"Five named, research-backed failure factors — and the antidote is good use-case selection.",
                definition:"Many organizations have rapidly experimented with GenAI, but studies show many AI projects fail to meet their goals — commonly attributed to people, process, and data issues. Common failure factors: misunderstanding/miscommunicating the problem to be solved using AI; lack of quality data; not solving the business problem; inadequate infrastructure to manage and deploy AI models; applying AI to problems too difficult for AI to solve. Good use cases drive ROI and should align with what's valuable for the organization, its customers, and drivers of success.",
                example:"An AI hiring tool project failing not because the model was poorly built, but because the underlying business problem was never clearly defined in the first place.",
                tip:"" },
              { term:"Figure 2.5 — Good AI Model Use Case Attributes", summary:"Three attribute categories the exam expects you to recognize as a checklist.",
                definition:"Focus on the problem: focus on the business problem to be solved and not the technology; commit AI project resources with adequate time to solve the problem; understand AI's limitations. Data quality: volume and veracity of data relevant to the AI use case are adequate; data is clean, organized, and properly labeled. Business and technical partnership: technical resources understand the business intent and domain context of the problem; business resources effectively communicate the business problem and metrics of success (not AI model performance).",
                example:"A business stakeholder defining success as 'reduce customer wait time by 30%' rather than 'achieve 95% model accuracy' — the former is a business metric, the latter is a technical one.",
                tip:"That last bullet is a favorite exam trap: business resources should define success using business metrics, NOT AI model performance metrics — those are two different things and mixing them up is exactly what this attribute is warning against." },
              { term:"2.8.2 Design: Data Ingestion and Feature Selection", summary:"Building the data lake, then picking which features actually go into the model.",
                definition:"Once good AI use cases are defined and aligned with values/mission/customer needs, design goes through iterative stages requiring collaboration between business and data subject matter experts. Data Ingestion — to easily explore and correlate data, bespoke data from multiple sources is aggregated into a centralized data store like a data lake; this requires identifying data sources and copying data from originating sources into the lake (may be one-time for a single source, repeated for each source deemed useful); future retraining or inference may necessitate data ingestion pipelines to automate the collection process. Feature Selection — depending on the use case, the AI solution may leverage one or more models; the current field of AI is rooted in ML algorithms using models like support vector machines, decision trees, and stochastic gradient descent (SGD); many require manual selection of relevant features (feature engineering); selecting too few or too many features can cause adverse outcomes for performance, efficiency, cost, and interpretability.",
                example:"A team building a data ingestion pipeline once a single source proves useful enough to warrant automated, repeated collection rather than a one-time copy.",
                tip:"" },
              { term:"Feature Selection: Too Few vs. Too Many Features", summary:"Underfitting and overfitting reframed specifically around feature COUNT, not just model complexity.",
                definition:"Too FEW features: Underfitting — the model doesn't capture data relationships well and does a poor job correlating, predicting, or classifying (e.g., a housing-price model with only 2–3 features like location, square footage, and bedroom count may miss factors like number of bathrooms, age, or crime statistics). Too MANY features: Generalization — the model doesn't include other relevant features affecting applicability to broader use, and may not properly predict for cases outside its narrow training (e.g., a housing model that doesn't include lot size can't properly price a plot of land with no house). Interpretability — the model can't interpret a more complex problem with limited or excessive features, making it hard to explain the real drivers behind a result. Overfitting — the model fits training-dataset relationships well but fails to generalize to unseen data. Higher computation costs — a very large feature set takes more time to collect a sufficiently balanced dataset, compute the weight of each feature, and process inferences. Interpretability (again) — too many features makes the resulting weight of each feature hard to explain or interpret.",
                example:"A housing-price model missing lot size as a feature being unable to price a vacant plot of land with no house on it at all.",
                tip:"Notice Interpretability appears as a risk on BOTH ends — too few features AND too many features can each make a model hard to interpret, just for opposite reasons (too little signal to explain vs. too much to untangle)." },
              { term:"Design: Deep Learning, Transformers, and Assessing Fit for Purpose", summary:"Why LLM feature engineering is 'indirect,' and what an AI auditor checks at the design stage.",
                definition:"DL is a subcategory of ML that leverages neural networks; unlike supervised learning with manually selected features, DL identifies and extracts features automatically from raw data (a form of unsupervised learning). Advances enabling DL's rise: availability of large datasets, scalability and reduced cost of computing power/storage, and improvements in model architecture and optimization — these helped overcome DL's traditionally higher computation costs, enabling image/voice recognition and NLP. The transformer architecture behind modern LLMs allows models to learn features from a dataset unlike traditional ML's manual feature engineering — but feature engineering is still present, just more indirect: choices about tokenization (how words are split into tokens — subwords, full words, or characters, including handling of special characters) and embedding design (how the system represents the 'meaning' of tokens) are both indirect forms of feature engineering that affect model behavior. Assessing design: the organization should document its design decisions, the source/attributes of the dataset, and expected outputs. Supervised learning models are generally easier to assess since the labeled dataset and features provide insight into the model's logic and explainability. Self-learning (unsupervised) models require deeper inspection — the underlying training dataset is key to explaining model output, and the AI auditor should assess how the dataset was curated to address any data governance issues.",
                example:"An auditor assessing a self-learning fraud model by deeply inspecting its training dataset's curation process, since the model itself offers little direct insight into its own logic.",
                tip:"Supervised models: audit the labeled data + features. Unsupervised/self-learning models: audit the training dataset's curation, since that's your only real window into what the model actually learned." },
              { term:"2.8.3 Development: Environment and Data Preprocessing", summary:"Real data needs real security controls, even in nonproduction — and preprocessing has real legal teeth.",
                definition:"With design complete, developers undertake activities differing from conventional software — rather than directly coding instructions, development of AI models heavily relies on attributes learned from the data. Development Environment: in traditional software, fake/synthetic data is often used in nonproduction; for AI development, real data is typically required during the actual training session and requires commensurate data security controls extended to nonproduction environments and even local machines. Data Preprocessing: raw data varies in quality, so preprocessing is performed to clean and resolve data quality issues — imputing missing values, normalizing data, removing duplicates or outliers, and other transformations to reach the desired state; DL models handling high-dimensional unstructured data may benefit from dimensionality-reduction techniques to make training more efficient. For DL models trained on large amounts of unstructured data, legal and privacy teams should validate that training is ethically and responsibly carried out with the authorization/consent of data owners; customers may be able to selectively opt in or opt out of AI training use, requiring preprocessing to remove opt-out data regularly as customers withdraw permission; removal of disallowed sensitive personal/health/financial/regulated data may be required if not needed for the use case, preventing possible leakage of sensitive data in model outputs. For some DL models, especially LLMs, the raw dataset needs to be tokenized as part of preprocessing.",
                example:"A legal team validating that a customer's opt-out request was actually reflected in the next preprocessing run before that data could be used again in retraining.",
                tip:"The opt-out removal process isn't a one-time event — it must be performed regularly as customers continue to withdraw permission over time, and auditors should expect to see evidence of that ongoing process, not just a policy document." },
              { term:"Development: Dataset Preparation and the Corrected Split Percentages", summary:"The real numbers from Figure 2.6 — training data is 60%–80%, not 50%–80%.",
                definition:"If the AI solution requires supervised learning, dataset preparation involves collecting a labeled dataset with relevant, diverse examples aligned to the use case's objectives (e.g., fine-tuning a sentiment model needs feedback text paired with positive/negative labels). Regardless of supervised or unsupervised learning, preparing high-quality and diverse data is essential to real-world performance. Splitting the dataset into a minimum of three chunks (cross-validation) is necessary to maintain training/evaluation integrity, reduce bias, and help the model generalize to new data — care must be taken to ensure the splitting process maintains the data's distribution and doesn't create selection bias among the datasets. Figure 2.6 — Types of Datasets: Training dataset — the LARGEST dataset, representing 60%–80% of the entire dataset, used to train the model in the next stage. Validation dataset — a small (10%–20%) dataset that allows the organization to validate model performance and make hyperparameter tuning tweaks to improve performance or help select the best model when multiple models are being evaluated. Testing dataset — similar in size to the validation dataset (10%–20%), reserved for the final evaluation of the model once all training and tuning have been completed.",
                example:"A dataset of 100,000 records split roughly 70,000 training / 15,000 validation / 15,000 test.",
                tip:"⚠️ Correction: this guide previously listed the training dataset range as 50%–80% in both this card and Section A.7 — the confirmed figure from Figure 2.6 is 60%–80%. If you memorized the old number, update it." },
              { term:"Development: Model Training", summary:"Real costs, real sustainability impact, and the specific technique of randomly dropping nodes to fight overfitting.",
                definition:"At this stage, the preprocessed data is fed into the selected AI model — much of the difficult work (model selection, curation of high-quality diverse datasets) has already been done. Some advanced DL models, like the transformer architecture of modern LLMs, allow for hyperparameter settings such as batch size and attention heads to be used during training. Several factors significantly impact training time and cost: dataset size, hardware used, and the model itself — a small, simple model can take hours to train, whereas a large, complex model can take weeks to process at significant cost (e.g., US $1 million). Training AI models can take significant computing resources and may impact an organization's sustainability goals. It's essential to monitor the training process for issues like overfitting — this could require stopping training early or randomly dropping some nodes during training to prevent overfitting. System crashes or interruptions could occur during training, so regularly saving progress helps avoid loss of training progress.",
                example:"A training run configured to periodically save checkpoints, so an unexpected system crash costs hours of progress rather than the entire multi-week run.",
                tip:"'Randomly dropping some nodes during training' is a specific, named overfitting-prevention technique (this is describing dropout regularization, though the source doesn't use that exact term) — distinct from just 'getting more data' or 'stopping early,' both of which are also mentioned." },
              { term:"2.8.4 Evaluation", summary:"Precision, recall, and F1 on the validation set — then final evaluation only on the untouched test set.",
                definition:"Once trained, a model's performance should be evaluated using a variety of metrics to test its precision, recall, and the two combined using an F1 score. A validation dataset is often used to evaluate performance — it should be new and unseen by the model, and should be a good proxy to determine if the model's performance is sustained and generalizes well against unseen data. If the model's performance goals and business success metrics are not met, additional tuning of hyperparameters is needed — the model may go through several iterations of training, tuning, and retraining until suitable performance metrics are attained. Once final training iterations are complete, the final performance evaluation is completed using the testing dataset. Beyond performance, the organization may need to evaluate the model for harmful and malicious output — early versions of GenAI models were later shown to have produced biased and toxic results, much of which was attributable not to the model's algorithms or hyperparameters but to existing harmful/toxic content in the dataset itself; adequate testing during evaluation could identify such problems early. Organizations should maintain artifacts of testing and evaluation performed to support the growing demand from AI consumers for explainability of AI models and their testing measures.",
                example:"A model iterating through several rounds of hyperparameter tuning on the validation set before ever touching the testing dataset for its true final evaluation.",
                tip:"This is the life-cycle-anchored version of Domain 1 C.11's Accuracy/Precision/Recall/F1 metrics — same math, now placed at a specific point in the life cycle (validation-set tuning, then one final testing-set evaluation)." },
              { term:"2.8.5 Deployment", summary:"Wrapping the model in software so real users can actually reach it.",
                definition:"Deployment of an AI solution involves wrapping the model around software that allows AI users to interact with and use the model. New real-world data is presented to the model for inference — the process of using a trained AI model to produce an output from unseen data. Depending on the modality of the AI user's input (e.g., text, speech, visual), additional data processing may be needed before the input is directly run through the model to produce the output.",
                example:"A voice-input feature requiring additional speech-to-text processing before the resulting text can be run through the underlying language model.",
                tip:"" },
              { term:"2.8.6 Monitoring and Maintenance: Data and Model Drift", summary:"The resolved gap — full drift definitions anchored to this specific life-cycle phase.",
                definition:"Like most projects, monitoring and maintenance are essential to keep an AI system running, operating, and continuing to function as expected. Data and Model Drift: AI systems may continue to produce consistent results, but performance may deteriorate over time. This can occur within the data (data drift) or within the model (model drift). Deterioration may result from changing characteristics of new input data that the AI model wasn't trained on (data drift), or from seasonality or shifting preferences the model didn't previously recognize (model drift). It's important for the organization to monitor performance and diagnose root causes of abnormalities or variances in metrics like precision, recall, and F1 scores. When an AI system's performance drops to an unacceptable level, the AI model may need to be updated with a new dataset representative of the data changes.",
                example:"A recommendation model's F1 score gradually declining over several months, traced back to a shift in customer preferences the model was never retrained on.",
                tip:"This is the life-cycle-phase home for the same Data/Model/Concept Drift concepts covered in Domain 1 C.10 — that's the deep-dive on drift types and RAG boundaries; this is where drift monitoring sits within the development life cycle itself." },
              { term:"2.8.6 Monitoring and Maintenance: AI Observability and Maintenance", summary:"A one-line pointer to Section D's fuller Observability content, plus what ongoing maintenance actually involves.",
                definition:"AI Observability is an emerging field in which AI engineers monitor holistic aspects of an AI system, from data to model performance, and can even aid in model interpretability (see Domain 2 Section D for the fuller three-area breakdown). Maintenance: even though an AI system may continue to perform well, regular maintenance — updating the underlying model with new datasets, improving the model's architecture, or incorporating user feedback — will improve business relevance. Similar AI development life cycle stages may be followed for retraining models with tweaks to the dataset, hyperparameter tuning, or even suppression of specific unwanted patterns (e.g., toxic or biased outputs).",
                example:"A model getting a full mini-pass through Design and Development again — new data, retuned hyperparameters — specifically to suppress a pattern of biased outputs discovered post-launch.",
                tip:"Retraining isn't a separate process bolted onto maintenance — it reuses the same life-cycle stages (Design, Development) at smaller scale, which is worth remembering if a question asks what process governs a retraining effort." },
              { term:"2.8.7 Decommission", summary:"The resolved gap — decommissioning goes well beyond turning off the inference service.",
                definition:"Early adopters of AI solutions found that many of their AI projects failed to meet business, technical, and societal measures of success. The decommissioning of an AI solution goes beyond shutting down the inference service that delivered the model's outputs — care should be taken to ensure derivatives of the base AI model are also considered in the scope of program decommissioning. Parts of an AI model can be 'forgotten' through retraining without specific datasets, but this is impractical to do in large models with billions of parameters.",
                example:"A decommissioning plan that shuts down the live inference API but forgets that three other internal tools were fine-tuned from the same base model and are still running.",
                tip:"The 'impractical to fully forget large models' point directly foreshadows Domain 1's later discussion of the right to be forgotten (D.2, GDPR) — full unlearning is a genuine, unresolved technical limitation, not just a policy gap." },
              { term:"2.9.1 Privacy by Design: The Seven UK ICO Principles", summary:"A named, globally-recognized 7-principle privacy framework — genuinely new material, not previously in this guide.",
                definition:"The rise in popularity of GenAI has caused an increase in privacy and security fears, partly because some AI may be inherently nondeterministic, making it hard to explain the inner workings of a complex AI model. Privacy by design provides a framework for embedding privacy controls into the design of technology from the beginning of a project — integrating privacy into the design and operation of IT/business systems, networked infrastructure, and business practices, ensuring privacy is considered from the start rather than added as an afterthought. Its motivation is not to stop data use, but to ensure data can continue to be used to deliver quality services while keeping data safe. The UK Information Commissioner's Office (ICO) created a privacy model recognized as a global standard, with 7 foundational principles: (1) Proactive, not reactive; preventative, not remedial — anticipate and articulate cyberrisk and privacy risk from the earliest stage of the systems development cycle. (2) Privacy as the default setting — if users don't modify their settings, their privacy should be guaranteed by default. (3) Privacy embedded into design — giving privacy the same attention as system performance, functionality, availability, and usability. (4) Full functionality: positive-sum, not zero-sum — privacy and security have equal footing with functionality and user experience. (5) End-to-end security: full life cycle protection — privacy originates in design, before the system is set in motion, and must be guaranteed throughout the life cycle of the data. (6) Visibility and transparency: keep it open — transparency in data processing is essential for demonstrating diligence and accountability to regulators and as a measure of trust. (7) Respect for user privacy: keep it user-centric — the ultimate goal must be to guarantee the rights and freedoms of the users whose data is processed.",
                example:"A development team designing a new AI feature so that the most privacy-protective settings are the default, requiring a user to actively opt into less-private options rather than the reverse.",
                tip:"This is genuinely new material to this guide, not a duplicate of anything already covered — Privacy by Design (2.9.1) and Secure by Design (2.9.2, below) are presented as a matched pair in the source, but only Secure by Design had been captured before now." },
              { term:"2.9.2 Secure by Design — Three Principles", summary:"The matched pair to Privacy by Design — now confirmed complete, including the secure-by-default concept.",
                definition:"Like privacy by design, secure by design is a process that ensures technology products are designed with cybersecurity considerations embedded from the start of the development process — involving the application of secure IT development practices and defense-in-depth concepts to prevent cyberattacks. Secure by design also includes secure by default: the concept that technology products include protections against the most common cybersecurity threats and vulnerabilities without any additional charges. The three principles of secure by design are: (1) take ownership of customer security outcomes; (2) embrace radical transparency and accountability; (3) build organizational structures and leadership to achieve these goals.",
                example:"A vendor including baseline protections against common attack types in its product's standard price, rather than selling essential security features as a paid add-on.",
                tip:"'Secure by default' is the specific, testable companion concept to secure by design — the distinction is default protections at no extra cost, versus the broader design process itself." },
              { term:"2.9.3 Explainability: Six Concrete Techniques", summary:"Specific documentation practices tied directly to GDPR and EU AI Act 'right to explanation' obligations.",
                definition:"Unlike typical software, the full instructions of how an AI application or system works are not fully readable/explainable to human users — especially with large, complex models, some trained on billions of parameters that self-learn patterns in data and encode them in high-dimensional matrices. Enacted in 2018, GDPR provides data subjects in the EU some rights with respect to decisions resulting from automated processing; the EU AI Act extends this further with the right to explanation of individual decision-making from an AI system. Techniques organizations can adopt for greater explainability: (1) explain the AI governance implemented to oversee and monitor development and use, including stakeholder groups like data privacy, legal, security, and human resources; (2) explain what personal data, if any, is included in the dataset used in model training, and provide explanations of controls over how data subjects can withdraw their consent to use their personal data; (3) explain how consent in the use of data was collected from the data owner or data subject for inclusion in the dataset for model training; (4) explain the data cleaning process used to correct errors in the dataset for model training; (5) explain the security controls implemented throughout the AI system to restrict access and monitor for harmful, malicious, or accidental tampering of the dataset, model algorithm, and software running the AI system; (6) document the AI model and system design, configurable and tunable hyperparameters, and evaluation metrics to support the design and construction of the model, and explain the training, evaluation, and validation process, including any adversarial, bias, and toxicity testing performed, to support due diligence.",
                example:"A model's documentation package including a specific record of how a user's GDPR-based consent-withdrawal request was processed through the data pipeline, not just a general privacy policy statement.",
                tip:"This connects directly to Domain 1 E.6's Transparency/Explainability/Observability framework — this is the concrete, design-time checklist version of that concept, now tied to specific legal obligations (GDPR, EU AI Act Article 86)." },
              { term:"2.9.4 Robustness: Four Concrete Techniques", summary:"Designing for safe failure, not just correct operation under ideal conditions.",
                definition:"AI system resiliency and robustness ensures the system continues to perform despite unexpected data input, changing conditions, or cyberattacks — achieved by designing the system to expect the unexpected and handle errors in a manner that results in safe failure. Techniques: (1) resilient AI systems should be designed with data input validation checks, and data sanitization to mitigate data input attacks like prompt injections should be ensured; (2) during inference processing, the AI system should protect itself from infinite processing loops or skewed resource utilization by imposing limits and throttling techniques to preserve resources; (3) error handling for common issues should be proactively addressed and monitored to reactively respond with additional actions; (4) if the AI output does not meet defined accuracy, precision, recall, trust, and safety metrics, the AI system should fail in a safe manner to avoid producing harmful outputs.",
                example:"A model that detects its own output confidence has dropped below a safety threshold and returns 'unable to determine' rather than a low-confidence guess presented as fact.",
                tip:"Notice technique 4 — 'fail safely' — connects directly to the Precision/Recall/F1 metrics from Domain 1 C.11, and to overfitting/underfitting detection. Robustness isn't a separate technical skill; it's applying those existing concepts as design-time guardrails." },
              { term:"Changing Conditions and Attacks on AI", summary:"Why robustness has to be an ongoing discipline, not a one-time design checklist.",
                definition:"Changing Conditions — change is a constant that affects many parts of our lives, and it affects AI systems as well. Changing conditions in the data patterns, changing human norms and preferences, and changing environmental conditions (i.e., underlying infrastructure changes) can affect an AI system's ability to maintain robust performance. Postproduction monitoring and maintenance are essential for a robust AI system. Attacks on AI — new technologies often get quickly pummeled with adversarial attacks, as the scope of testing in a nonproduction environment rarely matches the variety of attacks introduced when new users and scenarios appear during real-world use. This has proven true for AI, with new and novel attacks on GenAI. In addition to protecting conventional IT and cloud systems, security teams must safeguard attack surfaces vulnerable to data and model poisoning, data input and instruction substitution attacks, and other emerging AI-specific attacks.",
                example:"A model that passed every robustness test before launch still becoming vulnerable months later as attackers develop new prompt-injection variants nonproduction testing never anticipated.",
                tip:"This is the direct bridge between Section B's design-phase robustness techniques and Section F's full threat catalog — robustness designed once at launch degrades over time unless paired with the ongoing monitoring and threat-detection controls covered later." }
            ]
          }
        ]
      },
      {
        id: "C", title: "Change Management Specific to AI",
        intro: "AI change management builds on conventional IT change management rather than replacing it — the shared goals (informed stakeholders, minimal service impact) stay the same, but AI adds new dependencies that need their own controls.",
        groups: [
          {
            name: "C — Change Management Specific to AI",
            cards: [
              { term:"Shared Change Management Goals", summary:"AI change management builds on, rather than replaces, conventional IT change management.",
                definition:"Conventional software and AI systems share the same core change management goals: all parties involved with or impacted by a change are informed of what's happening, and impact on service quality/availability is minimized. These are achieved through shared commonalities — controlled and structured change processes, the role of testing, rollback plans, and stakeholder management practices.",
                example:"An AI change advisory board following the same rollback-plan and stakeholder-notification discipline used for any conventional software release.",
                tip:"If a question implies AI change management is a wholesale replacement for conventional IT change management, that's wrong — it's an extension with AI-specific additions layered on top." },
              { term:"Data Dependency", summary:"AI systems are unusually sensitive to changes in data — including changes the organization never initiated.",
                definition:"AI has a fundamental dependency on data for its core functionality. Training data is curated with specific structure, quality, and relevance requirements, so the model expects specific input attributes at inference — unexpected changes to those attributes cause problems. Organizations should document data input requirements and align them with production data inputs; changes to data sources or preprocessing may require additional standardization/normalization. Critically, changes can occur that the organization did NOT initiate or control — seasonality, shifting user preferences, or the introduction of new data classes. Data drift monitoring must be part of a robust AI change management program.",
                example:"A retail demand-forecasting model degrading every holiday season because seasonal shifts in customer behavior were never treated as a change-management-relevant event.",
                tip:"The trap is assuming change management only covers changes the organization deliberately makes. External/uncontrolled data shifts still fall inside AI change management's scope, specifically through drift monitoring." },
              { term:"AI Model Changes", summary:"Model behavior can change from a single tuned parameter — no code change required.",
                definition:"Model behavior can be modified or tuned via inference-time parameters (e.g., a GPT-4-class model's \"temperature\" parameter dramatically shifts how \"creative\" vs. deterministic outputs are). Some AI systems rely on a single model; others chain several together. As new model versions are developed, models can be swapped in and out, dramatically altering system output. Model opacity varies significantly based on data sources, training, and the developer's own ethical practices. Governance of the underlying model(s) should be part of the organization's change management program.",
                example:"A support chatbot's tone shifting noticeably after someone quietly raises its temperature setting, with no formal change ticket filed.",
                tip:"A 'small' change like adjusting temperature is still a change-management-relevant event — not just a user preference setting to wave through unreviewed." },
              { term:"Regulatory and Societal Impact", summary:"Change management must also track the regulatory environment and workforce disruption, not just the technology.",
                definition:"Regulation continues to catch up to AI's advancement; some industries face heavier regulatory scrutiny than others. Society is split on AI adoption, and workforce displacement fears are common. Historical precedent: the rise of the personal computer and internet eliminated an estimated 3.5 million clerical jobs in the US over the following decades — but created more than 19 million jobs in computer-related industries. Organizations should include workforce impact analyses in AI deployment and change management processes, including reskilling employees and rethinking what work needs to be done.",
                example:"An organization running a formal workforce impact analysis and reskilling program before rolling out an AI drafting tool to its audit staff.",
                tip:"That 3.5M/19M statistic is specific and named — it supports Domain 1 B.7's 'augmented vs. replaced' framing rather than a wholesale-replacement narrative, and connects the same idea across both domains." }
            ]
          }
        ]
      },
      {
        id: "D", title: "Supervision of AI Solutions",
        intro: "Once an AI solution is live, supervision is how an organization keeps eyes on it — through observability, human oversight gates, and understanding why things like hallucination happen in the first place.",
        groups: [
          {
            name: "D — Supervision of AI Solutions",
            cards: [
              { term:"AI Observability: Three Areas of Focus", summary:"A more detailed breakdown than Domain 1's mention — three specific things to observe.",
                definition:"Data pipelines — the model training/inference pipeline has many steps where issues can arise; observing data flow can reveal prompt-injection attempts and preprocessing/cleaning quality problems. Infrastructure and systems — monitoring compute, storage, and processing telemetry helps anticipate heavy usage that could overload resources, threaten SLA commitments to stakeholders, and helps manage/forecast storage cost. Model performance — collecting input/output data plus user feedback creates a feedback loop enabling drift detection; some model types (e.g., deep neural networks) have hidden layers that make this harder to interpret than white-box models.",
                example:"An observability dashboard flagging a storage-cost spike (Infrastructure) in one panel while a separate panel shows prediction accuracy quietly declining (Model performance).",
                tip:"If a scenario asks which observability category would catch a specific problem (e.g., 'the system is about to run out of storage' vs. 'the model's predictions are quietly getting worse'), match it to Infrastructure vs. Model Performance respectively." },
              { term:"Human-in-the-Loop (HITL) — Supervision Angle", summary:"A required approval gate for critical decisions, with a real speed trade-off.",
                definition:"For critical decisions, HITL places a human in the final decision-making role to approve AI output before it takes effect (e.g., a doctor reviewing an AI diagnosis before it's finalized). The AI workflow must be explicitly designed to require HITL approval under specified conditions before the workflow continues. This slows the system down, so organizations must exercise care in designing where HITL gates are placed.",
                example:"A loan-approval workflow requiring a human underwriter to sign off on any AI-recommended denial before it's communicated to the applicant.",
                tip:"HITL is a supervision/accountability control here — recall from Domain 1 E.4 that it does NOT prevent bias at the root; it catches bad outputs at the decision point." },
              { term:"Causes of AI Hallucination", summary:"Three specific, named root causes — useful for 'why did this happen' scenario questions.",
                definition:"Flawed training data — biased or fictional data that wasn't sufficiently cleansed or properly labeled skews the model's feature weighting. Lack of real-world grounding — humans ground truth in physics, biology, and societal law; AI models have no such grounding, and their only 'truth' is their training data — this is especially acute in generative models predicting tokens, where conclusions can be wrong, nonexistent, or impossible. Ambiguity in data input — insufficient, skewed, biased, or harmful inputs at inference time can't support a correct inference, producing inaccurate output.",
                example:"An LLM confidently citing a nonexistent court case — a lack-of-real-world-grounding hallucination, since the model has no external mechanism to verify the case actually exists.",
                tip:"Three distinct root causes map to three distinct mitigation angles: better data curation (flawed data), RAG/grounding techniques (lack of grounding — direct callback to A.6/C.10), and input validation (ambiguous input)." }
            ]
          }
        ]
      },
      {
        id: "E", title: "Testing Techniques for AI Solutions",
        intro: "Testing AI is complicated by black-box decision-making in some models, but most conventional software testing practices still apply and just need adapting.",
        groups: [
          {
            name: "E — Testing Techniques for AI Solutions",
            cards: [
              { term:"Why AI Testing Is Different", summary:"Black-box decision-making creates new challenges, but conventional testing still applies to most components.",
                definition:"Testing AI solutions can be challenging because the decision-making process of some models may be a black box, creating challenges not typical in conventional software testing. However, conventional testing practices and tools still apply to many components of an AI solution.",
                example:"A team reusing its standard integration-test suite for an AI system's API layer, while needing entirely new techniques to test the model's actual decision logic.",
                tip:"" },
              { term:"A/B Testing", summary:"Comparing two versions to see which performs better — adapted for AI's unique factors.",
                definition:"A/B testing allows for the testing of two versions (A and B) of models or systems to determine which version performs better in delivering the intended outcome. For AI specifically, the organization can vary different features in the data to evaluate a feature's impact on the model. Different model architectures, hyperparameters, and even algorithms can be tested with A/B testing techniques.",
                example:"Running two candidate fraud models side by side in production to see which achieves better precision without sacrificing recall.",
                tip:"" },
              { term:"Unit and Integration Testing", summary:"Breaking a multi-component, multi-model AI system down to test the pieces and the whole.",
                definition:"An AI system may have multiple components and leverage multiple models to perform the functions it was developed to perform. By breaking down the AI system, unit testing validates individual components while integration testing validates that they work correctly together.",
                example:"Unit-testing a RAG chatbot's retrieval component and its generation component separately, then integration-testing the full pipeline end to end.",
                tip:"" },
              { term:"Adversarial Testing and MITRE ATLAS", summary:"Building a knowledge base of expected and incorrect AI responses via AI red teaming, using a named industry framework.",
                definition:"Adversarial testing builds a knowledge base of expected and incorrect responses from an AI system that can be leveraged by AI red teams. For a more thorough knowledge base of adversarial tactics and techniques, the MITRE Corporation developed the Adversarial Threat Landscape for Artificial Intelligence Systems (ATLAS) — a matrix of tactics mirroring the conventional MITRE ATT&CK framework but built for AI: Reconnaissance, Resource Development, Initial Access, ML Model Access, Execution, Persistence, Privilege Escalation, Defense Evasion, Credential Access, Discovery, Collection, Exfiltration, and Impact — each with named techniques (e.g., LLM Prompt Injection appears across Initial Access, Execution, Persistence, Privilege Escalation, and Defense Evasion; Poison Training Data appears under both Resource Development and Persistence; Discover LLM Hallucinations appears under Discovery).",
                example:"An AI red team using MITRE ATLAS technique names as a checklist while planning adversarial tests against a newly deployed LLM application.",
                tip:"Recognize MITRE ATLAS by name, sponsoring body (MITRE), and purpose — you don't need to memorize every technique, but should recognize this is the adversarial-testing-specific technique catalog referenced across Domain 1 (C.3, E.1) and Domain 2 alike." }
            ]
          }
        ]
      },
      {
        id: "F", title: "Threats and Vulnerabilities Specific to AI",
        intro: "AI introduces attack surfaces conventional IT security wasn't built for — the model itself, the training data, and the pipeline connecting them all become targets, on top of the conventional threats that still apply.",
        groups: [
          {
            name: "F — Threats and Vulnerabilities Specific to AI",
            cards: [
              { term:"Development-Time and Runtime Threats Overview", summary:"The two broad phases where AI-specific threats occur, each with named attack types.",
                definition:"Development-time threats — training data leak, training data poisoning (direct or via supply chain), development-time model theft, development-time model poisoning (direct or via supply chain). Runtime threats (threats through use) — evasion, model theft, model inversion, data disclosure, membership inference, denial of model service, prompt injection, input leak, runtime model poisoning, output containing an injection attack. Application and infrastructure threats — conventional attacks still apply: bypassing model access controls, compromising plugins, SQL injection, password guessing.",
                example:"An attacker poisoning training data before deployment (development-time) versus an attacker sending crafted queries to a live model's API (runtime) — two different attack windows requiring different controls.",
                tip:"If a scenario describes an attack happening before the model is ever deployed, it's development-time; if it's happening via the live API/interface, it's runtime." },
              { term:"The Five-Category Impact Legend", summary:"The vocabulary used to tag which kind of harm a given AI threat causes.",
                definition:"Training data confidentiality (T), Model behavior (B), Intellectual property (P), Availability (A), Input confidentiality (L).",
                example:"A denial-of-model-service attack is tagged Availability (A); a model-inversion attack that reconstructs training records is tagged Training data confidentiality (T).",
                tip:"" },
              { term:"Training Data Leakage", summary:"Often exits through the easiest door — a single line of code.",
                definition:"Data can leak from the training environment via weak access controls anywhere in the data supply chain — the originating source, the cleansing/preprocessing platform, or individual dev environments (Jupyter Notebooks, Google Colab). Even with data access limited to authorized staff, these platforms often lack data exfiltration controls. A simple line of Python code can exfiltrate data outside organizational control, making this hard to prevent and detect.",
                example:"A data scientist's notebook silently uploading a training data sample to a personal cloud drive with a single unreviewed line of code.",
                tip:"The mitigation is robust infrastructure/network access controls paired with application-level monitoring — not just data access restrictions alone." },
              { term:"Data Poisoning: Five Entry Points", summary:"Malicious/erroneous data inserted to change model behavior — and it can enter almost anywhere.",
                definition:"Source (changed at the point of collection), Supplier (changed at a third-party data broker or during transfer), In transit (attackers breach intermediary pipeline systems), Preprocessing (cleansing/preprocessing routines modified), In-context training (an external knowledge base used for RAG grounding is poisoned). Two categories of resulting risk: creating a backdoor/Trojan horse to alter specific model behavior, or sabotage to undermine safety, trust, or performance broadly.",
                example:"An attacker poisoning the document store behind a RAG chatbot so it confidently repeats false information sourced from the poisoned documents.",
                tip:"The RAG entry point connects data poisoning risk directly back to Domain 1 C.6/C.10 and Domain 2 A.4's RAG material — RAG reduces some risks but introduces this one." },
              { term:"Model Poisoning: Three Methods", summary:"You can poison a model without ever poisoning its training data.",
                definition:"(1) Poisoning the underlying data; (2) directly altering the model's parameters, architecture, or training libraries (requires access to dev/production environments — access controls should be reviewed regularly to prevent this); (3) poisoning via a third-party model supplier when an organization further trains or fine-tunes a purchased/pretrained model.",
                example:"An organization fine-tuning a vendor's foundation model, unaware the vendor's own training pipeline had already been compromised.",
                tip:"" },
              { term:"Model Theft: Two Methods", summary:"Theft doesn't require ever touching the model's files — and the model itself is often a multi-million-dollar investment worth protecting.",
                definition:"AI model development is a significant investment, often costing millions of dollars, so protecting it as intellectual property matters. At its simplest, an AI model is a mathematical algorithm with a specific architecture (transformers, GANs, RNNs) and feature weights, represented as source code files, configurations, and binaries. (1) Direct theft — gaining access to the system or code repository storing those files/binaries, or where they're loaded into memory. (2) Runtime/query-based reconstruction — sending specifically crafted inputs, analyzing the outputs, and inferring the model's parameters, features, and even training data well enough to reconstruct a functioning copy — without ever accessing source files. Stolen models can also be used to learn how they behave in order to develop further adversarial attacks.",
                example:"A competitor systematically querying a company's public-facing model API and using the input/output pairs to train a functionally similar replica.",
                tip:"Method 2 is the more novel, AI-specific concept — recognize that a model can be 'stolen' purely through its public-facing API." },
              { term:"Prompt Injection", summary:"The SQL-injection of the GenAI era.",
                definition:"An adversarial attack using specifically crafted text prompts designed to make a GenAI model ignore its original instructions and follow the attacker's instead — conceptually similar to a classic SQL injection attack on a database. Popular because they're easy to attempt and don't require deep technical sophistication.",
                example:"A user embedding hidden instructions in a document a chatbot is asked to summarize, causing the chatbot to leak its system prompt instead.",
                tip:"" },
              { term:"AI Solution Disruption (Denial of Model Service)", summary:"Attackers overload availability, not confidentiality or integrity.",
