              { term:"Prepare: AI-Specific Incident Types", summary:"Three named categories of AI incident an IRP must be ready for.",
                definition:"Being prepared provides an organization with the best chance for recovery and long-term resiliency. Many organizations have an incident response program (IRP) but have not adapted their policies, procedures, and people to address AI-specific incidents. AI incidents include: abuse of AI output to create harm to society; disclosure of confidential or personal data from the training dataset; incorrect, hallucinated, or biased predictions. An AI-ready incident response program should address the unique and additive risk and impact an AI incident could have on the organization and the welfare of humans.",
                example:"An IRP that has robust data-breach procedures but has never considered what to do when an AI model itself starts producing hallucinated, harmful output.",
                tip:"" },
              { term:"Prepare: Policies, Procedures, and Model Documentation", summary:"Debate over appropriate AI use belongs OUTSIDE active incident response, not during it.",
                definition:"An incident response policy should address AI-specific threats, techniques for detection and response, and ethical considerations. Debate and decision making over the use of AI should occur outside of active incident response efforts. Maintaining thorough documentation (e.g., model cards) helps incident investigators better interpret the AI model's architecture, training data, and decision-making processes. Documentation should include a communication plan and escalation protocols to ensure the proper internal and external stakeholders, business functions, and law enforcement are informed and called upon for support.",
                example:"An incident responder pulling up a model card mid-incident to quickly understand what data trained the model, rather than debating in real time whether the AI should have been used at all.",
                tip:"" },
              { term:"Prepare: Incident Response Team", summary:"Four AI-specific stakeholder roles beyond conventional IT/security responders — including a brand-new role.",
                definition:"The organization should ensure the AI incident response team includes adequate representation of key stakeholder groups, subject matter experts, and risk management functions. In addition to conventional IT and security incident responders, these stakeholders include: Data stewards/owners — subject matter experts on the dataset used for developing the AI model. Data engineers and scientists — resources involved in the data preprocessing and training of the AI model, who can help interpret the anomalous output and AI behavior. Privacy experts — resources who can guide the incident response on possible impact to personal data, data subject rights, and compliance with privacy and data sovereignty regulations. AI ethicist — a new type of stakeholder trained on and responsible for the safe and ethical use of AI.",
                example:"A data engineer being pulled into an incident specifically to help interpret why the model's behavior looks anomalous, a task conventional IT security responders aren't equipped for.",
                tip:"'AI ethicist' as a named, distinct incident-response stakeholder role is genuinely new territory — recognize it as a real named role, not just a conceptual nice-to-have." },
              { term:"Prepare: Tabletop Exercises", summary:"Forensic tools for a breach are NOT the same tools needed for data poisoning.",
                definition:"The organization should train the AI incident response team on standard operating procedures (SOPs) related to the necessary skills and resources (e.g., audit logs, forensic tools, AI model cards) to handle an incident effectively. The procedures and tools for evaluating a system breach with forensic analysis tools are very different from those used to evaluate data poisoning of an AI model — the latter requires access to or a copy of the data lake in which the data was poisoned. This requires collaboration between the incident response team and data engineering/science teams to analyze the dataset for tampering. Adapting the tabletop exercise toward AI-specific activities like dataset exploration and data input/output analysis can help the response team gain experience and be more effective.",
                example:"A tabletop exercise simulating a poisoned training dataset, requiring the incident response team to practice pulling a data lake snapshot rather than running a conventional breach forensics tool.",
                tip:"" },
              { term:"Identify and Report: Why Detection Is Uniquely Hard for AI", summary:"AI is designed to be wrong sometimes — which breaks the usual definition of 'incident.'",
                definition:"One key attribute of AI is that it's rooted in mathematical probability. AI solutions make mistakes and provide wrong predictions some percentage of the time — this is by design, and AI developers are not aiming to achieve perfection, as overfitted models do not generalize well for new data. Therefore, defining an organization's threshold for categorizing incorrect AI predictions as an incident makes detection of AI threats significantly more challenging. Because of the probabilistic nature of AI outputs, AI observability is crucial in detecting the manifestation of an AI threat — the organization needs clear metrics and a baseline for the AI's performance and normative behavior to determine when an AI solution has veered off course. A combination of techniques is needed to judge the AI solution's performance and detect the incident: while some detection can be automated through AI observability tools, other detection techniques require a human in the loop (HITL) to make judgments on subjective matters. Attacks on data, such as data poisoning, are harder to detect than traditional data loss or leakage incidents, since security teams have been trained to recognize traditional patterns — injection of malicious data, directly or indirectly, can occur in many stages of the data pipeline.",
                example:"A security team debating whether a model's unusual but plausible-looking output is a genuine incident or just expected probabilistic variation.",
                tip:"This threshold-setting difficulty is a direct, named challenge — expect a question asking why AI incident detection is harder than conventional IT incident detection." },
              { term:"Detection Techniques by Attack Type (Figure 2.12)", summary:"Three attack types, each with its own named detection techniques.",
                definition:"Prompt injection — processes to evaluate and sanitize data input into language models to prevent attacks; monitoring of data inputs into the AI model to identify patterns atypical of expected inputs (e.g., code-like structure of text, excessive use of special characters, high-volume but subtle changes to data inputs). Data poisoning — monitoring access and change logs to systems in the data supply chain; review of data preprocessing scripts for unauthorized changes; review of dataset versioning and hashes. Adversarial inference — analyzing application programming interface (API) call logs; scanning for anomalous patterns that could indicate systematic adversarial testing.",
                example:"A security analyst noticing an unusual spike in API calls with subtly varied inputs, consistent with systematic adversarial testing.",
                tip:"Notice this is the SAME three-attack-type structure (prompt injection / data poisoning / adversarial inference) that repeats across Figures 2.12, 2.13, and 2.14 — detection, containment, and eradication are all organized around these same three attack types, making them easy to study as one consistent table rather than three separate ones." },
              { term:"Assess", summary:"Establish the facts fast, without compromising the investigation.",
                definition:"Like conventional IT and security incident techniques, assessment of an AI incident involves collecting facts to establish a timeline, the scope, and the impact. This phase should be completed as quickly as possible, without damaging the integrity of the investigation. Documentation about the AI model can aid in the assessment. Questions to ask include: Has the incident stopped or is it still happening? What are the facts about the incident? (Who was impacted and what harm or negative consequences occurred? When was the incident discovered — important to determine breach notification requirements? What happened — specific details of the incident? What AI systems and data were impacted? What attack tactics were used?) What is still unknown, and what needs to be known in order to return to a safe operational state?",
                example:"An incident responder using a model card to quickly determine which datasets and downstream systems were potentially affected.",
                tip:"" },
              { term:"Respond: Containment (Figure 2.13)", summary:"Isolating the AI system is harder than isolating conventional software — three attack types, three containment techniques.",
                definition:"Conventional strategies to contain, eradicate, and recover are still relevant to an AI incident; however, these strategies can be significantly less effective for AI solutions because of the complexity and probabilistic nature of AI. Actions should be taken to contain an AI incident from spreading further — appropriate actions depend on the circumstances, and threats to human life and safety necessitate immediate action. Isolating and disabling certain AI functionalities may be difficult to deploy because of the complexities involved with AI solutions. Prompt injection — data input and output validation and prompt templates can be deployed to screen and sanitize abusive prompts, shielding the AI model from direct attacks. Data poisoning — access to datasets for all systems involved in the data pipeline should be revoked to contain further direct poisoning; access to code or scripts that execute data preprocessing functions should also be revoked. Adversarial inference — since these attacks leverage validated data input channels (e.g., APIs, user interface), additional data input throttling, validation, and sanitization can reduce systematic inference attacks.",
                example:"Revoking pipeline access to a compromised preprocessing script the moment data poisoning is suspected, before assessing full scope.",
                tip:"" },
              { term:"Respond: Eradication (Figure 2.14)", summary:"You usually can't just 'patch' an AI incident the way you'd patch conventional software.",
                definition:"In conventional software development, security vulnerabilities are patched to eradicate incidents, and intruders can be locked out by changing credentials. For AI incidents, the eradication step is more challenging — it depends on the techniques used by the attacker. Prompt injection — the underlying AI model needs to be retrained or fine-tuned to resist the injections; retraining for LLMs may be impractical and costly, so data input/output validations and prompt templates are still effective long-term controls for LLMs. Data poisoning — poisoned data needs to be isolated and removed from the training dataset, then a new version of the model needs to be retrained, which could be costly and time-consuming for large datasets; short-term actions include data output sanitization to mitigate the impact of poisoned data, while long-term actions include selective retraining on new, clean data that can be used to force the AI model to forget the poisoned data. Adversarial inference — regularization techniques make the AI model more resilient to inference attacks; defensive distillation techniques are also effective.",
                example:"An organization applying short-term output sanitization to blunt a data-poisoning incident's impact while it works through the slower, costlier process of selective retraining on clean data.",
                tip:"Adversarial inference eradication (regularization, defensive distillation) is a genuinely distinct pair of named techniques from the other two attack types — don't default to 'retrain the model' as the universal eradication answer; it's specifically a prompt-injection and data-poisoning technique." },
              { term:"Respond: Recovery", summary:"Some AI-specific attacks can never be fully eradicated — recovery has to plan around that.",
                definition:"Returning the AI solution to a safe and operational state involves steps to ensure the threat has been successfully contained and eradicated. Some forms of AI-specific attacks cannot be fully eradicated. The optimal resolution would reduce the attack surface to prevent relapse, actively monitor for any residual threats, and continuously improve the AI models to build in robustness and resilience. Stricter access controls, new data input/output validations, and other guardrails would need to be implemented. A postincident validation of the new control measures should be carried out, and approval from all relevant stakeholders obtained, prior to reactivating the AI solution.",
                example:"A team implementing stricter input validation and obtaining sign-off from privacy, security, and business stakeholders before flipping a remediated model back on for production traffic.",
                tip:"The explicit acknowledgment that 'some forms of AI-specific attacks cannot be fully eradicated' is a meaningful, testable admission — recovery for AI sometimes means managed risk reduction rather than a clean, fully-resolved state the way conventional IT incidents often reach." },
              { term:"Postincident Review", summary:"The resolved gap — a full postmortem scope, and the shift from reactive to proactive readiness.",
                definition:"A postmortem of AI incidents should be conducted to identify areas of improvement for the AI solution, including data preprocessing, security controls, sufficiency of adversarial testing, data input/output controls, fairness of the outputs, and the AI provider's control environment and processes. Moving from a reactive to a proactive readiness posture can minimize the impact of a future AI incident.",
                example:"A postmortem finding that adversarial testing before launch was insufficient, leading the organization to expand its pre-launch red-teaming scope for all future model releases.",
                tip:"Postincident review explicitly includes assessing the AI PROVIDER's control environment, not just the deploying organization's own controls — a reminder that vendor accountability doesn't disappear just because the incident happened on your side of the deployment." }
            ]
          }
        ]
      }
    ] },
  { id:"d3", title:"Domain 3", full:"AI Auditing Tools and Techniques", weight:"21% of exam · ~19 questions", desc:"Audit planning, testing/sampling, evidence collection, data analytics, and reporting.", locked:false, sections:[
      {
        id: "A", title: "Audit Planning and Design",
        intro: "The steps and concepts around planning and designing audits are similar regardless of the area being audited, but the complexity and emerging nature of AI means additional considerations are needed — asset identification, control mapping, and auditor education all look different for AI.",
        groups: [
          {
            name: "A — Audit Planning and Design",
            cards: [
              { term:"Identification of AI Assets", summary:"AI assets are fundamentally different from conventional IT assets — internal audit should lead the effort but not own it.",
                definition:"An AI Solution (AIS) is not a single application — one AIS may have multiple owners, models, versions, datasets, algorithms, SDLC considerations, and third-party tools (Open Source AI, MLflow, Kubeflow, SageMaker, Azure ML). Internal audit should not lead or manage the AI inventory effort — it should be the department that leads the organization toward better AI/data governance, but ownership sits elsewhere. An AI usage policy is often a good starting point for building an inventory. Data fields to capture: AIS name, version number, license, deployment method, purpose, frequency of use, stakeholders, accountable owner, third-party vendor details.",
                example:"An organization discovering during its first AI inventory effort that three separate departments were independently using different AI tools no one else knew about.",
                tip:"The 'internal audit leads but doesn't own' distinction is a classic ISACA independence trap — don't let internal audit become the accountable owner of the very thing it needs to audit." },
              { term:"Common Types of AI Controls (Figure 3.1)", summary:"Two broad control categories — Governance/Organizational Accountability, and Technical/Security/Privacy.",
                definition:"Governance and Organizational Accountability — a documented charter with clear AI asset ownership; an executive-level role (CDO or CAIO); an AI policy aligned to organizational values; adopted standards/frameworks; an AI asset registry; a risk committee with KRIs for AI-specific risk; AI-aware legal contract management (including vendor consent obligations). Technical, Security, and Privacy — data quality thresholds and monitoring; access controls adjusted for AI data/system classification with MFA; configuration management with automated monitoring; testing frameworks (end-to-end testing, scenario analysis, bias/fairness testing); privacy controls (anonymization, de-identification, key management); data controls (encryption, integrity monitoring, backup); AI incident management tied into the existing breach response plan.",
                example:"An auditor checking whether a documented AI risk committee exists with KRIs, before moving on to check technical controls like access management.",
                tip:"" },
              { term:"AI Documentation, SDLC & Legal/Compliance Controls", summary:"What auditors should expect to see documented, and the EU AI Act's high-risk category list.",
                definition:"Documentation types — dataflow diagrams, explainability documentation, decision-making process documentation, end-user documentation, model documentation, compliance/ethical documentation, data traceability documentation. SDLC controls vary by methodology (DevOps/DevSecOps vs. waterfall) and cover change management, data quality/validation, version management, and deployment approval processes. Legal/Compliance: systems must be iteratively risk-assessed since data and risk change over time. A Fundamental Rights Impact Assessment (FRIA) is required for EU AI Act high-risk systems; a Data Protection Impact Assessment (DPIA) is specific to privacy/data protection risk only. Named high-risk categories requiring a FRIA include biometric identification, critical infrastructure management/operation, education and vocational training, and employment/worker management, among others.",
                example:"An auditor confirming a high-risk AI hiring tool has a completed FRIA on file, not just a DPIA.",
                tip:"This is the same FRIA-broader-than-DPIA distinction from Domain 1 E.8, reinforced here from the audit-documentation angle." },
              { term:"Ethical and Human Values Audit Controls", summary:"What an auditor actually checks for each ethical dimension — concrete verification steps, not just principles.",
                definition:"Ethical impact assessment — conduct one, aligned to industry/corporate frameworks. Consent management — verify opt-out rights, user control over data, documented consent status for training data, retention procedures, and right-to-be-forgotten processes. Bias management — a regular FRIA can enumerate bias-related harms (dignity, discrimination, inequality); check for human bias in the development team itself; test regularly against protected characteristics (e.g., socioeconomic status); facial-recognition error rates as high as 34.7% for dark-skinned females vs. 0.8% for light-skinned males is used here as an audit validation example. Transparency and explainability — validate capability/limitation documentation and confirm use of explainability tools: LIME (explains individual predictions) and SHAP (feature importance for individual predictions), or review decision rules directly for simpler rule-based models. Human oversight — verify a human-oversight process exists, an appeal process for AI decisions, and independent in-house ethical reviews.",
                example:"An auditor confirming a hiring model's documentation cites SHAP feature-importance scores to explain why specific candidates were ranked higher.",
                tip:"LIME and SHAP reappear here as the specific tools an auditor confirms are in use — same tools as elsewhere, but now in an audit-verification frame rather than a developer-tooling frame." },
              { term:"AI Audit Use Cases: Large Language Models (3.3.1)", summary:"Three named LLM applications for IS auditors.",
                definition:"LLM use cases for IS auditors include contract analysis (testing entire contract populations at once, especially useful for third-party service-level comparisons) and data analytics (read-only access across multiple financial data repositories, enabling testing previously infeasible — e.g., detecting false or duplicate invoicing across a multi-location healthcare provider). Risk assessments: feeding LLMs reports from all departments, external sources, third parties, and external organizations, using the outputs to identify and predict areas within the organization that will experience increased risk over time — allowing auditors to proactively audit those areas and potentially avert negative events.",
                example:"An audit team using an LLM to compare hundreds of vendor contracts against required SLA terms in a fraction of the time manual review would take.",
                tip:"" },
              { term:"AI Audit Use Cases: Audit Process Improvement (3.3.2)", summary:"Five ways AI reshapes how audit departments operate, not just what they test.",
                definition:"Eliminating repetitive and manual audits — automating activities like manual reconciliation testing frees auditors to focus on areas requiring more skill. Audit resource allocation — AI can model auditor capabilities, training, and interests to allocate staff across planned audits, helping during overtasked periods, identifying on-the-job training opportunities, avoiding burnout, and ensuring rotation for objectivity (avoiding collusion or negative sympathy). Documentation and reporting — AI virtual assistants can aid with documentation, findings write-ups, recordkeeping, status/report generation, and even peer reviews based on common audit frameworks and standards. Data collection and processing — NLP can record client interviews, summarize them, categorize the information, feed it into working papers, and compare interviews to reveal gaps and inconsistencies. Generating audit reports — combining collected data with GenAI to craft audit reports and remediation recommendations based on testing/interview defects.",
                example:"An AI virtual assistant conducting a department's peer reviews against standard audit frameworks, freeing senior staff from that recurring documentation burden.",
                tip:"" },
              { term:"AI Audit Use Cases: Generative AI (3.3.3)", summary:"Two GenAI-specific applications, distinct from general LLM use cases.",
                definition:"Audit planning — using GenAI to research emerging technology areas, understand a technology, and identify potential risk areas; GenAI can suggest audit areas or evaluate/adjust current audit plans for emerging technology topics or risk. Designing indicative audit scope based on collected data — generating indicative interview questions for audit interviews that incorporate up-to-the-minute data about a topic and emerging threats, vulnerabilities, and risk.",
                example:"Using GenAI to draft interview questions for an upcoming cloud-security audit, informed by that week's emerging vulnerability disclosures.",
                tip:"" },
              { term:"AI Audit Use Cases: Audit-specific AI Applications (3.3.4)", summary:"Five emerging areas where AI-based tools directly power audit work.",
                definition:"Audit sampling — data extraction/analysis tools can test 100% of a population (e.g., every technical change management ticket) instead of a manual subset, improving effectiveness and building new relationships with data owners/stewards as audit secures ongoing 'read-only' access. Pattern recognition in financial data — tools using pattern recognition (e.g., automating Benford's Law to test data distribution) can identify fabricated or manipulated data. Anomaly detection techniques — ML-based tools (including SIEM) establish baseline behavioral profiles and analyze behavior in real time, combining with statistical analysis to predict risk trends. Continuous monitoring approaches — replacing manual repetitive testing (e.g., monthly corporate credit card testing) with automated capture, testing, and reporting for duplicates, fraud, misuse, or policy failures. Process automation — combining automation, pattern recognition, anomaly detection, and process automation end-to-end: access data monthly, extract it, load it for analysis, test against defined outcomes, generate a report with visualizations, and distribute it automatically.",
                example:"An automated process extracting corporate credit card data monthly, testing it against fraud/misuse criteria, and emailing a findings report with visualizations — with no manual audit intervention.",
                tip:"Benford's Law is a specific, named, testable detail here — it's a statistical law about the expected distribution of leading digits in real-world datasets, used to flag fabricated or manipulated numbers." },
              { term:"Internal Training for AI Use: Foundations", summary:"Why a shared organizational definition of AI has to come before any training program is built.",
                definition:"Educational programs, skill development, and competency measures designed to help audit staff effectively work with and evaluate AI systems are key to an effective AI audit — auditors must embrace AI's dynamic nature and undertake continual education. Before defining an AI education program, the enterprise needs an agreed-upon definition of AI, based on industry thought leadership (e.g., the OECD's definition) or on regulation (e.g., the EU AI Act's definition). An important characteristic to remember regardless of which definition is used: AI systems are created to be trained — they are not programmed the way other applications are. A shared definition matters because public AI awareness has grown loosely since ChatGPT's public release, and terms like artificial intelligence, machine learning, and deep learning are often used interchangeably by nonexperts as just 'AI' — auditors should be able to account for this nuance when interviewing stakeholders and aggregating data. AI, ML, and Deep Learning (DL) exist in a nested hierarchical relationship, with Data Science and Generative AI as related, overlapping fields — understanding these relationships helps auditors identify what technologies are actually in use and tailor education programs accordingly.",
                example:"An auditor discovering during stakeholder interviews that what one team calls 'our AI system' is actually a simple rules-based automation with no machine learning component at all.",
                tip:"The Figure 3.3 key-terms table referenced alongside this (AI, AGI, ANI, ML) uses the same definitions as Domain 1 Section A.1/A.4 — this is a cross-reference back to material already covered, not new content." },
              { term:"Key AI Education Areas for Auditors (Figure 3.4) + Practical Skills Development", summary:"What auditors need to know, and how they should build that knowledge hands-on.",
                definition:"Technical knowledge areas: basic AI/ML/NLP/computer vision concepts and terminology; common AI models; bias; AI governance; AI ethics (an applied subfield covering fairness, transparency, privacy, human rights, security, societal impact, sustainability — and a theoretical subfield covering consequentialism, virtue ethics, deontology); Trustworthy AI (core concepts: explainable, transparent, fair, robust/reliable, understandable/interpretable, accountable, safe, secure); AI risk assessment frameworks; audit-specific AI applications; regulatory/compliance considerations. Practical skills development: effective AI auditing requires cross-disciplinary expertise (IT, data science, ethics, domain knowledge) — often a real limitation for auditors; hands-on experience, case studies, and simulation exercises (analogous to disaster-recovery drills) build this skill set; training must be ongoing given how fast AI evolves.",
                example:"An audit department running a simulated AI-incident tabletop exercise the same way it already runs disaster-recovery drills.",
                tip:"Trustworthy AI's 8 core concepts here are a different list from Domain 1's OECD 8 program-metric objectives (B.8) — don't conflate the two frameworks even though both use '8 named qualities' as their structure." }
            ]
          }
        ]

      {
        id: "B", title: "Audit Testing and Sampling Methodologies",
        intro: "AI audit testing incorporates specialized knowledge about AI, ML, and NLP into an expanded scope — determining if outcomes are based on reliable, unbiased data, if decisions are explainable, and if outcomes introduce undue risk.",
        groups: [
          {
            name: "B — Audit Testing and Sampling Methodologies",
            cards: [
              { term:"Designing an AI Audit", summary:"Scope must go beyond technical review into ethics, trust, and long-term strategic risk.",
                definition:"An AI audit begins with establishing scope and objectives like any audit, but must also include ethics, trustworthiness, and privacy considerations. Auditors must determine and report on efficiency, operational controls, security, safety, regulatory compliance, ethical, and trust dimensions of AI systems — plus the organization's governance, processes, and accountability for AI. A top-down, strategic approach is needed: the audit function should focus on potential long-term risk and impact (regulatory noncompliance, ethical challenges, reputational harm, sustainability of AI deployments) rather than narrowly reviewing technical implementation.",
                example:"AI can both enable and hinder corporate ESG efforts — auditors need judgment, independence, and strategic risk management to assess that long-term impact correctly.",
                tip:"The 'top-down, strategic, not narrowly technical' framing is a direct callback to Domain 1 A.8's business-use-case-first principle, now applied to how audit itself should scope its work." },
              { term:"AI Audit Objectives", summary:"Six specific goals an AI audit is checking for.",
                definition:"A consistent, integrated development approach aligned with enterprise goals; design and outcome decisions in line with enterprise strategy; enterprise project management and financial reporting/controls followed and reported; SDLC processes overseen effectively and transparently; compliance with legal/regulatory requirements validated; operational reporting on outcomes, performance, obligations, and ethics made to the accountable owner and AI governance committee.",
                example:"An audit report confirming that operational reporting on an AI hiring tool's outcomes reaches both the accountable owner and the AI governance committee, not just IT.",
                tip:"" },
              { term:"Audit Scoping and Resources (Figure 3.5)", summary:"Six concrete scoping steps, plus a note that auditors are expected to use outside expertise.",
                definition:"IS auditors are expected to quickly learn AI as a new technology, so appropriately skilled staff or external advisors should be leveraged to consult or co-source audit work when appropriate. Scoping steps: (1) determine the systems to be audited and their owner/accountable department; (2) decide what data will be accessed and tested, and obtain access; (3) determine where development, documentation, testing, and reporting are recorded, and acquire access; (4) review existing assessments and testing results (second-line testing, trustworthy AI/ethical assessments, privacy and security testing); (5) ensure all applicable AI regulations and laws are accounted for in planning; (6) obtain AI documentation (explainability/transparency documentation, ethics and bias documentation and outcomes).",
                example:"An audit team co-sourcing with an external data science advisor to properly scope a first-time AI audit.",
                tip:"" },
              { term:"AI Audit Testing Areas: Definition and Development", summary:"The first two of five testing areas — validating the 'why' and the 'how it was built.'",
                definition:"Definition — validates that the enterprise fully understands the 'why' of the AI solution. Testing considerations: problem statement, business value, current processes/products, change management, transparency for users (internal and external), incorporation of ethical considerations, adoption/implementation plan. Development — investigates how the AI solution was created, including methodology and process soundness. Testing considerations: data governance (access controls, retention policies, ongoing model management); full testing population sampling (data relevant to the domain, representative of edge cases, demographic diversity, subgroups); data quality (duplicates, errors, typos, special characters — monitored over time); data collection/aggregation methods and access controls (e.g., are public APIs password-protected?); data integrity verification by comparing samples from the original dataset against the integrated version.",
                example:"An auditor checking whether a hiring model's training data was tested for demographic diversity and edge cases before the model was ever trained.",
                tip:"" },
              { term:"AI Audit Testing Areas: Testing and Deployment", summary:"The next two testing areas — does it work, and was it released responsibly.",
                definition:"Testing — provides assurance that the processes used to train and validate the model are sound. Testing considerations: does the model make correct/expected predictions or actionable outcomes; is the model meeting required SLAs; has the developer conducted tests to represent real-world conditions. Deployment — evaluates the processes allowing the AI solution to go live, internally or externally. Testing considerations: rollback plan if needed; training and change management for end users; operational-development integration for model improvement; model, system, and interface updates and patching.",
                example:"An auditor confirming a documented rollback plan exists before a new model version is allowed to go live.",
                tip:"Definition/Development/Testing/Deployment/Operations — five audit testing areas, distinct from (but mapping loosely onto) the life-cycle phase models in Domain 1 A.7 and Domain 2 B.1. Keep the audit testing area framing separate from the life-cycle phase framing." },
              { term:"AI Sampling: Why It's Different", summary:"The scale and diversity of AI data usually rules out full-population testing.",
                definition:"A major difference between AI sampling and traditional sampling is the large and diverse amount of data involved, often collected from multiple sources. Due to dataset size, auditors will likely not have the ability to test the entire population. It's not expected that IS auditors manually reperform the model's calculations — but they do need to consider sampling, selecting method and size based on findings from the AI audit design and scoping phases.",
                example:"An auditor deciding a sampling approach for a fraud model trained on millions of transactions, rather than attempting to reperform every calculation.",
                tip:"" },
              { term:"Data Population Sample Testing", summary:"Three named sampling approaches for AI-specific data.",
                definition:"Random sampling — select data randomly from the total set (e.g., picking 10 of 100 resumes in an AI recruiting tool). Stratified sampling — select the sample based on characteristics in the data (e.g., 'years of experience in the role' as the key characteristic in the hiring example). Data splitting considerations — if the dataset has already been split into training/validation/test, select a sample based on the same ratio used for that split.",
                example:"An auditor selecting a stratified sample of resumes based on years of experience to test for bias across experience levels.",
                tip:"" },
              { term:"Judgmental Sampling", summary:"Nonprobability sampling that leans entirely on the auditor's subject-matter expertise.",
                definition:"A form of nonprobability sampling where samples are selected based on the auditor's judgment. Requires real subject-matter expertise — in AI audit, this is essential for determining whether outcomes are accurate or whether training data truly represents the deployment population.",
                example:"Auditing AI used in medical diagnostics requires the auditor to be knowledgeable about medical records, diagnostic practices, and the typical population relative to the condition being tested, selecting samples based on that personal knowledge rather than random or stratified methods.",
                tip:"" },
              { term:"Testing AI Outcomes: Underfitting and Overfitting (Audit Angle)", summary:"Same concepts as Domain 1 A.5, now framed as things an auditor verifies.",
                definition:"Underfitting — the model is too simplistic to identify patterns; performance is poor on both training and test data, showing bias in predictions. Audit should ensure processes exist to evaluate the cause (bad/insufficient data, or a model too simplistic for the data type) and determine a solution. Overfitting — the model is trained too precisely on the training data, including its noise and outliers; it performs excellently on training data but poorly on new/real-world data. Auditors should validate the processes undertaken to train and analyze results to determine whether overfitting is occurring, since a deployed overfit model will make faulty predictions.",
                example:"An auditor requesting evidence of the process used to compare training vs. test performance, rather than accepting the developer's word that the model 'works well.'",
                tip:"This is auditing FOR the Domain 1 A.5 concepts, not just knowing the definitions — the exam angle here is 'what process should exist to catch this,' not 'what is this.'" },
              { term:"Outliers", summary:"Outlier testing needs to happen at multiple points, and auditors have real tool options.",
                definition:"Outliers represent a deviation from the normal data distribution, or an abnormally large/small value. They should be tested for in data acquired for training, validation, and testing, and during model training itself — outlier data isn't just noise, it can introduce bias into the training process. Auditors should verify tools/techniques exist to test for outliers.",
                example:"An auditor loading a sample of training data into MS Excel, Power BI, or Tableau to visually examine distribution patterns based on the model's key parameters.",
                tip:"" },
              { term:"AI's Impact on the Audit Profession Itself", summary:"AI is already replacing manual audit work — and creating new validation obligations.",
                definition:"AI is already impacting the audit profession — automated data analytics is replacing manual financial testing, and this will only increase. While AI offers opportunities for more precise, efficient, and accelerated results, auditors are still needed both to validate AI's completed work and to validate the accuracy of the underlying data.",
                example:"An audit team using AI-powered analytics to test 100% of transactions, while still manually validating the accuracy of the underlying data feeding that analysis.",
                tip:"This connects to Domain 1 B.7 and Domain 2 C.3's 'augmented, not simply replaced' framing — here applied to the audit profession specifically auditing itself." },
              { term:"Sample AI Audit Process: Full Worked Example (Figure 3.7)", summary:"A complete 8-step audit case study on a high-risk EU AI Act hiring tool — worth knowing end to end.",
                definition:"For an organization's AI-based recruitment tool (a high-risk system under the EU AI Act), the audit process is: Scoping — define what's in scope (the model, data sources like applications/resumes/social media, decision-making processes) and applicable laws (e.g., equal employment opportunity laws). Data Collection — collect/review training datasets (historical hiring data, candidate demographics, protected class data, performance metrics); verify data is complete, diverse, error-free; confirm candidate consent for data use. Model Assessment — inquire how the model was designed/trained; assess architecture (decision trees, neural networks), explainability, dataflows; review hyperparameter documentation; evaluate performance metrics (e.g., 85% accuracy, F1 score) and how success thresholds were chosen. Bias and Fairness Assessment — analyze outputs for disparities by gender, ethnicity, age, or other protected class (e.g., if 75% of 'acceptable' candidates are male while only 50% of total applicants are male, that indicates potential bias). Transparency and Explainability — review documentation explaining why specific candidates were recommended, confirming criteria were clearly communicated. Compliance Assessment — verify lawful, transparent processing of personal/protected data; check where the model is deployed (local vs. globally accessible) and confirm compliance with relevant jurisdictional mandates. Performance and Outcomes — verify the model provides 'acceptable' hires consistently over time (a long-term evaluation point); compare retention rates of AI-selected hires against traditionally-hired employees (e.g., 90% vs. 70% one-year retention) as effectiveness evidence. Reporting — document findings (scope, objectives, regulatory requirements, biases, compliance issues, performance issues, ethical defects, accountability concerns) with recommendations (e.g., retraining with more diverse data); obtain management agreement and ownership. A final Remediation and Monitoring step tracks recommended actions to completion and reports status to stakeholders, typically managed by risk management or internal audit.",
                example:"A finding that 75% of 'acceptable' candidates are male against a 50% male applicant pool, triggering a recommendation to retrain the model with more diverse data.",
                tip:"This worked example ties together nearly every concept from Sections A and B — expect scenario questions built directly around this hiring-tool case study." }
            ]
          }
        ]

      {
        id: "C", title: "Audit Evidence Collection Techniques",
        intro: "Data serves as the foundation for AI model learning and performance — and it's also the raw material of AI audit evidence, which brings its own collection risks distinct from the risks in the AI system being audited.",
        groups: [
          {
            name: "C — Audit Evidence Collection Techniques",
            cards: [
              { term:"Training Data as Audit Evidence (3.10.1)", summary:"What the model learns from — and the direct link to overfitting.",
                definition:"Training data is the data with which the model is trained, or that allows the model to learn patterns, relationships, and predictions. For supervised learning, this data has defined input-output pairs (a known label for each input). For unsupervised learning, there's no labeled output pair — the model must discover patterns and relationships without labeled guidance. Training data can take many forms (images, text, audio, and more) and can be structured, unstructured, or semi-structured. Critically, it must be the highest quality and genuinely represent the population the model will classify — high-quality data helps avoid overfitting the model.",
                example:"An auditor asking what data was used to train a model as a first step, since a mismatch between training data and the real deployment population is a leading root cause of poor model performance.",
                tip:"The overfitting connection here is direct: training data must represent the real population, or the model risks overfitting — this ties straight back to Domain 1 A.5's overfitting/underfitting definitions and Domain 3 Section B's audit-of-that-process framing." },
              { term:"Testing and Production Data as Audit Evidence (3.10.2)", summary:"Includes a genuinely new concept — AI-generated synthetic test data.",
                definition:"Testing data is used to tune a model's functionality, performance, and output to determine how well it will perform on comprehensive, real-world data and scenarios; it must remain distinct from training data. Testing data generated by AI is called synthetic data — designed to be diverse and comprehensive, sometimes created by training a separate model to generate data under strict statistical guidelines, or by combining deep learning methods with Generative Adversarial Networks (GANs) and Variational Autoencoders (VAEs). Key audit questions: was test data appropriately separated from training data, and how was synthetic data generated? Beyond testing, production data (for deployed models) is essential to a product's success — it may come from a population directly (e.g., wearable-device health data), be purchased, be crowdsourced, or be collected internally. Key questions: what data is used in production, how was it sourced, and how is it stored over time to ensure the model doesn't drift?",
                example:"An audit team recommending synthetic data generation via GANs when an organization's real training data is too sparse to adequately represent rare fraud cases.",
                tip:"Synthetic data is a genuinely new concept here, not a restatement of anything in Domain 1 or 2 — GANs reappear from Domain 1 A.2 as the generation mechanism, but their use as an audit-evidence data-augmentation tool is new." },
              { term:"Unstructured and Structured Data Collection (3.10.3)", summary:"Two different collection approaches, with structured data creating a new organizational risk for audit itself.",
                definition:"Unstructured data comes from varied sources: file share directories, MS Office/flat files, audio files, image files, email, social media posts. Structured data is organized in a predefined format, typically in a relational database with a schema and often a data dictionary (data type, size, format, relationships). Auditors have recently begun collecting structured data into their own data stores for regular data analytics testing or continuous auditing — audit departments are becoming data collectors themselves, and this trend will only grow. For AI specifically, auditors should pay close attention to where structured data lives and what access limitations apply to it — a misconfiguration could grant a tool like Microsoft Copilot access to restricted shares, letting that unstructured data be indexed, analyzed, and used to answer internal questions it was never meant to touch. This increases the risk of audit becoming a target for internal and external bad actors, and represents a paradigm shift requiring audit to follow organizational data-protection policies and international audit standards for its own data stores.",
                example:"A misconfigured permission on a restricted file share silently letting Microsoft Copilot index and surface sensitive documents in answers to unrelated internal questions.",
                tip:"" },
              { term:"Extract, Transform, and Load (Audit Context)", summary:"A familiar audit concept, now increasingly automated and AI-agent-driven.",
                definition:"Data is identified in data stores, extracted (by a process or middleware tool) into a repository managed by the audit department, then transformed/'cleaned' so it's usable for analysis, then loaded into the target system for testing via querying and analysis. Popular audit ETL tools include Audit Command Language (ACL), Tableau, and Power BI. With AI, this process can become fully automated. There's a growing trend of audit using AI agents both for data collection and for testing, including 'fuzzy' testing to predict outputs or identify patterns.",
                example:"An AI agent monitoring the HR system, extracting new-hire data, validating and checking it for changes, then conducting tests like user access certification and recertification.",
                tip:"" },
              { term:"Data Manipulation Risks in Evidence Collection", summary:"Three named risks an AI auditor must account for in the evidence itself, not just in the AI system being audited.",
                definition:"Bias — data scientists may unconsciously or consciously introduce bias in model design or data selection, creating a relationship between training data bias and biased outcomes disadvantaging one group; auditors themselves may also carry bias in their selection and use of data for audit analytics. Data poisoning — an attacker or malicious actor introduces data to skew output to their advantage; data management controls help auditors determine if data has been changed. Adversarial attacks — particularly damaging for LLMs, where an attacker manipulates input data to deceive the model into incorrect decisions or harmful output; tools exist to test for adversarial prompts (e.g., the open-source tool LLMFuzzer tests LLM response robustness) — and internal audit itself, as it builds these capabilities, may become newly vulnerable to similar attacks.",
                example:"An audit team's own newly-built LLM-powered analytics tool becoming a target for the same prompt-injection attacks it was built to help detect elsewhere.",
                tip:"" },
              { term:"Data Scraping", summary:"Useful for LLM-scale data needs, but increasingly less effective against modern websites.",
                definition:"Data scraping aggregates data from multiple websites into one location; however, modern websites are dynamic, making scraping less effective than methods like APIs. Still especially useful for LLMs, which need vast amounts of data. Questions to ask: How is the data scraped and validated? How efficient is the scraping process? Do scraping scripts need frequent tuning? Is there manual intervention to clean scraped data, and does that intervention introduce a data integrity concern?",
                example:"An auditor questioning whether manual cleanup of scraped vendor pricing data introduced any integrity concerns before it was used as audit evidence.",
                tip:"" },
              { term:"Optical Character Recognition (OCR)", summary:"A decades-old technology, dramatically improved by pairing with AI.",
                definition:"OCR converts printed/scanned data into digital text that can be extracted, manipulated, changed, captured, and analyzed — in use since 1934. Combining AI with OCR has dramatically increased accuracy. Particularly helpful for auditors scanning large volumes of documents that would otherwise require manual reading.",
                example:"Using OCR to read every IT contract, extract SLA data, create an SLA matrix, compare it against actual IT reporting data, and immediately generate a report of vendors not meeting SLA targets — with high accuracy in a fraction of the time.",
                tip:"" },
              { term:"Voice to Text", summary:"Useful for interviews and meetings, but carries real jurisdiction-specific consent and data-control risk.",
                definition:"Used to capture and analyze interview or meeting details for future use or pattern matching. Auditors should be careful — some tools process audio by taking it off-site, which removes data from audit's control and can create integrity and privacy issues. Auditors will need consent in some jurisdictions to collect, process, and store data from an interview or speaker, and in some jurisdictions, offsite-processed data would be considered breached.",
                example:"An audit team confirming a voice-to-text tool processes recordings locally before adopting it for sensitive interviews in a jurisdiction with strict data-residency rules.",
                tip:"This connects to Domain 1 D.2's consent framework — the AI-specific twist is that voice-to-text tools may silently move data outside the organization's control." },
              { term:"Walkthroughs and Interviews: The Audit Question Bank", summary:"A real, organized bank of interview questions across four categories — this is what auditors actually ask.",
                definition:"Both walkthroughs and interviews are essential to audit, and many departments build a structured approach to them into their methodology. Representative questions by category: Model Assessment — Were preprocessing steps documented? Does data need cleaning or anonymization, and how is that anonymization validated? Is the data of sufficient size and diversity to represent the use case? What algorithms are used and why were they chosen? Were models developed in-house or purchased? What documentation exists on model capabilities and how outputs are derived? Can decisions be explained to nontechnical stakeholders? Has an approach been implemented to disclose to users that they're interacting with AI? Bias and Fairness — Does the model handle protected class data, or make potentially harmful/sensitive decisions (critical infrastructure, law enforcement, biometrics, migration, essential services, education, justice, hiring)? What steps identified bias in data, was bias detected, and was it remediated? How have edge cases been tested, and on diverse groups of stakeholders? What ongoing reporting exists on bias and fairness over time? Performance and Outcomes — How was outcome testing conducted? Were adversarial prompts/injections or other vulnerabilities tested, and with what results? What automated testing tools were used (e.g., pytest, PyTorch Lightning, TensorFlow Extended, GitHub Actions)? How is model code protected, who validates it, and who can release it to production? Is there human oversight in decision-making, and how is model drift monitored over time? Compliance Assessment — How were relevant laws and regulations determined, and is there a compliance register? Does the organization need to notify a regulator or market surveillance body that the model is deployed (EU AI Act)? Has the AI system undergone a required conformity assessment? Can users opt out of AI-made decisions, and can they contest them? What's the process for reporting incidents or breaches?",
                example:"An auditor using the compliance-assessment questions to confirm a high-risk hiring model actually underwent its required EU AI Act conformity assessment before deployment, not just a general legal review.",
                tip:"This question bank is the practical toolkit behind Section B's Sample AI Audit Process case study — many of B.12's audit steps map directly onto specific questions from this bank." }
            ]
          }
        ]
      },
      {
        id: "D", title: "Audit Data Quality and Data Analytics",
        intro: "AI models rely on huge amounts of data to function effectively. IS auditors play a key role not only in providing assurance over that data's quality but also in ensuring any AI used by the audit team itself adheres to high data standards.",
        groups: [
          {
            name: "D — Audit Data Quality and Data Analytics",
            cards: [
              { term:"Data Quality, Integrity, and Profiling", summary:"Three related-but-distinct concepts, with data integrity as a narrower subset of data quality.",
                definition:"Data quality processes assess how well a dataset meets standards for accuracy, completeness, validity, consistency, uniqueness, timeliness, and fitness for purpose (7 dimensions) — critical across AI, audit, and data governance alike. Data integrity focuses on only a subset of these attributes — specifically accuracy, consistency, and completeness — plus data security, implementing safeguards against unauthorized manipulation or corruption through human error or malicious actors. Data profiling produces summary data about data (metadata) with multiple downstream uses.",
                example:"A dataset that's accurate and complete but inconsistently formatted would pass data integrity checks on two counts but still fail overall data quality on consistency.",
                tip:"This is the fuller, 7-dimension version of the data quality list that Domain 2 Section A.6 only partially captured (Accuracy, Consistency, Uniqueness) — worth reconciling the two." },
              { term:"Data Optimization", summary:"Nine named data-management disciplines that support both AI systems and audit's own data use.",
                definition:"Establishing data governance policies/practices to maintain quality, security, and compliance during optimization; managing/controlling storage infrastructure to minimize space and consumption; enhancing speed/efficiency of transformation, analytics, and computation; data cleaning and quality improvement (resolving inconsistencies, errors, missing values); data integration (combining multiple sources into a coherent unified form); data life cycle management (availability and proper disposal of data); query and access enhancement to boost database performance; cost-effective data strategies balancing cost against performance/reliability; data security and compliance (access controls, encryption, auditing) using scalable technologies for growing data volumes.",
                example:"An audit department applying data life cycle management to properly dispose of sensitive data it collected for a completed engagement.",
                tip:"" },
              { term:"Data Analytics in Audit", summary:"Already reducing manual audit work, and expected to free auditors for higher-value strategic work.",
                definition:"At its most basic, data analytics is the interrogation of data to provide factual and actionable insight, using a range of paid and free tools, technologies, techniques, and processes. Audit departments can eliminate several manual and repetitive audits through data analytics in areas such as technical change management, corporate credit card analysis, accounts payable analysis, and fraud detection. As AI increases the potential for factual, actionable insight and automates more of the testing/reporting workflow, auditors gain more time for strategic and project auditing.",
                example:"An audit team automating its corporate credit card analysis so staff can redirect time toward higher-risk strategic engagements.",
                tip:"" },
              { term:"Sentiment Analysis (Audit Application)", summary:"The same NLP technique from Domain 1 A.5, now applied as an audit analytics tool.",
                definition:"Sentiment analysis algorithms — likely including logistic regression, Naive Bayes, and support vector machines (source text partially unclear on the exact algorithm list) — are trained to gauge sentiment in blocks of text through a combination of analyzing words and the order in which they appear.",
                example:"An audit team running sentiment analysis on customer complaint logs to prioritize which recurring issues to investigate first.",
                tip:"⚠️ Minor gap: the exact algorithm list is unclear in the source material — Naive Bayes and SVM are confirmed, the third algorithm named is less certain." },
              { term:"Data Reporting and Visualization", summary:"Turning analytics output into decision-useful, visual findings.",
                definition:"Data reporting is the collection and summarization of insight from AI-driven analytics, improving decision-making and business outcomes. Fundamental to this is data visualization — graphical representations of patterns discovered in data analysis, using both paid and free tools. Data analytics yields reports of defects and findings identifying risk and control/process gaps; tools like Tableau and Power BI can generate reports or dashboards for these findings.",
                example:"An audit team building a Power BI dashboard that visualizes active vulnerabilities by category for ongoing reporting to stakeholders.",
                tip:"" }
            ]
          }
        ]
      },
      {
        id: "E", title: "AI Audit Outputs and Reports",
        intro: "Audit reports for AI provide the same details and depth as conventional audit reports, with additional data and report points layered in to address AI's unique considerations.",
        groups: [
          {
            name: "E — AI Audit Outputs and Reports",
            cards: [
              { term:"AI Audit Report Structure (Figure 3.14)", summary:"The same depth as a conventional audit report, with AI-specific data and points layered in.",
                definition:"Audit reports for AI provide the same details and depth as conventional audit reports with additional data and report points. Standard sections: Executive summary (key findings/actions summary, audit conclusion and opinion, overall audit rating). Scope and objectives (scope overview — accountabilities, systems, models, data, processes, and controls in scope; methodology and objectives covering data management, quality and integrity, data privacy, security testing, technology and process testing, SDLC, change management, configuration management, release management, ethical testing outcomes, and internal/external compliance and regulatory adherence). Findings — linked to risk assessment and controls assessment mappings, recommended action items and remediation timelines, operational and financial considerations, and management owners and responses. Appendices — further technical or statistical detail. This is provided as an example, not an exhaustive template — actual reports depend on the enterprise.",
                example:"An AI audit report's executive summary stating an overall audit rating, while the appendices carry the detailed statistical bias-testing results referenced in the findings.",
                tip:"" },
              { term:"Advisory Reports", summary:"Controversial but increasingly valuable — audit's insider knowledge as a consulting asset.",
                definition:"Advisory reports are generated by internal audit as consultancy engagements. While controversial, they play an increasingly needed role — auditors know the organization, its processes, its people, and its technology at a level external consultants can't match, and this can meaningfully reduce unintended consequences in AI development and deployment. Considerations: Scope — the advisory engagement is not an audit; goals should be formalized, documented, and agreed upon with stakeholders, including who receives the report, the timeline for work and deliverables, and communication channels. Risk considerations — the auditor should advise on risk management and control improvements, including guidance through remediation, provided the auditor/consultant does not design the organization's controls or take ownership of a process or control.",
                example:"An internal auditor advising a development team on AI risk controls during design, without ever taking ownership of implementing those controls.",
                tip:"That last independence boundary — advise, don't design or own — is the same principle as Domain 1 B.4's 'Internal Audit assesses, does not own' concept, reapplied to advisory work specifically." },
              { term:"Charts, Visualizations, and Dashboards", summary:"Visualizations belong in the report itself or its appendices — and their use is only growing.",
                definition:"All data analysis visualizations should be included — referenced or used to highlight insights, or grouped in appendices and referenced in the front matter. Dashboards are very important to audit stakeholders, audit committees, and boards, who often use visualizations to quickly assess key aspects of a report; whether generated from data analytics output or composed by AI agents/assistants, dashboard use will keep increasing across all auditing, not just AI auditing. Heat maps should be generated from the standard audit reporting/ratings methodology the department uses, or from the business's risk management framework.",
                example:"A board member scanning a heat map dashboard to quickly identify which audited AI systems carry the highest residual risk rating.",
                tip:"" },
              { term:"Audit Follow-up (including Automated Follow-up)", summary:"AI audit follow-up can be faster than conventional follow-up because the auditor sees remediation happen in real time.",
                definition:"Follow-up is very important in AI audit and may take a different shape than conventional audit follow-up. An auditor following an AI project's deployment observes remediations as they occur — so once audit reports are issued and tracking begins, the auditor can see remediation happen and close open actions more quickly. As AI systems become integrated across the ecosystem, the opportunity exists to automate the follow-up activities conducted by auditors.",
                example:"An auditor tracking a bias-remediation action item and confirming it's resolved as soon as the retrained model is deployed, rather than waiting for a separate follow-up review cycle.",

    { q:"An organization needs to assess credit risk using a model that can manage complex, nonlinear relationships and provide an interpretable decision path. Which algorithm class is MOST appropriate?", options:["Tree-based models","Hierarchical clustering","Principal Component Analysis","Deep Q Networks"], correctIndex:0, explanation:"Tree-based models are the go-to choice for nonlinear relationships requiring an interpretable decision path (A.4)." },
    { q:"A team has only a small amount of labeled training data but still needs a reliable image classifier. Which algorithm is BEST suited to this constraint?", options:["Support Vector Machine (SVM)","K-means clustering","Policy-based reinforcement learning","Hierarchical clustering"], correctIndex:0, explanation:"SVMs are specifically noted for working reliably even with relatively small amounts of training data (A.4)." },
    { q:"A marketing team wants to segment customers into a predefined number of groups for a campaign, with no existing labels to guide the grouping. Which technique is MOST appropriate?", options:["K-means clustering","Linear regression","Support Vector Machine","Q-learning"], correctIndex:0, explanation:"K-means is the defining technique for grouping unlabeled data into a predefined number (K) of clusters around centroids (A.4)." },
    { q:"A genetics research team wants to visualize nested relationships between genes without pre-specifying how many groups should exist. Which technique is MOST appropriate?", options:["K-means clustering","Hierarchical clustering","Principal Component Analysis","Logistic regression"], correctIndex:1, explanation:"Hierarchical clustering builds a nested tree (dendrogram) of clusters without requiring a predefined K, unlike K-means (A.4)." },
    { q:"Before training an image classifier, a team wants to reduce a very large number of correlated input variables into a smaller set of uncorrelated components. Which technique is MOST appropriate?", options:["Principal Component Analysis (PCA)","K-means clustering","Support Vector Machine","Deep Q Network"], correctIndex:0, explanation:"PCA is specifically used to reduce dimensionality by transforming correlated variables into uncorrelated principal components — a different goal from clustering (A.4)." },
    { q:"A robotics team wants an agent to learn the best action for each state using a lookup table of values, without needing a model of the environment. Which technique is MOST appropriate?", options:["Q-learning","Deep Q Network (DQN)","Policy-based methods","Convolutional Neural Network"], correctIndex:0, explanation:"Q-learning is the model-free reinforcement learning technique that maintains a Q-table of state-action values — DQN extends this with a neural network for high-dimensional spaces (A.4)." },
    { q:"A reinforcement learning team finds their environment's state space is too large for a traditional Q-table. Which approach is MOST appropriate?", options:["Q-learning with an expanded table","Deep Q Network (DQN)","K-means clustering","Hierarchical clustering"], correctIndex:1, explanation:"DQN extends Q-learning specifically by using a neural network instead of a Q-table, allowing it to scale to high-dimensional state spaces (A.4)." },
    { q:"An audit finding notes that a vendor set the learning rate and number of layers before training began, while the model's weights emerged only after training on data. How should the auditor classify the learning rate and layer count?", options:["Parameters","Hyperparameters","The algorithm itself","The trained model"], correctIndex:1, explanation:"Hyperparameters are settings chosen before training that control how the model learns (learning rate, layers) — parameters are what the model learns from data during training (A.4)." },

    { q:"An organization's chatbot confidently cites a court case that does not exist, presenting it as established fact. This is a textbook example of which phenomenon?", options:["Underfitting","Overfitting","Hallucination","Data drift"], correctIndex:2, explanation:"Confident but factually wrong or fabricated output from a generative model is the defining characteristic of hallucination (A.5)." },
    { q:"An enterprise wants to classify thousands of customer reviews as positive, negative, or neutral. Which technique is MOST directly designed for this task?", options:["Sentiment analysis","Principal Component Analysis","Q-learning","Data provenance"], correctIndex:0, explanation:"Sentiment analysis (opinion mining) is specifically designed to classify text sentiment as positive, negative, or neutral (A.5)." },
    { q:"A 500-word prompt is broken down by an LLM into roughly 650 smaller units before processing. What are these units called?", options:["Embeddings","Tokens","Vectors","Parameters"], correctIndex:1, explanation:"Tokens are the smallest chunks of text an LLM processes — a prompt is broken into tokens (often word-pieces) before the model can operate on it (A.6)." },
    { q:"An auditor is told that the numerical representations of 'king' and 'queen' sit closer together in a model's internal space than 'king' and 'banana.' What concept does this illustrate?", options:["Tokens","Embeddings","Context window","Data provenance"], correctIndex:1, explanation:"Embeddings are numerical vectors representing meaning in high-dimensional space, enabling this kind of similarity comparison (A.6)." },
    { q:"A very long document plus a lengthy prompt is silently cut off before an LLM can process all of it. Which concept explains this limitation?", options:["Vector database capacity","Context window","Embedding dimensionality","Token bias"], correctIndex:1, explanation:"The context window is the number of tokens a model can consider at once — inputs exceeding it are truncated, a leading cause of hallucination (A.6)." },

    { q:"An organization is fine-tuning a third-party foundation model using internal HR data. What is the GREATEST risk specific to this approach compared to using RAG instead?", options:["Higher latency during inference","Sensitive data may be encoded into the model's weights and later leak through queries","Reduced model accuracy overall","Increased storage costs for embeddings"], correctIndex:1, explanation:"Fine-tuning bakes data directly into model weights, creating leakage risk through future queries — this is exactly why RAG is generally lower-risk for sensitive data (C.6)." },
    { q:"Which of the following is a named, unique challenge that makes AI risk management harder than traditional IT risk management?", options:["Lack of any available risk frameworks","Absence of a human baseline to measure against for augmented/replaced tasks","Excessive documentation requirements","Overreliance on manual testing"], correctIndex:1, explanation:"The need for a human baseline when AI augments or replaces human activity is one of the five named challenges unique to AI risk management (C.7)." },

    { q:"An organization proceeds with using an AI chatbot despite negative customer sentiment, having determined the reputational risk falls within its defined risk tolerance. Which risk treatment option does this represent?", options:["Avoid","Mitigate","Share/Transfer","Accept"], correctIndex:3, explanation:"Accept means proceeding with a risk within tolerance — proceeding with risk ABOVE tolerance and taking no further action would instead constitute negligence, not a valid Accept (C.9)." },
    { q:"A retail demand-forecasting model's performance degrades every holiday season as customer buying habits shift, while the fundamental question being predicted stays the same. This is BEST described as which phenomenon?", options:["Concept drift", "Data drift", "Model theft", "Underfitting"], correctIndex:1, explanation:"When the input data distribution shifts (seasonality) but the underlying prediction task/target doesn't change, this is data drift — concept drift would mean the target's meaning itself changed (C.10)." },
    { q:"A fraud-detection model is 99% 'accurate' on a dataset that is 99% legitimate transactions, simply by always predicting 'not fraud.' Which metric should have been prioritized instead?", options:["Accuracy alone","F1 score (or precision/recall)","Model interpretability","Training time"], correctIndex:1, explanation:"On imbalanced datasets, accuracy is misleading — F1 score (balancing precision and recall) or the individual metrics themselves should be prioritized instead (C.11)." },
    { q:"A chatbot's KRI dashboard shows resolution rate at 92% and misunderstanding rate at 3%. Which of these values should trigger closer review against its stated target?", options:["Resolution rate, because it is below the 95% satisfaction target","Misunderstanding rate, because it exceeds the less-than-1% target","Both are within acceptable range","Neither metric is relevant to a chatbot"], correctIndex:1, explanation:"The misunderstanding rate target is less than 1% — 3% exceeds that threshold and should trigger review, while resolution rate's own target is 90%+, which 92% satisfies (C.12)." },
    { q:"An organization cannot independently verify a vendor's claimed accuracy figures because the vendor won't disclose its measurement methodology. This is BEST described as which type of third-party risk?", options:["Third-Party Data Risk","Third-Party System Risk","Model poisoning risk","Membership inference risk"], correctIndex:1, explanation:"Third-Party System Risk specifically concerns disagreement over or lack of transparency in HOW risk/performance is measured — distinct from Data Risk, which concerns WHAT data was used to train the model (C.6)." },
    { q:"An organization decides not to pursue an AI use case at all because of unresolved regulatory concerns. Which risk treatment option does this represent?", options:["Avoid","Mitigate","Share/Transfer","Accept"], correctIndex:0, explanation:"Avoid means eliminating exposure by not pursuing the activity at all — distinct from Mitigate (reducing impact via controls) or Share/Transfer (spreading impact to a partner or insurer) (C.9)." },
    { q:"A flight-demand forecasting model's predictions become unreliable after a major shift in border policy fundamentally changes what 'normal' travel behavior looks like, even though holiday and macroeconomic inputs stayed similar. This is BEST described as which phenomenon?", options:["Data drift","Concept drift","Model theft","Underfitting"], correctIndex:1, explanation:"Concept drift occurs when the statistical properties of the target itself change — here, the meaning of 'likely to fly' changed due to external constraints, not the input data distribution (C.10)." },
    { q:"A team wants to solve a customer-churn forecasting problem and considers implementing RAG as the solution. Is this an appropriate choice?", options:["Yes, RAG is ideal for any predictive analytics problem","No, RAG is designed for grounding factual answers, not forecasting or classification tasks","Yes, provided the vector database is large enough","No, because RAG only works with structured data"], correctIndex:1, explanation:"RAG is the wrong tool for predictive analytics like forecasting or classification — those are ML tasks; RAG is for grounding factual, retrievable answers (C.10)." }

function questionBankAudit() {
  const all=allQuestions(),ids=new Set(),issues=[];
  all.forEach(q=>{
    if(ids.has(q.id))issues.push(`${q.id}: duplicate ID`);ids.add(q.id);
    if(!q.stem||!Array.isArray(q.options)||q.options.length!==4||!Number.isInteger(q.correctIndex)||q.correctIndex<0||q.correctIndex>3||!q.explanation)issues.push(`${q.id}: incomplete question structure`);
    if(Array.isArray(q.options)&&new Set(q.options).size!==q.options.length)issues.push(`${q.id}: duplicate answer choices`);
    if(q.knowledgePointIds.some(id=>!knowledgePointIndex().some(p=>p.id===id)))issues.push(`${q.id}: unknown knowledge-point link`);
    if(!q.sourceRef)issues.push(`${q.id}: missing source reference`);
    if(q.scenarioId&&!q.scenario)issues.push(`${q.id}: scenario link has no case text`);
  });
  const unlinked=all.filter(q=>!q.knowledgePointIds.length).length;
  const withScenarios=all.filter(q=>q.scenarioId).length;
  return {total:all.length,issues,unlinked,missingRationales:all.filter(q=>!Array.isArray(q.optionRationales)||q.optionRationales.length!==4).length,withScenarios,scenarioCount:new Set(all.filter(q=>q.scenarioId).map(q=>q.scenarioId)).size};
}
