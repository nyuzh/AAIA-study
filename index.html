 and do not let performance metrics offset them","Remove the compliance findings, since the privacy notice is compliant","Rate it unsatisfactory without describing the evidence"],"correctIndex":1,"explanation":"A high-risk system must satisfy fairness, transparency and compliance criteria, not only performance. Step 1: weigh each audit area against its criteria. Step 2: report the gaps with evidence. Performance does not compensate, a privacy notice does not satisfy an impact assessment, and ratings without evidence are not supportable.","optionRationales":["Performance metrics do not offset fairness and compliance gaps.","A high-risk system must satisfy fairness, transparency and compliance criteria, not only performance. Step 1: weigh each audit area against its criteria. Step 2: report the gaps with evidence. Performance does not compensate, a privacy notice does not satisfy an impact assessment, and ratings without evidence are not supportable.","Privacy notice compliance does not remove the other findings.","A rating without supporting evidence is not defensible."],"sourceRef":"D3 practice questions · Q41 · 3.9","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q042","sectionId":"d3-B","knowledgePointIds":["d3-B-0-11"],"scenarioId":"d3-doc-case-20f9ba7d60","scenario":"The auditor, Oren Katz, plans to test a loan model's decisions at Aldgate Bank. The population is 50,000 decisions; he wants (a) an estimate of the overall error rate that can be reported to the committee, and (b) assurance that a small protected group (3%) is treated fairly. He also knows that 40 high-value decisions deserve special attention.","type":"application","difficulty":"expert","topic":"Sampling design for a mixed objective","stem":"Which design is MOST appropriate? Correct Answer: D","options":["A random sample of 30 decisions, with the protected group ignored","One judgmental sample of 100 decisions, extrapolated to the whole population","A convenience sample of the most recent 100 decisions","A probability sample (stratified so that the protected group is represented) for the error-rate estimate and fairness testing, plus a separate judgmental selection of the 40 high-value decisions reported separately without extrapolation"],"correctIndex":3,"explanation":"Different objectives need different samples. Step 1: match probability sampling (stratified) to estimation and subgroup testing. Step 2: use judgmental selection for targeted risks and report it separately, since it cannot be projected. A single judgmental sample, a convenience sample or a tiny random sample do not meet both objectives.","optionRationales":["A small random sample may include almost no members of the protected group.","Judgmental results cannot be statistically projected.","Convenience samples are biased and unrepresentative.","Different objectives need different samples. Step 1: match probability sampling (stratified) to estimation and subgroup testing. Step 2: use judgmental selection for targeted risks and report it separately, since it cannot be projected. A single judgmental sample, a convenience sample or a tiny random sample do not meet both objectives."],"sourceRef":"D3 practice questions · Q42 · 3.7","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q043","sectionId":"d3-B","knowledgePointIds":["d3-B-0-8"],"scenarioId":"d3-doc-case-a1db44398d","scenario":"In the testing-area audit of a claims model at Marchmont Insurance, the auditor, Zara Whitfield, finds: documentation says a separate test set was held back; version history shows the test set was used to tune hyperparameters; reported test accuracy is 96%; and production logs show 78% accuracy. The data science lead says that production data is simply \"harder.\"","type":"application","difficulty":"expert","topic":"Reconciling conflicting testing evidence","stem":"What is the BEST audit conclusion? Correct Answer: A","options":["The test results are not reliable because of contamination and likely overfitting; require evaluation on a fresh held-out set and an analysis of the production gap before reliance","Rely on the 96% figure, as it is documented","Accept the lead's explanation and take no action","Conclude that the model is underfitted"],"correctIndex":0,"explanation":"Tuning on the test set contaminates it, which inflates the score, and a large gap to production suggests overfitting. Step 1: connect version evidence to the reported result. Step 2: require a clean evaluation and analysis of the gap. Documentation of a process that was not followed is not evidence of reliability.","optionRationales":["Tuning on the test set contaminates it, which inflates the score, and a large gap to production suggests overfitting. Step 1: connect version evidence to the reported result. Step 2: require a clean evaluation and analysis of the gap. Documentation of a process that was not followed is not evidence of reliability.","Documentation conflicts with the version history, so it cannot be relied on.","An explanation without evidence is not sufficient.","Underfitting would show poor training performance too."],"sourceRef":"D3 practice questions · Q43 · 3.8","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q044","sectionId":"d3-C","knowledgePointIds":["d3-C-0-0"],"scenarioId":"d3-doc-case-eb758e1f27","scenario":"The auditor, Lucia Perez, needs to understand how an AI sentiment model at Marlow Retail learned to classify customer comments. The data scientist explains that each comment was paired with a label of positive, neutral or negative by reviewers.","type":"application","difficulty":"basic","topic":"Types of data: training data","stem":"What kind of training data is this? Correct Answer: C","options":["Production data generated after deployment","Unsupervised data with no labels, used to find clusters","Supervised training data of labeled input-output pairs, whose label quality should be assessed","Synthetic data produced by a GAN"],"correctIndex":2,"explanation":"Supervised learning uses labeled input-output pairs, so the accuracy and consistency of labels are audit-relevant. Unsupervised data has no labels, production data is live operational data, and synthetic data is artificially generated.","optionRationales":["Training data precedes deployment.","The comments carry labels, so this is not unsupervised.","Supervised learning uses labeled input-output pairs, so the accuracy and consistency of labels are audit-relevant. Unsupervised data has no labels, production data is live operational data, and synthetic data is artificially generated.","The data came from real comments labeled by reviewers."],"sourceRef":"D3 practice questions · Q44 · 3.10.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q045","sectionId":"d3-C","knowledgePointIds":["d3-C-0-1"],"scenarioId":"d3-doc-case-fdfb025d7e","scenario":"A healthcare analytics team at Evermed uses synthetic patient records, generated with a GAN, to test a diagnostic model because real data is sensitive. The auditor, Ola Nwosu, is asked what to check.","type":"application","difficulty":"moderate","topic":"Synthetic data","stem":"Which procedure is MOST appropriate? Correct Answer: C","options":["Reject all synthetic data as invalid","Accept synthetic data as perfectly representative because it is generated","Confirm that the synthetic data reflects the real population's relevant characteristics, does not leak real records, and that results are validated against real data where permitted","Check only the file format of the synthetic data"],"correctIndex":2,"explanation":"Synthetic data (for example from GANs or VAEs) is useful where real data is scarce or sensitive, but its fidelity and potential leakage must be assessed. Step 1: assess representativeness. Step 2: check for leakage and validate against real data.","optionRationales":["Rejection ignores its legitimate use.","Generated data can be unrepresentative or biased.","Synthetic data (for example from GANs or VAEs) is useful where real data is scarce or sensitive, but its fidelity and potential leakage must be assessed. Step 1: assess representativeness. Step 2: check for leakage and validate against real data.","File format says nothing about fidelity or privacy."],"sourceRef":"D3 practice questions · Q45 · 3.10.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q046","sectionId":"d3-C","knowledgePointIds":["d3-C-0-1"],"scenarioId":"d3-doc-case-3509f937af","scenario":"The auditor, Daniel Frost, is testing whether a bank's deployed fraud model still performs as validated. The model owner provides a curated dataset from last year's testing. Daniel wants stronger evidence.","type":"application","difficulty":"moderate","topic":"Production data as evidence","stem":"What is the BEST evidence source? Correct Answer: A","options":["Production data extracted directly, with documented completeness and accuracy checks, to compare current performance with validated baselines","The curated dataset prepared by the owner","The vendor's marketing results","A summary prepared by the project sponsor"],"correctIndex":0,"explanation":"Production data shows how the live system behaves now. Step 1: obtain it independently. Step 2: verify completeness and accuracy and compare with baselines. Curated data, marketing results and summaries are less reliable.","optionRationales":["Production data shows how the live system behaves now. Step 1: obtain it independently. Step 2: verify completeness and accuracy and compare with baselines. Curated data, marketing results and summaries are less reliable.","Owner-curated data may not represent current production.","Marketing results are not independent evidence.","Summaries are second-hand and open to bias."],"sourceRef":"D3 practice questions · Q46 · 3.10.3","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q047","sectionId":"d3-C","knowledgePointIds":["d3-C-0-2"],"scenarioId":"d3-doc-case-0551d76f7c","scenario":"The auditor, Maria Costa, reviews an enterprise copilot at Westfield Insurance. Search results returned HR salary documents to a junior employee because folder permissions were misconfigured. The IT manager says the copilot is working as designed.","type":"application","difficulty":"difficult","topic":"Unstructured data and access misconfiguration","stem":"What is the GREATEST risk? Correct Answer: D","options":["The copilot uses a modern language model","The copilot's user interface is slow","The vendor's pricing is high","Unstructured data in shared repositories is hard to govern, so AI search can expose documents users should not see, which makes access permissions and classification the key audit focus"],"correctIndex":3,"explanation":"Unstructured data (documents, email, files) is difficult to classify and secure, and AI tools can surface content because of existing permission errors. Step 1: recognize the AI as an amplifier of existing access problems. Step 2: audit permissions, classification and monitoring.","optionRationales":["Technology currency does not create the exposure.","Speed is not the risk evidenced.","Cost is not the exposure.","Unstructured data (documents, email, files) is difficult to classify and secure, and AI tools can surface content because of existing permission errors. Step 1: recognize the AI as an amplifier of existing access problems. Step 2: audit permissions, classification and monitoring."],"sourceRef":"D3 practice questions · Q47 · 3.10.4","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q048","sectionId":"d3-C","knowledgePointIds":["d3-C-0-2"],"scenarioId":"d3-doc-case-f056758b33","scenario":"The auditor, Hiro Tanaka, will extract customer data from a bank's loan decision database to test a credit model. He has table names but no information about fields and their meaning.","type":"application","difficulty":"moderate","topic":"Structured data: schema and data dictionary","stem":"What should the auditor obtain FIRST? Correct Answer: B","options":["A full copy of the database to browse","The database schema and data dictionary, to understand fields, definitions and relationships before extracting data","A verbal description from the first available analyst","The data warehouse's invoice"],"correctIndex":1,"explanation":"Structured data is organized under a schema and described by a data dictionary. Step 1: understand the structure and meaning. Step 2: define a targeted extraction. Bulk copies increase privacy risk, verbal descriptions are unreliable, and invoices are irrelevant.","optionRationales":["A full copy adds exposure and is unfocused.","Structured data is organized under a schema and described by a data dictionary. Step 1: understand the structure and meaning. Step 2: define a targeted extraction. Bulk copies increase privacy risk, verbal descriptions are unreliable, and invoices are irrelevant.","Verbal descriptions are unreliable and undocumented.","Invoices tell nothing about data fields."],"sourceRef":"D3 practice questions · Q48 · 3.10.5","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q049","sectionId":"d3-C","knowledgePointIds":["d3-C-0-2"],"scenarioId":"d3-doc-case-f57a12315a","scenario":"The audit team at Granton Bank has collected extracts of customer loan data with personal information, stored on a shared drive and in analysts' laptops. The CAE, Rita Okoye, learns that security has flagged audit repositories as an attractive target. She asks for the BEST response.","type":"application","difficulty":"difficult","topic":"Audit as data collector and target","stem":"What is the BEST action? Correct Answer: B","options":["Continue to keep extracts on laptops for convenience","Minimize the data collected, store evidence in a restricted, encrypted repository with access logging, and apply retention and disposal rules","Share the extracts widely with the business for transparency","Delete evidence immediately after each test without documentation"],"correctIndex":1,"explanation":"When audit collects data, it becomes both a data collector and a target. Step 1: reduce what is collected. Step 2: protect, log and dispose of evidence properly while keeping working papers sufficient. Convenience, wide sharing or undocumented deletion weaken protection or support for conclusions.","optionRationales":["Laptops and shared drives lack adequate controls.","When audit collects data, it becomes both a data collector and a target. Step 1: reduce what is collected. Step 2: protect, log and dispose of evidence properly while keeping working papers sufficient. Convenience, wide sharing or undocumented deletion weaken protection or support for conclusions.","Wide sharing increases exposure.","Deleting without documentation undermines the audit trail."],"sourceRef":"D3 practice questions · Q49 · 3.10.5","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q050","sectionId":"d3-C","knowledgePointIds":["d3-C-0-3"],"scenarioId":"d3-doc-case-ef1488c40d","scenario":"The auditor, Pedro Alves, extracts loan data with an ETL tool such as ACL to test a retail bank's AI approvals. He needs assurance that the extract is complete and accurate before drawing conclusions.","type":"application","difficulty":"moderate","topic":"ETL validation","stem":"What is the MOST effective procedure? Correct Answer: D","options":["Rely on the data owner's statement that extraction worked","Assume the tool is accurate because it is commercial","Test only the first ten rows","Reconcile record counts and control totals with the source system and test transformation logic"],"correctIndex":3,"explanation":"ETL can introduce errors at extraction, transformation or load, so completeness and accuracy should be validated, for example by reconciling counts and totals to the source and reviewing the logic. Assumptions, tiny samples and owner statements are insufficient.","optionRationales":["An owner's statement is not independent.","Tool reputation is not evidence of this extract's accuracy.","Ten rows do not show completeness.","ETL can introduce errors at extraction, transformation or load, so completeness and accuracy should be validated, for example by reconciling counts and totals to the source and reviewing the logic. Assumptions, tiny samples and owner statements are insufficient."],"sourceRef":"D3 practice questions · Q50 · 3.10.6","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q051","sectionId":"d3-C","knowledgePointIds":["d3-C-0-3"],"scenarioId":"d3-doc-case-4c763b7f47","scenario":"The audit team at Hartley Public Services plans to use an AI agent to extract and transform data from the HR system for testing. The agent will be given the HR administrator's credentials so that it can reach all tables. The IS auditor, Yvonne Cole, reviews the design.","type":"application","difficulty":"difficult","topic":"AI agents for ETL","stem":"What is the PRIMARY concern? Correct Answer: A","options":["Excessive privileges and weak accountability; the agent should have least-privilege, read-only access, with logging and validation of its outputs","The agent is too fast","The agent's name is unprofessional","The agent may lower costs"],"correctIndex":0,"explanation":"AI agents can automate ETL, but they need controlled access: least privilege, read-only where possible, logging, and validation of results. Using administrator credentials exposes sensitive data and breaks accountability. Step 1: assess access design. Step 2: require compensating controls.","optionRationales":["AI agents can automate ETL, but they need controlled access: least privilege, read-only where possible, logging, and validation of results. Using administrator credentials exposes sensitive data and breaks accountability. Step 1: assess access design. Step 2: require compensating controls.","Speed is not a risk.","Naming is cosmetic.","Cost reduction is a benefit."],"sourceRef":"D3 practice questions · Q51 · 3.10.6","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q052","sectionId":"d3-C","knowledgePointIds":["d3-C-0-4"],"scenarioId":"d3-doc-case-0b5b4b2053","scenario":"Management at Dunhill Insurance gives the auditor, Sofia Marin, a training dataset for a claims model on a USB stick. Sofia suspects that data poisoning could affect the model and that data might have been altered before being supplied.","type":"application","difficulty":"difficult","topic":"Data manipulation and integrity of evidence","stem":"What is the BEST audit procedure? Correct Answer: C","options":["Ask the data scientists whether poisoning occurred","Use the USB data as provided, because management supplied it","Obtain the data directly from the source or controlled repository and verify integrity through hashes, versions and access and change logs","Ignore integrity because the model's accuracy is high"],"correctIndex":2,"explanation":"Data can be manipulated through bias, poisoning or adversarial attacks. Evidence supplied by the auditee needs independent validation. Step 1: go to the source. Step 2: verify integrity through hashes, versioning and logs. Owner assurances and high accuracy do not prove integrity.","optionRationales":["A statement from those responsible is not independent evidence.","Management-supplied data may be incomplete or altered.","Data can be manipulated through bias, poisoning or adversarial attacks. Evidence supplied by the auditee needs independent validation. Step 1: go to the source. Step 2: verify integrity through hashes, versioning and logs. Owner assurances and high accuracy do not prove integrity.","Accuracy can be high on poisoned data."],"sourceRef":"D3 practice questions · Q52 · 3.10.7","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q053","sectionId":"d3-C","knowledgePointIds":["d3-C-0-5"],"scenarioId":"d3-doc-case-71ab5f3e9a","scenario":"An audit team at Birch Retail wants to collect competitor pricing data from a website to test a pricing model. A junior auditor suggests scraping; a senior auditor, Wendy Hsu, proposes using the provider's API.","type":"application","difficulty":"moderate","topic":"Scraping versus APIs","stem":"What is the MOST important consideration? Correct Answer: C","options":["Reliability does not matter for audit evidence","Scraping is always better because it avoids contracts","APIs are generally more reliable and controlled than scraping, and the auditor should check permission, reliability and protection of the collected data","Collection permissions are irrelevant"],"correctIndex":2,"explanation":"Scraping is less effective than APIs and raises questions about permission, reliability and data protection. Step 1: prefer a controlled API. Step 2: confirm permission and reliability. Treating reliability and permission as irrelevant weakens the evidence.","optionRationales":["Evidence must be reliable.","Scraping can breach terms and give unstable data.","Scraping is less effective than APIs and raises questions about permission, reliability and data protection. Step 1: prefer a controlled API. Step 2: confirm permission and reliability. Treating reliability and permission as irrelevant weakens the evidence.","Permissions and terms matter for lawful collection."],"sourceRef":"D3 practice questions · Q53 · 3.10.8","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q054","sectionId":"d3-C","knowledgePointIds":["d3-C-0-8"],"scenarioId":"d3-doc-case-64b311146a","scenario":"The auditor, Alan Pierce, will interview the data science team about a hiring model at Lakeview Technologies. He has only one hour. The audit manager, Tess Carrington, asks how he should prepare.","type":"application","difficulty":"moderate","topic":"Walkthroughs and interviews: structured questions","stem":"What is the BEST approach? Correct Answer: A","options":["Prepare structured questions by audit area (business context, data collection, model assessment, bias and fairness, performance and outcomes, compliance) and plan to corroborate answers with evidence","Improvise questions during the interview","Ask only general questions about the team's morale","Ask the team to write its own audit questions"],"correctIndex":0,"explanation":"Walkthroughs and interviews work best with structured questions by audit area. Step 1: prepare. Step 2: corroborate answers with documents or data. Improvisation, irrelevant questions or team-authored questions weaken coverage and independence.","optionRationales":["Walkthroughs and interviews work best with structured questions by audit area. Step 1: prepare. Step 2: corroborate answers with documents or data. Improvisation, irrelevant questions or team-authored questions weaken coverage and independence.","Improvised questions risk gaps.","Morale questions do not address AI risk.","Auditees should not write the audit questions."],"sourceRef":"D3 practice questions · Q54 · 3.11","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q055","sectionId":"d3-C","knowledgePointIds":["d3-C-0-8"],"scenarioId":"d3-doc-case-81a4998156","scenario":"In an audit of an AI claims model at Redstone Insurance, the data science lead says in an interview that bias testing is done each quarter and shows no issues. The auditor, Meera Pillai, has no documents or test outputs to support this.","type":"application","difficulty":"difficult","topic":"Limits of interview evidence","stem":"What should the auditor do? Correct Answer: D","options":["Ask the lead to sign a statement and accept it","Record bias testing as effective based on the interview","Close the question since interviews are the strongest evidence","Treat the statement as unsupported, request test plans, results and approvals, and corroborate by inspection or re-performance before concluding"],"correctIndex":3,"explanation":"Interviews provide context but are weaker evidence than documents and data. Step 1: recognize the lack of corroboration. Step 2: obtain and test the documentary evidence. A signed statement from the person responsible still lacks independent support.","optionRationales":["A signed assertion does not replace evidence.","Uncorroborated statements are insufficient.","Interviews are generally weaker than documented evidence.","Interviews provide context but are weaker evidence than documents and data. Step 1: recognize the lack of corroboration. Step 2: obtain and test the documentary evidence. A signed statement from the person responsible still lacks independent support."],"sourceRef":"D3 practice questions · Q55 · 3.11","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q056","sectionId":"d3-C","knowledgePointIds":["d3-C-0-2"],"scenarioId":"d3-doc-case-b0779aa5d8","scenario":"The auditor, Gareth Nolan, wants evidence about who accessed a bank's AI model API and whether unusual queries occurred. The security manager, Isla Burke, offers a screenshot of a dashboard.","type":"application","difficulty":"moderate","topic":"Logs and SIEM as evidence","stem":"What is the BEST evidence? Correct Answer: B","options":["A screenshot of a dashboard with no source","Log data collected from the SIEM and system logs, with confirmation of completeness and time coverage, analyzed for access and anomalies","The security manager's recollection","A statement that logging is enabled"],"correctIndex":1,"explanation":"Logs and SIEM provide detailed, time-stamped evidence of access and events. Step 1: get the source logs. Step 2: confirm completeness and analyze them. Screenshots, recollection and statements are weaker.","optionRationales":["A screenshot without the source can hide gaps.","Logs and SIEM provide detailed, time-stamped evidence of access and events. Step 1: get the source logs. Step 2: confirm completeness and analyze them. Screenshots, recollection and statements are weaker.","Recollection is unreliable.","Logging enabled does not show what was logged."],"sourceRef":"D3 practice questions · Q56 · 3.12","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q057","sectionId":"d3-C","knowledgePointIds":["d3-C-0-8"],"scenarioId":"d3-doc-case-5cb3558c50","scenario":"The audit team at Seaview Health records interviews with clinicians and uses a cloud voice-to-text service to transcribe them. The compliance officer, Daria Ng, notes that the service processes audio offsite and that no consent was obtained.","type":"application","difficulty":"difficult","topic":"Voice-to-text for interviews","stem":"What is the PRIMARY concern? Correct Answer: B","options":["The transcripts are too accurate","Offsite processing creates privacy and integrity risk, and consent from interviewees is needed; the team should vet the service and protect transcripts","Interviewees may find the tool interesting","The tool may save the team time"],"correctIndex":1,"explanation":"Voice-to-text is a useful collection tool, but offsite processing introduces integrity and privacy concerns and requires consent. Step 1: identify the data protection issue. Step 2: obtain consent, vet the provider and secure transcripts.","optionRationales":["Accuracy is not a concern.","Voice-to-text is a useful collection tool, but offsite processing introduces integrity and privacy concerns and requires consent. Step 1: identify the data protection issue. Step 2: obtain consent, vet the provider and secure transcripts.","Interest is irrelevant.","Time saving is a benefit, not a risk."],"sourceRef":"D3 practice questions · Q57 · 3.12","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q058","sectionId":"d3-C","knowledgePointIds":["d3-C-0-6"],"scenarioId":"d3-doc-case-474bce8e27","scenario":"The auditor, Felix Brandt, uses OCR to extract service level commitments from 800 scanned IT contracts at Corbin Manufacturing. The tool's output will be used to test supplier performance.","type":"application","difficulty":"moderate","topic":"OCR for contract evidence","stem":"What is the MOST effective control over the evidence? Correct Answer: D","options":["Use the OCR output only for the cover page","Rely on the OCR output with no checks","Retype all 800 contracts by hand","Validate OCR accuracy by comparing a sample of extracted values with the original documents before relying on the data"],"correctIndex":3,"explanation":"OCR scales document extraction (for example SLAs in contracts), but errors occur with scans. Step 1: recognize the accuracy risk. Step 2: validate against originals on a sample. Blind reliance is weak, and retyping everything forfeits the benefit.","optionRationales":["Using only the cover page ignores the content needed.","Unchecked output may contain errors.","Full manual retyping is disproportionate.","OCR scales document extraction (for example SLAs in contracts), but errors occur with scans. Step 1: recognize the accuracy risk. Step 2: validate against originals on a sample. Blind reliance is weak, and retyping everything forfeits the benefit."],"sourceRef":"D3 practice questions · Q58 · 3.12","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q059","sectionId":"d3-C","knowledgePointIds":["d3-C-0-8"],"scenarioId":"d3-doc-case-6fc9b2c75c","scenario":"The audit team at Northcote Bank records interviews with the model risk team and uses a cloud service to transcribe them and an LLM to summarize them. The summary states that \"bias testing is performed quarterly and independently reviewed.\" The auditor, Phoebe Lamont, wants to use the summary as evidence of the control.","type":"application","difficulty":"expert","topic":"Reliability of AI-generated interview evidence","stem":"What is the BEST approach? Correct Answer: A","options":["Confirm consent and the provider's data handling, verify the summary against the transcript and audio, and corroborate the control with test plans, results and approvals before relying on it","Use the summary as direct evidence, since it came from the interview","Discard interviews as evidence entirely","Ask the interviewee to approve the summary and treat it as sufficient"],"correctIndex":0,"explanation":"AI-generated transcripts and summaries can contain errors, and the content is only an assertion. Step 1: control privacy and verify the summary's fidelity. Step 2: corroborate the underlying claim with documents and data. Interviewee approval does not make an assertion independent evidence.","optionRationales":["AI-generated transcripts and summaries can contain errors, and the content is only an assertion. Step 1: control privacy and verify the summary's fidelity. Step 2: corroborate the underlying claim with documents and data. Interviewee approval does not make an assertion independent evidence.","Unverified AI summaries may misstate what was said, and the claim itself is uncorroborated.","Interviews remain useful when corroborated.","Approval by the interviewee does not provide independence."],"sourceRef":"D3 practice questions · Q59 · 3.12","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q060","sectionId":"d3-D","knowledgePointIds":["d3-D-0-0"],"scenarioId":"d3-doc-case-aa351bb3b1","scenario":"The auditor, Noor Hassan, tests a navigation-based delivery model at Pathway Logistics. The data shows that vehicle location updates arrive hours late, so routes are based on out-of-date positions. The operations manager asks which data quality dimension is affected.","type":"application","difficulty":"basic","topic":"Data quality: timeliness","stem":"Which dimension is MOST directly affected? Correct Answer: C","options":["Validity","Uniqueness","Timeliness","Completeness"],"correctIndex":2,"explanation":"Timeliness means data reflects reality at the time required. Late location updates breach it. Uniqueness concerns duplicates, validity concerns conformance to rules, and completeness concerns missing records or fields.","optionRationales":["The data may conform to rules but still be late.","Nothing indicates duplicate records.","Timeliness means data reflects reality at the time required. Late location updates breach it. Uniqueness concerns duplicates, validity concerns conformance to rules, and completeness concerns missing records or fields.","The problem is lateness, not missing fields."],"sourceRef":"D3 practice questions · Q60 · 3.13","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q061","sectionId":"d3-D","knowledgePointIds":["d3-D-0-0"],"scenarioId":"d3-doc-case-f8d1d1c7ee","scenario":"The auditor, Elena Vasquez, reviews a customer-churn model at Avalon Telecom. Data is accurate and complete, but it covers only urban customers while the model is applied to the national customer base. The data scientist says the data is \"high quality.\"","type":"application","difficulty":"moderate","topic":"Data quality: fitness for purpose","stem":"What is the BEST audit conclusion? Correct Answer: C","options":["Fitness for purpose is not a data quality dimension","The data is high quality, since it is accurate and complete","The data may not be fit for purpose because it does not represent the population the model serves, so quality is inadequate despite accuracy and completeness","Only the model's accuracy matters"],"correctIndex":2,"explanation":"Data quality includes fitness for purpose, meaning suitability and representativeness for the intended use, in addition to accuracy, completeness, validity, consistency, uniqueness and timeliness. Step 1: compare the data to the application population. Step 2: report the fitness gap.","optionRationales":["Fitness for purpose is a recognized dimension.","Accuracy and completeness alone do not establish suitability.","Data quality includes fitness for purpose, meaning suitability and representativeness for the intended use, in addition to accuracy, completeness, validity, consistency, uniqueness and timeliness. Step 1: compare the data to the application population. Step 2: report the fitness gap.","Model accuracy on unrepresentative data can mislead."],"sourceRef":"D3 practice questions · Q61 · 3.13","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q062","sectionId":"d3-D","knowledgePointIds":["d3-D-0-0"],"scenarioId":"d3-doc-case-c34c140fc7","scenario":"The audit manager at Kestrel Bank, Raj Singh, wants to understand how data integrity relates to data quality before planning tests. A junior auditor says they are the same thing.","type":"application","difficulty":"difficult","topic":"Data integrity versus data quality","stem":"Which statement is MOST accurate? Correct Answer: A","options":["Data integrity is a subset of data quality, covering accuracy, consistency and completeness plus security, while data quality has additional dimensions such as timeliness and fitness for purpose","Data integrity is wider than data quality and includes all business processes","Data integrity only means encryption","Data integrity and data quality have no relationship"],"correctIndex":0,"explanation":"Integrity is a subset of data quality that adds a security element to accuracy, consistency and completeness. Data quality also includes dimensions such as validity, uniqueness, timeliness and fitness for purpose. Step 1: map the relationship. Step 2: plan tests for both.","optionRationales":["Integrity is a subset of data quality that adds a security element to accuracy, consistency and completeness. Data quality also includes dimensions such as validity, uniqueness, timeliness and fitness for purpose. Step 1: map the relationship. Step 2: plan tests for both.","Integrity is narrower, not wider.","Integrity covers more than encryption.","The two are closely related."],"sourceRef":"D3 practice questions · Q62 · 3.13","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q063","sectionId":"d3-D","knowledgePointIds":["d3-D-0-0"],"scenarioId":"d3-doc-case-9b96052dcd","scenario":"The auditor, Carla Mendes, receives a large dataset from a retail AI project. She wants to quickly understand its structure, value ranges, null rates and distributions before designing tests.","type":"application","difficulty":"moderate","topic":"Data profiling","stem":"Which technique is MOST appropriate? Correct Answer: D","options":["Training a new model","Encrypting the dataset","Deleting records with nulls","Data profiling, which produces summary data (metadata) about the dataset"],"correctIndex":3,"explanation":"Data profiling summarizes a dataset through metadata such as ranges, null rates and distributions, which informs test design. Encrypting, deleting and training do not do this, and deleting records alters evidence.","optionRationales":["Training a model is not a profiling step.","Encryption protects data but does not describe it.","Deleting alters the evidence being assessed.","Data profiling summarizes a dataset through metadata such as ranges, null rates and distributions, which informs test design. Encrypting, deleting and training do not do this, and deleting records alters evidence."],"sourceRef":"D3 practice questions · Q63 · 3.13","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q064","sectionId":"d3-D","knowledgePointIds":["d3-D-0-1"],"scenarioId":"d3-doc-case-f2510a1f0e","scenario":"The data team at Winfield Insurance reduces storage costs by moving AI training data to cheaper storage and compressing it, and plans to delete lineage logs to save space. The auditor, Tom Reilly, reviews the optimization plan.","type":"application","difficulty":"difficult","topic":"Data optimization","stem":"What is the MOST important consideration? Correct Answer: B","options":["Cost reduction is the only objective","Optimization must keep data governance, security and compliance, including lineage and access controls, in addition to cost, performance and scalability","Lineage logs have no value","Compliance requirements apply only to production"],"correctIndex":1,"explanation":"Data optimization covers governance, storage, performance, cleaning and quality, integration, life cycle management, query and access, cost, security and compliance, and scalability. Step 1: recognize that cost is one aspect. Step 2: confirm that governance, security and lineage are preserved. Deleting lineage weakens traceability.","optionRationales":["Cost is one aspect among several.","Data optimization covers governance, storage, performance, cleaning and quality, integration, life cycle management, query and access, cost, security and compliance, and scalability. Step 1: recognize that cost is one aspect. Step 2: confirm that governance, security and lineage are preserved. Deleting lineage weakens traceability.","Lineage supports traceability and audit.","Compliance applies across the data life cycle."],"sourceRef":"D3 practice questions · Q64 · 3.13.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q065","sectionId":"d3-D","knowledgePointIds":["d3-D-0-3"],"scenarioId":"d3-doc-case-06885c4e15","scenario":"The audit team at Orion Public Health analyzes thousands of citizen complaint messages about an AI triage system using a sentiment analysis model (for example Naive Bayes or SVM). The auditor, Jin Park, wants to rely on the results.","type":"application","difficulty":"moderate","topic":"Sentiment analysis as an analytic technique","stem":"What is the BEST approach? Correct Answer: B","options":["Accept the sentiment results as conclusive proof of service quality","Validate the model's accuracy against a labeled sample and treat the output as an indicator that guides further audit work","Ignore text data because only numbers are evidence","Run the analysis on the complaints without any privacy review"],"correctIndex":1,"explanation":"Sentiment analysis classifies opinions in text and is useful for risk indicators. Step 1: test accuracy against labeled examples. Step 2: use results to direct, not replace, evidence gathering. Treating it as proof or ignoring privacy is weak.","optionRationales":["Sentiment results are indicators and can err.","Sentiment analysis classifies opinions in text and is useful for risk indicators. Step 1: test accuracy against labeled examples. Step 2: use results to direct, not replace, evidence gathering. Treating it as proof or ignoring privacy is weak.","Text data can be valuable evidence of risk.","Complaint data may contain personal information that needs protection."],"sourceRef":"D3 practice questions · Q65 · 3.14.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q066","sectionId":"d3-D","knowledgePointIds":["d3-D-0-3"],"scenarioId":"d3-doc-case-a5e7daa7b8","scenario":"In an audit at Brookside Bank, the analyst, Mina Okafor, reports that sentiment toward the bank's AI chatbot is 82% positive based on survey comments. A manager notes that many comments are sarcastic and some are in other languages. The auditor, Leo Grant, must decide how to treat the figure.","type":"application","difficulty":"difficult","topic":"Limitations of sentiment analysis","stem":"What is the BEST approach? Correct Answer: D","options":["Replace the analysis with the manager's opinion","Report 82% as the satisfaction rate","Remove all sarcastic comments without documentation","Test the classifier on sarcastic and multilingual samples, state the limitations, and avoid presenting the figure as a precise measure"],"correctIndex":3,"explanation":"Sentiment models can misclassify sarcasm and other languages. Step 1: test performance on difficult cases. Step 2: disclose limitations and avoid false precision. Deleting data without documentation or relying on opinion reduces reliability.","optionRationales":["An opinion is weaker than validated analysis.","Presenting a precise figure overstates reliability.","Undocumented removal biases the result.","Sentiment models can misclassify sarcasm and other languages. Step 1: test performance on difficult cases. Step 2: disclose limitations and avoid false precision. Deleting data without documentation or relying on opinion reduces reliability."],"sourceRef":"D3 practice questions · Q66 · 3.14.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q067","sectionId":"d3-D","knowledgePointIds":["d3-D-0-4"],"scenarioId":"d3-doc-case-dc57c93799","scenario":"The auditor, Amira Khalil, builds a Power BI dashboard of AI model error rates from several systems at Crestmont Insurance. The audit director asks what must be verified before the dashboard is shared with the audit committee.","type":"application","difficulty":"moderate","topic":"Visualization tools and source data","stem":"What is the MOST important verification? Correct Answer: A","options":["The completeness and accuracy of the source data and the logic of filters and calculations feeding the visualization","The colour palette of the charts","The number of charts on a page","The fonts used in the dashboard"],"correctIndex":0,"explanation":"Visualization tools such as Tableau and Power BI present data well, but the dashboard is only as reliable as its inputs and logic. Step 1: validate sources. Step 2: validate calculations and filters. Style choices are secondary.","optionRationales":["Visualization tools such as Tableau and Power BI present data well, but the dashboard is only as reliable as its inputs and logic. Step 1: validate sources. Step 2: validate calculations and filters. Style choices are secondary.","Colours are presentation details.","Chart count does not affect reliability.","Fonts do not affect data integrity."],"sourceRef":"D3 practice questions · Q67 · 3.15","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q068","sectionId":"d3-D","knowledgePointIds":["d3-D-0-4"],"scenarioId":"d3-doc-case-ed90e6d94d","scenario":"The CAE of Harbor Bank, Isabel Torres, wants the audit committee to see AI risk exposure change over time, including a risk matrix, without waiting for the next audit report. A manager suggests adding a section to the annual audit report.","type":"application","difficulty":"difficult","topic":"Reports versus dashboards","stem":"Which output is MOST appropriate? Correct Answer: C","options":["An email with a photograph of a whiteboard","Only the annual report","A dashboard with a risk matrix and risk exposure, refreshed from validated data, alongside formal reports for point-in-time findings","A slide with no data source"],"correctIndex":2,"explanation":"Reports give formal, point-in-time results, while dashboards provide ongoing interactive views, such as risk matrices and exposure. Step 1: identify the need as continuous visibility. Step 2: provide a dashboard from validated sources together with reports.","optionRationales":["A photograph is not reliable or maintainable.","An annual report cannot show changes over time.","Reports give formal, point-in-time results, while dashboards provide ongoing interactive views, such as risk matrices and exposure. Step 1: identify the need as continuous visibility. Step 2: provide a dashboard from validated sources together with reports.","A slide with no source cannot be validated."],"sourceRef":"D3 practice questions · Q68 · 3.15","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q069","sectionId":"d3-D","knowledgePointIds":["d3-D-0-4"],"scenarioId":"d3-doc-case-d3ad1a49c1","scenario":"A dashboard prepared for the audit committee of Calloway Group shows AI risk exposure as low across all business units. The auditor, Dr. Hana Sorensen, discovers that it draws only on the AI inventory, which omits shadow AI, uses owner self-ratings and was last updated 14 months ago. The CAE wants the dashboard presented as planned.","type":"application","difficulty":"expert","topic":"Reliability of an AI risk dashboard","stem":"What is the BEST response? Correct Answer: C","options":["Remove the dates from the dashboard","Present it as planned, since the committee expects it","Do not present the exposure as low; disclose the data limitations, refresh the inventory, replace self-ratings with validated assessments and re-issue the dashboard","Present it and tell the committee the data is reliable"],"correctIndex":2,"explanation":"A dashboard is only as reliable as its inputs. Missing shadow AI, self-assessed ratings and stale data make the \"low\" conclusion unsupported. Step 1: identify the weaknesses in the evidence. Step 2: correct and disclose before reliance. Presenting it as is or hiding dates misleads the committee.","optionRationales":["Hiding dates conceals a known weakness.","Presenting unreliable information compromises objectivity.","A dashboard is only as reliable as its inputs. Missing shadow AI, self-assessed ratings and stale data make the \"low\" conclusion unsupported. Step 1: identify the weaknesses in the evidence. Step 2: correct and disclose before reliance. Presenting it as is or hiding dates misleads the committee.","Claiming reliability without evidence is misleading."],"sourceRef":"D3 practice questions · Q69 · 3.15.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q070","sectionId":"d3-D","knowledgePointIds":["d3-D-0-0"],"scenarioId":"d3-doc-case-16fb4db5fc","scenario":"The auditor, Daniela Pires, reviews a patient-risk model at Lakemont Health. Profiling shows that 15% of lab values are missing and the team filled them with the overall median. Missingness is concentrated in patients from two rural clinics. The data scientist says accuracy was unaffected overall.","type":"application","difficulty":"expert","topic":"Data completeness and imputation in a model","stem":"What is the BEST audit response? Correct Answer: A","options":["Treat it as a completeness and fairness concern: request the profiling results and a subgroup analysis of performance and imputation impact, and assess whether the data is fit for purpose","Accept the conclusion because overall accuracy is unaffected","Delete all records with missing values without analysis","Ignore the issue because medians are standard practice"],"correctIndex":0,"explanation":"Concentrated missing data and uniform imputation can degrade performance for specific groups while overall accuracy looks fine. Step 1: use profiling to see the pattern. Step 2: analyze subgroup effects and fitness for purpose. Deleting records can worsen representation, and overall accuracy masks subgroup harm.","optionRationales":["Concentrated missing data and uniform imputation can degrade performance for specific groups while overall accuracy looks fine. Step 1: use profiling to see the pattern. Step 2: analyze subgroup effects and fitness for purpose. Deleting records can worsen representation, and overall accuracy masks subgroup harm.","Aggregate accuracy hides subgroup effects.","Deleting records may remove the affected groups further.","Standard practice must still be assessed for impact."],"sourceRef":"D3 practice questions · Q70 · 3.13","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q071","sectionId":"d3-E","knowledgePointIds":["d3-E-0-0"],"scenarioId":"d3-doc-case-e990d6e86b","scenario":"The auditor, Nicola Fox, is drafting the report on an AI credit model audit at Granville Bank. The CAE reminds her that the report should follow the standard structure.","type":"application","difficulty":"basic","topic":"Contents of an AI audit report","stem":"Which set of sections is CORRECT? Correct Answer: D","options":["Findings only, with no scope or methodology","Marketing summary, pricing, sales plan, findings and bibliography","Source code, hardware drawings, budget and holiday plans","Executive summary, scope and objectives, methodology, findings, remediation and appendices"],"correctIndex":3,"explanation":"A typical AI audit report includes an executive summary, scope and objectives, methodology, findings, remediation and appendices. Omitting scope or methodology reduces transparency, and the other sets are unrelated.","optionRationales":["Without scope and methodology the reader cannot judge the findings.","These sections do not belong in an audit report.","These items are irrelevant to audit reporting.","A typical AI audit report includes an executive summary, scope and objectives, methodology, findings, remediation and appendices. Omitting scope or methodology reduces transparency, and the other sets are unrelated."],"sourceRef":"D3 practice questions · Q71 · 3.16","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q072","sectionId":"d3-E","knowledgePointIds":["d3-E-0-0"],"scenarioId":"d3-doc-case-b4a782a72c","scenario":"The audit committee of Seaton Insurance meets for 20 minutes and will read only the first page of the AI audit report. The auditor, Paula Ward, has 40 detailed findings.","type":"application","difficulty":"moderate","topic":"Executive summary for the audit committee","stem":"What should the executive summary do? Correct Answer: B","options":["List all 40 findings in technical detail","State the overall conclusion, the most significant findings and risks, and required decisions, in clear non-technical language","Describe the audit team's biographies","Present the model architecture diagram only"],"correctIndex":1,"explanation":"The executive summary should let the reader grasp the conclusion, key risks and needed actions quickly. Details belong in the body and appendices. Biographies or architecture diagrams do not inform decisions.","optionRationales":["A long technical list defeats the purpose.","The executive summary should let the reader grasp the conclusion, key risks and needed actions quickly. Details belong in the body and appendices. Biographies or architecture diagrams do not inform decisions.","Biographies do not inform decisions.","A diagram alone gives no conclusion."],"sourceRef":"D3 practice questions · Q72 · 3.16","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q073","sectionId":"d3-E","knowledgePointIds":["d3-E-0-0"],"scenarioId":"d3-doc-case-59bdec408a","scenario":"The auditor, Idris Bello, used judgmental sampling and relied on a vendor's test report for part of an AI model audit at Larkin Health. He is drafting the methodology section.","type":"application","difficulty":"moderate","topic":"Methodology and limitations in reporting","stem":"What should the methodology section include? Correct Answer: B","options":["No description of sampling, to keep the report short","The approach, sampling method and rationale, sources of evidence and their limitations, so readers can judge the reliability of the conclusions","Only the names of audit tools","A statement that all evidence was perfect"],"correctIndex":1,"explanation":"The methodology explains how conclusions were reached, including sampling and evidence limitations. Step 1: disclose approach and limits. Step 2: let readers judge reliability. Omitting them or overstating evidence harms credibility.","optionRationales":["Without sampling detail, readers cannot judge the extent of assurance.","The methodology explains how conclusions were reached, including sampling and evidence limitations. Step 1: disclose approach and limits. Step 2: let readers judge reliability. Omitting them or overstating evidence harms credibility.","Tool names alone do not explain the approach.","Claiming perfection is unsupported."],"sourceRef":"D3 practice questions · Q73 · 3.16","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q074","sectionId":"d3-E","knowledgePointIds":["d3-E-0-0"],"scenarioId":"d3-doc-case-81a8757471","scenario":"The auditor, Tara Whelan, has a finding that an insurer's AI claims model has no bias monitoring. Management's response says \"we will consider it.\" The audit manager asks how to complete the finding.","type":"application","difficulty":"difficult","topic":"Findings and remediation","stem":"What is the BEST approach? Correct Answer: D","options":["Remove the finding to maintain good relations","Accept \"will consider it\" as a response","Assign the remediation to the audit team","State the condition, criteria, cause, risk and recommendation, and obtain a specific management action plan with an owner and due date"],"correctIndex":3,"explanation":"Findings should be clear and actionable, with agreed ownership and timelines. Step 1: document the finding properly. Step 2: obtain a specific plan. Vague responses, audit-owned remediation or removal undermine reporting and independence.","optionRationales":["Removing valid findings compromises objectivity.","A vague response leaves no accountability.","Remediation is management's responsibility.","Findings should be clear and actionable, with agreed ownership and timelines. Step 1: document the finding properly. Step 2: obtain a specific plan. Vague responses, audit-owned remediation or removal undermine reporting and independence."],"sourceRef":"D3 practice questions · Q74 · 3.16","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q075","sectionId":"d3-E","knowledgePointIds":["d3-E-0-1"],"scenarioId":"d3-doc-case-979f285c02","scenario":"The head of data science at Fairview Bank, Colm Rafferty, asks internal audit for an \"AI readiness review\" of a planned model before development. The auditor, Soraya Ahmadi, notes that this is not an assurance audit.","type":"application","difficulty":"moderate","topic":"Advisory engagement versus audit","stem":"What is the BEST approach? Correct Answer: A","options":["Treat it as an advisory (consultancy) engagement and agree the scope, receiver, timeline and communication in advance","Issue an audit opinion on a system that does not yet exist","Start without any agreement on scope","Decline because audit never advises"],"correctIndex":0,"explanation":"Advisory engagements are consultancy rather than audits. Step 1: recognize the nature of the request. Step 2: agree scope, receiver, timeline and communication. Auditors can advise, within independence limits.","optionRationales":["Advisory engagements are consultancy rather than audits. Step 1: recognize the nature of the request. Step 2: agree scope, receiver, timeline and communication. Auditors can advise, within independence limits.","An opinion cannot be given on a nonexistent system.","Without agreed scope, expectations differ.","Audit may advise when independence is protected."],"sourceRef":"D3 practice questions · Q75 · 3.16.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q076","sectionId":"d3-E","knowledgePointIds":["d3-E-0-1"],"scenarioId":"d3-doc-case-d538c8eecc","scenario":"During an advisory engagement for Ridgewood Retail, management asks the audit team to design the monitoring controls for a new AI pricing model and then to own the monitoring process. The audit director, Ben Okoro, must respond.","type":"application","difficulty":"difficult","topic":"Advisory independence limits","stem":"What is the BEST response? Correct Answer: C","options":["Design the controls but let management operate them","Design the controls and operate the process, since audit knows controls best","Advise on control objectives and good practice, but do not design the controls or own the process, so that independence is preserved for future audits","Refuse all advice"],"correctIndex":2,"explanation":"In advisory work, audit may advise but must not design controls or own a process. Doing so creates a self-review threat when it later audits them. Step 1: separate advice from management responsibility. Step 2: keep ownership with management.","optionRationales":["Designing the controls is also a management function.","Operating the process is a management role and impairs independence.","In advisory work, audit may advise but must not design controls or own a process. Doing so creates a self-review threat when it later audits them. Step 1: separate advice from management responsibility. Step 2: keep ownership with management.","Refusing all advice is unnecessary."],"sourceRef":"D3 practice questions · Q76 · 3.16.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q077","sectionId":"d3-E","knowledgePointIds":["d3-E-0-1"],"scenarioId":"d3-doc-case-b929ca5314","scenario":"Internal audit at Stanton Bank helped management shape an AI model risk framework through an advisory engagement last year, as advised only. This year the CAE, Gloria Santos, plans an assurance audit of the framework's operation and asks an auditor from that advisory team to lead it. Management has since changed the framework without audit input.","type":"application","difficulty":"expert","topic":"Advisory involvement and later assurance","stem":"What is the MOST important consideration? Correct Answer: C","options":["Cancel the assurance audit permanently","No consideration is needed because advice is not design","Assess the independence and objectivity risk from the prior advisory involvement, and assign leadership and safeguards so that the assurance work is not reviewing audit's own advice","Have the same auditor sign off with no review"],"correctIndex":2,"explanation":"Prior involvement can create threats to objectivity even when audit only advised. Step 1: assess the nature and extent of involvement and what has changed. Step 2: apply safeguards such as different leadership and review. Ignoring the issue or cancelling assurance are both weaker.","optionRationales":["Cancelling removes needed assurance.","Prior involvement still requires an objectivity assessment.","Prior involvement can create threats to objectivity even when audit only advised. Step 1: assess the nature and extent of involvement and what has changed. Step 2: apply safeguards such as different leadership and review. Ignoring the issue or cancelling assurance are both weaker.","Sign-off without review gives no safeguard."],"sourceRef":"D3 practice questions · Q77 · 3.16.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q078","sectionId":"d3-E","knowledgePointIds":["d3-E-0-2"],"scenarioId":"d3-doc-case-94c10ba4df","scenario":"The auditor, Lena Jorgensen, wants to present AI audit ratings by business unit to the audit committee of Westgate Public Services using a heat map. A colleague suggests choosing colours for visual effect.","type":"application","difficulty":"moderate","topic":"Heat maps and visualizations","stem":"What should the heat map be based on? Correct Answer: A","options":["The audit rating methodology or the risk management framework, so that colours have consistent, defined meaning","The designer's preferred colours","Random values","The size of each unit's office"],"correctIndex":0,"explanation":"Heat maps should reflect the audit rating methodology or risk framework so that ratings are consistent and understood. Visual preference or arbitrary values do not convey risk.","optionRationales":["Heat maps should reflect the audit rating methodology or risk framework so that ratings are consistent and understood. Visual preference or arbitrary values do not convey risk.","Preference does not convey defined meaning.","Random values mislead.","Office size is not a risk measure."],"sourceRef":"D3 practice questions · Q78 · 3.16.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q079","sectionId":"d3-E","knowledgePointIds":["d3-E-0-3"],"scenarioId":"d3-doc-case-adce9d01b4","scenario":"Six months after an AI audit report at Harlow Insurance, management reports that all actions on bias testing are \"complete.\" The auditor, Sam Odell, is responsible for follow-up.","type":"application","difficulty":"moderate","topic":"Follow-up","stem":"What is the MOST effective procedure? Correct Answer: D","options":["Ask the model owner to attest in an email","Accept management's report and close the actions","Close the actions because the due date has passed","Verify completion through evidence, such as bias test results and approved procedures, and report the status of each action to the audit committee"],"correctIndex":3,"explanation":"Follow-up verifies that management has implemented agreed remediation, with evidence. Step 1: obtain evidence. Step 2: report the status. Self-reported closure, dates or emails are not sufficient.","optionRationales":["An email attestation lacks independent support.","Management assertion is not evidence.","A due date passing is not completion.","Follow-up verifies that management has implemented agreed remediation, with evidence. Step 1: obtain evidence. Step 2: report the status. Self-reported closure, dates or emails are not sufficient."],"sourceRef":"D3 practice questions · Q79 · 3.17","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q080","sectionId":"d3-E","knowledgePointIds":["d3-E-0-3"],"scenarioId":"d3-doc-case-ef04ff6d08","scenario":"The audit team at Kingsley Bank introduces a tool that tracks remediation actions and automatically marks them closed when owners upload a document. The CAE, Marta Costa, is concerned about reliability.","type":"application","difficulty":"difficult","topic":"Automated follow-up and validation","stem":"What is the BEST design? Correct Answer: B","options":["Allow owners to close actions by uploading any file","Use automation to track due dates and send reminders, but require auditors to validate the evidence before an action is closed","Disable follow-up automation entirely","Close actions automatically after a set time"],"correctIndex":1,"explanation":"Automation helps track and prompt follow-up, but closure needs validated evidence. Step 1: use the tool for tracking and reminders. Step 2: keep auditor validation. Uploading any file or time-based closure risks false closure.","optionRationales":["Any file can be irrelevant or inadequate.","Automation helps track and prompt follow-up, but closure needs validated evidence. Step 1: use the tool for tracking and reminders. Step 2: keep auditor validation. Uploading any file or time-based closure risks false closure.","Disabling automation forfeits efficiency.","Time passing is not completion."],"sourceRef":"D3 practice questions · Q80 · 3.17.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q081","sectionId":"d3-E","knowledgePointIds":["d3-E-0-4"],"scenarioId":"d3-doc-case-a448768418","scenario":"The CAE of Eastwood Health, Dr. Ingrid Hale, wants to ensure that AI audit work is of consistent quality. A senior auditor suggests that peers check each other informally.","type":"application","difficulty":"moderate","topic":"Internal quality assurance","stem":"What is the BEST approach? Correct Answer: B","options":["Rely on informal peer chats only","Designate a senior leader as quality assurance reviewer to assess audit work against the audit standards and methodology","Let the auditee review the work for quality","Skip quality review for AI audits"],"correctIndex":1,"explanation":"Quality assurance should be performed by a senior leader acting as QA reviewer. Informal or auditee review lacks authority and independence, and skipping review leaves quality unverified.","optionRationales":["Informal checks lack structure and authority.","Quality assurance should be performed by a senior leader acting as QA reviewer. Informal or auditee review lacks authority and independence, and skipping review leaves quality unverified.","Auditees should not assess audit quality.","AI audits need quality review like any other."],"sourceRef":"D3 practice questions · Q81 · 3.18","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q082","sectionId":"d3-E","knowledgePointIds":["d3-E-0-4"],"scenarioId":"d3-doc-case-3507f79dde","scenario":"The audit committee chair of Dalton Insurance, Walter Reid, asks how often the AI audit function should have an independent external quality review and to whom it should report.","type":"application","difficulty":"moderate","topic":"External quality assessment","stem":"Which answer is CORRECT? Correct Answer: D","options":["Every ten years, reported to the press","Every month, reported to the vendor","Never, reported to management only","Once every three to five years, with results reported to the audit committee or board"],"correctIndex":3,"explanation":"An external QA review takes place once every 3 to 5 years, with results reported to the audit committee or board. Other frequencies and recipients do not match.","optionRationales":["Ten years is too long, and the press is not a recipient.","Monthly external reviews are impractical, and vendors are not recipients.","Reviews must occur, and the board or committee must receive results.","An external QA review takes place once every 3 to 5 years, with results reported to the audit committee or board. Other frequencies and recipients do not match."],"sourceRef":"D3 practice questions · Q82 · 3.18","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q083","sectionId":"d3-E","knowledgePointIds":["d3-C-0-2"],"scenarioId":"d3-doc-case-8dd843f98c","scenario":"The CAE of Moon Capital, Reed Tolliver, plans four tasks: (1) reviewing end-of-month journal entries for anomalies across the whole population; (2) extracting payment terms from scanned supplier contracts; (3) testing a trading model when real client data cannot be shared; (4) combining records from the loan system and the CRM for analysis. She asks which techniques fit best.","type":"application","difficulty":"expert","topic":"Matching audit techniques to tasks","stem":"Which mapping is MOST appropriate? Correct Answer: A","options":["(1) an LLM or analytics tool on the full population; (2) OCR; (3) synthetic data; (4) ETL","(1) OCR; (2) synthetic data; (3) ETL; (4) an LLM","(1) synthetic data; (2) ETL; (3) OCR; (4) scraping","(1) scraping; (2) an LLM; (3) OCR; (4) synthetic data"],"correctIndex":0,"explanation":"Whole-population anomaly checks suit analytics or an LLM, scanned contracts need OCR, unavailable real data suggests synthetic data, and combining systems requires ETL. Step 1: identify each task's need. Step 2: map to the technique.","optionRationales":["Whole-population anomaly checks suit analytics or an LLM, scanned contracts need OCR, unavailable real data suggests synthetic data, and combining systems requires ETL. Step 1: identify each task's need. Step 2: map to the technique.","This scrambles all four pairings.","Synthetic data does not extract contract text, and scraping is not for joining internal systems.","Scraping is not an end-of-month check, and OCR does not generate test data."],"sourceRef":"D3 practice questions · Q83 · 3.10","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q084","sectionId":"d3-E","knowledgePointIds":["d3-E-0-0"],"scenarioId":"d3-doc-case-59ee4f17e4","scenario":"The auditor in charge, Dr. Yasmin Farouk, concludes that an AI underwriting model at Pembroke Insurance has significant gaps in explainability and bias testing, with sufficient evidence. The chief underwriting officer asks her to rate it \"satisfactory with minor comments\" ahead of a regulator visit and says the CAE is \"flexible.\"","type":"application","difficulty":"expert","topic":"Reporting under management pressure","stem":"What should the auditor do? Correct Answer: C","options":["Remove the findings from the report entirely","Soften the rating to protect the relationship","Report the rating the evidence supports, discuss factual accuracy with management, and escalate to the CAE and the audit committee if pressure continues","Ask the regulator to decide the rating"],"correctIndex":2,"explanation":"Audit conclusions must rest on evidence and remain objective. Step 1: confirm the evidence. Step 2: report accurately, allow management to correct facts, and escalate pressure. Softening or deleting findings compromises independence and may mislead the regulator.","optionRationales":["Deleting findings conceals known risk.","Rating changes without evidence compromise objectivity.","Audit conclusions must rest on evidence and remain objective. Step 1: confirm the evidence. Step 2: report accurately, allow management to correct facts, and escalate pressure. Softening or deleting findings compromises independence and may mislead the regulator.","The rating is the auditor's responsibility."],"sourceRef":"D3 practice questions · Q84 · 3.16","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q085","sectionId":"d3-E","knowledgePointIds":["d3-E-0-0"],"scenarioId":"d3-doc-case-accf9e353b","scenario":"An audit team at Ravensworth Insurance uses an LLM-based tool to test 100% of 60,000 claims against policy and flags 1,800 exceptions. A manual review of 100 flagged items finds that 40 are false positives. The senior auditor wants to report \"1,800 control failures\" and recommend disciplinary action in the draft.","type":"application","difficulty":"expert","topic":"Reporting AI-generated exceptions","stem":"What is the BEST action? Correct Answer: C","options":["Report 1,080 failures (60% of 1,800) as confirmed","Report all 1,800 as failures, since the tool tested the whole population","Validate the exceptions further, refine the tool or criteria, and report only validated findings, describing the tool's limitations and the validation performed","Drop the analysis because AI tools are unreliable"],"correctIndex":2,"explanation":"AI tool output is a lead, not evidence. A 40% false positive rate means the raw count overstates failures. Step 1: validate and refine. Step 2: report validated results with the limitations disclosed. Extrapolating a sample percentage to claim confirmed failures is a projection, not validation, and abandoning the work forfeits the value.","optionRationales":["Applying a rate from a small sample to claim confirmed failures is unsupported.","Unvalidated AI output is not reliable evidence.","AI tool output is a lead, not evidence. A 40% false positive rate means the raw count overstates failures. Step 1: validate and refine. Step 2: report validated results with the limitations disclosed. Extrapolating a sample percentage to claim confirmed failures is a projection, not validation, and abandoning the work forfeits the value.","Tool limitations call for validation, not abandonment."],"sourceRef":"D3 practice questions · Q85 · 3.3","tags":["d3","document-import","scenario","application"]}];

const QUESTION_BY_ID = Object.fromEntries(Object.values(QUESTION_BANK).flat().map(q => [q.id, q]));
function questionsForSection(sectionId) { return QUESTION_BANK[sectionId] || []; }
function knowledgePointIndex() {
  const points = [];
  DOMAINS.forEach(dom => dom.sections.forEach(sec => sec.groups.forEach((group, gi) => group.cards.forEach((card, ci) => {
    const id = cardKey(dom.id, sec.id, gi, ci);
    points.push({ id, domain:dom, section:sec, group, card });
  }))));
  return points;
}
function linkLegacyQuestions() {
  const reviewedLegacyLinks = {
    "d1-A-q008":"Business use case requirements", "d1-A-q011":"GANs — Generative Adversarial Networks",
    "d1-A-q016":"Support Vector Machines — SVM (Supervised)", "d1-A-q022":"Algorithm vs. Model vs. Parameter vs. Hyperparameter",
    "d1-A-q031":"AI-specific cost categories", "d1-B-q002":"Industry-level AI strategy",
    "d1-B-q006":"Champions / Power Users", "d1-B-q007":"Managing AI's Workforce Impact",
    "d1-B-q008":"The 8 Metric Objectives (OECD.AI Policy Observatory)", "d1-B-q010":"AI Benefits Worth Memorizing",
    "d1-C-q003":"AI Risk Identification Principles", "d1-C-q007":"Fine-tuning third-party models with internal data",
    "d1-C-q008":"Five Challenges for AI Risk Management", "d1-C-q013":"KRI Examples — Customer Service Chatbot",
    "d1-C-q017":"RAG — When It's the WRONG Answer", "d1-D-q007":"Data minimization principle",
    "d1-D-q008":"Data licensing considerations", "d1-D-q010":"Data balancing (class imbalance correction)",
    "d1-E-q005":"Systematic (Systemic) Bias", "d1-E-q009":"Statistical / Computational Bias",
    "d1-E-q012":"IP risk in AI training and content generation", "d1-E-q014":"Environmental impact of AI infrastructure"
  };
  const pointsBySection = {};
  knowledgePointIndex().forEach(point => {
    const key = `${point.domain.id}-${point.section.id}`;
    (pointsBySection[key] ||= []).push(point);
  });
  Object.values(QUESTION_BANK).flat().forEach(question => {
    if (question.knowledgePointIds.length) return;
    let points = pointsBySection[question.sectionId] || [];
    const reviewedTerm = reviewedLegacyLinks[question.id];
    const reviewedPoint = reviewedTerm && points.find(point => point.card.term === reviewedTerm);
    if (reviewedPoint) { question.knowledgePointIds = [reviewedPoint.id]; return; }
    const citedGroup = question.explanation.match(/\(([A-E]\.\d+)\)/i)?.[1]?.toUpperCase();
    if (citedGroup) {
      const inCitedGroup = points.filter(point => point.group.name.toUpperCase().startsWith(citedGroup));
      if (inCitedGroup.length) points = inCitedGroup;
    }
    for (const text of [question.options[question.correctIndex] || "", question.stem, question.explanation]) {
      const lowerText = text.toLowerCase();
      const matches = points.filter(point => {
        const term = point.card.term;
        const aliases = [term, term.split(/[—–]/)[0].trim(), term.replace(/\s*\([^)]*\)/g, "").trim()];
        const acronyms = [...term.matchAll(/\(([A-Z][A-Z0-9&+.-]{1,})\)/g)].map(match => match[1]);
        return [...aliases, ...acronyms].some(alias => alias.length > 2 && lowerText.includes(alias.toLowerCase()));
      });
      if (!matches.length) continue;
      const longest = Math.max(...matches.map(point => point.card.term.length));
      const best = matches.filter(point => point.card.term.length === longest);
      if (best.length === 1) { question.knowledgePointIds = [best[0].id]; break; }
    }
  });
}

function questionCoverage() {
  const points = knowledgePointIndex();
  const counts = Object.fromEntries(points.map(p => [p.id, 0]));
  Object.values(QUESTION_BANK).flat().forEach(q => q.knowledgePointIds.forEach(id => { if (id in counts) counts[id]++; }));
  const assigned = Object.values(QUESTION_BANK).flat().filter(q => q.knowledgePointIds.length).length;
  return { points, counts, assigned, questions:Object.values(QUESTION_BANK).flat().length };
}
function questionBankAudit() {
  const all=allQuestions(),ids=new Set(),issues=[];
  all.forEach(q=>{
    if(ids.has(q.id))issues.push(`${q.id}: duplicate ID`);ids.add(q.id);
    if(!q.stem||!Array.isArray(q.options)||q.options.length!==4||!Number.isInteger(q.correctIndex)||q.correctIndex<0||q.correctIndex>3||!q.explanation)issues.push(`${q.id}: incomplete question structure`);
    if(Array.isArray(q.options)&&new Set(q.options).size!==q.options.length)issues.push(`${q.id}: duplicate answer choices`);
    if(q.knowledgePointIds.some(id=>!knowledgePointIndex().some(p=>p.id===id)))issues.push(`${q.id}: unknown knowledge-point link`);
    if(!q.sourceRef)issues.push(`${q.id}: missing source reference`);
    if(q.scenarioId&&!q.scenario)issues.push(`${q.id}: scenario link has no case text`);
  });
  const unlinked=all.filter(q=>!q.knowledgePointIds.length).length;
  const withScenarios=all.filter(q=>q.scenarioId).length;
  return {total:all.length,issues,unlinked,missingRationales:all.filter(q=>!Array.isArray(q.optionRationales)||q.optionRationales.length!==4).length,withScenarios,scenarioCount:new Set(all.filter(q=>q.scenarioId).map(q=>q.scenarioId)).size};
}
function allQuestions() { return Object.values(QUESTION_BANK).flat(); }

  const questions=questionsForSection(q.sectionId);
