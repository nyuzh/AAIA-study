PointIds":["d2-G-0-9","d2-F-0-3"],"scenarioId":"d2-doc-case-8056693785","scenario":"Bellamy Health's diagnostic model was poisoned through its training feed. The poisoned records have been identified and the pipeline access cut off. The model cannot be patched. The AI lead, Sunita Rao, must choose an eradication approach that balances speed and thoroughness.","type":"application","difficulty":"expert","stem":"What is the BEST approach?","options":["Keep the model unchanged, since the access has been revoked","Patch the model's weights manually, as with code","In the short term sanitize outputs, and in the long term isolate and remove the poisoned data and retrain, using selective retraining on clean data to force the model to forget poisoned patterns","Delete all logs and datasets so that the issue disappears"],"correctIndex":2,"explanation":"Patching does not work for models. Step 1: recognize that the poisoned patterns remain in the model even after access is cut. Step 2: apply short-term output sanitization, then remove poisoned data and retrain selectively on clean data. Doing nothing keeps the flawed behavior, and deleting evidence destroys the investigation.","optionRationales":["Cutting access prevents new poisoning but does not remove existing influence.","Weights cannot be patched like code.","Patching does not work for models. Step 1: recognize that the poisoned patterns remain in the model even after access is cut. Step 2: apply short-term output sanitization, then remove poisoned data and retrain selectively on clean data. Doing nothing keeps the flawed behavior, and deleting evidence destroys the investigation.","Deleting logs and data destroys evidence and does not repair the model."],"sourceRef":"D2 practice questions · Q84 · 2.19.2","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q085","sectionId":"d2-G","knowledgePointIds":["d2-G-0-10"],"scenarioId":"d2-doc-case-bed7d874e3","scenario":"After an adversarial inference incident, Calder Insurance's AI model has been contained and partially cleaned. Some attack techniques cannot be fully eradicated. The business owner, Idris Cole, wants the system back online today. The security manager, Wanda Pierce, must decide what recovery requires.","type":"application","difficulty":"difficult","stem":"Which approach is BEST?","options":["Reactivate and disable monitoring to restore full performance","Reactivate immediately, because containment is complete","Reduce the attack surface with stricter access controls and new input/output validations, validate the new controls, monitor for residual threats, and obtain stakeholder approval before reactivation","Wait for the next scheduled audit before reactivation"],"correctIndex":2,"explanation":"Recovery returns the system to a safe operational state. Because some attacks cannot be fully eradicated, the aim is to reduce the attack surface and prevent relapse. Step 1: apply and validate stronger controls. Step 2: monitor for residuals and obtain approval to reactivate. Reactivation without these steps, or with monitoring off, risks relapse, and waiting for an audit is arbitrary.","optionRationales":["Switching off monitoring removes the ability to detect residual threats.","Containment alone does not validate controls or prevent relapse.","Recovery returns the system to a safe operational state. Because some attacks cannot be fully eradicated, the aim is to reduce the attack surface and prevent relapse. Step 1: apply and validate stronger controls. Step 2: monitor for residuals and obtain approval to reactivate. Reactivation without these steps, or with monitoring off, risks relapse, and waiting for an audit is arbitrary.","Linking reactivation to the audit calendar ignores readiness criteria."],"sourceRef":"D2 practice questions · Q85 · 2.19.3","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q086","sectionId":"d2-G","knowledgePointIds":["d2-G-0-11"],"scenarioId":"d2-doc-case-6039917e43","scenario":"Two weeks after a data-poisoning incident is closed, Quantum Bank's CEO, Hillary Stone, wants the incident team to move on. The incident manager, Tobias Reyes, proposes a postmortem. The CEO asks what it is for.","type":"application","difficulty":"moderate","stem":"What is the PRIMARY purpose of the post-incident review?","options":["To identify improvements in data preprocessing, security controls, adversarial testing, input/output controls, fairness of outputs and the provider's control environment, moving the organization from reactive to proactive readiness","To assign blame to an individual so that the organization can discipline them","To reduce the size of the logs","To formally retire the model"],"correctIndex":0,"explanation":"The postmortem is a learning mechanism: it looks for improvements across data handling, controls, testing and provider environments, and shifts the posture from reactive to proactive. Step 1: reject blame as the aim. Step 2: use findings to strengthen controls. Log size and retirement are unrelated.","optionRationales":["The postmortem is a learning mechanism: it looks for improvements across data handling, controls, testing and provider environments, and shifts the posture from reactive to proactive. Step 1: reject blame as the aim. Step 2: use findings to strengthen controls. Log size and retirement are unrelated.","Blame discourages reporting and does not improve controls.","Log size is not a learning objective.","Retirement is a different life cycle decision."],"sourceRef":"D2 practice questions · Q86 · 2.20","tags":["d2","document-import","scenario","application"]},{"id":"d2-doc-q087","sectionId":"d2-G","knowledgePointIds":["d2-G-0-5","d2-B-0-11"],"scenarioId":"d2-doc-case-a6fc8364e0","scenario":"Ladbroke Retail's demand-forecast accuracy drops sharply overnight. The change log shows no model or data changes, and drift monitoring would normally take weeks to show such a fall. Access logs reveal that an unfamiliar account edited a preprocessing script two days ago. The operations lead, Gideon Marsh, suggests treating it as ordinary drift and retraining tonight.","type":"application","difficulty":"expert","stem":"What should the AI incident manager do FIRST?","options":["Delete the preprocessing script so that no one can edit it","Retrain tonight on the latest data to absorb the new pattern","Wait a week to see whether accuracy recovers","Treat it as a possible poisoning incident: invoke the response process, contain by revoking pipeline access, and assess scope before any retraining"],"correctIndex":3,"explanation":"The speed of the fall and the unauthorized edit are indicators of tampering rather than gradual drift. Step 1: reclassify the event as a potential incident. Step 2: contain (revoke access to the pipeline and scripts), preserve evidence and assess scope before retraining, which could embed poisoned data. Retraining first, waiting or deleting evidence are weaker.","optionRationales":["Deleting the script destroys evidence and may break the pipeline.","Retraining on possibly poisoned data would incorporate it.","Waiting prolongs exposure and delays assessment.","The speed of the fall and the unauthorized edit are indicators of tampering rather than gradual drift. Step 1: reclassify the event as a potential incident. Step 2: contain (revoke access to the pipeline and scripts), preserve evidence and assess scope before retraining, which could embed poisoned data. Retraining first, waiting or deleting evidence are weaker."],"sourceRef":"D2 practice questions · Q87 · 2.17","tags":["d2","document-import","scenario","application"]}];

const IMPORTED_DOMAIN3_QUESTIONS = [{"id":"d3-doc-q001","sectionId":"d3-A","knowledgePointIds":["d3-A-0-0"],"scenarioId":"d3-doc-case-01da3b6503","scenario":"Oakridge Bank's chief audit executive, Helen Marsh, has been asked to include AI in next year's audit plan. The bank uses AI in credit scoring, a customer chatbot and several analyst tools, but no one has a complete list. The IS audit manager, Tariq Ali, must start planning.","type":"application","difficulty":"basic","topic":"Where an AI audit begins","stem":"What should be the FIRST step in planning the AI audit? Correct Answer: B","options":["Select the sampling method for testing model outputs","Identify the AI assets in use, through an AI inventory, so that scope and controls can be defined","Draft the audit report template","Run bias tests on the credit-scoring model"],"correctIndex":1,"explanation":"Audit planning for AI begins with identification of AI assets, because scope, owners, data and controls depend on knowing what exists. Step 1: recognize that no inventory exists. Step 2: establish it before choosing tests or report formats. Sampling, report templates and bias tests all presume a defined scope.","optionRationales":["Sampling methods depend on the scope and population, which are not yet known.","Audit planning for AI begins with identification of AI assets, because scope, owners, data and controls depend on knowing what exists. Step 1: recognize that no inventory exists. Step 2: establish it before choosing tests or report formats. Sampling, report templates and bias tests all presume a defined scope.","A report template is a late-stage output.","Bias tests on one model skip the wider question of what AI exists."],"sourceRef":"D3 practice questions · Q1 · 3.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q002","sectionId":"d3-A","knowledgePointIds":["d3-A-0-0"],"scenarioId":"d3-doc-case-37de393030","scenario":"At Lakeshore Insurance, management asks internal audit to build and maintain the AI inventory itself because \"audit knows the business best.\" Several departments are reluctant to report tools they bought on their own, fearing reprimand. The audit director, Priya Raman, must respond.","type":"application","difficulty":"moderate","topic":"Purpose and ownership of the AI inventory","stem":"What is the BEST response? Correct Answer: D","options":["Skip the inventory and sample AI tools reported by vendors","Lead the inventory and report unapproved tools to the disciplinary committee","Lead the inventory and keep it confidential from management","Decline to lead the inventory, support management in building it, and have management communicate that its purpose is visibility and governance, not penalties"],"correctIndex":3,"explanation":"The inventory should be run by management using a structured approach across governance, risk, IT and audit; internal audit should not lead or manage it, which would impair independence. Its purpose is to identify AI in use, so staff should be told no one will be reprimanded for disclosure. Step 1: preserve independence. Step 2: support disclosure through clear messaging.","optionRationales":["Vendor-reported lists miss shadow AI and cannot substitute for the inventory.","Leading the effort compromises independence, and threatening discipline discourages disclosure.","Audit leading it still impairs independence, and hiding it from management defeats governance.","The inventory should be run by management using a structured approach across governance, risk, IT and audit; internal audit should not lead or manage it, which would impair independence. Its purpose is to identify AI in use, so staff should be told no one will be reprimanded for disclosure. Step 1: preserve independence. Step 2: support disclosure through clear messaging."],"sourceRef":"D3 practice questions · Q2 · 3.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q003","sectionId":"d3-A","knowledgePointIds":["d3-A-0-0"],"scenarioId":"d3-doc-case-df4b720657","scenario":"A public-sector agency's compliance team is surveying departments to build a baseline AI inventory. One manager, Ewan Rhodes, proposes making the survey completely anonymous so that people answer honestly. The IS auditor, Mara Ibsen, reviews the design.","type":"application","difficulty":"moderate","topic":"Inventory data gathering: surveys","stem":"What is the MOST important consideration? Correct Answer: A","options":["Some anonymity can encourage honest answers, but complete anonymity reduces accountability and motivation to respond, so use structured, quantifiable questions with identified owners where possible","Complete anonymity is always best because it maximizes honesty","Surveys should be avoided because interviews are more reliable for baselines","Open-ended essay questions give the most reliable aggregated data"],"correctIndex":0,"explanation":"Surveys are efficient for a baseline, and partial anonymity helps, but full anonymity removes accountability and may lower response. Structured, quantifiable questions produce data that can be aggregated. Step 1: weigh honesty against accountability. Step 2: design for aggregation. Interviews help in development teams but are only minimally useful for a baseline.","optionRationales":["Surveys are efficient for a baseline, and partial anonymity helps, but full anonymity removes accountability and may lower response. Structured, quantifiable questions produce data that can be aggregated. Step 1: weigh honesty against accountability. Step 2: design for aggregation. Interviews help in development teams but are only minimally useful for a baseline.","Full anonymity reduces accountability and follow-up.","Interviews are minimally useful for building a baseline and are hard to aggregate.","Open-ended answers add complexity and are hard to aggregate."],"sourceRef":"D3 practice questions · Q3 · 3.1.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q004","sectionId":"d3-A","knowledgePointIds":["d3-A-0-0"],"scenarioId":"d3-doc-case-defd56301a","scenario":"The AI inventory at Pinnacle Retail lists tool names only. The auditor, Sven Larsen, finds no information about versions, licences, vendors or who is answerable for each tool, and the IT asset register uses ServiceNow. He must recommend how to make the inventory useful for governance and audit.","type":"application","difficulty":"moderate","topic":"Inventory fields and ownership","stem":"What is the BEST recommendation? Correct Answer: C","options":["Replace the inventory with a one-time list in a spreadsheet","Keep names only, to keep the inventory simple","Standardize fields, including name and version, licence, deployment, purpose and frequency of use, stakeholders, accountable owner and third-party vendor details, and integrate with the existing asset management platform","Capture only the vendor's name and contract value"],"correctIndex":2,"explanation":"A useful inventory models existing IT asset inventories, captures standard fields including an accountable owner and vendor details, and integrates with platforms such as ServiceNow or Jira. Step 1: find what is missing for governance. Step 2: standardize and integrate. Names alone do not support risk assessment, and one-time lists go stale.","optionRationales":["A one-time spreadsheet is not maintained and is not integrated.","Names alone cannot support ownership, risk or vendor oversight.","A useful inventory models existing IT asset inventories, captures standard fields including an accountable owner and vendor details, and integrates with platforms such as ServiceNow or Jira. Step 1: find what is missing for governance. Step 2: standardize and integrate. Names alone do not support risk assessment, and one-time lists go stale.","Vendor name and contract value omit version, purpose, owner and use."],"sourceRef":"D3 practice questions · Q4 · 3.1.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q005","sectionId":"d3-A","knowledgePointIds":["d3-A-0-0"],"scenarioId":"d3-doc-case-865236140f","scenario":"During fieldwork at Brightmore Health, the auditor, Zainab Qureshi, learns that the recruitment team subscribed to an external CV-screening tool without involving IT or procurement. It is not in the AI inventory, and the vendor processes candidate data. The CAE, Ravi Sethi, asks for the audit's PRIMARY concern.","type":"application","difficulty":"difficult","topic":"Shadow AI and decentralized ownership","stem":"What is the PRIMARY concern? Correct Answer: C","options":["The tool is too new to have a user manual","The subscription cost exceeds the recruitment team's budget","Shadow AI with decentralized ownership leaves a high-risk system outside governance, risk assessment and data protection review","The tool's interface does not match the corporate brand"],"correctIndex":2,"explanation":"Departments that deploy AI externally without IT involvement create shadow AI, and ownership becomes decentralized. Step 1: classify the tool (hiring is a high-risk use with personal data). Step 2: see that the real exposure is the absence of governance, risk and privacy oversight. Cost, manuals and branding are minor.","optionRationales":["Documentation quality is secondary to governance gaps.","Budget is not the key risk.","Departments that deploy AI externally without IT involvement create shadow AI, and ownership becomes decentralized. Step 1: classify the tool (hiring is a high-risk use with personal data). Step 2: see that the real exposure is the absence of governance, risk and privacy oversight. Cost, manuals and branding are minor.","Branding is cosmetic."],"sourceRef":"D3 practice questions · Q5 · 3.1.3","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q006","sectionId":"d3-A","knowledgePointIds":["d3-A-0-1"],"scenarioId":"d3-doc-case-6055efc77e","scenario":"Auditor Leo Bianchi is mapping an AI audit programme to the five categories of AI controls. He needs to place a RACI chart that documents who is responsible and accountable for each AI system.","type":"application","difficulty":"basic","topic":"Control categories","stem":"Under which category does it belong? Correct Answer: A","options":["Governance and organizational","Technical, security and privacy","Operation and life cycle","Ethical and human values"],"correctIndex":0,"explanation":"Accountability structures such as RACI charts, charters, executive roles, AI policy, registries and risk management fall under governance and organizational controls. Technical controls cover data quality, access, configuration, testing and privacy; life cycle controls cover documentation, version control and monitoring; ethical controls cover bias, consent, explainability and oversight.","optionRationales":["Accountability structures such as RACI charts, charters, executive roles, AI policy, registries and risk management fall under governance and organizational controls. Technical controls cover data quality, access, configuration, testing and privacy; life cycle controls cover documentation, version control and monitoring; ethical controls cover bias, consent, explainability and oversight.","Technical controls concern data, access, configuration and testing.","Life cycle controls concern documentation, change, monitoring and SDLC.","Ethical controls concern bias, consent, transparency and human oversight."],"sourceRef":"D3 practice questions · Q6 · 3.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q007","sectionId":"d3-A","knowledgePointIds":["d3-A-0-2"],"scenarioId":"d3-doc-case-3a0f0ee9c3","scenario":"In an audit of a lending model at Granite Bank, the data science lead, Omar Fadel, suggests that the auditor run the bias detection tool himself because the team is busy. The auditor, Jess Taylor, wants to gain assurance over fairness.","type":"application","difficulty":"moderate","topic":"Validate controls, do not execute them","stem":"What is the BEST action? Correct Answer: D","options":["Accept a verbal assurance from the data science lead","Run the bias tool and treat the result as management's control","Design a new bias detection method for the team","Validate that the bias detection tool was used, that testing covered fairness against requirements and protected characteristics, and that results were reviewed, without running the tool as the control"],"correctIndex":3,"explanation":"The auditor validates that controls exist and operate; the auditor does not execute them or design them. Step 1: identify the control to test (bias testing). Step 2: obtain evidence of its execution and review. Running or designing the control compromises independence, and verbal assurance is insufficient evidence.","optionRationales":["A verbal statement is not sufficient, reliable evidence.","Operating the control makes the auditor part of it and impairs independence.","Designing methods is a management function.","The auditor validates that controls exist and operate; the auditor does not execute them or design them. Step 1: identify the control to test (bias testing). Step 2: obtain evidence of its execution and review. Running or designing the control compromises independence, and verbal assurance is insufficient evidence."],"sourceRef":"D3 practice questions · Q7 · 3.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q008","sectionId":"d3-A","knowledgePointIds":["d3-A-0-1"],"scenarioId":"d3-doc-case-a89451b9c3","scenario":"Auditor Mina Sato reviews the technical, security and privacy controls of a claims AI at Avalon Insurance. Access to training data uses shared accounts, accounts are never recertified, and privileged access is not reviewed. The data owner, Pete Garrity, says data quality is the only control that matters.","type":"application","difficulty":"difficult","topic":"Technical controls: data quality and access","stem":"Which finding should the auditor treat as the GREATEST risk? Correct Answer: B","options":["The absence of a corporate AI slogan","Weak access control, including shared accounts and no recertification, which exposes training and production data to unauthorized change and use","The data owner's focus on data quality","The lack of a colour scheme in dashboards"],"correctIndex":1,"explanation":"Access controls should cover users, systems, applications and third parties, with multifactor authentication, monitoring and certification and recertification. Step 1: weigh the findings by risk. Step 2: shared, unreviewed access endangers confidentiality and integrity. Data quality is important but does not replace access control.","optionRationales":["A slogan has no control significance.","Access controls should cover users, systems, applications and third parties, with multifactor authentication, monitoring and certification and recertification. Step 1: weigh the findings by risk. Step 2: shared, unreviewed access endangers confidentiality and integrity. Data quality is important but does not replace access control.","A focus on data quality is a view, not itself an exposure, and data quality is also a control.","Colour schemes are cosmetic."],"sourceRef":"D3 practice questions · Q8 · 3.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q009","sectionId":"d3-A","knowledgePointIds":["d3-A-0-2"],"scenarioId":"d3-doc-case-a53f46ec04","scenario":"At Harlow Manufacturing, an AI vision model for quality inspection has been retrained by the vendor several times this year. The auditor, Ines Costa, finds that change approvals are kept in email, emergency changes have no retrospective review, and versions are not recorded. The operations manager says that these are \"just model updates.\"","type":"application","difficulty":"difficult","topic":"Operation and life cycle controls: change management","stem":"What is the BEST audit conclusion? Correct Answer: B","options":["No conclusion is needed because retraining is automatic","Model updates are changes requiring a documented process with approvals, risk assessment, version control and review of emergency changes; the gaps are a control deficiency","The deficiency is only that email was used, so no further action is needed","The auditor should design the change process for management"],"correctIndex":1,"explanation":"Operation and life cycle controls include version control and a documented change process with authority, approvals, retention and emergency change handling. Step 1: classify retraining as a change. Step 2: conclude that missing records and reviews are deficiencies to report. Designing the process is management's role.","optionRationales":["Automatic does not mean exempt from change control.","Operation and life cycle controls include version control and a documented change process with authority, approvals, retention and emergency change handling. Step 1: classify retraining as a change. Step 2: conclude that missing records and reviews are deficiencies to report. Designing the process is management's role.","Email use is one symptom, but the missing approvals, versions and emergency reviews are the issue.","The auditor should recommend, not design, the process."],"sourceRef":"D3 practice questions · Q9 · 3.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q010","sectionId":"d3-A","knowledgePointIds":["d3-A-0-2"],"scenarioId":"d3-doc-case-16cddc97b3","scenario":"Auditor Karim Haddad reviews the design phase of an AI hiring tool at Vireo Technologies. The requirements are vague, the team cannot show that training data represents the applicant population, and the project has missed two milestones. The programme director says that more developers will fix it.","type":"application","difficulty":"moderate","topic":"SDLC and design-phase data fitness","stem":"What is the PRIMARY audit concern? Correct Answer: D","options":["The project does not use the newest algorithm","The number of developers is too low","The vendor's logo is too small in the user interface","Unclear or incomplete requirements and weak data fitness, which are leading causes of AI project failure and bias"],"correctIndex":3,"explanation":"Most projects fail due to unclear or incomplete requirements or poor leadership, and the design phase should confirm data fitness: completeness and representativeness of the population for bias mitigation. Step 1: identify the root issues in the evidence. Step 2: prioritize them over staffing or algorithm choice.","optionRationales":["Algorithm novelty is not the risk shown by the evidence.","Adding staff does not clarify requirements or data representativeness.","Logos are irrelevant.","Most projects fail due to unclear or incomplete requirements or poor leadership, and the design phase should confirm data fitness: completeness and representativeness of the population for bias mitigation. Step 1: identify the root issues in the evidence. Step 2: prioritize them over staffing or algorithm choice."],"sourceRef":"D3 practice questions · Q10 · 3.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q011","sectionId":"d3-A","knowledgePointIds":["d3-A-0-2"],"scenarioId":"d3-doc-case-85cb8bfe09","scenario":"Delta Council plans to use AI to prioritize applications for housing support. The privacy officer has completed a data protection impact assessment. The IS auditor, Nina Paulsen, asks whether this is sufficient given the EU AI Act.","type":"application","difficulty":"moderate","topic":"FRIA versus DPIA","stem":"What is the BEST audit position? Correct Answer: A","options":["A DPIA addresses privacy only; for a high-risk system the organization should also complete a fundamental rights impact assessment (FRIA)","The DPIA is sufficient for any AI system","Neither assessment is needed for public-sector systems","A penetration test replaces both assessments"],"correctIndex":0,"explanation":"High-risk AI systems under the EU AI Act, which include access to essential public services and benefits, require a FRIA, which is broader than the privacy-focused DPIA. Step 1: classify the system as high-risk. Step 2: expect both assessments. Penetration tests address security only.","optionRationales":["High-risk AI systems under the EU AI Act, which include access to essential public services and benefits, require a FRIA, which is broader than the privacy-focused DPIA. Step 1: classify the system as high-risk. Step 2: expect both assessments. Penetration tests address security only.","A DPIA covers privacy and data protection, not wider fundamental rights.","Public bodies are not exempt and the use is high-risk.","Security testing does not assess rights impacts."],"sourceRef":"D3 practice questions · Q11 · 3.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q012","sectionId":"d3-A","knowledgePointIds":["d3-A-0-3"],"scenarioId":"d3-doc-case-b827710599","scenario":"Auditor Gwen Ellis reviews bias management for a facial-recognition access system at Corvid Retail. The vendor reports 99% overall accuracy. The audit team notes that published studies of similar systems found error rates of 34.7% for dark-skinned women against 0.8% for light-skinned men. The security manager says overall accuracy is enough.","type":"application","difficulty":"difficult","topic":"Ethical controls: bias management and representativeness","stem":"What should the auditor do FIRST? Correct Answer: C","options":["Run a new recognition model herself and replace the vendor's system","Accept the 99% figure as proof of fairness","Request evidence of testing by demographic subgroup against protected characteristics and of representative training data, and review the human review and appeal arrangements","Remove the system from the audit scope because the vendor is responsible"],"correctIndex":2,"explanation":"Aggregate accuracy can hide large subgroup disparities. Step 1: recognize the risk of unrepresentative data. Step 2: request subgroup testing evidence, validation of representative sampling and evidence of oversight and appeal. Replacing the system is management's decision, and vendor responsibility does not remove scope.","optionRationales":["Building a replacement is not the auditor's role.","Overall accuracy masks subgroup error rates.","Aggregate accuracy can hide large subgroup disparities. Step 1: recognize the risk of unrepresentative data. Step 2: request subgroup testing evidence, validation of representative sampling and evidence of oversight and appeal. Replacing the system is management's decision, and vendor responsibility does not remove scope.","Third-party systems remain in scope, as the organization is accountable."],"sourceRef":"D3 practice questions · Q12 · 3.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q013","sectionId":"d3-A","knowledgePointIds":["d3-A-0-3"],"scenarioId":"d3-doc-case-e7bbb09344","scenario":"In an audit of an AI claims-triage tool at Meridian Insurance, the auditor, Dev Anand, finds that the model is complex and decisions cannot be explained to customers. There is no process for customers to challenge outcomes. The compliance officer says the model is accurate.","type":"application","difficulty":"moderate","topic":"Explainability and human oversight controls","stem":"What should the auditor recommend? Correct Answer: C","options":["Remove customers' ability to appeal, to reduce workload","Increase accuracy instead of providing explanations","Implement explainability (such as LIME or SHAP for individual predictions, or rule-based review for simpler models) with documented decision logic, plus human oversight and an appeal process","Publish only the model's source code"],"correctIndex":2,"explanation":"Transparency and explainability controls include documentation and tools such as LIME (explaining individual predictions) and SHAP (feature importance), while human oversight includes appeal processes. Step 1: identify the two missing ethical controls. Step 2: recommend both. Accuracy does not replace explanation or redress.","optionRationales":["Removing appeal worsens oversight.","Accuracy does not explain individual decisions.","Transparency and explainability controls include documentation and tools such as LIME (explaining individual predictions) and SHAP (feature importance), while human oversight includes appeal processes. Step 1: identify the two missing ethical controls. Step 2: recommend both. Accuracy does not replace explanation or redress.","Source code does not explain learned behavior to customers."],"sourceRef":"D3 practice questions · Q13 · 3.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q014","sectionId":"d3-A","knowledgePointIds":["d3-A-0-4"],"scenarioId":"d3-doc-case-7882214dfe","scenario":"The internal audit team at Stratus Telecom wants to check that 4,000 supplier contracts contain required service levels and exit clauses. Traditionally it would sample 40 contracts. The audit manager, Rhea Dutta, is considering an LLM.","type":"application","difficulty":"moderate","topic":"LLMs for audit: contract analysis","stem":"What is the BEST way to use the LLM? Correct Answer: A","options":["Apply testing criteria to the total population of contracts, then validate a sample of the LLM's findings and keep a human reviewing exceptions","Use the LLM to test only 40 contracts, as the manual process did","Accept all LLM results without review","Feed contracts into a public chatbot without a data protection check"],"correctIndex":0,"explanation":"LLMs can apply criteria to the total population of contracts, which extends coverage. Step 1: use the scale advantage. Step 2: validate output and review exceptions, and protect confidential data. Trusting results blindly or using public tools without checks are weaknesses.","optionRationales":["LLMs can apply criteria to the total population of contracts, which extends coverage. Step 1: use the scale advantage. Step 2: validate output and review exceptions, and protect confidential data. Trusting results blindly or using public tools without checks are weaknesses.","Limiting to 40 wastes the benefit of full-population testing.","Unvalidated AI output is not reliable evidence.","Uploading confidential contracts to public tools creates privacy and confidentiality risk."],"sourceRef":"D3 practice questions · Q14 · 3.3.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q015","sectionId":"d3-A","knowledgePointIds":["d3-A-0-7"],"scenarioId":"d3-doc-case-9e29bf1638","scenario":"Auditor Isabel Chen at Northgate Bank wants to test 100% of technical change tickets against the change policy using an AI tool, and asks IT for a database administrator account so that she can pull data directly. The IT manager, Frank Ode, is concerned about independence and data integrity.","type":"application","difficulty":"difficult","topic":"Audit-specific AI: 100% testing and read-only access","stem":"What is the BEST access arrangement? Correct Answer: D","options":["Shared credentials used by the IT team","Administrator access, so that she can fix errors she finds","No direct access; accept a sample prepared by the process owner","Read-only, always-on access to the data source, so that audit can self-provision data without altering records"],"correctIndex":3,"explanation":"Audit-specific AI works best with read-only, always-on access to data sources, enabling full-population testing and a move to continuous auditing. Step 1: protect integrity and independence. Step 2: avoid reliance on owner-selected samples. Admin and shared credentials undermine evidence integrity and accountability.","optionRationales":["Shared credentials destroy accountability and traceability.","Write access lets the auditor change what is being audited.","Owner-prepared samples weaken reliability and independence.","Audit-specific AI works best with read-only, always-on access to data sources, enabling full-population testing and a move to continuous auditing. Step 1: protect integrity and independence. Step 2: avoid reliance on owner-selected samples. Admin and shared credentials undermine evidence integrity and accountability."],"sourceRef":"D3 practice questions · Q15 · 3.3.4","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q016","sectionId":"d3-A","knowledgePointIds":["d3-A-0-7"],"scenarioId":"d3-doc-case-e458ccbb79","scenario":"The audit team at Redwood Retail uses AI to review expense claims. The analyst, Colin Park, finds that the leading digits of claims from one branch deviate sharply from the expected distribution. The audit manager, Yasmin Aziz, asks what the result suggests and what to do.","type":"application","difficulty":"moderate","topic":"Benford's Law","stem":"What is the BEST interpretation and next step? Correct Answer: B","options":["The result proves fraud; report it to the board immediately","The data may be fabricated or manipulated; investigate the branch's claims with corroborating evidence before concluding","The result is irrelevant, because Benford's Law applies only to financial statements","The result shows that the AI tool is faulty; disable it"],"correctIndex":1,"explanation":"Benford's Law tests the distribution of digits to flag possible manipulation. Step 1: treat the deviation as an indicator. Step 2: investigate with corroborating evidence. It does not prove fraud on its own, and dismissing it or blaming the tool are weaker.","optionRationales":["An anomaly is an indicator, not proof.","Benford's Law tests the distribution of digits to flag possible manipulation. Step 1: treat the deviation as an indicator. Step 2: investigate with corroborating evidence. It does not prove fraud on its own, and dismissing it or blaming the tool are weaker.","The test applies to many numeric datasets, including expense claims.","Nothing indicates the tool is faulty; the deviation concerns the data."],"sourceRef":"D3 practice questions · Q16 · 3.3.4","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q017","sectionId":"d3-A","knowledgePointIds":["d3-A-0-7"],"scenarioId":"d3-doc-case-5c1972de24","scenario":"Eastfield Insurance's audit team tests corporate credit card transactions manually once a quarter, finding duplicate charges long after they occur. The CAE, Marcus Boyd, wants a more effective approach.","type":"application","difficulty":"moderate","topic":"Continuous monitoring and process automation","stem":"What is the MOST effective improvement? Correct Answer: B","options":["Test only the largest transaction each quarter","Automate continuous monitoring of the full transaction population with defined tests, anomaly detection and exception reporting","Ask cardholders to self-report duplicates","Replace the tests with a once-a-year review"],"correctIndex":1,"explanation":"Continuous monitoring replaces repetitive manual work with automated testing and reporting, detecting duplicates, fraud, misuse and policy failures sooner. Step 1: see the lag and sampling weakness. Step 2: automate over the full population with exception reporting.","optionRationales":["One transaction per quarter gives minimal coverage.","Continuous monitoring replaces repetitive manual work with automated testing and reporting, detecting duplicates, fraud, misuse and policy failures sooner. Step 1: see the lag and sampling weakness. Step 2: automate over the full population with exception reporting.","Self-reporting is unreliable and not independent.","A longer interval worsens detection delay."],"sourceRef":"D3 practice questions · Q17 · 3.3.4","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q018","sectionId":"d3-A","knowledgePointIds":["d3-A-0-5"],"scenarioId":"d3-doc-case-d65d4c28fc","scenario":"The CAE of Fenwick Bank, Hannah Lowe, is considering an AI tool that recommends which auditors should be assigned to which audits, using their skills, training and interests. A senior auditor warns that the tool might assign the same people to the same areas indefinitely.","type":"application","difficulty":"difficult","topic":"Audit resource allocation with AI","stem":"What is the MOST important consideration? Correct Answer: D","options":["Never rotate auditors, to maintain consistency","Allow the tool's allocation to be final without CAE review","Assign auditors by personal preference only","Use the tool to match skills and rotate assignments to preserve objectivity and avoid burnout or collusion, and have the CAE review its recommendations"],"correctIndex":3,"explanation":"AI can optimize audit resource allocation by modelling capabilities, training and interests, while rotation supports objectivity and reduces burnout and collusion risk. Step 1: use AI for matching. Step 2: retain management judgment and rotation. Final automatic allocation or no rotation weakens objectivity.","optionRationales":["Lack of rotation increases familiarity and collusion risk.","AI output needs review by accountable leadership.","Preference-only assignment ignores skills and objectivity.","AI can optimize audit resource allocation by modelling capabilities, training and interests, while rotation supports objectivity and reduces burnout and collusion risk. Step 1: use AI for matching. Step 2: retain management judgment and rotation. Final automatic allocation or no rotation weakens objectivity."],"sourceRef":"D3 practice questions · Q18 · 3.3.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q019","sectionId":"d3-A","knowledgePointIds":["d3-A-0-6"],"scenarioId":"d3-doc-case-859964bf03","scenario":"A senior auditor at Calder Public Health Agency uses a generative AI assistant to draft the indicative scope and interview questions for an audit of a new AI diagnostic tool. The audit director, Ellen Moss, asks how to treat the draft.","type":"application","difficulty":"moderate","topic":"Generative AI in audit planning","stem":"What is the BEST approach? Correct Answer: A","options":["Use it to accelerate planning with up-to-date threat and risk themes, but review and adapt the output with professional judgment and keep confidential data out of public tools","Issue the draft scope to management without review","Prohibit any AI use in planning","Paste the agency's sensitive documents into a public tool to improve the draft"],"correctIndex":0,"explanation":"Generative AI can support audit planning and generate interview questions using current risk information, but outputs need professional review, and confidentiality must be protected. Step 1: use it as an accelerator. Step 2: validate and control data exposure.","optionRationales":["Generative AI can support audit planning and generate interview questions using current risk information, but outputs need professional review, and confidentiality must be protected. Step 1: use it as an accelerator. Step 2: validate and control data exposure.","Unreviewed AI output is not reliable.","A blanket prohibition forgoes legitimate benefit.","Uploading sensitive documents to public tools breaches confidentiality."],"sourceRef":"D3 practice questions · Q19 · 3.3.3","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q020","sectionId":"d3-A","knowledgePointIds":["d3-A-0-8"],"scenarioId":"d3-doc-case-d4e17944c4","scenario":"New auditors at Hartwell Insurance hear \"AI,\" \"ML\" and \"deep learning\" used interchangeably. The training lead, Rosa Ferreira, wants a shared understanding before the first AI audit. She asks which statement is correct.","type":"application","difficulty":"basic","topic":"Core AI terms for auditors","stem":"Which statement is MOST accurate? Correct Answer: C","options":["Deep learning is the broad field that contains machine learning","Machine learning is the broad field that contains all AI","AI is the broad field, machine learning is a subset of AI, and deep learning is a subset of machine learning","AI, ML and deep learning are identical"],"correctIndex":2,"explanation":"AI is the umbrella term, ML builds predictive models from data, and deep learning is a subset of ML, with generative AI and data science related alongside. An agreed definition (for example the OECD's or the EU AI Act's) avoids confusion in interviews and aggregation of data.","optionRationales":["Deep learning is the narrowest of the three.","This reverses the hierarchy.","AI is the umbrella term, ML builds predictive models from data, and deep learning is a subset of ML, with generative AI and data science related alongside. An agreed definition (for example the OECD's or the EU AI Act's) avoids confusion in interviews and aggregation of data.","They are related but not the same, and the difference matters when interviewing stakeholders."],"sourceRef":"D3 practice questions · Q20 · 3.4","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q021","sectionId":"d3-A","knowledgePointIds":["d3-A-0-9"],"scenarioId":"d3-doc-case-e16f7d9084","scenario":"The CAE of Orion Bank, Valerie Knox, is designing a training programme for auditors who will review AI systems. She lists topics including programming languages and hardware specifications. A deputy, Seth Ibarra, argues that the plan should focus on what auditors need to assess AI risk.","type":"application","difficulty":"difficult","topic":"Auditor education areas","stem":"Which set of topics is MOST appropriate for the programme? Correct Answer: C","options":["Vendor product features only","Hardware specifications and programming languages only","Core AI concepts and terminology, common models, bias, AI governance, ethics, trustworthy AI, risk assessment frameworks, audit-specific AI applications and regulatory requirements","Financial accounting standards only"],"correctIndex":2,"explanation":"Auditor education covers technical knowledge, common models, bias, governance, ethics, trustworthy AI, risk frameworks, audit-specific applications and regulation. Step 1: identify the competencies needed to assess risk. Step 2: choose training to match them. Hardware, vendor features or accounting alone do not.","optionRationales":["Vendor features do not build independent judgment.","Programming and hardware alone do not equip auditors to assess governance, bias or compliance.","Auditor education covers technical knowledge, common models, bias, governance, ethics, trustworthy AI, risk frameworks, audit-specific applications and regulation. Step 1: identify the competencies needed to assess risk. Step 2: choose training to match them. Hardware, vendor features or accounting alone do not.","Accounting standards do not cover AI risk."],"sourceRef":"D3 practice questions · Q21 · 3.4.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q022","sectionId":"d3-A","knowledgePointIds":["d3-A-0-9"],"scenarioId":"d3-doc-case-2894712eac","scenario":"The audit team at Birchwood Retail has completed classroom AI training but struggles to apply it. The learning and development manager, Omar Rizvi, asks the CAE how to build practical capability.","type":"application","difficulty":"moderate","topic":"Practical skills development","stem":"What is the MOST effective approach? Correct Answer: A","options":["Combine hands-on exercises, internally developed case studies, simulations and external experts, with ongoing updates","A single lecture per year","Reliance on vendors' marketing demonstrations","Avoid AI projects until the team is fully trained"],"correctIndex":0,"explanation":"Effective AI auditing needs IT, data science, ethics and domain knowledge, built through hands-on experience, case studies, simulations like crisis or DR exercises, and external experts for gaps, refreshed regularly. Step 1: identify the gap as application. Step 2: use applied methods.","optionRationales":["Effective AI auditing needs IT, data science, ethics and domain knowledge, built through hands-on experience, case studies, simulations like crisis or DR exercises, and external experts for gaps, refreshed regularly. Step 1: identify the gap as application. Step 2: use applied methods.","One lecture does not build skills in a changing field.","Marketing demos are not neutral training.","Waiting for full training delays learning that comes from doing."],"sourceRef":"D3 practice questions · Q22 · 3.4.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q023","sectionId":"d3-A","knowledgePointIds":["d3-A-0-0"],"scenarioId":"d3-doc-case-e61dfd5e66","scenario":"The new AI inventory at Brightwater Group lists 41 tools. Among them are a hiring screener used in the EU (high-risk), a marketing copy generator, a credit-limit model, and 12 shadow AI tools found through surveys with no owners. Audit capacity allows four reviews this year. The CAE, Nadine Boyle, asks the IS audit manager, Colm Treacy, how to choose.","type":"application","difficulty":"expert","topic":"Risk-based prioritization from the inventory","stem":"What is the BEST approach? Correct Answer: D","options":["Audit only the tools with the highest licence cost","Audit the first four tools in the list alphabetically","Audit the tools the business units ask to be audited","Prioritize by risk, using classification (such as high-risk status under applicable law), impact on individuals and the business, data sensitivity and control maturity, and include a governance review of the shadow AI gap"],"correctIndex":3,"explanation":"A risk-based, top-down plan ranks AI assets by classification and impact, data sensitivity and control maturity. Step 1: use the inventory to rank. Step 2: recognize that ownerless shadow AI is itself a governance risk needing attention, even without auditing each tool. Alphabetical, request-driven or cost-based selection ignores risk.","optionRationales":["Licence cost does not measure risk to people or data.","Alphabetical order has no link to risk.","Requests reflect preference and may avoid the real risks.","A risk-based, top-down plan ranks AI assets by classification and impact, data sensitivity and control maturity. Step 1: use the inventory to rank. Step 2: recognize that ownerless shadow AI is itself a governance risk needing attention, even without auditing each tool. Alphabetical, request-driven or cost-based selection ignores risk."],"sourceRef":"D3 practice questions · Q23 · 3.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q024","sectionId":"d3-A","knowledgePointIds":["d3-A-0-2"],"scenarioId":"d3-doc-case-1924076d13","scenario":"Kestrel Public Services uses a vendor-hosted AI system to prioritize benefit claims, which is a high-risk use. The vendor provides a security certificate and says the system is compliant. The auditor, Esther Lindgren, must plan evidence across the control categories.","type":"application","difficulty":"expert","topic":"Evidence for a vendor-hosted high-risk system","stem":"Which approach is BEST? Correct Answer: B","options":["Rely on the vendor's certificate as sufficient evidence","Request evidence by category: governance (ownership, vendor risk), contracts (audit rights, consent for training data), privacy and a FRIA, bias and explainability testing, and monitoring and incident arrangements, rather than relying on the certificate","Test only network security","Skip the audit because the vendor hosts the system"],"correctIndex":1,"explanation":"The organization stays accountable for a vendor-hosted high-risk system. Step 1: identify that a certificate covers only part of the control environment. Step 2: obtain evidence across governance, legal, technical, operational and ethical controls. A certificate, network-only testing or skipping scope leaves most risks unexamined.","optionRationales":["A security certificate does not address bias, rights impacts or contract terms.","The organization stays accountable for a vendor-hosted high-risk system. Step 1: identify that a certificate covers only part of the control environment. Step 2: obtain evidence across governance, legal, technical, operational and ethical controls. A certificate, network-only testing or skipping scope leaves most risks unexamined.","Network security is one small part of the control environment.","Vendor hosting does not remove accountability or scope."],"sourceRef":"D3 practice questions · Q24 · 3.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q025","sectionId":"d3-B","knowledgePointIds":["d3-B-0-0"],"scenarioId":"d3-doc-case-10a83ee2bb","scenario":"The audit committee chair of Larkfield Energy, Dr. Anne Marsh, asks the CAE how the first AI audit will be designed. The CAE, Paul Greco, notes that the company uses AI in trading, maintenance and customer service, and that the committee is concerned with long-term ethical, privacy and trust risk.","type":"application","difficulty":"basic","topic":"Designing an AI audit: top-down approach","stem":"Which approach is BEST? Correct Answer: B","options":["A bottom-up review of individual algorithms, ignoring ethics and privacy","A top-down, strategic design starting with scope and objectives, focused on long-term risk and including ethics, trust and privacy","A review limited to the vendor's technical documentation","A design based on the audit team's availability"],"correctIndex":1,"explanation":"AI audits start with scope and objectives and take a top-down, strategic view of long-term risk, with ethics, trust and privacy included. Step 1: reflect the committee's concerns in the objectives. Step 2: let scope follow risk. Bottom-up algorithm review, vendor documents or staff availability do not drive risk-based design.","optionRationales":["Algorithm-level review without ethics and privacy omits core objectives.","AI audits start with scope and objectives and take a top-down, strategic view of long-term risk, with ethics, trust and privacy included. Step 1: reflect the committee's concerns in the objectives. Step 2: let scope follow risk. Bottom-up algorithm review, vendor documents or staff availability do not drive risk-based design.","Vendor documentation is not independent and covers only part of the risk.","Availability is a resourcing matter, not a design basis."],"sourceRef":"D3 practice questions · Q25 · 3.5","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q026","sectionId":"d3-B","knowledgePointIds":["d3-B-0-2"],"scenarioId":"d3-doc-case-0980893442","scenario":"The IS auditor, Tomas Reyes, is scoping an audit of an AI fraud detection model at Calloway Bank. He has the audit objectives. The model owner, Bea Lindqvist, offers to send \"everything the team has\" in one folder.","type":"application","difficulty":"moderate","topic":"Scoping: systems, owners and data","stem":"What should be done FIRST in scoping? Correct Answer: D","options":["Agree the report distribution list","Begin testing the model's accuracy using the folder","Draft findings from the owner's description","Identify the AI systems in scope and their owners, then the data to be accessed and where development and testing documentation is stored"],"correctIndex":3,"explanation":"Scoping steps start with identifying the AI systems and owners, then the data needed and where development and testing documentation lives, followed by existing assessments, applicable laws and AI documentation. Testing and findings come later.","optionRationales":["Report distribution is a reporting matter, not scoping.","Testing before scoping risks wasted or irrelevant work.","Findings must rest on evidence collected within a defined scope.","Scoping steps start with identifying the AI systems and owners, then the data needed and where development and testing documentation lives, followed by existing assessments, applicable laws and AI documentation. Testing and findings come later."],"sourceRef":"D3 practice questions · Q26 · 3.5.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q027","sectionId":"d3-B","knowledgePointIds":["d3-B-0-2"],"scenarioId":"d3-doc-case-66da8c7cf9","scenario":"Before auditing an AI claims model at Pelham Insurance, the auditor, Sana Iqbal, finds that the second line has performed trustworthy AI testing and security and privacy testing in the last six months. The audit manager asks whether to repeat all the work.","type":"application","difficulty":"moderate","topic":"Scoping: using existing assessments","stem":"What is the BEST approach? Correct Answer: A","options":["Review the existing assessments, evaluate their reliability and scope, and rely on them where appropriate, focusing audit effort on gaps","Ignore the assessments and repeat all tests independently","Accept the assessments without reading them","Cancel the audit because assessments exist"],"correctIndex":0,"explanation":"Scoping includes reviewing existing assessments (second-line testing, trustworthy AI, privacy and security testing). Step 1: evaluate their quality and relevance. Step 2: rely on them where reliable and test the gaps. Blind acceptance or full duplication are both weak.","optionRationales":["Scoping includes reviewing existing assessments (second-line testing, trustworthy AI, privacy and security testing). Step 1: evaluate their quality and relevance. Step 2: rely on them where reliable and test the gaps. Blind acceptance or full duplication are both weak.","Repeating all work wastes resources when reliable assessments exist.","Unreviewed reliance is not sufficient evidence.","Existing assessments do not replace independent audit coverage of the gaps."],"sourceRef":"D3 practice questions · Q27 · 3.5.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q028","sectionId":"d3-B","knowledgePointIds":["d3-B-0-2"],"scenarioId":"d3-doc-case-37d4db1ca8","scenario":"Westbridge Group deploys an HR screening model across the EU, the US and Asia. The auditor, Cleo Dunne, builds the scope using the EU AI Act only, because head office is in the EU. The legal counsel, Ravi Kapoor, points out that other laws also apply.","type":"application","difficulty":"difficult","topic":"Scoping: applicable AI laws","stem":"What should the auditor do? Correct Answer: C","options":["Ask the process owner which laws he prefers","Keep the EU AI Act only, since it is the strictest","Include all applicable AI and privacy laws and regulations for each jurisdiction in which the system operates, including local rules for automated hiring decisions","Defer legal review until the audit report is drafted"],"correctIndex":2,"explanation":"Scoping must account for all applicable AI laws, which depend on where the system operates and affects people, not just head office. Step 1: identify jurisdictions. Step 2: map each law to the audit criteria. Choosing by preference or deferring legal review leaves criteria incomplete.","optionRationales":["Owner preference is not an audit criterion.","Applicability depends on where the system is used, and other rules may impose additional duties.","Scoping must account for all applicable AI laws, which depend on where the system operates and affects people, not just head office. Step 1: identify jurisdictions. Step 2: map each law to the audit criteria. Choosing by preference or deferring legal review leaves criteria incomplete.","Deferring legal review leaves the work without criteria."],"sourceRef":"D3 practice questions · Q28 · 3.5.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q029","sectionId":"d3-B","knowledgePointIds":["d3-B-0-2"],"scenarioId":"d3-doc-case-f0327ed679","scenario":"The auditor, Jonas Weber, reviews an AI credit model at Summit Credit. Management provides a user guide and a presentation. He needs documentation to evaluate whether decisions can be explained and whether ethics and bias were considered.","type":"application","difficulty":"moderate","topic":"Scoping: obtaining AI documentation","stem":"Which request is MOST appropriate? Correct Answer: C","options":["The CEO's biography","Only the marketing brochure from the vendor","Documentation on explainability and transparency, and on ethics and bias assessments, together with development and test records","The company's holiday calendar"],"correctIndex":2,"explanation":"The final scoping step is obtaining AI documentation, including explainability and transparency and ethics and bias records, to evaluate the system against criteria. Brochures, biographies and calendars are not audit evidence.","optionRationales":["A biography has no bearing on the model.","Marketing material is not reliable evidence.","The final scoping step is obtaining AI documentation, including explainability and transparency and ethics and bias records, to evaluate the system against criteria. Brochures, biographies and calendars are not audit evidence.","A calendar is irrelevant."],"sourceRef":"D3 practice questions · Q29 · 3.5.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q030","sectionId":"d3-B","knowledgePointIds":["d3-B-0-3"],"scenarioId":"d3-doc-case-32285c5a7f","scenario":"An audit programme for an AI fraud model at Dunmore Bank is organized around the AI life cycle. The audit manager, Kofi Mensah, asks which five areas auditors should test.","type":"application","difficulty":"basic","topic":"Five testing areas","stem":"Which set is CORRECT? Correct Answer: A","options":["Definition, development, testing, deployment and operations","Planning, billing, marketing, delivery and retirement","Input, output, storage, backup and archive","Sales, support, finance, legal and HR"],"correctIndex":0,"explanation":"The audit tests five areas of the AI life cycle: definition, development, testing, deployment and operations. The other sets are unrelated groupings.","optionRationales":["The audit tests five areas of the AI life cycle: definition, development, testing, deployment and operations. The other sets are unrelated groupings.","These are business functions, not AI life cycle areas.","These are data handling steps, not life cycle areas.","These are departments, not testing areas."],"sourceRef":"D3 practice questions · Q30 · 3.6","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q031","sectionId":"d3-B","knowledgePointIds":["d3-B-0-3"],"scenarioId":"d3-doc-case-0f6acb8a16","scenario":"In the development-area audit of a loan model at Alderwood Bank, the auditor, Mei Tanaka, finds that the training set covers customers from only two of the bank's eight regions. Data governance documents are thin, and there are no data integrity checks. The data scientist, Pablo Rios, says model accuracy is high.","type":"application","difficulty":"difficult","topic":"Testing the development area: data representativeness","stem":"What is the GREATEST risk the auditor should report? Correct Answer: D","options":["The model uses too much electricity","The accuracy figure is too good to be believed","The development team has too many documents","The data may not represent the full population, creating bias and unreliable outcomes, compounded by weak data governance and no integrity checks"],"correctIndex":3,"explanation":"Development testing examines data governance, whether data represents the full population, sample sizes, data quality, access control and integrity checks. Step 1: spot that two regions cannot represent eight. Step 2: see that governance and integrity gaps compound the risk. Accuracy on unrepresentative data is misleading.","optionRationales":["Energy use is not the issue evidenced.","High accuracy on unrepresentative data may be misleading, but the greater risk is the data's coverage.","The finding is thin documentation, not excess.","Development testing examines data governance, whether data represents the full population, sample sizes, data quality, access control and integrity checks. Step 1: spot that two regions cannot represent eight. Step 2: see that governance and integrity gaps compound the risk. Accuracy on unrepresentative data is misleading."],"sourceRef":"D3 practice questions · Q31 · 3.6","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q032","sectionId":"d3-B","knowledgePointIds":["d3-B-0-6"],"scenarioId":"d3-doc-case-4fa33ea39e","scenario":"The auditor, Lena Hoffmann, wants to test whether data in a retail recommendation model's production log shows any systematic problem. The log contains 2 million records of similar type. She has no reason to expect one subgroup to behave differently.","type":"application","difficulty":"moderate","topic":"Random sampling","stem":"Which sampling method is MOST appropriate? Correct Answer: B","options":["Selecting the first 100 records for convenience","Random sampling, so that each record has an equal chance of selection","Selecting records the process owner recommends","Selecting only records from the newest day"],"correctIndex":1,"explanation":"Random sampling gives every record an equal chance of selection and supports unbiased conclusions on a homogeneous population. Convenience, owner-selected or one-day samples introduce bias.","optionRationales":["The first records may not be representative.","Random sampling gives every record an equal chance of selection and supports unbiased conclusions on a homogeneous population. Convenience, owner-selected or one-day samples introduce bias.","Owner-selected records bias the result and compromise independence.","A single day may miss patterns across the period."],"sourceRef":"D3 practice questions · Q32 · 3.7","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q033","sectionId":"d3-B","knowledgePointIds":["d3-B-0-6"],"scenarioId":"d3-doc-case-fd69b69309","scenario":"The auditor, Aiden Brooks, reviews an AI loan-approval model at Beacon Bank. Applicants from a small protected group make up 4% of the population. A simple random sample of 200 would include about eight of them. He wants to test fair outcomes across groups.","type":"application","difficulty":"difficult","topic":"Stratified sampling for fairness testing","stem":"Which approach is BEST? Correct Answer: B","options":["Simple random sampling, since it is unbiased","Stratified sampling, dividing the population into groups and sampling from each so that the protected group is adequately represented","Judgmental sampling of the largest group only","No sampling; accept the model owner's summary"],"correctIndex":1,"explanation":"Stratified sampling ensures subgroups are represented, which is essential for fairness testing. Step 1: recognize the risk of underrepresentation in a random sample. Step 2: stratify. Testing only the largest group or accepting a summary defeats the objective.","optionRationales":["A random sample may include too few records from the small group to conclude anything.","Stratified sampling ensures subgroups are represented, which is essential for fairness testing. Step 1: recognize the risk of underrepresentation in a random sample. Step 2: stratify. Testing only the largest group or accepting a summary defeats the objective.","Ignoring the protected group does not test fairness.","A management summary is not independent evidence."],"sourceRef":"D3 practice questions · Q33 · 3.7","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q034","sectionId":"d3-B","knowledgePointIds":["d3-B-0-6"],"scenarioId":"d3-doc-case-140b45b313","scenario":"The auditor, Parisa Nouri, reviews how a hospital's readmission model was evaluated. The data science team says that data was divided into training, validation and test sets. She wants to know how this relates to audit sampling.","type":"application","difficulty":"moderate","topic":"Data-splitting-based sampling","stem":"Which statement is MOST accurate? Correct Answer: D","options":["Data-splitting is used only after deployment","Data-splitting means copying the same records into all three sets","Data-splitting means ignoring the test set","Data-splitting divides data into training, validation and test sets so that performance is evaluated on data the model did not learn from, and the auditor can check the split and that the test set was held back"],"correctIndex":3,"explanation":"Data-splitting-based sampling is a way of sampling data populations: separate sets for learning, tuning and final evaluation. Step 1: understand the purpose. Step 2: verify the split and that the test set was not used in training or tuning.","optionRationales":["Splitting happens during development, not only after deployment.","Overlapping sets contaminate evaluation.","The test set provides the unbiased estimate.","Data-splitting-based sampling is a way of sampling data populations: separate sets for learning, tuning and final evaluation. Step 1: understand the purpose. Step 2: verify the split and that the test set was not used in training or tuning."],"sourceRef":"D3 practice questions · Q34 · 3.7.1","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q035","sectionId":"d3-B","knowledgePointIds":["d3-B-0-7"],"scenarioId":"d3-doc-case-bfbd136c02","scenario":"The auditor, Stefan Maier, uses subject matter knowledge to select 30 high-value insurance claims that an AI model rejected, believing these carry the greatest risk. In the draft report he writes that \"about 12% of all AI rejections are wrong,\" based on four errors in the 30 items.","type":"application","difficulty":"difficult","topic":"Judgmental sampling and its limits","stem":"What is the PRIMARY concern? Correct Answer: A","options":["Judgmental (nonprobability) samples cannot be statistically projected to the whole population, so the 12% extrapolation is not supported","Judgmental sampling cannot be used in AI audits","Thirty items are always enough to project any rate","The extrapolation is valid because the items were chosen by an expert"],"correctIndex":0,"explanation":"Judgmental sampling is useful for targeting risk using expertise, but results cannot be extrapolated statistically. Step 1: identify the sampling type. Step 2: report the findings as relating to the items tested, or use probability sampling to estimate a rate.","optionRationales":["Judgmental sampling is useful for targeting risk using expertise, but results cannot be extrapolated statistically. Step 1: identify the sampling type. Step 2: report the findings as relating to the items tested, or use probability sampling to estimate a rate.","Judgmental sampling is legitimate when its limits are respected.","Sample size does not make a nonprobability sample projectable.","Expert selection does not create a statistically valid sample."],"sourceRef":"D3 practice questions · Q35 · 3.7.2","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q036","sectionId":"d3-B","knowledgePointIds":["d3-B-0-8"],"scenarioId":"d3-doc-case-ab572be1ca","scenario":"The auditor, Bianca Rossi, reviews test results for an AI fraud model at Harbour Bank. The model scored 99% on training data and 72% on new data. The data science lead, Mark Elias, says the result is excellent because the training score is high.","type":"application","difficulty":"moderate","topic":"Testing outcome: overfitting","stem":"What should the auditor conclude? Correct Answer: C","options":["The result is excellent, since training accuracy is high","The model is underfitted","The model is overfitted: it performs well on training data but poorly on new data, so it may not generalize to production","The gap indicates the test was not needed"],"correctIndex":2,"explanation":"Overfitting means memorizing training data and performing poorly on new data. Underfitting performs poorly on both. Step 1: compare training and new-data performance. Step 2: report the generalization risk and request remediation.","optionRationales":["Training accuracy alone does not show real-world performance.","Underfitting would show poor training performance as well.","Overfitting means memorizing training data and performing poorly on new data. Underfitting performs poorly on both. Step 1: compare training and new-data performance. Step 2: report the generalization risk and request remediation.","The gap shows why independent testing matters."],"sourceRef":"D3 practice questions · Q36 · 3.8","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q037","sectionId":"d3-B","knowledgePointIds":["d3-B-0-8"],"scenarioId":"d3-doc-case-dbbf3bca93","scenario":"The auditor, Ravi Menon, reviews three models at Quantum Retail. Model X performs poorly on both training and new data. Model Y scores 98% on training data and 70% on new data. Model Z performs well but is distorted by a few extreme transactions in the training set.","type":"application","difficulty":"difficult","topic":"Underfitting, overfitting and outliers","stem":"Which classification is CORRECT? Correct Answer: C","options":["X outliers; Y underfitting; Z overfitting","X overfitting; Y underfitting; Z affected by outliers","X underfitting; Y overfitting; Z affected by outliers that should be investigated","X and Y overfitting; Z underfitting"],"correctIndex":2,"explanation":"Poor performance on both sets indicates underfitting. Strong training but weak new-data performance indicates overfitting. Extreme data points are outliers, which can distort training and need investigation.","optionRationales":["X is not an outlier problem, and Y is not underfit.","This reverses X and Y.","Poor performance on both sets indicates underfitting. Strong training but weak new-data performance indicates overfitting. Extreme data points are outliers, which can distort training and need investigation.","X is not overfit, and Z is not underfit."],"sourceRef":"D3 practice questions · Q37 · 3.8","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q038","sectionId":"d3-B","knowledgePointIds":["d3-B-0-11"],"scenarioId":"d3-doc-case-7ab4472140","scenario":"The auditor, Elin Larsson, reviews a model testing report from the data science team at Meridian Health. The report gives false positive and false negative rates. The audit manager asks her to recalculate the false positive rate herself from scratch.","type":"application","difficulty":"moderate","topic":"Auditor cites test outcomes","stem":"What is the BEST approach? Correct Answer: A","options":["Cite and assess the test outcomes reported by management, validating the testing approach, data and evidence, rather than independently recalculating every metric","Ignore the reported outcomes","Accept the report with no checks","Redesign the model tests for the team"],"correctIndex":0,"explanation":"The auditor cites test outcomes and assesses the evidence supporting them; the auditor does not need to calculate false positives. Step 1: evaluate the methodology and data. Step 2: report conclusions. Ignoring or blindly accepting results weakens assurance, and redesign is a management function.","optionRationales":["The auditor cites test outcomes and assesses the evidence supporting them; the auditor does not need to calculate false positives. Step 1: evaluate the methodology and data. Step 2: report conclusions. Ignoring or blindly accepting results weakens assurance, and redesign is a management function.","Ignoring outcomes defeats the purpose of review.","Blind acceptance is not sufficient evidence.","Redesign crosses into management's role."],"sourceRef":"D3 practice questions · Q38 · 3.8","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q039","sectionId":"d3-B","knowledgePointIds":["d3-B-0-11"],"scenarioId":"d3-doc-case-faa76f507a","scenario":"Auditor Joyce Tan reviews an AI recruitment tool at Skyline Technologies. About 50% of applicants are men, but 75% of candidates the tool rates acceptable are men. The tool is accurate (85%) and the HR director, Neil Barrett, points to improved retention (90% against 70%).","type":"application","difficulty":"difficult","topic":"Sample audit: bias in an AI recruitment tool","stem":"What should the auditor conclude and do? Correct Answer: D","options":["The tool should be defended in the report","No issue exists, since accuracy and retention are strong","The skew is acceptable because retention improved","The skew suggests potential bias that must be investigated and reported despite good accuracy and retention, because the system is high-risk"],"correctIndex":3,"explanation":"A recruitment tool is a high-risk system, and the selection rate (75% male acceptable against 50% male applicants) suggests bias. Step 1: classify the risk. Step 2: investigate and report despite positive performance and outcome metrics, which do not offset fairness concerns.","optionRationales":["The auditor reports findings objectively and does not defend the system.","Strong performance does not rule out discriminatory outcomes.","Retention does not justify unfair selection.","A recruitment tool is a high-risk system, and the selection rate (75% male acceptable against 50% male applicants) suggests bias. Step 1: classify the risk. Step 2: investigate and report despite positive performance and outcome metrics, which do not offset fairness concerns."],"sourceRef":"D3 practice questions · Q39 · 3.9","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q040","sectionId":"d3-B","knowledgePointIds":["d3-B-0-11"],"scenarioId":"d3-doc-case-8abb1f2903","scenario":"In the final stage of an audit of an AI recruitment tool at Calder Group, the auditor, Femi Adeyemi, has documented bias and explainability findings. The HR director agrees that the findings are factual but says that the data science team will \"look at it sometime.\" The CAE, Louise Park, asks what the report must achieve.","type":"application","difficulty":"expert","topic":"Sample audit: reporting and remediation ownership","stem":"Which approach is BEST? Correct Answer: B","options":["Issue the report without management's response","Obtain management's agreement to the findings and named owners and dates for remediation, then monitor remediation through follow-up","Assign remediation tasks to audit staff","Close the audit when the report is issued"],"correctIndex":1,"explanation":"The reporting step requires management agreement and ownership of remediation, followed by remediation and monitoring. Step 1: secure named owners and dates. Step 2: follow up. Audit staff must not own remediation, and closing at issue leaves findings unresolved.","optionRationales":["Without management's agreement, ownership and action are unclear.","The reporting step requires management agreement and ownership of remediation, followed by remediation and monitoring. Step 1: secure named owners and dates. Step 2: follow up. Audit staff must not own remediation, and closing at issue leaves findings unresolved.","Remediation ownership by audit impairs independence.","Issue of the report is not resolution of the findings."],"sourceRef":"D3 practice questions · Q40 · 3.9","tags":["d3","document-import","scenario","application"]},{"id":"d3-doc-q041","sectionId":"d3-B","knowledgePointIds":["d3-B-0-11"],"scenarioId":"d3-doc-case-86c474efbd","scenario":"An audit of an AI recruitment tool at Fairmont Public Services shows 85% accuracy and a good F1 score, strong retention, and a compliant privacy notice. However, the model cannot explain individual rejections, no impact assessment was performed under applicable AI rules, and candidate groups are unevenly selected. The HR lead, Greta Olsen, asks the auditor for an overall \"satisfactory\" rating.","type":"application","difficulty":"expert","topic":"Sample audit: balancing conflicting evidence","stem":"What is the BEST audit response? Correct Answer: B","options":["Rate it satisfactory because performance is strong","Rate the area based on all evidence, report the explainability, impact assessment and fairness gaps as significant for a high-risk system,
